<style>

tify-content:space-between;gap:12px;padding:15px;background:#faf8f4;border-radius:12px;font-size:12px;color:#888}.impact b{display:block;color:#2c2925;margin-top:3px}.stats{display:flex;gap:18px;text-align:center}.actions{display:flex;gap:8px;border-top:1px solid #eee;margin-top:17px;padding-top:14px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;color:#555}.actions button:disabled{opacity:.55;cursor:not-allowed}.empty{min-height:280px;display:grid;place-items:center;text-align:center}.empty h3{font:500 21px Georgia,"Yu Mincho",serif}.primary{border:0!important;background:var(--orange)!important;color:#fff!important}.right{display:grid;align-content:start;gap:18px}.side-card small{color:#999;font-weight:700}.theme-title{font:500 28px Georgia,"Yu Mincho",serif;margin:18px 0}.side-card p{color:#777;line-height:1.65;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0}.metric{background:#faf8f4;border-radius:9px;text-align:center;padding:12px 4px}.metric b{display:block;font-size:20px}.metric span{font-size:10px;color:#999}.load-more{display:block;margin:20px auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 24px;font-weight:700}.overlay{position:fixed;inset:0;background:#211f1c80;backdrop-filter:blur(5px);z-index:20;display:none;align-items:center;justify-content:center;padding:22px}.overlay.open{display:flex}.modal{width:min(764px,100%);max-height:calc(100vh - 35px);overflow:auto;background:#fff;border-radius:26px;padding:36px;box-shadow:0 25px 70px #0004;position:relative}.close{position:absolute;right:22px;top:20px;border:0;background:#f3f1ed;color:#888;width:43px;height:43px;border-radius:50%;font-size:25px}.modal h2{font:500 29px Georgia,"Yu Mincho",serif;margin:7px 0 28px}.choices{display:flex;gap:9px;margin-bottom:18px}.choices button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 16px}.choices button.active{border-color:#f2a04b;background:#fff7eb;color:#ad5700;font-weight:800}.field{display:grid;gap:8px;margin:16px 0}.field label{font-size:13px;font-weight:800;color:#555}.field input,.field textarea{border:1px solid #dfd8ce;background:#fdfcfb;border-radius:12px;padding:14px;outline:0}.field textarea{min-height:176px;resize:vertical}.image-btn{display:inline-flex;border:1px dashed #cfc6bb;border-radius:10px;padding:11px 16px;color:#777}.preview{display:none;max-width:100%;max-height:180px;border-radius:10px;margin-top:10px}.modal-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:20px}.modal-actions button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:15px;font-weight:800}.list{display:grid;gap:10px}.list-item{border:1px solid var(--line);border-radius:12px;padding:14px}.list-item small{color:#999}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:12px 22px;z-index:40;display:none}.toast.show{display:block}@media(max-width:1250px){.shell{grid-template-columns:205px minmax(0,1fr);gap:26px}.right{display:none}}@media(max-width:900px){.shell{grid-template-columns:180px minmax(0,1fr);padding-inline:20px}}@media(max-width:760px){.shell{display:block;padding:22px 14px max(50px,env(safe-area-inset-bottom))}.left{position:static}.left .nav,.left .divider,.left .tool{display:none}.left .write{margin:0 0 20px}.heading h1{font-size:36px}.filters{overflow:auto;flex-wrap:nowrap}.card{padding:18px}.impact{display:block}.stats{margin-top:12px;justify-content:space-between}.actions{overflow:auto}.modal{padding:28px 20px}.modal-actions{grid-template-columns:1fr}}
</style>
<style>

@media(max-width:1100px) and (min-width:761px){.shell{grid-template-columns:176px minmax(0,1fr);gap:22px;padding:30px 24px 64px}.right{display:none}.left{top:18px}.nav button,.tool{padding:12px 10px}.heading h1{font-size:44px}.card{padding:20px}}
@media(max-width:760px){html,body{overflow-x:hidden}.shell{padding:0 14px 72px}.left{position:static;margin:0 -14px 16px;padding:10px 14px 12px;background:#f8f6f2;border-bottom:1px solid var(--line)}.left .nav{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}.left .nav::-webkit-scrollbar{display:none}.left .nav button{display:block;flex:0 0 auto;min-height:42px;padding:9px 13px;white-space:nowrap;scroll-snap-align:start}.left .nav button span{width:auto;margin-right:6px}.left .divider{display:none}
/* ツール（ライブラリー/ランキング/ウォレット）へスマホからも到達できるよう横並びチップにする */
.left .tool{display:inline-flex;align-items:center;gap:5px;width:auto;min-height:38px;margin:9px 6px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:700;color:#5c574f}
.left .tool span{width:auto;font-size:14px;color:#bd6100}.left .write{min-height:46px;margin:0 0 9px;padding:13px;box-shadow:none}.search{position:static;margin-bottom:16px;box-shadow:0 5px 16px #3927160d}.heading h1{font-size:38px;margin-bottom:14px}.heading>p:last-child{font-size:14px;line-height:1.7;margin-bottom:20px}.filters,.themes{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-14px;padding-right:14px}.filters::-webkit-scrollbar,.themes::-webkit-scrollbar{display:none}.themes>span{flex:0 0 auto}.pill,.theme{min-height:42px;padding:9px 15px}.card{padding:17px;border-radius:15px}.card h3{font-size:21px;margin-top:16px}.impact{padding:13px}.actions{display:grid;grid-template-columns:1fr 1fr;overflow:visible}.actions button{min-height:44px}.actions button:last-child{grid-column:1/-1}.modal{max-height:calc(100dvh - 12px);padding:26px 18px 20px;border-radius:22px 22px 8px 8px}.overlay{align-items:flex-end;padding:6px}.close{width:44px;height:44px}.choices{overflow-x:auto}.choices button{min-height:44px;white-space:nowrap}.field input,.field textarea{font-size:16px}.modal-actions{position:sticky;bottom:-20px;background:#fff;padding:12px 0 4px}}

<body>
<div class="shell" id="appShell">
  <aside class="left"><nav class="nav" id="sideFilters" aria-label="表示順" data-i18n-aria="k.sortAria"></nav><div class="divider"></div><button class="tool" data-command="library"><span aria-hidden="true">▥</span><span data-i18n="k.library">マイライブラリー</span></button><button class="write" data-compose data-i18n="k.write">＋ 知識を届ける</button></aside>
  <main><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="知識を検索" data-i18n-aria="k.searchAria" placeholder="悩み・体験・タグから探す" data-i18n-placeholder="k.searchPlaceholder"></div><header class="heading"><p class="eyebrow">KNOWLEDGE FROM EXPERIENCE</p><h1 data-i18n="k.title">知識を読む</h1><p data-i18n="k.lead">誰かの体験から生まれた知識を、あなたの次の一歩へ。</p></header><div class="filters" id="topFilters" aria-label="表示順" data-i18n-aria="k.sortAria"></div><div class="themes" id="themes"><span data-i18n="k.themeLabel">テーマ</span></div><div class="result"><span id="countLabel">0件の知識</span><span id="sortLabel">新着</span></div><div class="conclusions" id="conclusions" hidden></div><div class="posts" id="posts" aria-live="polite"></div><button class="load-more" id="loadMore" hidden data-i18n="k.loadMore">さらに読み込む</button></main>
  <aside class="right"><section class="side-card"><small data-i18n="k.monthlyLabel">今月のテーマ</small><div class="theme-title" id="monthlyTheme">夏休み</div><p data-i18n="k.monthlyCopy">長い休みだからこそ試せたこと。あなたの夏の体験を知識に。</p><button class="link" id="monthlyLink" data-i18n="k.monthlyLink">テーマの知識を見る →</button></section><section class="side-card"><b data-i18n="k.valueTitle">いま届いている価値</b><p id="valueText" data-i18n="k.valueLoading">読み込み中です。</p></section><section class="side-card"><small data-i18n="k.yourLibrary">あなたのライブラリー</small><div class="metrics"><div class="metric"><b id="helped">0</b><span data-i18n="k.metric.helped">役に立った</span></div><div class="metric"><b id="draftCount">0</b><span data-i18n="k.metric.draft">下書き</span></div><div class="metric"><b id="scheduledCount">0</b><span data-i18n="k.metric.scheduled">予約</span></div></div><button class="link" data-command="library" data-i18n="k.openLibrary">ライブラリーを開く</button></section></aside>
</div>
<div class="overlay" id="composer" role="dialog" aria-modal="true" aria-labelledby="composerTitle" aria-hidden="true"><form class="modal" id="composeForm"><button class="close" type="button" data-close aria-label="閉じる" data-i18n-aria="k.close">×</button><p class="eyebrow">SHARE YOUR EXPERIENCE</p><h2 id="composerTitle" data-i18n="k.composerTitle">体験を、誰かの知識へ。</h2><div class="choices" id="composeThemes"></div><div class="field"><label for="title" data-i18n="k.field.title">タイトル</label><input id="title" maxlength="160" required placeholder="何を知識として届けますか？" data-i18n-placeholder="k.field.titlePlaceholder"></div><div class="field"><label for="body" data-i18n="k.field.body">体験から得たこと</label><textarea id="body" maxlength="5000" required placeholder="状況、試したこと、分かったこと、注意点を書いてください" data-i18n-placeholder="k.field.bodyPlaceholder"></textarea></div><div class="field"><label for="tags" data-i18n="k.field.tags">タグ（カンマ区切り）</label><input id="tags" maxlength="500" placeholder="習慣, 朝時間, 小さく始める" data-i18n-placeholder="k.field.tagsPlaceholder"></div><label class="image-btn" for="image" data-i18n="k.addImage">＋ 画像を追加</label><input id="image" type="file" accept="image/*" hidden><img id="preview" class="preview" alt="選択した画像のプレビュー"><div class="field" id="scheduleField" hidden><label for="scheduledAt" data-i18n="k.field.scheduledAt">公開日時</label><input id="scheduledAt" type="datetime-local"></div><div class="modal-actions"><button type="button" id="draft" hidden data-i18n="k.saveDraft">下書き保存</button><button type="button" id="schedule" hidden data-i18n="k.schedulePost">予約投稿</button><button class="primary" id="publish" type="submit" data-i18n="k.publish">知識を公開する</button></div></form></div>
<div class="overlay" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" aria-hidden="true"><section class="modal"><button class="close" type="button" data-panel-close aria-label="閉じる">×</button><h2 id="panelTitle"></h2><div class="list" id="panelList"></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/emu-i18n.js"></script>
<script src="/emu-i18n-pages.js"></script>
<script>
/* テーマ・並び順の「値」は日本語のまま（保存済みデータの絞り込みに使うため）、表示だけ訳す */
const ORIGIN=location.origin,FILTERS=[['recommended','✦','k.filter.recommended'],['new','◷','k.filter.new'],['monthly','○','k.filter.monthly'],['good','♡','k.filter.good'],['change','↻','k.filter.change']],THEMES=['すべて','経験','失敗','本','出会い'];
const THEME_KEY={'すべて':'k.theme.all','経験':'k.theme.experience','失敗':'k.theme.failure','本':'k.theme.book','出会い':'k.theme.meeting'};
const themeLabel=t=>emuT(THEME_KEY[t]||t);
const state={posts:[],filter:'new',theme:'すべて',query:'',account:'',imageUrl:'',composeTheme:'経験',monthlyTheme:'夏休み',drafts:[],scheduledCount:0,helpedCount:0,conclusions:[],canDraft:false,canSchedule:false,hasMore:false,pending:null,lastFocus:null};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),send=m=>parent.postMessage(m,ORIGIN),tags=p=>(Array.isArray(p.tags)?p.tags:String(p.tags||'').split(',')).map(x=>x.trim()).filter(Boolean);
function notify(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),2800)}
function filterButtons(){const side=FILTERS.map(([id,icon,key])=>`<button data-filter="${id}" class="${state.filter===id?'active':''}" aria-pressed="${state.filter===id}"><span aria-hidden="true">${icon}</span>${esc(emuT(key))}</button>`).join('');$('#sideFilters').innerHTML=side;$('#topFilters').innerHTML=FILTERS.map(([id,,key])=>`<button class="pill ${state.filter===id?'active':''}" data-filter="${id}" aria-pressed="${state.filter===id}">${esc(emuT(key))}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;filterButtons();render()})}
function themeButtons(){document.querySelectorAll('#themes .theme').forEach(b=>b.remove());THEMES.forEach(t=>{const b=document.createElement('button');b.className='theme'+(state.theme===t?' active':'');b.textContent=themeLabel(t);b.setAttribute('aria-pressed',String(state.theme===t));b.onclick=()=>{state.theme=t;themeButtons();render()};$('#themes').appendChild(b)});$('#composeThemes').innerHTML=THEMES.slice(1).map(t=>`<button type="button" data-compose-theme="${t}" class="${state.composeTheme===t?'active':''}" aria-pressed="${state.composeTheme===t}">${esc(themeLabel(t))}</button>`).join('');document.querySelectorAll('[data-compose-theme]').forEach(b=>b.onclick=()=>{state.composeTheme=b.dataset.composeTheme;themeButtons()})}
function visible(){let list=[...state.posts].filter(p=>{const all=[p.title,p.body,p.displayName,...tags(p)].join(' ').toLowerCase();return(!state.query||all.includes(state.query.toLowerCase()))&&(state.theme==='すべて'||tags(p).includes(state.theme))});if(state.filter==='recommended')list.sort((a,b)=>((b.goodCount||0)*2+(b.changeCount||0)*3+(b.acceptedChangeCount||0)*5)-((a.goodCount||0)*2+(a.changeCount||0)*3+(a.acceptedChangeCount||0)*5)||new Date(b.createdAt)-new Date(a.createdAt));if(state.filter==='new')list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));if(state.filter==='monthly')list=list.filter(p=>tags(p).includes(state.monthlyTheme));if(state.filter==='good')list.sort((a,b)=>(b.goodCount||0)-(a.goodCount||0));if(state.filter==='change')list=list.filter(p=>p.changeCount||p.acceptedChangeCount).sort((a,b)=>(b.changeCount||0)-(a.changeCount||0));return list}
function card(p){const mine=state.account&&String(p.address).toLowerCase()===state.account,gooded=p.goodUsers?.includes(state.account),changed=p.changeUsers?.includes(state.account),name=p.displayName||String(p.address||emuT('k.anonymous')).replace(/^(.{6}).*(.{4})$/,'$1…$2'),date=p.createdAt?new Intl.DateTimeFormat(emuLocaleTag(),{month:'numeric',day:'numeric'}).format(new Date(p.createdAt)):'';return`<article class="card"><div class="author"><div class="avatar">${esc((name||'?')[0])}</div><div class="author-meta"><b>${esc(name)}</b><span class="access">${esc(['paid','paidNFT'].includes(p.userType)?emuT('k.paidPass'):emuT('k.freeUser'))}</span><small>${esc(date)}</small></div></div><h3>${esc(p.title)}</h3><div class="body clamp">${esc(p.body)}</div>${String(p.body||'').length>150?`<button class="more">${esc(emuT('k.readMore'))}</button>`:''}${p.imageUrl?`<img class="post-img" loading="lazy" src="${esc(p.imageUrl)}" alt="">`:''}<div class="tags">${tags(p).map(t=>`<span>#${esc(t)}</span>`).join('')}</div><div class="impact"><div><span>${esc(emuT('k.impactLabel'))}</span><b>${esc(emuT('k.impactValue',{n:p.goodCount||0}))}</b></div><div class="stats"><span><b>${p.goodCount||0}</b>${esc(emuT('k.stat.good'))}</span><span><b>${p.changeCount||0}</b>${esc(emuT('k.stat.change'))}</span><span><b>${p.acceptedChangeCount||0}</b>${esc(emuT('k.stat.accepted'))}</span></div></div><div class="actions">${mine?'':`<button data-react="good" data-id="${esc(p.id)}" ${gooded?'disabled':''}>${esc(gooded?emuT('k.action.gooded'):emuT('k.action.good'))}</button><button data-react="change" data-id="${esc(p.id)}" ${changed?'disabled':''}>${esc(changed?emuT('k.action.changed'):emuT('k.action.change'))}</button>`}<button data-react="history" data-id="${esc(p.id)}">${esc(emuT('k.action.history'))}</button></div></article>`}
function render(){const list=visible();$('#countLabel').textContent=emuT('k.count',{n:list.length});$('#sortLabel').textContent=emuT(FILTERS.find(x=>x[0]===state.filter)?.[2]||'');$('#helped').textContent=state.helpedCount;$('#draftCount').textContent=state.drafts.length;$('#scheduledCount').textContent=state.scheduledCount;$('#monthlyTheme').textContent=state.monthlyTheme;$('#valueText').textContent=state.posts.length?emuT('k.valueSummary',{posts:state.posts.length,good:state.posts.reduce((n,p)=>n+(p.goodCount||0),0)}):emuT('k.valueEmpty');renderConclusions();$('#posts').innerHTML=list.length?list.map(card).join(''):`<section class="card empty"><div><div>▤</div><h3>${esc(emuT('k.empty.title'))}</h3><p>${esc(emuT('k.empty.text'))}</p><button class="pill primary" data-compose>${esc(emuT('k.empty.action'))}</button></div></section>`;$('#loadMore').hidden=!state.hasMore;bindDynamic()}
/* 議論から届いた「みんなの結論」。投稿とは別のまとまりとして一覧の上に置く。 */
/* 議論から届いた「みんなの結論」。投稿とは別のまとまりとして一覧の上に置く。 */
function renderConclusions(){
  const box=$('#conclusions'); if(!box) return;
  const rows=state.conclusions||[];
  if(!rows.length){ box.innerHTML=''; box.hidden=true; return; }
  box.hidden=false;
  const head='<h2 class="conc-head">'+esc(emuT('k.conc.title'))+'<small>'+esc(emuT('k.conc.lead'))+'</small></h2>';
  box.innerHTML=head+rows.map(function(c){
    const when=c.createdAt?new Date(c.createdAt).toLocaleDateString('ja-JP'):'';
    const meta=esc(emuT('k.conc.meta',{people:c.participantCount,posts:c.messageCount}))+(when?' ・ '+esc(when):'');
    return '<article class="conc">'
      + '<p class="conc-topic">'+esc(c.topic)+'</p>'
      + '<p class="conc-body">'+esc(c.conclusion)+'</p>'
      + '<p class="conc-meta">'+meta+'</p>'
      + '</article>';
  }).join('');
}
function bindDynamic(){document.querySelectorAll('[data-compose]').forEach(b=>b.onclick=openComposer);document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{const body=b.previousElementSibling;body.classList.toggle('clamp');b.textContent=body.classList.contains('clamp')?emuT('k.readMore'):emuT('k.collapse')});document.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>{if(b.dataset.react!=='history'){b.disabled=true;b.textContent=emuT('k.sending')}send({type:'emu-knowledge-react',action:b.dataset.react,postId:b.dataset.id})})}
/* 言語切替時は、動的に描いた一覧・フィルタを作り直す */
window.onEmuLangChange=()=>{filterButtons();themeButtons();render()};
function setBusy(busy){['#publish','#draft','#schedule'].forEach(s=>{const el=$(s);if(el)el.disabled=busy})}
function resetComposer(){composeForm.reset();state.imageUrl='';state.composeTheme='経験';$('#preview').style.display='none';themeButtons()}
function openOverlay(el){state.lastFocus=document.activeElement;el.classList.add('open');el.setAttribute('aria-hidden','false');$('#appShell').setAttribute('inert','');setTimeout(()=>el.querySelector('button,input,textarea')?.focus(),0)}
function closeOverlay(el){el.classList.remove('open');el.setAttribute('aria-hidden','true');$('#appShell').removeAttribute('inert');state.lastFocus?.focus()}
function openComposer(){openOverlay($('#composer'))}function payload(){return{title:$('#title').value.trim(),body:$('#body').value.trim(),tags:[state.composeTheme,$('#tags').value].filter(Boolean).join(','),imageUrl:state.imageUrl}}
function request(kind){if(!$('#composeForm').reportValidity())return;const requestId=crypto.randomUUID?crypto.randomUUID():String(Date.now());state.pending={requestId,kind};setBusy(true);const type=kind==='publish'?'emu-knowledge-publish':kind==='draft'?'emu-knowledge-draft':'emu-knowledge-schedule',data=payload();if(kind==='schedule'){if(!$('#scheduledAt').value)return finish(false,emuT('k.toast.needSchedule'));data.scheduledAt=$('#scheduledAt').value}send({type,requestId,payload:data});notify(kind==='publish'?emuT('k.toast.publishing'):kind==='draft'?emuT('k.toast.saving'):emuT('k.toast.scheduling'))}
function finish(ok,error){setBusy(false);if(ok){closeOverlay($('#composer'));resetComposer();notify(state.pending?.kind==='draft'?emuT('k.toast.draftSaved'):state.pending?.kind==='schedule'?emuT('k.toast.scheduled'):emuT('k.toast.published'))}else notify(error||emuT('k.toast.failed'));state.pending=null}
function openPanel(kind){const panel=$('#panel');$('#panelTitle').textContent=emuT('k.library');$('#panelList').innerHTML=`<p>${esc(emuT('k.panel.loading'))}</p>`;if(!panel.classList.contains('open'))openOverlay(panel);send({type:'emu-knowledge-panel',kind})}
function renderPanel(kind,items){if(kind==='library'){const posts=items.posts||[],drafts=items.drafts||[];$('#panelList').innerHTML=`<h3>${esc(emuT('k.panel.myPosts'))}</h3>${posts.length?posts.map(p=>`<article class="list-item"><b>${esc(p.title)}</b><small> Good ${p.goodCount||0}・Change ${p.changeCount||0}</small></article>`).join(''):`<p>${esc(emuT('k.panel.noPosts'))}</p>`}<h3>${esc(emuT('k.panel.drafts'))}</h3>${drafts.length?drafts.map(d=>`<article class="list-item"><b>${esc(d.title)}</b><p>${esc(d.body).slice(0,100)}</p><button data-delete-draft="${d.id}">${esc(emuT('k.panel.delete'))}</button></article>`).join(''):`<p>${esc(emuT('k.panel.noDrafts'))}</p>`}`;document.querySelectorAll('[data-delete-draft]').forEach(b=>b.onclick=()=>send({type:'emu-knowledge-delete-draft',draftId:b.dataset.deleteDraft}))}else{const rows=Array.isArray(items)?items:[];$('#panelList').innerHTML=rows.length?rows.map((row,i)=>`<article class="list-item"><b>${i+1}. ${esc(row.displayName||row.address||emuT('k.anonymous'))}</b><small>${esc(row.scoreLabel||String(row.score||0))}</small></article>`).join(''):`<p>${esc(emuT('k.panel.noRanking'))}</p>`}}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay($('#composer')));document.querySelectorAll('[data-panel-close]').forEach(b=>b.onclick=()=>closeOverlay($('#panel')));document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>b.dataset.command==='wallet'?send({type:'emu-knowledge-command',command:'wallet'}):openPanel(b.dataset.command));document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#composer').classList.contains('open'))closeOverlay($('#composer'));if($('#panel').classList.contains('open'))closeOverlay($('#panel'))}});$('#search').oninput=e=>{state.query=e.target.value;render()};$('#composeForm').onsubmit=e=>{e.preventDefault();request('publish')};$('#draft').onclick=()=>request('draft');$('#schedule').onclick=()=>request('schedule');$('#loadMore').onclick=()=>send({type:'emu-knowledge-load-more'});$('#monthlyLink').onclick=()=>{state.filter='monthly';filterButtons();render()};$('#image').onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>8*1024*1024)return notify(emuT('k.toast.imageTooLarge'));const reader=new FileReader;reader.onerror=()=>notify(emuT('k.toast.imageReadError'));reader.onload=()=>{const img=new Image;img.onerror=()=>notify(emuT('k.toast.imageError'));img.onload=()=>{const scale=Math.min(1,900/Math.max(img.width,img.height)),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)return notify(emuT('k.toast.imageError'));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);ctx.drawImage(img,0,0,canvas.width,canvas.height);state.imageUrl=canvas.toDataURL('image/jpeg',.75);$('#preview').src=state.imageUrl;$('#preview').style.display='block'};img.src=reader.result};reader.readAsDataURL(file)};
window.addEventListener('message',e=>{if(e.origin!==ORIGIN||e.source!==parent)return;const m=e.data||{};if(m.type==='emu-knowledge-filter'){const map={recommended:'recommended',recommend:'recommended',trend:'monthly',monthly:'monthly',new:'new',good:'good',change:'change'};state.filter=map[m.mode]||'recommended';filterButtons();render();return}if(m.type==='emu-knowledge-loading'){if(!m.append)$('#posts').innerHTML=`<section class="card empty"><p>${esc(emuT('k.loadingPosts'))}</p></section>`;return}if(m.type==='emu-knowledge-error'){notify(m.error||emuT('k.toast.loadFailed'));return}if(m.type==='emu-knowledge-prefill'){openComposer();const t=$('#body');if(t){t.value=m.body||'';t.focus();}return}if(m.type==='emu-knowledge-posts'){state.posts=m.append?[...state.posts,...m.posts]:m.posts||[];state.account=m.account||'';state.monthlyTheme=m.monthlyTheme||'夏休み';state.drafts=m.drafts||[];state.scheduledCount=m.scheduledCount||0;state.helpedCount=m.helpedCount||0;if(!m.append)state.conclusions=m.conclusions||[];state.canDraft=!!m.canDraft;state.canSchedule=!!m.canSchedule;state.hasMore=!!m.hasMore;$('#draft').hidden=!state.canDraft;$('#schedule').hidden=!state.canSchedule;$('#scheduleField').hidden=!state.canSchedule;render();return}if(m.type==='emu-knowledge-panel-data'){renderPanel(m.kind,m.items||[]);return}if(m.type==='emu-knowledge-save-result'){if(state.pending&&m.requestId===state.pending.requestId)finish(!!m.ok,m.error);if(m.drafts)state.drafts=m.drafts;render();return}if(m.type==='emu-knowledge-drafts'){state.drafts=m.drafts||[];render();if($('#panel').classList.contains('open'))openPanel('library');return}if(m.type==='emu-knowledge-reaction-result'){notify(m.ok?emuT('k.toast.reacted'):m.error||emuT('k.toast.reactFailed'));if(!m.ok)render()}});
filterButtons();themeButtons();render();send({type:'emu-knowledge-ready'});
</script>
