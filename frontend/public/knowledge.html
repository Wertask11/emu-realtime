<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知識を読む — Emu</title>
<style>
[hidden]{display:none!important}
:root{--orange:#ef7d00;--ink:#211f1c;--muted:#85817a;--line:#e5dfd7;--paper:#f8f6f2;--soft:#fff1dc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1660px;margin:auto;padding:44px clamp(24px,3vw,48px) 76px;display:grid;grid-template-columns:220px minmax(620px,1fr) 280px;gap:clamp(24px,2.4vw,42px)}.left{position:sticky;top:26px;align-self:start}.nav{display:grid;gap:7px}.nav button,.tool{border:0;background:transparent;text-align:left;padding:13px 17px;border-radius:11px;font-weight:700;color:#35322e}.nav button.active{background:var(--soft);color:#bd6100}.nav button span,.tool span{display:inline-block;width:32px;color:#a29d95}.divider{height:1px;background:var(--line);margin:18px 0}.tool{display:block;width:100%}.write{width:100%;border:0;border-radius:14px;background:var(--orange);color:#fff;font-weight:800;padding:17px;margin-top:24px;box-shadow:0 10px 24px #ef7d0030}.search{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 18px;padding:0 15px}.search span{color:var(--orange)}.search input{width:100%;border:0;outline:0;background:transparent;padding:14px}.eyebrow{color:#bd6100;font-size:12px;font-weight:900;letter-spacing:.14em;margin:0 0 16px}.heading h1{font:500 50px/1.2 Georgia,"Yu Mincho",serif;margin:0 0 20px}.heading>p:last-child{color:#615d57;margin:0 0 26px}.filters,.themes{display:flex;gap:9px;flex-wrap:wrap}.filters{padding-bottom:16px;border-bottom:1px solid var(--line)}.themes{align-items:center;padding:17px 0}.themes>span{font-size:13px;color:#999}.pill,.theme{border:1px solid var(--line);background:#fff;padding:10px 17px;border-radius:999px;font-weight:700;color:#555;white-space:nowrap}.pill.active{background:#222;color:#fff;border-color:#222}.theme{background:transparent;padding:8px 16px}.theme.active{border-color:#f2ad62;background:#fff8ee;color:#b75c00}.result{display:flex;justify-content:space-between;color:#999;font-size:13px;padding:10px 2px 14px}.result b{font-size:18px;color:#111}.posts{display:grid;gap:16px}.card,.side-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.author{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border-radius:50%;background:#292724;color:#fff;display:grid;place-items:center;font-weight:800}.author-meta{flex:1}.author-meta small{display:block;color:#aaa;margin-top:3px}.access{font-size:10px;border:1px solid #edc99f;color:#aa5b09;border-radius:999px;padding:2px 7px;margin-left:7px}.card h3{font:700 24px/1.45 Georgia,"Yu Mincho",serif;margin:19px 0 10px}.body{line-height:1.85;color:#555;white-space:pre-wrap}.body.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.more,.link{border:0;background:none;color:#bd6100;padding:4px 0;font-weight:800}.post-img{max-width:100%;max-height:420px;border-radius:12px;margin-top:14px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0}.tags span{background:#f5f2ed;border-radius:999px;padding:5px 10px;font-size:12px;color:#777}.impact{display:flex;justify-content:space-between;gap:12px;padding:15px;background:#faf8f4;border-radius:12px;font-size:12px;color:#888}.impact b{display:block;color:#2c2925;margin-top:3px}.stats{display:flex;gap:18px;text-align:center}.actions{display:flex;gap:8px;border-top:1px solid #eee;margin-top:17px;padding-top:14px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;color:#555}.actions button:disabled{opacity:.55;cursor:not-allowed}.empty{min-height:280px;display:grid;place-items:center;text-align:center}.empty h3{font:500 21px Georgia,"Yu Mincho",serif}.primary{border:0!important;background:var(--orange)!important;color:#fff!important}.right{display:grid;align-content:start;gap:18px}.side-card small{color:#999;font-weight:700}.theme-title{font:500 28px Georgia,"Yu Mincho",serif;margin:18px 0}.side-card p{color:#777;line-height:1.65;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0}.metric{background:#faf8f4;border-radius:9px;text-align:center;padding:12px 4px}.metric b{display:block;font-size:20px}.metric span{font-size:10px;color:#999}.load-more{display:block;margin:20px auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 24px;font-weight:700}.overlay{position:fixed;inset:0;background:#211f1c80;backdrop-filter:blur(5px);z-index:20;display:none;align-items:center;justify-content:center;padding:22px}.overlay.open{display:flex}.modal{width:min(764px,100%);max-height:calc(100vh - 35px);overflow:auto;background:#fff;border-radius:26px;padding:36px;box-shadow:0 25px 70px #0004;position:relative}.close{position:absolute;right:22px;top:20px;border:0;background:#f3f1ed;color:#888;width:43px;height:43px;border-radius:50%;font-size:25px}.modal h2{font:500 29px Georgia,"Yu Mincho",serif;margin:7px 0 28px}.choices{display:flex;gap:9px;margin-bottom:18px}.choices button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 16px}.choices button.active{border-color:#f2a04b;background:#fff7eb;color:#ad5700;font-weight:800}.field{display:grid;gap:8px;margin:16px 0}.field label{font-size:13px;font-weight:800;color:#555}.field input,.field textarea{border:1px solid #dfd8ce;background:#fdfcfb;border-radius:12px;padding:14px;outline:0}.field textarea{min-height:176px;resize:vertical}.image-btn{display:inline-flex;border:1px dashed #cfc6bb;border-radius:10px;padding:11px 16px;color:#777}.preview{display:none;max-width:100%;max-height:180px;border-radius:10px;margin-top:10px}.modal-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:20px}.modal-actions button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:15px;font-weight:800}.list{display:grid;gap:10px}.list-item{border:1px solid var(--line);border-radius:12px;padding:14px}.list-item small{color:#999}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:12px 22px;z-index:40;display:none}.toast.show{display:block}@media(max-width:1250px){.shell{grid-template-columns:205px minmax(0,1fr);gap:26px}.right{display:none}}@media(max-width:900px){.shell{grid-template-columns:180px minmax(0,1fr);padding-inline:20px}}@media(max-width:760px){.shell{display:block;padding:22px 14px 50px}.left{position:static}.left .nav,.left .divider,.left .tool{display:none}.left .write{margin:0 0 20px}.heading h1{font-size:36px}.filters{overflow:auto;flex-wrap:nowrap}.card{padding:18px}.impact{display:block}.stats{margin-top:12px;justify-content:space-between}.actions{overflow:auto}.modal{padding:28px 20px}.modal-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell" id="appShell">
  <aside class="left"><nav class="nav" id="sideFilters" aria-label="表示順"></nav><div class="divider"></div><button class="tool" data-command="library"><span aria-hidden="true">▥</span>マイライブラリー</button><button class="tool" data-command="ranking"><span aria-hidden="true">♛</span>ランキング</button><button class="tool" data-command="wallet"><span aria-hidden="true">◇</span>マイウォレット</button><button class="write" data-compose>＋ 知識を届ける</button></aside>
  <main><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="知識を検索" placeholder="悩み・体験・タグから探す"></div><header class="heading"><p class="eyebrow">KNOWLEDGE FROM EXPERIENCE</p><h1>知識を読む</h1><p>誰かの体験から生まれた知識を、あなたの次の一歩へ。</p></header><div class="filters" id="topFilters" aria-label="表示順"></div><div class="themes" id="themes"><span>テーマ</span></div><div class="result"><span><b id="count">0</b>件の知識</span><span id="sortLabel">おすすめ</span></div><div class="posts" id="posts" aria-live="polite"></div><button class="load-more" id="loadMore" hidden>さらに読み込む</button></main>
  <aside class="right"><section class="side-card"><small>今月のテーマ</small><div class="theme-title" id="monthlyTheme">はじまり</div><p>小さな一歩、新しい習慣。あなたの「始めてみた」を知識に。</p><button class="link" id="monthlyLink">テーマの知識を見る →</button></section><section class="side-card"><b>いま届いている価値</b><p id="valueText">読み込み中です。</p></section><section class="side-card"><small>あなたのライブラリー</small><div class="metrics"><div class="metric"><b id="helped">0</b><span>役に立った</span></div><div class="metric"><b id="draftCount">0</b><span>下書き</span></div><div class="metric"><b id="scheduledCount">0</b><span>予約</span></div></div><button class="link" data-command="library">ライブラリーを開く</button></section></aside>
</div>
<div class="overlay" id="composer" role="dialog" aria-modal="true" aria-labelledby="composerTitle" aria-hidden="true"><form class="modal" id="composeForm"><button class="close" type="button" data-close aria-label="閉じる">×</button><p class="eyebrow">SHARE YOUR EXPERIENCE</p><h2 id="composerTitle">体験を、誰かの知識へ。</h2><div class="choices" id="composeThemes"></div><div class="field"><label for="title">タイトル</label><input id="title" maxlength="160" required placeholder="何を知識として届けますか？"></div><div class="field"><label for="body">体験から得たこと</label><textarea id="body" maxlength="5000" required placeholder="状況、試したこと、分かったこと、注意点を書いてください"></textarea></div><div class="field"><label for="tags">タグ（カンマ区切り）</label><input id="tags" maxlength="500" placeholder="習慣, 朝時間, 小さく始める"></div><label class="image-btn" for="image">＋ 画像を追加</label><input id="image" type="file" accept="image/*" hidden><img id="preview" class="preview" alt="選択した画像のプレビュー"><div class="field" id="scheduleField" hidden><label for="scheduledAt">公開日時</label><input id="scheduledAt" type="datetime-local"></div><div class="modal-actions"><button type="button" id="draft" hidden>下書き保存</button><button type="button" id="schedule" hidden>予約投稿</button><button class="primary" id="publish" type="submit">知識を公開する</button></div></form></div>
<div class="overlay" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" aria-hidden="true"><section class="modal"><button class="close" type="button" data-panel-close aria-label="閉じる">×</button><h2 id="panelTitle"></h2><div class="list" id="panelList"></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const ORIGIN=location.origin,FILTERS=[['recommended','✦','おすすめ'],['new','◷','新着'],['monthly','○','今月のテーマ'],['good','♡','役に立った'],['change','↻','改善された']],THEMES=['すべて','経験','失敗','本','出会い'];
const state={posts:[],filter:'recommended',theme:'すべて',query:'',account:'',imageUrl:'',composeTheme:'経験',monthlyTheme:'はじまり',drafts:[],scheduledCount:0,canDraft:false,canSchedule:false,hasMore:false,pending:null,lastFocus:null};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),send=m=>parent.postMessage(m,ORIGIN),tags=p=>(Array.isArray(p.tags)?p.tags:String(p.tags||'').split(',')).map(x=>x.trim()).filter(Boolean);
function notify(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),2800)}
function filterButtons(){const side=FILTERS.map(([id,icon,label])=>`<button data-filter="${id}" class="${state.filter===id?'active':''}" aria-pressed="${state.filter===id}"><span aria-hidden="true">${icon}</span>${label}</button>`).join('');$('#sideFilters').innerHTML=side;$('#topFilters').innerHTML=FILTERS.map(([id,,label])=>`<button class="pill ${state.filter===id?'active':''}" data-filter="${id}" aria-pressed="${state.filter===id}">${label}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;filterButtons();render()})}
function themeButtons(){document.querySelectorAll('#themes .theme').forEach(b=>b.remove());THEMES.forEach(t=>{const b=document.createElement('button');b.className='theme'+(state.theme===t?' active':'');b.textContent=t;b.setAttribute('aria-pressed',String(state.theme===t));b.onclick=()=>{state.theme=t;themeButtons();render()};$('#themes').appendChild(b)});$('#composeThemes').innerHTML=THEMES.slice(1).map(t=>`<button type="button" data-compose-theme="${t}" class="${state.composeTheme===t?'active':''}" aria-pressed="${state.composeTheme===t}">${t}</button>`).join('');document.querySelectorAll('[data-compose-theme]').forEach(b=>b.onclick=()=>{state.composeTheme=b.dataset.composeTheme;themeButtons()})}
function visible(){let list=[...state.posts].filter(p=>{const all=[p.title,p.body,p.displayName,...tags(p)].join(' ').toLowerCase();return(!state.query||all.includes(state.query.toLowerCase()))&&(state.theme==='すべて'||tags(p).includes(state.theme))});if(state.filter==='recommended')list.sort((a,b)=>((b.goodCount||0)*2+(b.changeCount||0)*3+(b.acceptedChangeCount||0)*5)-((a.goodCount||0)*2+(a.changeCount||0)*3+(a.acceptedChangeCount||0)*5)||new Date(b.createdAt)-new Date(a.createdAt));if(state.filter==='new')list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));if(state.filter==='monthly')list=list.filter(p=>tags(p).includes(state.monthlyTheme));if(state.filter==='good')list.sort((a,b)=>(b.goodCount||0)-(a.goodCount||0));if(state.filter==='change')list=list.filter(p=>p.changeCount||p.acceptedChangeCount).sort((a,b)=>(b.changeCount||0)-(a.changeCount||0));return list}
function card(p){const mine=state.account&&String(p.address).toLowerCase()===state.account,gooded=p.goodUsers?.includes(state.account),changed=p.changeUsers?.includes(state.account),name=p.displayName||String(p.address||'匿名').replace(/^(.{6}).*(.{4})$/,'$1…$2'),date=p.createdAt?new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric'}).format(new Date(p.createdAt)):'';return`<article class="card"><div class="author"><div class="avatar">${esc((name||'匿')[0])}</div><div class="author-meta"><b>${esc(name)}</b><span class="access">${['paid','paidNFT'].includes(p.userType)?'有料パス':'無料利用者'}</span><small>${esc(date)}</small></div></div><h3>${esc(p.title)}</h3><div class="body clamp">${esc(p.body)}</div>${String(p.body||'').length>150?'<button class="more">続きを読む</button>':''}${p.imageUrl?`<img class="post-img" loading="lazy" src="${esc(p.imageUrl)}" alt="">`:''}<div class="tags">${tags(p).map(t=>`<span>#${esc(t)}</span>`).join('')}</div><div class="impact"><div><span>この知識が生んだ価値</span><b>${p.goodCount||0}人の次の一歩に</b></div><div class="stats"><span><b>${p.goodCount||0}</b>役に立った</span><span><b>${p.changeCount||0}</b>改善参加</span><span><b>${p.acceptedChangeCount||0}</b>採用済み</span></div></div><div class="actions">${mine?'':`<button data-react="good" data-id="${esc(p.id)}" ${gooded?'disabled':''}>${gooded?'✓ 届けました':'♡ 役に立った'}</button><button data-react="change" data-id="${esc(p.id)}" ${changed?'disabled':''}>${changed?'✓ 提案済み':'↻ 改善案を届ける'}</button>`}<button data-react="history" data-id="${esc(p.id)}">変更履歴</button></div></article>`}
function render(){const list=visible();$('#count').textContent=list.length;$('#sortLabel').textContent=FILTERS.find(x=>x[0]===state.filter)?.[2]||'';$('#helped').textContent=state.posts.filter(p=>p.goodUsers?.includes(state.account)).length;$('#draftCount').textContent=state.drafts.length;$('#scheduledCount').textContent=state.scheduledCount;$('#monthlyTheme').textContent=state.monthlyTheme;$('#valueText').textContent=state.posts.length?`読み込み済み ${state.posts.length}件、役に立った ${state.posts.reduce((n,p)=>n+(p.goodCount||0),0)}回`:'まだ届いている価値はありません。';$('#posts').innerHTML=list.length?list.map(card).join(''):`<section class="card empty"><div><div>▤</div><h3>該当する知識がありません</h3><p>条件を変えるか、最初の知識を届けてみましょう。</p><button class="pill primary" data-compose>知識を届ける</button></div></section>`;$('#loadMore').hidden=!state.hasMore;bindDynamic()}
function bindDynamic(){document.querySelectorAll('[data-compose]').forEach(b=>b.onclick=openComposer);document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{const body=b.previousElementSibling;body.classList.toggle('clamp');b.textContent=body.classList.contains('clamp')?'続きを読む':'閉じる'});document.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>{if(b.dataset.react!=='history'){b.disabled=true;b.textContent='送信中…'}send({type:'emu-knowledge-react',action:b.dataset.react,postId:b.dataset.id})})}
function setBusy(busy){['#publish','#draft','#schedule'].forEach(s=>{const el=$(s);if(el)el.disabled=busy})}
function resetComposer(){composeForm.reset();state.imageUrl='';state.composeTheme='経験';$('#preview').style.display='none';themeButtons()}
function openOverlay(el){state.lastFocus=document.activeElement;el.classList.add('open');el.setAttribute('aria-hidden','false');$('#appShell').setAttribute('inert','');setTimeout(()=>el.querySelector('button,input,textarea')?.focus(),0)}
function closeOverlay(el){el.classList.remove('open');el.setAttribute('aria-hidden','true');$('#appShell').removeAttribute('inert');state.lastFocus?.focus()}
function openComposer(){openOverlay($('#composer'))}function payload(){return{title:$('#title').value.trim(),body:$('#body').value.trim(),tags:[state.composeTheme,$('#tags').value].filter(Boolean).join(','),imageUrl:state.imageUrl}}
function request(kind){if(!$('#composeForm').reportValidity())return;const requestId=crypto.randomUUID?crypto.randomUUID():String(Date.now());state.pending={requestId,kind};setBusy(true);const type=kind==='publish'?'emu-knowledge-publish':kind==='draft'?'emu-knowledge-draft':'emu-knowledge-schedule',data=payload();if(kind==='schedule'){if(!$('#scheduledAt').value)return finish(false,'公開日時を入力してください。');data.scheduledAt=$('#scheduledAt').value}send({type,requestId,payload:data});notify(kind==='publish'?'公開しています…':kind==='draft'?'保存しています…':'予約しています…')}
function finish(ok,error){setBusy(false);if(ok){closeOverlay($('#composer'));resetComposer();notify(state.pending?.kind==='draft'?'下書きを保存しました':state.pending?.kind==='schedule'?'投稿を予約しました':'知識を公開しました')}else notify(error||'処理に失敗しました。');state.pending=null}
function openPanel(kind){const title=kind==='library'?'マイライブラリー':'ランキング',panel=$('#panel');$('#panelTitle').textContent=title;if(kind==='library'){const mine=state.posts.filter(p=>String(p.address).toLowerCase()===state.account);$('#panelList').innerHTML=`<h3>自分の投稿</h3>${mine.length?mine.map(p=>`<article class="list-item"><b>${esc(p.title)}</b><small> Good ${p.goodCount||0}・Change ${p.changeCount||0}</small></article>`).join(''):'<p>投稿はありません。</p>'}<h3>下書き</h3>${state.drafts.length?state.drafts.map(d=>`<article class="list-item"><b>${esc(d.title)}</b><p>${esc(d.body).slice(0,100)}</p><button data-delete-draft="${d.id}">削除</button></article>`).join(''):'<p>下書きはありません。</p>'}`}else{const ranked=[...state.posts].sort((a,b)=>(b.goodCount||0)-(a.goodCount||0));$('#panelList').innerHTML=ranked.length?ranked.slice(0,20).map((p,i)=>`<article class="list-item"><b>${i+1}. ${esc(p.title)}</b><small>${p.goodCount||0} Good</small></article>`).join(''):'<p>ランキング対象の投稿はありません。</p>'}if(!panel.classList.contains('open'))openOverlay(panel);document.querySelectorAll('[data-delete-draft]').forEach(b=>b.onclick=()=>send({type:'emu-knowledge-delete-draft',draftId:b.dataset.deleteDraft}))}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay($('#composer')));document.querySelectorAll('[data-panel-close]').forEach(b=>b.onclick=()=>closeOverlay($('#panel')));document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>b.dataset.command==='wallet'?send({type:'emu-knowledge-command',command:'wallet'}):openPanel(b.dataset.command));document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#composer').classList.contains('open'))closeOverlay($('#composer'));if($('#panel').classList.contains('open'))closeOverlay($('#panel'))}});$('#search').oninput=e=>{state.query=e.target.value;render()};$('#composeForm').onsubmit=e=>{e.preventDefault();request('publish')};$('#draft').onclick=()=>request('draft');$('#schedule').onclick=()=>request('schedule');$('#loadMore').onclick=()=>send({type:'emu-knowledge-load-more'});$('#monthlyLink').onclick=()=>{state.filter='monthly';filterButtons();render()};$('#image').onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>8*1024*1024)return notify('画像は8MB以下にしてください');const reader=new FileReader;reader.onerror=()=>notify('画像を読み込めませんでした。');reader.onload=()=>{const img=new Image;img.onerror=()=>notify('画像を処理できませんでした。');img.onload=()=>{const scale=Math.min(1,900/Math.max(img.width,img.height)),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)return notify('画像を処理できませんでした。');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);ctx.drawImage(img,0,0,canvas.width,canvas.height);state.imageUrl=canvas.toDataURL('image/jpeg',.75);$('#preview').src=state.imageUrl;$('#preview').style.display='block'};img.src=reader.result};reader.readAsDataURL(file)};
window.addEventListener('message',e=>{if(e.origin!==ORIGIN||e.source!==parent)return;const m=e.data||{};if(m.type==='emu-knowledge-loading'){if(!m.append)$('#posts').innerHTML='<section class="card empty"><p>知識を読み込んでいます…</p></section>';return}if(m.type==='emu-knowledge-error'){notify(m.error||'読み込みに失敗しました。');return}if(m.type==='emu-knowledge-posts'){state.posts=m.append?[...state.posts,...m.posts]:m.posts||[];state.account=m.account||'';state.monthlyTheme=m.monthlyTheme||'はじまり';state.drafts=m.drafts||[];state.scheduledCount=m.scheduledCount||0;state.canDraft=!!m.canDraft;state.canSchedule=!!m.canSchedule;state.hasMore=!!m.hasMore;$('#draft').hidden=!state.canDraft;$('#schedule').hidden=!state.canSchedule;$('#scheduleField').hidden=!state.canSchedule;render();return}if(m.type==='emu-knowledge-save-result'){if(state.pending&&m.requestId===state.pending.requestId)finish(!!m.ok,m.error);if(m.drafts)state.drafts=m.drafts;render();return}if(m.type==='emu-knowledge-drafts'){state.drafts=m.drafts||[];render();if($('#panel').classList.contains('open'))openPanel('library');return}if(m.type==='emu-knowledge-reaction-result'){notify(m.ok?'反応を届けました':m.error||'反応を保存できませんでした。');if(!m.ok)render()}});
filterButtons();themeButtons();render();send({type:'emu-knowledge-ready'});
</script>
