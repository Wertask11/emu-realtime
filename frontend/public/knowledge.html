<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知識を読む — Emu</title>
<style>
:root{--orange:#ef7d00;--ink:#211f1c;--muted:#85817a;--line:#e5dfd7;--paper:#f8f6f2;--white:#fff;--soft:#fff1dc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1600px;margin:auto;padding:38px 34px 70px;display:grid;grid-template-columns:264px minmax(0,900px) 310px;gap:34px}.left{position:sticky;top:26px;align-self:start}.left h2{font:700 28px/1.4 Georgia,"Yu Mincho",serif;margin:0 0 14px}.lead{color:#6f6b65;line-height:1.8;font-size:14px;margin:0 0 28px}.nav{display:grid;gap:7px}.nav button,.tool{border:0;background:transparent;text-align:left;padding:13px 17px;border-radius:11px;font-weight:700;color:#35322e}.nav button.active{background:var(--soft);color:#bd6100}.nav button span,.tool span{display:inline-block;width:32px;color:#a29d95}.divider{height:1px;background:var(--line);margin:18px 0}.tool{display:block;width:100%}.write{width:100%;border:0;border-radius:14px;background:var(--orange);color:#fff;font-weight:800;padding:17px;margin-top:24px;box-shadow:0 10px 24px #ef7d0030}.eyebrow{color:#bd6100;font-size:12px;font-weight:900;letter-spacing:.14em;margin:0 0 16px}.heading h1{font:500 50px/1.2 Georgia,"Yu Mincho",serif;margin:0 0 20px}.heading>p:last-child{color:#615d57;margin:0 0 26px}.filters{display:flex;gap:9px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}.pill{border:1px solid var(--line);background:#fff;padding:11px 19px;border-radius:999px;font-weight:700;color:#555}.pill.active{background:#222;color:#fff;border-color:#222}.themes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:17px 0}.themes>span{font-size:13px;color:#999;margin-right:3px}.theme{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:700;color:#666}.theme.active{border-color:#f2ad62;background:#fff8ee;color:#b75c00}.search{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 18px;padding:0 15px}.search span{color:var(--orange)}.search input{width:100%;border:0;outline:0;background:transparent;padding:14px;color:#333}.result{display:flex;justify-content:space-between;color:#999;font-size:13px;padding:10px 2px 14px}.result b{font-size:18px;color:#111}.posts{display:grid;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px}.author{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border-radius:50%;background:#292724;color:#fff;display:grid;place-items:center;font-weight:800}.author-meta{flex:1}.author-meta b{font-size:14px}.author-meta small{display:block;color:#aaa;margin-top:3px}.access{font-size:10px;border:1px solid #edc99f;color:#aa5b09;border-radius:999px;padding:2px 7px;margin-left:7px}.card h3{font:700 24px/1.45 Georgia,"Yu Mincho",serif;margin:19px 0 10px}.body{line-height:1.85;color:#555;white-space:pre-wrap}.body.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.more{border:0;background:none;color:#c56500;padding:4px 0;font-weight:700}.post-img{max-width:100%;max-height:420px;border-radius:12px;margin-top:14px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0}.tags span{background:#f5f2ed;border-radius:999px;padding:5px 10px;font-size:12px;color:#777}.impact{display:flex;justify-content:space-between;gap:12px;padding:15px;background:#faf8f4;border-radius:12px;font-size:12px;color:#888}.impact b{display:block;color:#2c2925;margin-top:3px}.stats{display:flex;gap:18px;text-align:center}.actions{display:flex;gap:8px;border-top:1px solid #eee;margin-top:17px;padding-top:14px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;color:#555}.actions button:hover{border-color:#e79c4c;color:#b65a00}.empty{min-height:310px;display:grid;place-items:center;text-align:center}.empty .icon{font-size:42px;color:#ccc}.empty h3{font:500 21px Georgia,"Yu Mincho",serif;margin:10px}.empty p{color:#999;margin:0 0 10px}.primary{border:0!important;background:var(--orange)!important;color:#fff!important}.right{display:grid;align-content:start;gap:18px}.side-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.side-card small{color:#999;font-weight:700}.theme-title{font:500 28px Georgia,"Yu Mincho",serif;margin:18px 0}.side-card p{color:#777;line-height:1.65;font-size:13px}.link{border:0;background:none;color:#bd6100;font-weight:800;padding:0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0}.metric{background:#faf8f4;border-radius:9px;text-align:center;padding:12px 4px}.metric b{display:block;font-size:20px}.metric span{font-size:10px;color:#999}.overlay{position:fixed;inset:0;background:#211f1c80;backdrop-filter:blur(5px);z-index:20;display:none;align-items:center;justify-content:center;padding:22px}.overlay.open{display:flex}.modal{width:min(764px,100%);max-height:calc(100vh - 35px);overflow:auto;background:#fff;border-radius:26px;padding:36px;box-shadow:0 25px 70px #0004;position:relative}.close{position:absolute;right:22px;top:20px;border:0;background:#f3f1ed;color:#888;width:43px;height:43px;border-radius:50%;font-size:25px}.modal h2{font:500 29px Georgia,"Yu Mincho",serif;margin:7px 0 28px}.choices{display:flex;gap:9px;margin-bottom:18px}.choices button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 16px}.choices button.active{border-color:#f2a04b;background:#fff7eb;color:#ad5700;font-weight:800}.field{display:grid;gap:8px;margin:16px 0}.field label{font-size:13px;font-weight:800;color:#555}.field input,.field textarea{border:1px solid #dfd8ce;background:#fdfcfb;border-radius:12px;padding:14px;outline:0}.field textarea{min-height:176px;resize:vertical}.image-btn{display:inline-flex;border:1px dashed #cfc6bb;border-radius:10px;padding:11px 16px;color:#777;cursor:pointer}.preview{display:none;max-width:100%;max-height:180px;border-radius:10px;margin-top:10px}.modal-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:20px}.modal-actions button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:15px;font-weight:800}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:12px 22px;z-index:40;display:none}.toast.show{display:block}@media(max-width:1100px){.shell{grid-template-columns:220px minmax(0,1fr)}.right{display:none}}@media(max-width:760px){.shell{display:block;padding:22px 14px 50px}.left{position:static}.left h2,.lead,.left .nav,.left .divider,.left .tool{display:none}.left .write{margin:0 0 20px}.heading h1{font-size:36px}.filters{overflow:auto;flex-wrap:nowrap}.pill{white-space:nowrap}.card{padding:18px}.impact{display:block}.stats{margin-top:12px;justify-content:space-between}.actions{overflow:auto}.modal{padding:28px 20px}.modal-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="left">
    <h2>知識を読む</h2><p class="lead">誰かの体験から生まれた知識を受け取り、次の体験へ。</p>
    <nav class="nav" id="sideFilters"></nav><div class="divider"></div>
    <button class="tool"><span>▥</span>マイライブラリー</button><button class="tool"><span>♛</span>ランキング</button><button class="tool"><span>◇</span>マイウォレット</button>
    <button class="write" data-compose>＋ 知識を届ける</button>
  </aside>
  <main>
    <div class="search"><span>⌕</span><input id="search" type="search" placeholder="悩み・体験・タグから探す"></div>
    <header class="heading"><p class="eyebrow">KNOWLEDGE FROM EXPERIENCE</p><h1>知識を読む</h1><p>誰かの体験から生まれた知識を、あなたの次の一歩へ。</p></header>
    <div class="filters" id="topFilters"></div><div class="themes" id="themes"><span>テーマ</span></div>
    <div class="result"><span><b id="count">0</b>件の知識</span><span id="sortLabel">おすすめ</span></div><div class="posts" id="posts"></div>
  </main>
  <aside class="right"><section class="side-card"><small>今月のテーマ</small><div class="theme-title">はじまり</div><p>小さな一歩、新しい習慣。あなたの「始めてみた」を知識に。</p><button class="link" data-theme="はじまり">テーマの知識を見る →</button></section><section class="side-card"><b>いま届いている価値</b><p id="valueText">まだ届いている価値はありません。</p></section><section class="side-card"><small>あなたのライブラリー</small><div class="metrics"><div class="metric"><b id="helped">0</b><span>役に立った</span></div><div class="metric"><b>0</b><span>下書き</span></div><div class="metric"><b>0</b><span>予約</span></div></div><button class="link">ライブラリーを開く</button></section></aside>
</div>
<div class="overlay" id="composer"><form class="modal" id="composeForm"><button class="close" type="button" data-close>×</button><p class="eyebrow">SHARE YOUR EXPERIENCE</p><h2>体験を、誰かの知識へ。</h2><div class="choices" id="composeThemes"></div><div class="field"><label>タイトル</label><input id="title" maxlength="160" required placeholder="何を知識として届けますか？"></div><div class="field"><label>体験から得たこと</label><textarea id="body" maxlength="5000" required placeholder="状況、試したこと、分かったこと、注意点を書いてください"></textarea></div><div class="field"><label>タグ（カンマ区切り）</label><input id="tags" maxlength="500" placeholder="習慣, 朝時間, 小さく始める"></div><label class="image-btn">＋ 画像を追加<input id="image" type="file" accept="image/*" hidden></label><img id="preview" class="preview" alt=""><div class="modal-actions"><button type="button" id="draft">下書き保存</button><button class="primary" type="submit">知識を公開する</button></div></form></div>
<div class="toast" id="toast"></div>
<script>
const FILTERS=[['recommended','✦','おすすめ'],['new','◷','新着'],['monthly','○','今月のテーマ'],['good','♡','役に立った'],['change','↻','改善された']];const THEMES=['すべて','経験','失敗','本','出会い'];let state={posts:[],filter:'recommended',theme:'すべて',query:'',account:'',imageUrl:'',composeTheme:'経験'};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filterButtons(){const html=FILTERS.map(([id,icon,label])=>`<button data-filter="${id}" class="${state.filter===id?'active':''}"><span>${icon}</span>${label}</button>`).join('');$('#sideFilters').innerHTML=html;$('#topFilters').innerHTML=FILTERS.map(([id,,label])=>`<button class="pill ${state.filter===id?'active':''}" data-filter="${id}">${label}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;filterButtons();render()})}
function themeButtons(){THEMES.forEach(t=>{const b=document.createElement('button');b.className='theme'+(state.theme===t?' active':'');b.textContent=t;b.onclick=()=>{state.theme=t;themeButtonsReset();render()};$('#themes').appendChild(b)});$('#composeThemes').innerHTML=THEMES.slice(1).map(t=>`<button type="button" data-compose-theme="${t}" class="${state.composeTheme===t?'active':''}">${t}</button>`).join('');document.querySelectorAll('[data-compose-theme]').forEach(b=>b.onclick=()=>{state.composeTheme=b.dataset.composeTheme;themeButtonsReset()})}
function themeButtonsReset(){document.querySelectorAll('#themes .theme').forEach(b=>b.remove());themeButtons();}
function tags(p){return(Array.isArray(p.tags)?p.tags:String(p.tags||'').split(',')).map(x=>x.trim()).filter(Boolean)}function visible(){let a=state.posts.filter(p=>{const all=[p.title,p.body,p.displayName,...tags(p)].join(' ').toLowerCase();return(!state.query||all.includes(state.query.toLowerCase()))&&(state.theme==='すべて'||tags(p).includes(state.theme))});if(state.filter==='new')a.sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt));if(state.filter==='monthly')a=a.filter(p=>tags(p).includes('はじまり'));if(state.filter==='good')a.sort((x,y)=>y.goodCount-x.goodCount);if(state.filter==='change')a=a.filter(p=>p.changeCount||p.acceptedChangeCount).sort((x,y)=>y.changeCount-x.changeCount);return a}
function card(p){const mine=state.account&&String(p.address).toLowerCase()===state.account;const name=p.displayName||String(p.address||'匿名').replace(/^(.{6}).*(.{4})$/,'$1…$2');const ts=p.createdAt?new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric'}).format(new Date(p.createdAt)):'';return`<article class="card"><div class="author"><div class="avatar">${esc((name||'匿')[0])}</div><div class="author-meta"><b>${esc(name)}</b><span class="access">${p.userType==='paid'?'有料パス':'無料利用者'}</span><small>${esc(ts)}</small></div></div><h3>${esc(p.title)}</h3><div class="body clamp">${esc(p.body)}</div>${String(p.body||'').length>150?'<button class="more">続きを読む</button>':''}${p.imageUrl?`<img class="post-img" src="${esc(p.imageUrl)}" alt="">`:''}<div class="tags">${tags(p).map(t=>`<span>#${esc(t)}</span>`).join('')}</div><div class="impact"><div><span>この知識が生んだ価値</span><b>${p.goodCount||0}人の次の一歩に</b></div><div class="stats"><span><b>${p.goodCount||0}</b>役に立った</span><span><b>${p.changeCount||0}</b>改善参加</span><span><b>${p.acceptedChangeCount||0}</b>採用済み</span></div></div><div class="actions">${mine?'':`<button data-react="good" data-id="${esc(p.id)}">♡ 役に立った</button><button data-react="change" data-id="${esc(p.id)}">↻ 改善案を届ける</button>`}<button>変更履歴</button></div></article>`}
function render(){const a=visible();$('#count').textContent=a.length;$('#sortLabel').textContent=FILTERS.find(x=>x[0]===state.filter)?.[2]||'';$('#helped').textContent=state.posts.filter(p=>p.goodUsers?.includes(state.account)).length;$('#valueText').textContent=state.posts.length?`知識 ${state.posts.length}件、役に立った ${state.posts.reduce((n,p)=>n+(p.goodCount||0),0)}回`:'まだ届いている価値はありません。';$('#posts').innerHTML=a.length?a.map(card).join(''):`<section class="card empty"><div><div class="icon">▤</div><h3>まだ知識がありません</h3><p>最初の体験を、誰かの次の一歩になる知識として届けてみましょう。</p><button class="pill primary" data-compose>最初の知識を届ける</button></div></section>`;bind()}
function bind(){document.querySelectorAll('[data-compose]').forEach(b=>b.onclick=openComposer);document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{const body=b.previousElementSibling;body.classList.toggle('clamp');b.textContent=body.classList.contains('clamp')?'続きを読む':'閉じる'});document.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>parent.postMessage({type:'emu-knowledge-react',action:b.dataset.react,postId:b.dataset.id},'*'))}
function openComposer(){$('#composer').classList.add('open')}function closeComposer(){$('#composer').classList.remove('open')}function payload(){return{title:$('#title').value.trim(),body:$('#body').value.trim(),tags:[state.composeTheme,$('#tags').value].filter(Boolean).join(','),imageUrl:state.imageUrl}}
function notify(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeComposer);$('#composer').onclick=e=>{if(e.target===$('#composer'))closeComposer()};$('#search').oninput=e=>{state.query=e.target.value;render()};$('#composeForm').onsubmit=e=>{e.preventDefault();parent.postMessage({type:'emu-knowledge-publish',payload:payload()},'*');closeComposer();notify('知識を公開しています…')};$('#draft').onclick=()=>{if(!$('#title').value.trim())return notify('タイトルを入力してください');parent.postMessage({type:'emu-knowledge-draft',payload:payload()},'*');closeComposer();notify('下書きを保存しました')};$('#image').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024)return notify('画像は8MB以下にしてください');const r=new FileReader;r.onload=()=>{const img=new Image;img.onload=()=>{const max=900,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);state.imageUrl=c.toDataURL('image/jpeg',.75);$('#preview').src=state.imageUrl;$('#preview').style.display='block'};img.src=r.result};r.readAsDataURL(f)};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.query=b.dataset.theme;$('#search').value=state.query;render()});
window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='emu-knowledge-posts'){state.posts=m.posts||[];state.account=m.account||'';render()}if(m.type==='emu-knowledge-filter'&&m.mode){state.filter=m.mode==='recommended'?'recommended':m.mode;filterButtons();render()}if(m.type==='emu-knowledge-saved'){notify(m.kind==='draft'?'下書きを保存しました':'知識を公開しました');setTimeout(()=>parent.postMessage({type:'emu-knowledge-refresh'},'*'),700)}});filterButtons();themeButtons();render();parent.postMessage({type:'emu-knowledge-ready'},'*');
</script>
</body></html>
