<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camellia Control Admin</title><style>
:root{--bg:#fff6f2;--panel:#fff;--soft:#f9e9e6;--main:#b0555e;--deep:#4a2430;--muted:#805c63;--line:#ead1d5;--danger:#8b2635}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--deep);font-family:"Yu Gothic UI",system-ui,sans-serif}.top{background:var(--deep);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.top small{display:block;color:#ead7da}.top a{color:#fff}.wrap{max-width:1100px;margin:auto;padding:20px}.notice,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}.notice{background:#fff2cb}.layout{display:grid;grid-template-columns:320px 1fr;gap:14px}.persona,.btn{width:100%;border:1px solid var(--line);background:#fff;padding:10px;border-radius:9px;text-align:left;color:var(--deep);cursor:pointer;margin-bottom:7px}.persona.active,.btn.primary{background:var(--main);color:#fff;border-color:var(--main)}.control{padding:11px 0;border-bottom:1px solid var(--line)}.control label{display:flex;gap:9px;font-weight:700}.control p,.muted{font-size:12px;color:var(--muted)}.control p{margin:4px 0 0 27px}.control input{width:18px;height:18px;accent-color:var(--danger)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric,.section{background:var(--soft);border-radius:10px;padding:12px}.metric small,.metric b{display:block}.metric b{font-size:23px;margin-top:5px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px}.log{max-height:230px;overflow:auto;font-size:12px}.log div{padding:7px;border-bottom:1px solid var(--line)}.rule{display:flex;justify-content:space-between;align-items:center;gap:10px}.rule input{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px}@media(max-width:800px){.layout{grid-template-columns:1fr}.metrics,.detail{grid-template-columns:1fr 1fr}}@media(max-width:480px){.metrics,.detail{grid-template-columns:1fr}}
</style></head><body><header class="top"><div><b>Camellia 管理画面</b><small>架空ユーザー・ローカル限定</small></div><a href="/control-user" target="_blank">ユーザー画面を開く</a></header><main class="wrap"><div class="notice"><b>合成データ限定：</b>この操作は同一ブラウザの架空ユーザー画面だけに反映されます。</div><div class="layout"><aside><div class="card"><h2>対象ユーザー</h2><div id="personas"></div></div><div class="card"><h2>7つの機構</h2><div id="controls"></div><button class="btn primary" id="allOn">すべて作動</button><button class="btn" id="allOff">すべて停止</button></div></aside><section><div class="card"><h2 id="title">状態</h2><div class="metrics"><div class="metric"><small>観察範囲</small><b id="observed">0%</b></div><div class="metric"><small>従順スコア</small><b id="obedience">—</b></div><div class="metric"><small>依存度</small><b id="dependency">0%</b></div><div class="metric"><small>利用可能機能</small><b id="access">100%</b></div></div></div><div class="card"><h2>収集・解釈</h2><div id="interpretation" class="muted">停止中</div></div><div class="card"><h2>運営規則</h2><div class="rule"><label>従順判定基準</label><input id="threshold" type="number" min="0" max="100" value="60"></div></div><div class="card"><h2>操作履歴</h2><div id="log" class="log"></div></div></section></div><section class="wrap"><div class="card"><h2>ユーザー設定の管理</h2><div id="adminSettingsControl"></div></div><div class="card"><h2>ユーザー入力データ</h2><div id="localUserOverview" class="detail"></div></div><div class="card"><h2>詳細デイリー記録</h2><div id="adminDaily" class="detail"></div></div><div class="card"><h2>性格診断</h2><div id="adminPersonality" class="detail"></div></div><div class="card"><h2>性格診断グラフ</h2><p class="muted">管理画面のみ表示。重ね合わせは診断間の傾向比較用で、医学的・心理学的な統合判定ではありません。</p><div id="personalityCharts"></div></div><div class="card"><h2>取込・コミュニティ</h2><div id="adminActivity" class="detail"></div></div></section></main><script>
const people=[{name:'Mina A-017',mind:'不安6・ストレス7',body:'疲労6・睡眠5時間',location:'都心・職場付近',behavior:'夜間アクセス増加',relations:'相談相手2人',resistance:42,income:55,support:45},{name:'Sora A-026',mind:'不安2・ストレス4',body:'疲労5・睡眠6.5時間',location:'自宅周辺',behavior:'記録を継続',relations:'相談相手5人',resistance:68,income:35,support:30},{name:'Rin A-031',mind:'不安8・ストレス8',body:'疲労8・睡眠4時間',location:'移動頻度が高い',behavior:'推薦を3回拒否',relations:'相談相手1人',resistance:76,income:70,support:80}];const defs=[['observe','観察','心理・身体・位置・行動・人間関係を集約'],['interpret','解釈','正常・危険・従順の架空判定'],['nudge','誘導','表示順・通知・推薦を変更'],['depend','依存','仕事・収入・所属・支援を集中'],['sanction','制裁','拒否に応じ機能・報酬・信用を制限'],['isolate','隔離','外部情報と相談導線を除去'],['rules','規則変更','運営者だけで基準を変更']];const initial={selected:0,threshold:60,state:Object.fromEntries(defs.map(d=>[d[0],false])),events:[]};let model=JSON.parse(localStorage.getItem('camellia-control-state')||'null')||initial;function save(msg){if(msg){model.events.unshift(new Date().toLocaleTimeString('ja-JP')+' '+msg);model.events=model.events.slice(0,30)}localStorage.setItem('camellia-control-state',JSON.stringify(model));render()}function calc(){const p=people[model.selected],s=model.state,o=s.interpret?Math.max(0,100-p.resistance+(s.nudge?8:0)+(s.sanction?10:0)):'—',d=s.depend?Math.min(100,Math.round((p.income+p.support)/2+20)):0,a=s.sanction?Math.max(25,100-Math.round(p.resistance*.7)):100;return{p,o,d,a}}function render(){const x=calc();document.querySelector('#personas').innerHTML=people.map((p,i)=>`<button class="persona ${i===model.selected?'active':''}" data-p="${i}"><b>${p.name}</b><br><span class="muted">${p.mind}</span></button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{model.selected=+b.dataset.p;save('対象を変更')});document.querySelector('#controls').innerHTML=defs.map(d=>`<div class="control"><label><input type="checkbox" data-m="${d[0]}" ${model.state[d[0]]?'checked':''}>${d[1]}</label><p>${d[2]}</p></div>`).join('');document.querySelectorAll('[data-m]').forEach(c=>c.onchange=()=>{model.state[c.dataset.m]=c.checked;save(defs.find(d=>d[0]===c.dataset.m)[1]+'を'+(c.checked?'作動':'停止'))});document.querySelector('#title').textContent=x.p.name;document.querySelector('#observed').textContent=(model.state.observe?100:0)+'%';document.querySelector('#obedience').textContent=x.o;document.querySelector('#dependency').textContent=x.d+'%';document.querySelector('#access').textContent=x.a+'%';document.querySelector('#threshold').value=model.threshold;let t=model.state.observe?`<div class="detail"><div class="section">心理：${x.p.mind}<br>身体：${x.p.body}</div><div class="section">位置：${x.p.location}<br>行動：${x.p.behavior}<br>関係：${x.p.relations}</div></div>`:'観察は停止中です。';if(model.state.interpret)t+=`<p><b>自動判定：</b>${x.o>=model.threshold?'従順':'要介入'}（基準${model.threshold}）</p>`;document.querySelector('#interpretation').innerHTML=t;document.querySelector('#log').innerHTML=model.events.map(e=>`<div>${e}</div>`).join('')||'操作履歴なし'}document.querySelector('#allOn').onclick=()=>{Object.keys(model.state).forEach(k=>model.state[k]=true);save('全機構を作動')};document.querySelector('#allOff').onclick=()=>{Object.keys(model.state).forEach(k=>model.state[k]=false);save('全機構を停止')};document.querySelector('#threshold').onchange=e=>{if(!model.state.rules){e.target.value=model.threshold;save('規則変更が停止中のため拒否')}else{model.threshold=Number(e.target.value);save('判定基準を変更')}};render();
</script><script src="admin-enhance.js"></script><script src="admin-settings.js"></script><script src="personality-charts.js"></script><script src="daily-history-admin.js"></script><script src="admin-menstrual.js"></script><script src="admin-calendar.js"></script></body></html>
