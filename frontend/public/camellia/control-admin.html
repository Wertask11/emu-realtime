<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camellia Admin</title><style>:root{--bg:#fff6f2;--soft:#f9e9e6;--main:#b0555e;--deep:#4a2430;--muted:#805c63;--line:#ead1d5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--deep);font-family:"Yu Gothic UI",system-ui,sans-serif}.top{background:var(--deep);color:#fff;padding:16px 22px}.app{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.stats,.detail{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.detail{grid-template-columns:1fr 1fr}.stat,.section{background:var(--soft);border-radius:10px;padding:12px}.stat small,.stat b{display:block}.stat b{font-size:22px}.users{display:flex;gap:8px;overflow:auto}.user{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:9px;cursor:pointer}.user.active{background:var(--main);color:#fff}.section p{white-space:pre-wrap;line-height:1.6}.history{width:100%;border-collapse:collapse}.history th,.history td{padding:8px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}.scroll{overflow:auto;max-height:330px}.muted{color:var(--muted);font-size:12px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}}</style></head><body><header class="top"><b>Camellia 管理画面</b><div class="muted" style="color:#ead7da">ユーザー別ローカルデータベース</div></header><main class="app"><div class="stats"><div class="card stat"><small>ユーザー</small><b id="count">0</b></div><div class="card stat"><small>オンライン</small><b id="online">0</b></div><div class="card stat"><small>記録総数</small><b id="records">0</b></div><div class="card stat"><small>選択中</small><b id="who">—</b></div></div><div class="card"><h2>ユーザーを選択</h2><div id="users" class="users"></div></div><div class="card"><h2 id="title">詳細</h2><div id="overview" class="detail"></div></div><div class="card"><h2>デイリー記録</h2><input id="date" type="date"><div id="daily" class="detail" style="margin-top:12px"></div><div class="scroll"><table class="history"><thead><tr><th>日付</th><th>感情</th><th>不安</th><th>ストレス</th><th>痛み</th><th>疲労</th><th>周期</th></tr></thead><tbody id="history"></tbody></table></div></div><div class="card"><h2>性格診断・活動</h2><div id="personality" class="detail"></div></div></main><script>const KEY='camellia-users-db';let selected='A-017';const $=q=>document.querySelector(q),esc=v=>String(v??'未記録').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),sec=(t,b)=>`<div class="section"><h3>${t}</h3><p>${b}</p></div>`,fmt=v=>v?new Date(v).toLocaleString('ja-JP'):'未記録';function render(){const db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:{}},list=Object.values(db.users),u=db.users[selected]||list[0];if(!u){$('#overview').innerHTML='ユーザー画面を一度開くとデータベースが作成されます。';return}selected=u.id;$('#count').textContent=list.length;$('#online').textContent=list.filter(x=>x.online).length;$('#records').textContent=list.reduce((n,x)=>n+(x.dailyHistory?.length||0),0);$('#who').textContent=u.name;$('#users').innerHTML=list.map(x=>`<button class="user ${x.id===selected?'active':''}" data-id="${x.id}">${esc(x.name)}<br><small>${x.id}</small></button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;$('#date').value='';render()});$('#title').textContent=`${u.name}（${u.id}）`;$('#overview').innerHTML=sec('プロフィール',`${u.avatar?`<img src="${u.avatar}" style="width:80px;height:80px;border-radius:50%;object-fit:cover"><br>`:''}表示名：${esc(u.profile?.displayName)}<br>生年：${esc(u.profile?.birthYear)}<br>職業：${esc(u.profile?.occupation)}<br>目標：${esc(u.profile?.goal)}`)+sec('接続・信用・報酬',`状態：${u.online?'オンライン':'オフライン'}<br>最終接続：${fmt(u.lastSeen)}<br>信用：${u.trust}<br>報酬：${Number(u.reward||0).toLocaleString()} SP`)+sec('設定',`保存：${u.settings?.saveData!==false?'ON':'OFF'}<br>位置情報：${u.settings?.allowLocation!==false?'ON':'OFF'}<br>取込AI利用：${u.settings?.useImported!==false?'ON':'OFF'}<br>外部LLM：${u.settings?.externalLlm!==false?'ON':'OFF'}`)+sec('位置・AI・活動',`位置：${u.location?`${u.location.latitude}, ${u.location.longitude}`:'未取得'}<br>AIチャット：${u.chats?.length||0}件<br>取込：${Object.keys(u.imports||{}).join('、')||'なし'}<br>投稿：${u.community?.length||0}件`);const hist=u.dailyHistory||[];if(!$('#date').value)$('#date').value=hist.at(-1)?.date||'';const d=hist.find(x=>x.date===$('#date').value)||u.daily;$('#daily').innerHTML=d?sec('心の状態',`感情：${esc(d.mood)}<br>不安：${esc(d.anxiety)}/10<br>ストレス：${esc(d.stress)}/10<br>孤独：${esc(d.loneliness)}/10<br>意欲：${esc(d.motivation)}/10<br>睡眠：${esc(d.sleep)}時間<br>${esc(d.mindNote)}`)+sec('体の状態',`痛み：${esc(d.painPlace)} ${esc(d.pain)}/10<br>疲労：${esc(d.fatigue)}/10<br>体力：${esc(d.energy)}/10<br>体温：${esc(d.temperature)}<br>周期：${esc(d.cycle)}<br>最終月経：${esc(d.lastMenstrualDate)}<br>症状：${esc(d.symptoms)}<br>服薬：${esc(d.medication)}<br>${esc(d.bodyNote)}`):sec('記録なし','選択日の記録はありません。');$('#history').innerHTML=hist.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.mood)}</td><td>${esc(x.anxiety)}</td><td>${esc(x.stress)}</td><td>${esc(x.pain)}</td><td>${esc(x.fatigue)}</td><td>${esc(x.cycle)}</td></tr>`).join('');const p=u.personality||{},big=p.bigFive?Object.entries(p.bigFive).map(([k,v])=>`${k}：${v}/100`).join('<br>'):'未実施';$('#personality').innerHTML=sec('Big Five',big)+sec('その他の診断',`エニアグラム：${p.enneagram?.type?'タイプ'+p.enneagram.type:'未実施'}<br>YG：${esc(p.yg)}<br>MBTI：${esc(p.mbti)}<br>動物キャラ：${esc(p.animal)}`)+sec('取込・チャット',`取込：${Object.entries(u.imports||{}).map(([k,v])=>`${k}:${esc(v.name)}`).join('<br>')||'なし'}<br>AIチャット：${u.chats?.length||0}件`)+sec('コミュニティ最新',u.community?.slice(-5).map(x=>`${esc(x.name)}：${esc(x.text)}`).join('<br>')||'なし')}$('#date').onchange=render;render();addEventListener('storage',render);setInterval(render,1000)</script></body></html>
