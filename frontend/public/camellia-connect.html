<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CamelliaとSchoolParkをつなぐ</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#fff7f8;color:#3c2830;display:grid;min-height:100vh;place-items:center}.card{max-width:390px;padding:32px;text-align:center}.flower{font-size:42px;color:#d85d78}button{border:0;border-radius:999px;padding:14px 24px;background:#d85d78;color:#fff;font-weight:700}p{line-height:1.8}</style></head><body><main class="card"><div class="flower">✿</div><h1>SchoolParkとつなぎます</h1><p id="status">Passportを確認しています。</p><button id="retry" hidden>もう一度試す</button></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';
const config={apiKey:'AIzaSyBKHS1D8Or6gfMd4NbzhDI7dG5Je7BLtbs',authDomain:'schoolpark-emu.vercel.app',projectId:'emusch-2a111',appId:'1:795496371585:web:51deec91b8a2152e4c8480'};const auth=getAuth(initializeApp(config));const status=document.querySelector('#status'),retry=document.querySelector('#retry');
const params=new URLSearchParams(location.search),returnUrl=params.get('return');function fail(text){status.textContent=text;retry.hidden=false}async function run(user){if(!returnUrl||!returnUrl.startsWith('https://camellia-beta.vercel.app/'))return fail('戻り先を確認できませんでした。');if(!user)return fail('先にSchoolParkへログインしてから、もう一度お試しください。');try{const token=await user.getIdToken();const r=await fetch('https://emu-realtime.onrender.com/api/camellia-auth/passport/ticket',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});const data=await r.json();if(!r.ok||!data.ticket)throw new Error();const u=new URL(returnUrl);u.searchParams.set('camellia_passport_ticket',data.ticket);location.replace(u.toString())}catch(e){fail('うまくつながりませんでした。もう一度試してみてください。')}}retry.onclick=()=>location.reload();onAuthStateChanged(auth,run);
</script></body></html>
