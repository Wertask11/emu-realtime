<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Camellia 管理</title>
<style>
:root{--ink:#2f2530;--muted:#756b73;--line:#eadde3;--bg:#fff8fb;--card:#fff;--accent:#c76582}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.65}
.wrap{max-width:1000px;margin:auto;padding:24px 18px 80px}h1{font-size:22px;margin:0}.lead,.meta,.empty{color:var(--muted);font-size:12px}
.notice{padding:12px;border:1px solid #efcbd6;border-radius:12px;background:#fff0f5;margin:16px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.hide{display:none}.empty{text-align:center;padding:20px}
details{border-bottom:1px solid var(--line)}summary{cursor:pointer;padding:13px 0}pre{white-space:pre-wrap;word-break:break-word;background:#fff8fb;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px}
</style>
</head>
<body><main class="wrap">
  <h1>Camellia 管理</h1>
  <p class="lead">正式版Camelliaの保存データ（オーナー専用）</p>
  <div id="gate" class="empty">権限を確認しています…</div>
  <section id="main" class="hide">
    <p class="notice"><b>センシティブな情報を含みます。</b>第三者から見えない場所でのみ開いてください。</p>
    <div class="card"><input id="find" placeholder="Camellia ID・表示名で探す"><div id="list"><p class="empty">読み込み中…</p></div></div>
  </section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
const API="https://emu-realtime.onrender.com";
const app=initializeApp({apiKey:"AIzaSyBKHS1D8Or6gfMd4NbzhDI7dG5Je7BLtbs",authDomain:"schoolpark-emu.vercel.app",projectId:"emusch-2a111",storageBucket:"emusch-2a111.firebasestorage.app",messagingSenderId:"795496371585",appId:"1:795496371585:web:51deec91b8a2152e4c8480"});
const auth=getAuth(app),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v?new Date(v).toLocaleString("ja-JP"):"—";
async function api(path,force=false){
  const user=auth.currentUser;if(!user)throw new Error("LOGIN_REQUIRED");
  const res=await fetch(API+path,{headers:{Authorization:"Bearer "+await user.getIdToken(force)}});
  let data={};try{data=await res.json()}catch(_){}
  if(res.status===401&&!force)return api(path,true);
  if(!res.ok)throw Object.assign(new Error(data.error||("HTTP "+res.status)),{code:data.error});
  return data;
}
const value=v=>v==null||v===""?"—":typeof v==="object"?JSON.stringify(v,null,2):String(v);
function section(title,rows){
  const list=Array.isArray(rows)?rows:[];
  return '<details><summary><b>'+esc(title)+'</b>（'+list.length+'）</summary>'
    +(list.length?list.map(row=>'<pre>'+esc(value(row))+'</pre>').join(""):'<p class="empty">まだありません。</p>')+'</details>';
}
async function detail(id,target){
  target.innerHTML='<p class="empty">全データを読み込んでいます…</p>';
  try{
    const r=await api('/api/camellia/admin/users/'+encodeURIComponent(id)),u=r.user||{},c=r.collections||{};
    target.innerHTML=section("プロフィール",[u.profile||{}])+section("保存への確認記録",[u.consent||{}])
      +section("今日のCheck",c.checkins)+section("行動",c.actions)+section("行動への評価",c.actionFeedback)
      +section("保存した行動",c.savedActions)+section("AI Camellia 会話",c.aiMessages)
      +section("Memory",c.contextualMemory)+section("Insight",c.insights)+section("Insightへの回答",c.insightFeedback)
      +section("今日の一枚",c.fortunes)+section("My Tree",c.treeLeaves)
      +section("My Treeの振り返り",c.treeReflections)+section("操作イベント",c.analyticsEvents);
  }catch(e){target.innerHTML='<p class="empty">読み込めませんでした（'+esc(e.code||e.message)+'）</p>'}
}
async function load(){
  const box=$("#list");let users=[];
  try{users=(await api("/api/camellia/admin/users")).users||[]}catch(e){box.innerHTML='<p class="empty">読み込めませんでした（'+esc(e.code||e.message)+'）</p>';return}
  function paint(){
    const q=$("#find").value.trim().toLowerCase(),hit=!q?users:users.filter(u=>[u.id,u.sourceProfileId,u.profile&&u.profile.name].some(v=>String(v||"").toLowerCase().includes(q)));
    box.innerHTML=hit.length?hit.map(u=>{const n=u.counts||{};return '<details data-id="'+esc(u.id)+'"><summary><b>'+esc((u.profile&&u.profile.name)||"名前未設定")+'</b><br><small class="meta">'+esc(u.id)+'／最終同期 '+esc(fmt(u.lastSyncAt))+'<br>Check '+Number(n.checkins||0)+'・AI会話 '+Number(n.aiMessages||0)+'・My Tree '+Number(n.treeLeaves||0)+'</small></summary><div data-detail><p class="empty">開くと全データを読み込みます。</p></div></details>'}).join(""):'<p class="empty">該当する利用者はいません。</p>';
    box.querySelectorAll("[data-id]").forEach(d=>d.addEventListener("toggle",()=>{if(!d.open||d.dataset.loaded)return;d.dataset.loaded="1";detail(d.dataset.id,d.querySelector("[data-detail]"))}));
  }
  $("#find").oninput=paint;paint();
}
onAuthStateChanged(auth,async user=>{
  if(!user){$("#gate").textContent="SchoolParkへ運営アカウントでログインしてから開いてください。";return}
  try{await api("/api/camellia/admin/users");$("#gate").classList.add("hide");$("#main").classList.remove("hide");load()}
  catch(e){$("#gate").textContent=e.code==="OWNER_ONLY"?"この画面はオーナー専用です。":"確認できませんでした（"+(e.code||e.message)+"）"}
});
</script></body></html>
