<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一日シェア — Emu</title>
<meta name="description" content="わたしの一日が、誰かの学びになる。時間割を決め、学びを残し、みんなの一日から学ぶ。">
<style>
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
:root {
  --orange: #ef7a2c;
  --orange-dark: #c95b18;
  --cream: #fffaf3;
  --ink: #302c28;
  --muted: #80776d;
  --line: #eadfd2;
}
body { margin: 0; background: var(--cream); color: var(--ink); font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", sans-serif; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
.app-shell { min-height: 100vh; }
.topbar { height: 78px; padding: 0 max(24px, calc((100vw - 1180px)/2)); display: flex; align-items: center; gap: 38px; background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); }
.brand { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; text-align: left; color: var(--ink); padding: 0; margin-right: auto; }
.brand-mark { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 14px 14px 14px 4px; color: white; background: var(--orange); font-family: serif; font-size: 24px; font-weight: 700; box-shadow: 0 5px 12px #ef7a2c38; }
.brand b { display: block; font-family: serif; font-size: 21px; letter-spacing: .08em; }
.brand small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
nav { display: flex; align-self: stretch; gap: 24px; }
nav button { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; padding: 4px 3px 0; border-bottom: 3px solid transparent; }
nav button.active { color: var(--orange-dark); border-color: var(--orange); }
.profile { display: flex; align-items: center; gap: 9px; border-left: 1px solid var(--line); padding-left: 22px; }
.profile > span { width: 34px; height: 34px; display: grid; place-items: center; background: #f5d3b5; color: #85481f; border-radius: 50%; font-weight: 800; }
.profile b, .profile small { display: block; font-size: 12px; }
.profile small { color: var(--muted); font-size: 9px; margin-top: 2px; }
.home-link { border: 1px solid var(--line); background: white; color: var(--orange-dark); border-radius: 20px; padding: 7px 13px; font-size: 11px; font-weight: 800; white-space: nowrap; text-decoration: none; }
.home-link:hover { background: #fff0e4; }
main { max-width: 1180px; margin: auto; padding: 44px 24px 80px; }
.hero { min-height: 260px; display: flex; justify-content: space-between; align-items: center; padding: 38px 58px; border-radius: 32px; color: white; overflow: hidden; background: radial-gradient(circle at 88% 30%, #ffc076 0 4%, transparent 4.3%), radial-gradient(circle at 93% 75%, #f8a550 0 11%, transparent 11.3%), linear-gradient(115deg, #d45c1b, #f58c37 68%, #f8aa55); box-shadow: 0 18px 45px #b6571c25; position: relative; }
.hero:before, .hero:after { content: ""; position: absolute; border: 1px solid #ffffff32; border-radius: 50%; width: 210px; height: 210px; right: 175px; top: -95px; }
.hero:after { width: 90px; height: 90px; right: 34px; top: 14px; }
.hero > * { position: relative; z-index: 1; }
.hero > div:first-child { min-width: 0; max-width: 760px; }
.eyebrow { margin: 0 0 10px; text-transform: uppercase; font-size: 11px; letter-spacing: .16em; font-weight: 800; }
.hero h1 { font-family: serif; font-size: clamp(32px, 4vw, 48px); margin: 0 0 18px; letter-spacing: .03em; line-height: 1.35; }
.hero h1 span { display: block; white-space: nowrap; }
.hero p:last-child { font-size: 14px; line-height: 1.9; opacity: .92; margin: 0; }
.day-progress { display: flex; flex-direction: column; align-items: center; gap: 9px; min-width: 150px; }
.ring { --progress: 20%; width: 114px; height: 114px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, #ed7b2d 0 61%, transparent 62%), conic-gradient(white var(--progress), #ffffff3d 0); }
.ring strong { font-size: 34px; }.ring small { font-size: 15px; opacity: .8; }
.day-progress > span { font-size: 11px; font-weight: 700; }
.content-grid { display: grid; grid-template-columns: 1fr 330px; gap: 24px; margin-top: 26px; align-items: start; }
.date-tools { margin-top: 18px; padding: 13px 16px; display: flex; align-items: center; gap: 12px; background: white; border: 1px solid var(--line); border-radius: 16px; }
.date-tools label { color: var(--muted); font-size: 10px; font-weight: 700; }
.date-tools input { margin-left: 8px; border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; color: var(--ink); background: white; }
.date-tools button { margin-left: auto; border: 0; border-radius: 10px; padding: 9px 13px; background: #fff0e4; color: var(--orange-dark); font-size: 11px; font-weight: 800; }
.past-note { margin-left: auto; color: var(--muted); font-size: 10px; }
.panel { background: white; border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 10px 30px #6e4f3410; overflow: hidden; }
.panel-head { padding: 24px 26px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.panel-head > div { display: flex; gap: 12px; align-items: center; }
.section-icon { width: 37px; height: 37px; display: grid; place-items: center; border-radius: 12px; background: #fff0e4; color: var(--orange-dark); font-family: serif; font-weight: 800; }
.panel h2 { font-family: serif; margin: 0; font-size: 20px; }
.panel-head p { color: var(--muted); margin: 3px 0 0; font-size: 11px; }
.primary { border: 0; border-radius: 11px; padding: 10px 15px; background: var(--orange); color: white; font-size: 12px; font-weight: 800; box-shadow: 0 5px 12px #ef7a2c30; }
.add-form { display: flex; flex-wrap: wrap; gap: 10px; background: #fff8f1; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.add-form label { color: var(--muted); font-size: 10px; font-weight: 700; min-width: 105px; }.add-form label.grow { flex: 1; }.add-form label.full { width: 100%; }
.add-form input, .add-form select { display: block; width: 100%; border: 1px solid #dfd0c1; background: white; border-radius: 9px; padding: 9px; margin-top: 5px; color: var(--ink); outline: none; }
.add-form input:focus, .add-form select:focus { border-color: var(--orange); box-shadow: 0 0 0 3px #ef7a2c1b; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; width: 100%; }.form-actions button { border: 0; padding: 9px 15px; border-radius: 9px; }
.timeline { padding: 10px 22px 18px; }
.empty-state { padding: 44px 20px; text-align: center; color: var(--muted); }
.empty-state > span { width: 48px; height: 48px; margin: 0 auto 12px; display: grid; place-items: center; border-radius: 16px; background: #fff0e4; color: var(--orange-dark); font-family: serif; font-size: 22px; font-weight: 800; }
.empty-state h3 { margin: 0 0 8px; color: var(--ink); font-family: serif; font-size: 18px; }
.empty-state p { margin: 0 auto 18px; max-width: 360px; font-size: 11px; line-height: 1.7; }
.empty-wide { grid-column: 1 / -1; width: 100%; padding: 70px 20px; border: 1px dashed #decfbe; border-radius: 22px; background: #fffdf9; }
.schedule-item { display: grid; grid-template-columns: 53px 25px 1fr; gap: 12px; align-items: start; padding: 15px 2px; border-bottom: 1px solid #f2e9df; position: relative; }
.schedule-item:last-child { border-bottom: 0; }
.schedule-item time { font-size: 13px; font-weight: 800; margin-top: 5px; }
.check { width: 23px; height: 23px; padding: 0; border: 2px solid #ddcfc0; border-radius: 50%; background: white; color: white; font-weight: 800; margin-top: 2px; position: relative; }
.check:disabled { cursor: default; }
.schedule-item:not(:last-child) .check:after { content: ""; width: 1px; height: 52px; background: #e8ded3; position: absolute; top: 23px; left: 9px; }
.schedule-item.done .check { background: var(--orange); border-color: var(--orange); }
.schedule-item.done h3 { text-decoration: line-through; color: #a4998e; }
.item-body > div { display: flex; align-items: center; gap: 8px; }
.item-body h3 { margin: 0; font-size: 14px; }.item-body span { border-radius: 20px; padding: 3px 8px; font-size: 9px; font-weight: 800; }
.item-body p { margin: 6px 0 0; font-size: 11px; color: var(--muted); line-height: 1.6; }
.inline-actions { display: flex; gap: 10px; margin-top: 8px; }
.inline-actions button { border: 0; background: transparent; color: var(--orange-dark); padding: 0; font-size: 9px; font-weight: 700; }
.inline-actions button:last-child { color: #a66f64; }
aside { display: grid; gap: 16px; }
.learning-card { padding: 27px; border-radius: 24px; background: #342f2a; color: white; box-shadow: 0 15px 35px #4e39242b; position: relative; overflow: hidden; }
.learning-card:after { content: "私"; position: absolute; font-family: serif; color: #ffffff0b; font-size: 180px; right: -28px; bottom: -55px; }
.learning-card > * { position: relative; z-index: 1; }
.learning-card .eyebrow { color: #f6a568; }
.learning-card h2 { font-family: serif; font-size: 26px; line-height: 1.45; margin: 0 0 12px; }.learning-card > p:not(.eyebrow) { color: #d3cbc4; font-size: 11px; line-height: 1.7; }
.learning-card textarea { width: 100%; height: 112px; resize: none; border: 1px solid #5e554d; border-radius: 12px; padding: 12px; background: #282420; color: white; outline: none; font-size: 12px; line-height: 1.7; margin-top: 8px; }
.learning-card textarea:focus { border-color: #ee8b47; }.counter { text-align: right; color: #91877e; font-size: 9px; margin-top: 3px; }
.share { width: 100%; border: 0; background: var(--orange); color: white; border-radius: 11px; padding: 12px; font-weight: 800; margin-top: 10px; }
.learning-card > small { display: block; color: #90877f; font-size: 9px; text-align: center; margin-top: 9px; }
.visibility { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; padding: 4px; border-radius: 10px; background: #282420; }
.visibility button { border: 0; border-radius: 7px; padding: 8px; background: transparent; color: #aaa097; font-size: 10px; font-weight: 800; }
.visibility button.selected { background: #5b5047; color: white; }
.future-learning { display: block; margin-top: 14px; padding: 11px; border: 1px solid #5e554d; border-radius: 10px; color: #bdb3aa; text-align: center; font-size: 10px; }
.mini-stats { display: grid; grid-template-columns: repeat(3,1fr); background: white; border: 1px solid var(--line); border-radius: 18px; padding: 17px 5px; }
.mini-stats div { text-align: center; border-right: 1px solid var(--line); }.mini-stats div:last-child { border: 0; }.mini-stats strong, .mini-stats span { display: block; }.mini-stats strong { color: var(--orange-dark); font-family: serif; font-size: 22px; }.mini-stats span { color: var(--muted); font-size: 8px; }
.page-title { text-align: center; padding: 30px 0 26px; max-width: 760px; margin: 0 auto; }.page-title .eyebrow { color: var(--orange-dark); }.page-title h1 { font-family: serif; font-size: 38px; line-height: 1.45; margin: 0 0 12px; overflow-wrap: anywhere; }.page-title > p:last-child { color: var(--muted); font-size: 13px; line-height: 1.8; }
.filter-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 28px; }.filter-row button { border: 1px solid var(--line); background: white; padding: 8px 16px; border-radius: 30px; color: var(--muted); font-size: 12px; }.filter-row button.selected { color: white; background: var(--orange); border-color: var(--orange); }
.people-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
.person-card { background: white; border: 1px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: 0 9px 25px #6e4f340d; }
.person-head { display: flex; align-items: center; gap: 9px; }.person-head > span { width: 35px; height: 35px; display: grid; place-items: center; color: white; background: var(--orange); border-radius: 50%; font-weight: 800; }.person-head div { flex: 1; }.person-head b,.person-head small { display: block; font-size: 11px; }.person-head small { color: var(--muted); font-size: 8px; margin-top: 2px; }.person-head button { border: 0; background: transparent; color: var(--muted); }
.person-card h2 { font-family: serif; font-size: 19px; margin: 20px 0 8px; }
.person-timeline { background: #fff9f3; padding: 9px 13px; border-radius: 12px; margin-top: 15px; }.person-timeline p { font-size: 10px; margin: 7px 0; }.person-timeline i { display: inline-grid; place-items: center; width: 17px; height: 17px; background: #fde1c7; color: var(--orange-dark); border-radius: 50%; font-style: normal; font-size: 8px; margin-right: 8px; }
.shared-item { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f0e3d6; }.shared-item:last-child { border: 0; }.shared-item p { flex: 1; }.shared-item button { border: 0; background: transparent; color: var(--orange-dark); font-size: 8px; font-weight: 800; white-space: nowrap; }
.person-card blockquote { margin: 15px 0; min-height: 83px; color: #6f675f; font-size: 10px; line-height: 1.7; }
.card-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }.card-actions button { border: 0; background: transparent; color: var(--muted); font-size: 9px; }.card-actions button:last-child { color: #a66f64; font-weight: 800; }.card-actions button.gooded { color: var(--orange-dark); font-weight: 800; }
.record-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }.record-summary > div { padding: 28px; background: white; border: 1px solid var(--line); border-radius: 22px; }.record-summary span { color: var(--muted); font-size: 11px; }.record-summary strong { display: block; font-family: serif; color: var(--orange-dark); font-size: 44px; margin: 9px 0 2px; }.record-summary small { font-size: 14px; }.record-summary p { color: var(--muted); font-size: 10px; margin: 0; }
.history { margin-top: 25px; padding: 28px; background: white; border: 1px solid var(--line); border-radius: 22px; }.history h2 { font-family: serif; margin: 0 0 15px; }.history article { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding: 16px 0; }.history article span { color: var(--orange-dark); font-size: 10px; font-weight: 800; }.history article p { margin: 0; font-size: 12px; }.history article button { border: 0; background: transparent; color: var(--muted); font-size: 10px; }.history-actions { display: flex; gap: 8px; }.history-actions button:last-child { color: #a66f64; }
.toast { position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); top: 92px; background: #2f2a25; color: white; padding: 12px 20px; border-radius: 12px; font-size: 12px; box-shadow: 0 12px 35px #0003; animation: toast .25s ease; }
@keyframes toast { from { opacity: 0; transform: translate(-50%,-8px); } }
.gate { max-width: 460px; margin: 60px auto; text-align: center; background: white; border: 1px solid var(--line); border-radius: 26px; padding: 46px 32px; box-shadow: 0 12px 35px #6e4f3410; }
.gate .brand-mark { margin: 0 auto 18px; width: 56px; height: 56px; font-size: 30px; }
.gate h2 { font-family: serif; font-size: 24px; margin: 0 0 12px; }
.gate p { color: var(--muted); font-size: 13px; line-height: 1.9; margin: 0 0 24px; }
.gate a { display: inline-block; background: var(--orange); color: white; text-decoration: none; border-radius: 12px; padding: 13px 26px; font-weight: 800; font-size: 13px; box-shadow: 0 5px 12px #ef7a2c30; }
footer { max-width: 1180px; margin: auto; padding: 28px 24px 40px; display: flex; align-items: baseline; gap: 16px; border-top: 1px solid var(--line); color: var(--muted); }footer b { color: var(--orange); font-family: serif; font-size: 20px; }footer span { font-size: 11px; }footer small { margin-left: auto; font-size: 9px; }

@media (max-width: 900px) {
  .topbar { gap: 12px; }.profile { display: none; }nav { gap: 12px; }nav button { font-size: 10px; }
  .content-grid { grid-template-columns: 1fr; }.people-grid { grid-template-columns: 1fr 1fr; }.hero { padding: 32px; }
}
@media (max-width: 620px) {
  .topbar { height: auto; padding: 12px 16px 0; flex-wrap: wrap; }.brand { width: auto; }.brand small { display: none; }
  .home-link { margin-left: auto; }
  nav { width: 100%; height: 40px; justify-content: space-between; order: 3; }nav button { flex: 1; white-space: nowrap; }
  main { padding: 20px 13px 60px; }
  .hero { min-height: 0; padding: 28px 24px 24px; display: grid; grid-template-columns: 1fr; gap: 22px; align-items: start; }
  .hero h1 { font-size: 30px; line-height: 1.45; margin-bottom: 16px; overflow-wrap: normal; letter-spacing: 0; }
  .hero h1 span { white-space: normal; }
  .hero p:last-child { max-width: none; padding-right: 0; font-size: 13px; line-height: 1.9; }
  .hero p br { display: none; }
  .day-progress { position: static; min-width: 0; width: 100%; flex-direction: row; justify-content: flex-end; gap: 12px; }
  .ring { width: 74px; height: 74px; flex: 0 0 74px; }
  .ring strong { font-size: 23px; }
  .day-progress > span { max-width: 70px; line-height: 1.5; }
  .date-tools { align-items: stretch; flex-wrap: wrap; }.date-tools label { width: 100%; }.date-tools button, .past-note { margin-left: 0; }
  .panel-head { padding: 18px 16px; }.panel-head p { display: none; }.timeline { padding: 8px 12px; }.schedule-item { grid-template-columns: 45px 23px 1fr; gap: 7px; }.content-grid { margin-top: 14px; gap: 14px; }
  .people-grid, .record-summary { grid-template-columns: 1fr; }
  .page-title { padding: 28px 4px 24px; }
  .page-title h1 { font-size: clamp(27px, 8vw, 34px); line-height: 1.5; word-break: auto-phrase; }
  .page-title > p:last-child { font-size: 12px; padding: 0 6px; }
  .filter-row { flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 22px; padding: 0; }
  .filter-row button { white-space: nowrap; min-width: 72px; flex: 0 0 auto; padding: 9px 14px; }
  .history { padding: 20px 15px; }.history article { grid-template-columns: 1fr; gap: 7px; }.history-actions { justify-content: flex-end; }
}
@media (max-width: 360px) { .hero h1 { font-size: 27px; } }
</style>
</head>
<body>
<div class="app-shell">
  <div id="toast" class="toast" role="status" style="display:none"></div>
  <header class="topbar">
    <button class="brand" id="brandBtn" aria-label="一日シェア ホーム">
      <span class="brand-mark">日</span><span><b>一日シェア</b><small>わたしの一日が、誰かの学びになる。</small></span>
    </button>
    <nav aria-label="メインメニュー">
      <button data-tab="today">今日の一日</button>
      <button data-tab="explore">みんなの一日</button>
      <button data-tab="mine">わたしの記録</button>
    </nav>
    <a class="home-link" id="homeLink" href="index.html">← Emuに戻る</a>
    <div class="profile"><span id="profileInitial">私</span><div><b id="profileName">わたし</b><small id="profileVis">非公開</small></div></div>
  </header>
  <main id="main"></main>
  <footer><b>Emu</b><span>学ぶことは、生きること。</span><small>一日シェア</small></footer>
</div>

<script>
"use strict";
// ── Emu 連携設定 ─────────────────────────────
const API_BASE = "https://emu-realtime.onrender.com";
const CATEGORY_COLOR = {
  "生活": "#f2a86b", "学び": "#e87932", "仕事": "#7867c8",
  "健康": "#55a978", "暮らし": "#3e8f9d", "子育て": "#d75c81",
};
const CATEGORIES = Object.keys(CATEGORY_COLOR);
// Emu本体の「今日のEmu」内にiframe埋め込みされている場合を判定
const EMBED = new URLSearchParams(location.search).get("embed") === "1" || window.parent !== window;
// 同一オリジンなら親フレーム(index.html)の接続アカウントも参照できる
function _parentWin() { try { return (window.parent !== window) ? window.parent : null; } catch (e) { return null; } }
const ADDRESS = (
  window.connectedAccount ||
  (_parentWin() && _parentWin().connectedAccount) ||
  localStorage.getItem("emuWallet") || ""
).toLowerCase().trim();
const USERNAME = (localStorage.getItem("ches_name") || "").trim() || "わたし";

const todayStr = () => {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ── 状態 ─────────────────────────────
const S = {
  tab: "today",
  filter: "すべて",
  selectedDate: todayStr(),
  schedule: [],
  learning: "",
  visibility: "private",
  showAdd: false,
  editingIndex: null,
  draft: { time: "", title: "", note: "", category: "生活", done: false },
  posts: [],
  history: [],
  stats: { streak: 0, learningCount: 0, usefulCount: 0, completionRate: 0 },
  loading: true,
  saving: false,
};

const $main = document.getElementById("main");
const $toast = document.getElementById("toast");
let toastTimer = null;
function notify(msg) {
  $toast.textContent = msg;
  $toast.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $toast.style.display = "none"; }, 2400);
}

// ── API ─────────────────────────────
async function apiGet(path) {
  const url = `${API_BASE}${path}${path.includes("?") ? "&" : "?"}address=${encodeURIComponent(ADDRESS)}`;
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "読み込みに失敗しました");
  return data;
}
async function apiPost(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ address: ADDRESS, userName: USERNAME, ...body }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "処理に失敗しました");
  return data;
}

// ── データ読み込み ─────────────────────────────
async function loadDay(date) {
  S.loading = true; render();
  try {
    const { day } = await apiGet(`/api/ichinichi/day?date=${date}`);
    S.schedule = day?.items || [];
    S.learning = day?.learning || "";
    S.visibility = day?.visibility || "private";
  } catch (e) { notify(e.message); }
  finally { S.loading = false; render(); }
}
async function loadFeed() {
  S.loading = true; render();
  try {
    const { posts } = await apiGet(`/api/ichinichi/feed?category=${encodeURIComponent(S.filter)}`);
    S.posts = posts || [];
  } catch (e) { notify(e.message); }
  finally { S.loading = false; render(); }
}
async function loadHistory(silent) {
  if (!silent) { S.loading = true; render(); }
  try {
    const { history, stats } = await apiGet("/api/ichinichi/history");
    S.history = history || [];
    S.stats = stats || S.stats;
  } catch (e) { if (!silent) notify(e.message); }
  finally { if (!silent) { S.loading = false; } render(); }
}

// ── アクション ─────────────────────────────
async function persist(items, msg) {
  S.saving = true;
  try {
    const { day } = await apiPost("/api/ichinichi/save", { date: S.selectedDate, items });
    if (day) S.schedule = day.items;
    notify(msg || "時間割を保存しました");
  } catch (e) { notify(e.message); }
  finally { S.saving = false; render(); }
}
async function saveDraft() {
  const d = S.draft;
  if (!d.time || !d.title.trim()) return notify("時間と予定の名前を入力してください");
  let next;
  if (S.editingIndex === null) next = [...S.schedule, d];
  else next = S.schedule.map((it, i) => i === S.editingIndex ? d : it);
  next = next.sort((a, b) => a.time.localeCompare(b.time));
  const isNew = S.editingIndex === null;
  S.showAdd = false; S.editingIndex = null;
  S.draft = { time: "", title: "", note: "", category: "生活", done: false };
  await persist(next, isNew ? "予定を追加しました" : "予定を変更しました");
}
async function shareDay() {
  if (!S.schedule.length) return notify("予定を1件以上追加してください");
  if (!S.learning.trim()) return notify("今日の学びを書いてください");
  S.saving = true; render();
  try {
    const { day } = await apiPost("/api/ichinichi/share", {
      date: S.selectedDate, learning: S.learning, visibility: S.visibility,
    });
    if (day) S.visibility = day.visibility;
    notify(S.visibility === "public" ? "Emuのみんなに共有しました" : "非公開で保存しました");
    loadHistory(true);
  } catch (e) { notify(e.message); }
  finally { S.saving = false; render(); }
}
async function appendLearning() {
  const addition = window.prompt("過去の学びに追記する内容");
  if (!addition || !addition.trim()) return;
  try {
    const { day } = await apiPost("/api/ichinichi/append-learning", { date: S.selectedDate, learning: addition });
    if (day) S.learning = day.learning;
    notify("学びを追記しました"); render();
  } catch (e) { notify(e.message); }
}
async function copyPrevious() {
  if (S.schedule.length && !window.confirm("現在の時間割を前日の内容で置き換えますか？")) return;
  try {
    const { day } = await apiPost("/api/ichinichi/copy-previous", { date: S.selectedDate });
    if (day) S.schedule = day.items;
    notify("前日の時間割をコピーしました"); render();
  } catch (e) { notify(e.message); }
}
async function adopt(dayId, itemId) {
  try {
    await apiPost("/api/ichinichi/adopt", { date: todayStr(), dayId, itemId });
    notify("今日の時間割に取り入れました");
  } catch (e) { notify(e.message); }
}
async function good(post) {
  if (post.gooded) return;
  try {
    await apiPost("/api/ichinichi/good", { dayId: post.id });
    post.gooded = true; post.goodCount += 1;
    notify("Goodを送りました"); render();
  } catch (e) { notify(e.message); }
}
async function report(post) {
  const reason = window.prompt("通報理由を入力してください");
  if (!reason || !reason.trim()) return;
  try { await apiPost("/api/ichinichi/report", { dayId: post.id, reason }); notify("通報を受け付けました"); }
  catch (e) { notify(e.message); }
}
async function deleteDay(day) {
  if (!window.confirm(`${day.date}の予定と学びを削除しますか？`)) return;
  try {
    await apiPost("/api/ichinichi/delete-day", { dayId: day.id });
    S.history = S.history.filter((h) => h.id !== day.id);
    notify("記録を削除しました"); render();
    loadHistory(true);
  } catch (e) { notify(e.message); }
}

// ── 画面切り替え ─────────────────────────────
function selectTab(next) {
  S.tab = next;
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (next === "today") loadDay(S.selectedDate);
  else if (next === "explore") loadFeed();
  else if (next === "mine") loadHistory();
  render();
}
function setSelectedDate(date) {
  S.selectedDate = date;
  S.showAdd = false; S.editingIndex = null;
  loadDay(date);
}

// ── レンダリング ─────────────────────────────
function render() {
  // ゲート: ウォレット未接続
  if (!ADDRESS) { renderGate(); return; }
  // ヘッダー状態
  document.querySelectorAll("nav button").forEach((b) =>
    b.classList.toggle("active", b.dataset.tab === S.tab));
  document.getElementById("profileName").textContent = USERNAME;
  document.getElementById("profileInitial").textContent = USERNAME.slice(0, 1);
  document.getElementById("profileVis").textContent = S.visibility === "public" ? "公開中" : "非公開";

  if (S.tab === "today") renderToday();
  else if (S.tab === "explore") renderExplore();
  else if (S.tab === "mine") renderMine();
}

function renderGate() {
  $main.innerHTML = `
    <div class="gate">
      <div class="brand-mark">日</div>
      <h2>一日シェアへようこそ</h2>
      <p>この機能は Emu にログイン（ウォレット接続）したうえでご利用いただけます。<br>
      Emu のトップからログインして、もう一度お越しください。</p>
      <a href="index.html">Emu にログインする</a>
    </div>`;
  document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
}

function renderToday() {
  const isToday = S.selectedDate === todayStr();
  const isFuture = S.selectedDate > todayStr();
  const isPast = S.selectedDate < todayStr();
  const canEdit = !isPast;
  const yearEnd = `${new Date().getFullYear()}-12-31`;
  const completed = S.schedule.filter((it) => it.done).length;
  const progress = S.schedule.length ? (completed / S.schedule.length) * 100 : 0;
  const dateLabel = new Intl.DateTimeFormat("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "long" })
    .format(new Date(`${S.selectedDate}T12:00:00`));

  const timelineHtml = S.loading
    ? `<div class="empty-state"><h3>読み込み中…</h3></div>`
    : S.schedule.length === 0
      ? `<div class="empty-state"><span>＋</span><h3>まだ予定はありません</h3><p>あなたの一日を作ってみましょう。</p>${canEdit ? `<button class="primary" data-act="openAdd">最初の予定を追加する</button>` : ""}</div>`
      : S.schedule.map((it, i) => `
        <article class="schedule-item ${it.done ? "done" : ""}">
          <time>${esc(it.time)}</time>
          <button class="check" data-act="toggle" data-i="${i}" ${isToday ? "" : "disabled"} aria-label="${esc(it.title)}を完了">${it.done ? "✓" : ""}</button>
          <div class="item-body">
            <div><h3>${esc(it.title)}</h3><span style="background:${CATEGORY_COLOR[it.category]}18;color:${CATEGORY_COLOR[it.category]}">${esc(it.category)}</span></div>
            <p>${esc(it.note || "意識することは未入力です。")}</p>
            ${canEdit ? `<div class="inline-actions"><button data-act="edit" data-i="${i}">編集</button><button data-act="del" data-i="${i}">削除</button></div>` : ""}
          </div>
        </article>`).join("");

  const addFormHtml = (S.showAdd && canEdit) ? `
    <div class="add-form">
      <label>時間<input type="time" data-draft="time" value="${esc(S.draft.time)}"></label>
      <label class="grow">すること<input data-draft="title" placeholder="予定の名前" value="${esc(S.draft.title)}"></label>
      <label>種類<select data-draft="category">${CATEGORIES.map((n) => `<option ${n === S.draft.category ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <label class="full">意識すること<input data-draft="note" placeholder="この時間に大切にしたいこと" value="${esc(S.draft.note)}"></label>
      <div class="form-actions"><button data-act="cancelAdd">やめる</button><button class="primary" data-act="saveDraft" ${S.saving ? "disabled" : ""}>${S.editingIndex === null ? "追加する" : "変更する"}</button></div>
    </div>` : "";

  const learningHtml = `
    <section class="learning-card">
      <p class="eyebrow">${isToday ? "今日の一日シェア" : isFuture ? "この日に向けて" : "この日の学び"}</p>
      <h2>${isFuture ? "当日になったら<br>学びを残そう。" : "今日の学びを<br>ひとつ残そう。"}</h2>
      <p>うまくできたことも、失敗したことも、誰かの役に立つ学びです。</p>
      <textarea data-learning ${isToday ? "" : "disabled"} placeholder="今日、気づいたことや意識したことを書く" maxlength="500">${esc(S.learning)}</textarea>
      <div class="counter"><span id="learnCount">${S.learning.length}</span>/500</div>
      ${isToday ? `
        <div class="visibility"><button class="${S.visibility === "private" ? "selected" : ""}" data-act="visPrivate">非公開</button><button class="${S.visibility === "public" ? "selected" : ""}" data-act="visPublic">Emu全体</button></div>
        <button class="share" data-act="share" ${S.saving ? "disabled" : ""}>${S.visibility === "public" ? "みんなに共有する" : "非公開で保存する"}</button>
      ` : isPast ? `<button class="share" data-act="append">学びを追記する</button>`
        : `<small class="future-learning">学びの記入・共有は当日からできます</small>`}
    </section>`;

  $main.innerHTML = `
    <section class="hero">
      <div><p class="eyebrow">${esc(dateLabel)}</p><h1><span>今日は、</span><span>どんな一日にする？</span></h1>
      <p>自分で時間を決め、意識したことを残す。<br>あなたの普通の一日が、誰かにとっての新しい学びになります。</p></div>
      <div class="day-progress"><div class="ring" style="--progress:${progress}%"><strong>${completed}<small>/${S.schedule.length}</small></strong></div><span>今日できたこと</span></div>
    </section>
    <div class="date-tools">
      <label>表示する日<input type="date" max="${yearEnd}" value="${S.selectedDate}" data-act="date"></label>
      ${canEdit ? `<button data-act="copyPrev">前日の時間割をコピー</button>` : ""}
      ${isPast ? `<span class="past-note">過去の時間割は閲覧のみです</span>` : ""}
      ${isFuture ? `<span class="past-note">未来の時間割を準備できます</span>` : ""}
    </div>
    <div class="content-grid">
      <section class="panel schedule-panel">
        <div class="panel-head">
          <div><span class="section-icon">時</span><div><h2>${isToday ? "今日" : esc(dateLabel)}の時間割</h2><p>${isPast ? "予定の編集はできません。" : "当日までは何度でも編集できます。"}</p></div></div>
          ${canEdit ? `<button class="primary" data-act="toggleAdd">＋ 予定を追加</button>` : ""}
        </div>
        ${addFormHtml}
        <div class="timeline">${timelineHtml}</div>
      </section>
      <aside>
        ${learningHtml}
        <section class="mini-stats"><div><strong>${S.stats.streak}</strong><span>続けた日</span></div><div><strong>${S.stats.learningCount}</strong><span>残した学び</span></div><div><strong>${S.stats.usefulCount}</strong><span>役に立った人</span></div></section>
      </aside>
    </div>`;

  bindTodayEvents();
}

function bindTodayEvents() {
  // 学びテキストエリア（再描画せず状態のみ更新）
  const ta = $main.querySelector("[data-learning]");
  if (ta) {
    ta.addEventListener("input", (e) => {
      S.learning = e.target.value;
      const c = document.getElementById("learnCount");
      if (c) c.textContent = S.learning.length;
    });
  }
  // 下書きフォーム入力（再描画せず状態のみ更新）
  $main.querySelectorAll("[data-draft]").forEach((el) => {
    el.addEventListener("input", (e) => { S.draft[el.dataset.draft] = e.target.value; });
    el.addEventListener("change", (e) => { S.draft[el.dataset.draft] = e.target.value; });
  });

  const dateInput = $main.querySelector('[data-act="date"]');
  if (dateInput) dateInput.addEventListener("change", (e) => setSelectedDate(e.target.value));
}

function onTodayClick(e) {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const i = btn.dataset.i != null ? Number(btn.dataset.i) : null;
  switch (act) {
    case "toggleAdd":
      S.draft = { time: "", title: "", note: "", category: "生活", done: false };
      S.editingIndex = null; S.showAdd = !S.showAdd; render();
      if (S.showAdd) scrollToAddForm(); break;
    case "openAdd": S.showAdd = true; render(); scrollToAddForm(); break;
    case "cancelAdd": S.showAdd = false; render(); break;
    case "saveDraft": saveDraft(); break;
    case "edit":
      S.draft = { ...S.schedule[i] }; S.editingIndex = i; S.showAdd = true; render(); scrollToAddForm(); break;
    case "del":
      persist(S.schedule.filter((_, x) => x !== i), "予定を削除しました"); break;
    case "toggle": {
      const next = S.schedule.map((x, idx) => idx === i ? { ...x, done: !x.done } : x);
      S.schedule = next;
      render(); // 押した瞬間に反映（サーバー応答を待たず体感を改善）
      persist(next, "完了状態を更新しました"); break;
    }
    case "copyPrev": copyPrevious(); break;
    case "visPrivate": S.visibility = "private"; render(); break;
    case "visPublic": S.visibility = "public"; render(); break;
    case "share": shareDay(); break;
    case "append": appendLearning(); break;
  }
}

// 予定の追加/編集フォームを開いたら、その位置までスクロールして入力欄にフォーカス
function scrollToAddForm() {
  requestAnimationFrame(() => {
    const form = $main.querySelector(".add-form");
    if (form) form.scrollIntoView({ behavior: "smooth", block: "center" });
    const titleInput = $main.querySelector('[data-draft="title"]');
    if (titleInput) titleInput.focus({ preventScroll: true });
  });
}

function renderExplore() {
  const filters = ["すべて", ...CATEGORIES];
  const cards = S.posts.length === 0 && !S.loading
    ? `<div class="empty-state empty-wide"><span>日</span><h3>まだ共有された一日はありません</h3><p>公開された一日がここに表示されます。</p></div>`
    : S.posts.map((post, pi) => `
      <article class="person-card">
        <div class="person-head"><span>${esc(post.userName.slice(0, 1))}</span><div><b>${esc(post.userName)}さんの一日</b><small>${esc(post.date)}</small></div><button data-act="report" data-pi="${pi}" aria-label="通報">•••</button></div>
        <h2>${esc(post.learning.split("\n")[0] || "今日の学び")}</h2>
        <div class="person-timeline">${post.items.map((it) => `<div class="shared-item"><p><i>時</i>${esc(it.time)} ${esc(it.title)}</p><button data-act="adopt" data-day="${esc(post.id)}" data-item="${esc(it.id)}">＋ 取り入れる</button></div>`).join("")}</div>
        <blockquote>“ ${esc(post.learning)} ”</blockquote>
        <div class="card-actions"><button class="${post.gooded ? "gooded" : ""}" data-act="good" data-pi="${pi}">♡ Good <b>${post.goodCount}</b></button><button data-act="report" data-pi="${pi}">通報する</button></div>
      </article>`).join("");

  $main.innerHTML = `
    <section class="explore-page">
      <div class="page-title"><p class="eyebrow">みんなの一日シェア</p><h1>一日の過ごし方から、学んでみる。</h1><p>気になる予定だけを、自分の今日へ取り入れられます。</p></div>
      <div class="filter-row">${filters.map((n) => `<button class="${S.filter === n ? "selected" : ""}" data-filter="${n}">${n}</button>`).join("")}</div>
      <div class="people-grid">${cards}</div>
    </section>`;

  $main.querySelectorAll("[data-filter]").forEach((b) =>
    b.addEventListener("click", () => { S.filter = b.dataset.filter; loadFeed(); }));
}

function onExploreClick(e) {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "adopt") adopt(btn.dataset.day, btn.dataset.item);
  else if (act === "good") good(S.posts[Number(btn.dataset.pi)]);
  else if (act === "report") report(S.posts[Number(btn.dataset.pi)]);
}

function renderMine() {
  const items = S.history.length === 0
    ? `<div class="empty-state"><span>記</span><h3>記録はまだありません</h3><p>時間割と今日の学びを残すと、ここに積み重なります。</p></div>`
    : S.history.map((day, di) => `
      <article><span>${esc(day.date)}</span><p>${esc(day.learning || "学びはまだありません")}（予定 ${day.items.length}件）</p>
      <div class="history-actions"><button data-act="view" data-di="${di}">見る</button><button data-act="del" data-di="${di}">削除</button></div></article>`).join("");

  $main.innerHTML = `
    <section class="records-page">
      <div class="page-title"><p class="eyebrow">わたしの記録</p><h1>毎日は、ちゃんと積み重なっている。</h1></div>
      <div class="record-summary">
        <div><span>連続</span><strong>${S.stats.streak}<small>日</small></strong><p>予定＋学びの共有で記録</p></div>
        <div><span>達成率</span><strong>${S.stats.completionRate}<small>%</small></strong><p>完了した予定の割合</p></div>
        <div><span>役に立った人</span><strong>${S.stats.usefulCount}<small>人</small></strong><p>予定を取り入れられた人数</p></div>
      </div>
      <div class="history"><h2>これまでの一日シェア</h2>${items}</div>
    </section>`;
}

function onMineClick(e) {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const day = S.history[Number(btn.dataset.di)];
  if (!day) return;
  if (btn.dataset.act === "view") { S.selectedDate = day.date; selectTab("today"); }
  else if (btn.dataset.act === "del") deleteDay(day);
}

// ── 初期化 ─────────────────────────────
// $main は永続要素。クリックは1つの委譲リスナーで現在のタブに振り分ける
$main.addEventListener("click", (e) => {
  if (S.tab === "today") onTodayClick(e);
  else if (S.tab === "explore") onExploreClick(e);
  else if (S.tab === "mine") onMineClick(e);
});

document.getElementById("brandBtn").addEventListener("click", () => selectTab("today"));
document.querySelectorAll("nav button").forEach((b) =>
  b.addEventListener("click", () => selectTab(b.dataset.tab)));

// ── Emu本体との行き来（埋め込み時） ─────────────────────────────
function goBackToEmu() {
  const p = _parentWin();
  if (p && typeof p.showEmuToday === "function") { p.showEmuToday(); return; }
  window.top.location.href = "index.html";
}
if (EMBED) {
  const hl = document.getElementById("homeLink");
  if (hl) { hl.textContent = "← 今日のEmu"; hl.href = "#"; }
  // 埋め込み中は index.html への直接遷移／戻るリンクを親の画面遷移に置き換える
  // （iframe内でEmuを二重に開くのを防ぐ）
  document.addEventListener("click", (e) => {
    const a = e.target.closest('#homeLink, a[href="index.html"]');
    if (a) { e.preventDefault(); goBackToEmu(); }
  });
}

if (ADDRESS) {
  loadHistory(true);   // ミニ統計の初期値
  loadDay(S.selectedDate);
} else {
  render();
}
</script>
</body>
