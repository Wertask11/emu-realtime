<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/maintenance-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Park Mall | SchoolPark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Noto+Serif+JP:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════ */
:root {
  /* Palette */
  --cream:       #faf7f4;
  --cream2:      #f5f0ea;
  --cream3:      #ede6dd;
  --white:       #ffffff;
  --text:        #2d2520;
  --text2:       #8a7f78;
  --text3:       #c4b8b0;
  --border:      rgba(180,160,145,0.2);
  --border2:     rgba(180,160,145,0.12);
  --card:        rgba(255,255,255,0.72);

  /* Accents */
  --rose:        #e8a4b0;
  --rose2:       #d4788a;
  --rose3:       #c05570;
  --gold:        #c9a96e;
  --gold2:       #b8924d;
  --blush:       #f9eef0;
  --sale:        #d4485a;
  --new:         #6b9e8a;
  --glow-rose:   rgba(232,164,176,0.22);

  /* Layout */
  --radius:      16px;
  --radius-sm:   10px;
  --header-h:    56px;

  /* Typography */
  --font-serif:  'Cormorant Garamond', 'Noto Serif JP', serif;
  --font-sans:   'Zen Maru Gothic', sans-serif;
  --font-jp:     'Noto Serif JP', serif;
}

/* ═══════════════════════════════════════
   BASE
═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-jp);
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; }
input, textarea, select { font-family: inherit; outline: none; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--cream2); }
::-webkit-scrollbar-thumb { background: var(--rose); border-radius: 2px; }

#app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  background: var(--cream);
}

/* ═══════════════════════════════════════
   HEADER
═══════════════════════════════════════ */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--header-h);
  background: rgba(250,247,244,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 14px;
}

.header-back {
  color: var(--text2);
  font-size: 13px;
  font-family: var(--font-sans);
  letter-spacing: 0.06em;
  padding: 6px 0;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: color 0.2s;
  flex-shrink: 0;
}
.header-back:hover { color: var(--rose3); }
.header-back::before {
  content: '←';
  font-size: 14px;
}

.header-title {
  flex: 1;
  text-align: center;
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 0.18em;
  color: var(--text);
  font-style: italic;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.cart-btn {
  position: relative;
  font-size: 20px;
  padding: 4px;
  color: var(--text);
  transition: transform 0.2s;
  line-height: 1;
}
.cart-btn.bounce {
  animation: cartBounce 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}
@keyframes cartBounce {
  0%,100% { transform: scale(1) rotate(0deg); }
  20% { transform: scale(1.35) rotate(-12deg); }
  50% { transform: scale(0.92) rotate(6deg); }
  75% { transform: scale(1.08); }
}

.cart-badge {
  position: absolute;
  top: -3px; right: -6px;
  background: var(--rose3);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  min-width: 15px; height: 15px;
  border-radius: 8px;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
  font-family: var(--font-sans);
}
.cart-badge.visible { display: flex; }

.header-clock {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.05em;
}

/* ═══════════════════════════════════════
   HERO
═══════════════════════════════════════ */
.hero {
  height: 200px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(150deg, #f9eef0 0%, #faf7f4 35%, #f5f0ea 65%, #fce8ec 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

/* Soft radial bloom */
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 55% 70% at 30% 40%, rgba(232,164,176,0.28) 0%, transparent 65%),
    radial-gradient(ellipse 40% 50% at 75% 60%, rgba(201,169,110,0.14) 0%, transparent 60%);
}

/* Shimmer beam */
.hero-beam {
  position: absolute;
  top: 0; left: -50%;
  width: 25%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,0.0) 30%,
    rgba(255,255,255,0.55) 50%,
    rgba(255,255,255,0.0) 70%,
    transparent 100%
  );
  animation: heroShimmer 4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes heroShimmer {
  0%   { left: -50%; opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { left: 130%; opacity: 0; }
}

/* Floating petal particles */
.hero-petal {
  position: absolute;
  font-size: 12px;
  opacity: 0;
  animation: petalFall linear infinite;
  pointer-events: none;
  user-select: none;
}
@keyframes petalFall {
  0%   { opacity: 0; transform: translateY(-10px) rotate(0deg); }
  10%  { opacity: 0.6; }
  90%  { opacity: 0.3; }
  100% { opacity: 0; transform: translateY(220px) rotate(360deg); }
}

.hero-eyebrow {
  position: relative;
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.4em;
  color: var(--rose2);
  text-transform: uppercase;
}

.hero-title {
  position: relative;
  font-family: var(--font-serif);
  font-size: 42px;
  font-weight: 300;
  letter-spacing: 0.18em;
  color: var(--text);
  font-style: italic;
  line-height: 1;
}
.hero-title span {
  color: var(--rose2);
}

.hero-divider {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 120px;
}
.hero-divider::before,
.hero-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--rose);
  opacity: 0.5;
}
.hero-divider-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--rose2);
}

.hero-sale-pill {
  position: relative;
  background: var(--rose3);
  color: #fff;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  padding: 6px 20px;
  border-radius: 20px;
  animation: salePulse 2.2s ease-in-out infinite;
}
@keyframes salePulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.75; transform: scale(0.98); }
}

/* ═══════════════════════════════════════
   ORDER FORM BANNER
═══════════════════════════════════════ */
.order-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 20px;
  background: linear-gradient(90deg, var(--blush) 0%, #fdf3f5 50%, var(--blush) 100%);
  border-top: 1px solid rgba(232,164,176,0.35);
  border-bottom: 1px solid rgba(232,164,176,0.35);
  text-decoration: none;
  color: var(--rose3);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  transition: background .2s, opacity .2s;
  cursor: pointer;
}
.order-banner:hover {
  background: linear-gradient(90deg, #fae4e8 0%, #fde8ec 50%, #fae4e8 100%);
  opacity: 0.9;
}
.order-banner-icon { font-size: 16px; flex-shrink: 0; }
.order-banner-arrow {
  font-size: 11px;
  opacity: 0.6;
  margin-left: 2px;
}

/* ═══════════════════════════════════════
   TABS
═══════════════════════════════════════ */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: rgba(250,247,244,0.95);
  position: sticky;
  top: var(--header-h);
  z-index: 90;
  backdrop-filter: blur(12px);
}

.tab-btn {
  flex: 1;
  padding: 14px 4px;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--text2);
  letter-spacing: 0.08em;
  border-bottom: 1.5px solid transparent;
  transition: color 0.25s, border-color 0.25s;
  position: relative;
}
.tab-btn:hover { color: var(--rose3); }
.tab-btn.active {
  color: var(--rose3);
  border-bottom-color: var(--rose3);
}

/* ═══════════════════════════════════════
   TAB PANELS
═══════════════════════════════════════ */
.tab-panel { display: none; padding: 24px 18px 120px; }
.tab-panel.active { display: block; animation: panelFadeIn 0.35s ease; }
@keyframes panelFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════
   CATEGORY FILTER
═══════════════════════════════════════ */
.category-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 18px;
  margin-bottom: 20px;
  scrollbar-width: none;
}
.category-scroll::-webkit-scrollbar { display: none; }

.cat-btn {
  flex-shrink: 0;
  padding: 7px 18px;
  border-radius: 20px;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  background: var(--white);
  border: 1px solid var(--border2);
  color: var(--text2);
  transition: all 0.22s;
  white-space: nowrap;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.cat-btn:hover { border-color: var(--rose); color: var(--rose3); }
.cat-btn.active {
  background: var(--rose3);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 2px 12px rgba(192,85,112,0.22);
}

/* ═══════════════════════════════════════
   SHOP GRID
═══════════════════════════════════════ */
.shop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}

.shop-card {
  background: var(--white);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 20px 16px 16px;
  cursor: pointer;
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.28s ease, border-color 0.28s;
  position: relative;
  overflow: hidden;
  box-shadow: 0 1px 6px rgba(0,0,0,0.04);
}
.shop-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--glow-rose) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
}
.shop-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 36px rgba(192,85,112,0.13), 0 2px 8px rgba(0,0,0,0.06);
  border-color: rgba(232,164,176,0.5);
}
.shop-card:hover::after { opacity: 1; }

.shop-emoji {
  font-size: 38px;
  display: block;
  margin-bottom: 12px;
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
}
.shop-card:hover .shop-emoji { transform: scale(1.1); }

.shop-badge {
  position: absolute;
  top: 12px; right: 12px;
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.1em;
  padding: 3px 8px;
  border-radius: 8px;
  text-transform: uppercase;
}
.badge-new { background: #e8f5f0; color: var(--new); border: 1px solid rgba(107,158,138,0.25); }
.badge-sale {
  background: #fdf0f0;
  color: var(--sale);
  border: 1px solid rgba(212,72,90,0.2);
  animation: salePulse 2s ease-in-out infinite;
}
.badge-hot { background: #fdf6e8; color: var(--gold2); border: 1px solid rgba(201,169,110,0.25); }

.shop-name {
  font-family: var(--font-jp);
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
  line-height: 1.3;
  color: var(--text);
}
.shop-category {
  font-family: var(--font-sans);
  font-size: 10px;
  color: var(--rose2);
  margin-bottom: 6px;
  letter-spacing: 0.08em;
}
.shop-desc {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.6;
  margin-bottom: 12px;
}
.shop-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text3);
}
.shop-rating { color: var(--gold); font-weight: 500; letter-spacing: 0.04em; }

/* ═══════════════════════════════════════
   SECTION TITLE
═══════════════════════════════════════ */
.section-title {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 18px;
}
.section-title-en {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 300;
  font-style: italic;
  color: var(--text);
  letter-spacing: 0.1em;
}
.section-title-jp {
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--text2);
  text-transform: uppercase;
}

/* ═══════════════════════════════════════
   MODAL
═══════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(45,37,32,0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: var(--cream);
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-width: 720px;
  max-height: 82vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: 50px;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.1);
}
.modal-overlay.open .modal { transform: translateY(0); }

.modal-handle {
  display: flex;
  justify-content: center;
  padding: 14px 0 6px;
}
.modal-handle-bar {
  width: 36px; height: 3px;
  background: var(--border);
  border-radius: 2px;
}

.modal-header {
  padding: 4px 22px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border2);
}
.modal-shop-emoji { font-size: 32px; }
.modal-shop-info { flex: 1; }
.modal-shop-name {
  font-family: var(--font-jp);
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 3px;
}
.modal-shop-meta {
  font-family: var(--font-sans);
  font-size: 11px;
  color: var(--text2);
  letter-spacing: 0.04em;
}
.modal-close {
  width: 32px; height: 32px;
  background: var(--cream2);
  border: 1px solid var(--border);
  color: var(--text2);
  border-radius: 50%;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.modal-close:hover { background: var(--rose3); color: #fff; border-color: transparent; }

.modal-products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 12px;
  padding: 18px 20px;
}

.product-card {
  background: var(--white);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 18px 14px 14px;
  text-align: center;
  transition: transform 0.24s ease, box-shadow 0.24s ease;
  box-shadow: 0 1px 6px rgba(0,0,0,0.04);
}
.product-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(192,85,112,0.1);
}

.product-emoji {
  font-size: 44px;
  display: block;
  margin-bottom: 10px;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.product-card:hover .product-emoji { transform: scale(1.1); }
.product-name {
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 4px;
  line-height: 1.4;
}
.product-desc {
  font-family: var(--font-sans);
  font-size: 10px;
  color: var(--text2);
  margin-bottom: 10px;
  line-height: 1.5;
}
.product-price {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 400;
  color: var(--rose3);
  margin-bottom: 12px;
  letter-spacing: 0.04em;
}
.product-price span {
  font-family: var(--font-sans);
  font-size: 10px;
  color: var(--text2);
  letter-spacing: 0.08em;
}

.add-cart-btn {
  width: 100%;
  padding: 9px;
  background: var(--rose3);
  color: #fff;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  transition: opacity 0.2s, transform 0.15s;
  box-shadow: 0 2px 8px rgba(192,85,112,0.2);
}
.add-cart-btn:hover { opacity: 0.88; }
.add-cart-btn:active { transform: scale(0.97); }

/* ═══════════════════════════════════════
   TAB② NEW & SALE
═══════════════════════════════════════ */
.carousel-wrap {
  overflow-x: auto;
  margin: 0 -18px;
  padding: 4px 18px 18px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.carousel-wrap::-webkit-scrollbar { display: none; }

.carousel { display: flex; gap: 12px; width: max-content; }

.carousel-card {
  width: 148px;
  background: var(--white);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 16px 14px;
  text-align: center;
  flex-shrink: 0;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s;
  box-shadow: 0 1px 6px rgba(0,0,0,0.04);
}
.carousel-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(192,85,112,0.12);
}
.carousel-card-emoji { font-size: 38px; display: block; margin-bottom: 8px; }
.carousel-card-name {
  font-size: 12px; font-weight: 500;
  margin-bottom: 5px; line-height: 1.4;
}
.carousel-card-shop {
  font-family: var(--font-sans);
  font-size: 10px; color: var(--text2); margin-bottom: 6px;
}
.carousel-card-price {
  font-family: var(--font-serif);
  font-size: 15px; color: var(--rose3); margin-bottom: 6px;
}
.carousel-card-badge {
  display: inline-block;
  background: #e8f5f0; color: var(--new);
  font-family: var(--font-sans);
  font-size: 9px; font-weight: 500;
  padding: 2px 8px; border-radius: 8px;
  letter-spacing: 0.1em; margin-bottom: 8px;
  border: 1px solid rgba(107,158,138,0.2);
}
.carousel-card-add {
  width: 100%; padding: 7px;
  background: var(--rose3); color: #fff;
  border-radius: 8px;
  font-family: var(--font-sans);
  font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
  transition: opacity 0.2s;
}
.carousel-card-add:hover { opacity: 0.88; }

/* Countdown */
.sale-section { margin-top: 36px; }

.countdown-bar {
  background: var(--white);
  border: 1px solid rgba(212,72,90,0.15);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.04);
}
.countdown-label {
  font-family: var(--font-sans);
  font-size: 11px; color: var(--text2);
  letter-spacing: 0.06em;
}
.countdown-timer {
  font-family: var(--font-serif);
  font-size: 22px; font-weight: 400;
  color: var(--sale);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
}

.sale-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}

.sale-card {
  background: var(--white);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 20px 14px 14px;
  text-align: center;
  transition: transform 0.25s ease, box-shadow 0.25s;
  position: relative;
  overflow: hidden;
  box-shadow: 0 1px 6px rgba(0,0,0,0.04);
}
.sale-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(212,72,90,0.04) 0%, transparent 40%);
}
.sale-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212,72,90,0.1); }

.sale-off-tag {
  position: absolute;
  top: 12px; left: 12px;
  background: var(--sale);
  color: #fff;
  font-family: var(--font-sans);
  font-size: 10px; font-weight: 500;
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.06em;
}
.sale-card-emoji { font-size: 40px; display: block; margin: 8px 0 10px; }
.sale-card-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.sale-card-shop {
  font-family: var(--font-sans);
  font-size: 10px; color: var(--text2); margin-bottom: 8px;
}
.sale-price-original {
  font-family: var(--font-sans);
  font-size: 11px; color: var(--text3);
  text-decoration: line-through; margin-bottom: 2px;
}
.sale-price-current {
  font-family: var(--font-serif);
  font-size: 20px; font-weight: 400; color: var(--sale);
  margin-bottom: 12px; letter-spacing: 0.04em;
}
.sale-add-btn {
  width: 100%; padding: 9px;
  background: var(--sale); color: #fff;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
  transition: opacity 0.2s;
}
.sale-add-btn:hover { opacity: 0.88; }

/* ═══════════════════════════════════════
   TAB③ MY BAG
═══════════════════════════════════════ */
.empty-bag {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 70px 20px 40px;
  gap: 14px;
  text-align: center;
}
.empty-bag-icon {
  font-size: 64px;
  animation: floatBag 3.5s ease-in-out infinite;
}
@keyframes floatBag {
  0%,100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-12px) rotate(4deg); }
}
.empty-bag-text {
  font-family: var(--font-serif);
  font-size: 20px; font-weight: 300; font-style: italic;
  color: var(--text2);
}
.empty-bag-sub {
  font-family: var(--font-sans);
  font-size: 11px; color: var(--text3);
  line-height: 1.8; letter-spacing: 0.06em;
}

.cart-list { display: flex; flex-direction: column; gap: 10px; }

.cart-item {
  background: var(--white);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: box-shadow 0.22s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  animation: cartItemIn 0.3s ease;
}
@keyframes cartItemIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
.cart-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); }

.cart-item-emoji { font-size: 32px; flex-shrink: 0; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
.cart-item-shop {
  font-family: var(--font-sans);
  font-size: 10px; color: var(--text2); margin-bottom: 4px; letter-spacing: 0.04em;
}
.cart-item-price {
  font-family: var(--font-serif);
  font-size: 15px; color: var(--rose3);
}

.cart-item-qty {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.qty-btn {
  width: 28px; height: 28px;
  background: var(--cream2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.17s;
}
.qty-btn:hover { background: var(--rose3); color: #fff; border-color: transparent; }
.qty-val {
  font-family: var(--font-serif);
  font-size: 16px; min-width: 20px; text-align: center;
}

.cart-item-del {
  color: var(--text3);
  font-size: 17px;
  padding: 4px;
  border-radius: 6px;
  flex-shrink: 0;
  transition: color 0.2s;
}
.cart-item-del:hover { color: var(--sale); }

/* Cart Footer */
.cart-footer {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 720px;
  background: rgba(250,247,244,0.97);
  backdrop-filter: blur(18px);
  border-top: 1px solid var(--border);
  padding: 16px 20px;
  display: none;
  flex-direction: column;
  gap: 12px;
  z-index: 80;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
}
.cart-footer.visible { display: flex; }

.cart-total-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.cart-total-label {
  font-family: var(--font-sans);
  font-size: 12px; color: var(--text2); letter-spacing: 0.06em;
}
.cart-total-amount {
  font-family: var(--font-serif);
  font-size: 24px; font-weight: 400; color: var(--rose3);
}
.cart-total-amount span {
  font-family: var(--font-sans);
  font-size: 11px; color: var(--text2); letter-spacing: 0.08em;
}

.buy-btn {
  width: 100%;
  padding: 15px;
  background: var(--rose3);
  color: #fff;
  border-radius: 14px;
  font-family: var(--font-jp);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.1em;
  box-shadow: 0 4px 18px rgba(192,85,112,0.28);
  transition: opacity 0.2s, transform 0.15s;
}
.buy-btn:hover { opacity: 0.9; }
.buy-btn:active { transform: scale(0.99); }

/* ═══════════════════════════════════════
   TAB④ OWNER
═══════════════════════════════════════ */
.owner-section {
  background: var(--white);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.04);
}
.owner-section-title {
  font-family: var(--font-serif);
  font-size: 16px; font-weight: 400; font-style: italic;
  color: var(--rose3);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
  letter-spacing: 0.06em;
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px; margin-bottom: 20px;
}
.stat-box {
  background: var(--cream2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  text-align: center;
}
.stat-num {
  font-family: var(--font-serif);
  font-size: 24px; font-weight: 400;
  color: var(--rose3);
  letter-spacing: 0.04em;
}
.stat-label {
  font-family: var(--font-sans);
  font-size: 10px; color: var(--text2);
  margin-top: 3px; letter-spacing: 0.08em;
}

.form-group { margin-bottom: 14px; }
.form-label {
  font-family: var(--font-sans);
  font-size: 11px; color: var(--text2);
  margin-bottom: 6px; display: block;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.form-input {
  width: 100%;
  background: var(--cream2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 10px 14px;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-input:focus {
  border-color: var(--rose);
  box-shadow: 0 0 0 3px rgba(232,164,176,0.15);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.form-submit {
  width: 100%;
  padding: 12px;
  background: var(--rose3);
  color: #fff;
  border-radius: 10px;
  font-family: var(--font-jp);
  font-size: 14px; font-weight: 500;
  letter-spacing: 0.06em;
  margin-top: 4px;
  transition: opacity 0.2s;
}
.form-submit:hover { opacity: 0.88; }

.owner-gate {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 70px 20px;
  gap: 14px;
  text-align: center;
}
.owner-gate-icon { font-size: 52px; }
.owner-gate-text {
  font-family: var(--font-serif);
  font-size: 20px; font-style: italic; color: var(--text2);
}
.owner-gate-sub {
  font-family: var(--font-sans);

}

.shop-manage-list { display: flex; flex-direction: column; gap: 10px; }
.shop-manage-item {
  background: var(--cream2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
}
.shop-manage-emoji { font-size: 22px; }
.shop-manage-info { flex: 1; }
.shop-manage-name { font-size: 14px; font-weight: 500; }
.shop-manage-cat {
  font-family: var(--font-sans);
  font-size: 10px; color: var(--text2);
}
.shop-manage-actions { display: flex; gap: 6px; }
.edit-btn {
  background: var(--blush);
  border: 1px solid rgba(232,164,176,0.35);
  color: var(--rose3);
  border-radius: 8px;
  padding: 5px 12px;
  font-family: var(--font-sans);
  font-size: 11px; font-weight: 500;
  transition: all 0.2s;
}
.edit-btn:hover { background: var(--rose3); color: #fff; }
.delete-btn {
  background: rgba(212,72,90,0.07);
  border: 1px solid rgba(212,72,90,0.2);
  color: var(--sale);
  border-radius: 8px;
  padding: 5px 12px;
  font-family: var(--font-sans);
  font-size: 11px; font-weight: 500;
  transition: all 0.2s;
}
.delete-btn:hover { background: var(--sale); color: #fff; }

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
#toast-container {
  position: fixed;
  bottom: 90px; right: 16px;
  z-index: 500;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 18px;
  font-family: var(--font-sans);
  font-size: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  display: flex; align-items: center; gap: 8px;
  animation: toastIn 0.32s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: all;
  max-width: 260px;
  color: var(--text);
  letter-spacing: 0.04em;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px) scale(0.9); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}
.toast.out {
  animation: toastOut 0.25s ease forwards;
}
@keyframes toastOut {
  to { opacity: 0; transform: translateX(20px) scale(0.9); }
}
.toast.success { border-left: 3px solid var(--new); }
.toast.error   { border-left: 3px solid var(--sale); }
.toast.info    { border-left: 3px solid var(--rose); }

/* ═══════════════════════════════════════
   CONFETTI (Petal)
═══════════════════════════════════════ */
#confetti-canvas {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 999;
  display: none;
}

/* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════ */
@media (max-width: 480px) {
  .shop-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .hero-title { font-size: 34px; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div id="toast-container"></div>

<div id="app">

  <!-- Header -->
  <header class="header">
    <button class="header-back" onclick="goBack()">戻る</button>
    <div class="header-title">School Park Mall</div>
    <div class="header-right">
      <button class="cart-btn" id="cartBtn" onclick="switchTab('bag')">
        🛍
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
      <span class="header-clock" id="clock">00:00:00</span>
    </div>
  </header>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px clamp(16px,4vw,36px);background:#eaf1e6;color:#244936;font:600 13px/1.5 'Zen Maru Gothic',sans-serif">
    <span>買い物・商品交換の入口はSchoolPark Cityへ移りました。注文履歴・引換・管理機能はこの画面にも残しています。</span>
    <button type="button" onclick="if(window.parent!==window&&typeof window.parent.openEmuShopping==='function')window.parent.openEmuShopping();else window.location.href='/?cityView=commerce'" style="border:1px solid #244936;border-radius:6px;background:#fff;padding:9px 14px;color:#244936;font:inherit">SchoolPark Cityを開く</button>
  </div>

  <!-- Hero -->
  <div class="hero" id="hero">
    <div class="hero-beam"></div>
    <div class="hero-title"><span>School Park</span> Mall</div>
    <div class="hero-divider"><div class="hero-divider-dot"></div></div>
    <div class="hero-sale-pill">✦ Grand open Sale — 最大 50% OFF</div>
  </div>

  <!-- Order Form Banner -->
  <a class="order-banner"
     href="https://forms.gle/R8a7A3KjwwGogEDj7"
     target="_blank"
     rel="noopener noreferrer">
    <span class="order-banner-icon">🛍️</span>
    <span>ご注文はこちら（住所入力フォーム）</span>
    <span class="order-banner-arrow">›</span>
  </a>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('shops')">Shop</button>
    <button class="tab-btn" onclick="switchTab('sale')">New &amp; Sale</button>
    <button class="tab-btn" onclick="switchTab('bag')">My Bag</button>
    <button class="tab-btn" id="ownerTabBtn" onclick="switchTab('owner')" style="display:none">Manage</button>
  </nav>

  <!-- Tab① Shops -->
  <div class="tab-panel active" id="panel-shops">
    <div class="category-scroll" id="catFilter">
      <button class="cat-btn active" data-cat="all" onclick="filterCat('all',this)">All</button>
      <button class="cat-btn" data-cat="kyozai" onclick="filterCat('kyozai',this)">教材</button>
      <button class="cat-btn" data-cat="yugu" onclick="filterCat('yugu',this)">遊具</button>
      <button class="cat-btn" data-cat="zakka" onclick="filterCat('zakka',this)">雑貨</button>
      <button class="cat-btn" data-cat="fashion" onclick="filterCat('fashion',this)">Fashion</button>
      <button class="cat-btn" data-cat="digital" onclick="filterCat('digital',this)">Digital</button>
      <button class="cat-btn" data-cat="other" onclick="filterCat('other',this)">その他</button>
    </div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>

  <!-- Tab② New & Sale -->
  <div class="tab-panel" id="panel-sale">
    <div class="section-title">
      <div class="section-title-en">New Arrivals</div>
      <div class="section-title-jp">新着商品</div>
    </div>
    <div class="carousel-wrap"><div class="carousel" id="newCarousel"></div></div>

    <div class="sale-section">
      <div class="section-title">
        <div class="section-title-en">On Sale</div>
        <div class="section-title-jp">セール中</div>
      </div>
      <div class="countdown-bar">
        <span class="countdown-label">セール終了まで</span>
        <span class="countdown-timer" id="countdownTimer">--:--:--</span>
      </div>
      <div class="sale-grid" id="saleGrid"></div>
    </div>
  </div>

  <!-- Tab③ My Bag -->
  <div class="tab-panel" id="panel-bag">
    <div id="bagContent"></div>
  </div>

  <!-- Tab④ Owner -->
  <div class="tab-panel" id="panel-owner">
    <div id="ownerContent"></div>
  </div>

</div><!-- #app -->

<!-- Shop Modal -->
<div class="modal-overlay" id="shopModal" onclick="closeModalOutside(event)">
  <div class="modal" id="modalInner">
    <div class="modal-handle"><div class="modal-handle-bar"></div></div>
    <div class="modal-header">
      <span class="modal-shop-emoji" id="modalEmoji"></span>
      <div class="modal-shop-info">
        <div class="modal-shop-name" id="modalName"></div>
        <div class="modal-shop-meta" id="modalCat"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-products" id="modalProducts"></div>
  </div>
</div>

<script>
/* ═══════════════════════
   DATA

   もとは空の配列が置いてあるだけの雛形だった（[MIGRATE] の印のとおり）。
   中身はサーバー（/api/mitemiru）から入れる。
   並べ方・見た目の関数はそのまま使うので、ここで同じ形に整える。
═══════════════════════ */
const API = 'https://emu-realtime.onrender.com/api/mitemiru';
let SHOPS = [];
let NEW_ITEMS = [];
let SALE_ITEMS = [];
let PRODUCTS = [];          /* サーバーから来た商品。注文のときに引く */
const productById = (id) => PRODUCTS.find(p => String(p.id) === String(id)) || null;

/* ═══════════════════════
   STATE
═══════════════════════ */
/* [MIGRATE] cart localStorage → Firestore sp_shopping_carts */
let cart = JSON.parse(localStorage.getItem('sp_cart') || '[]');
let currentTab = 'shops';
let currentFilter = 'all';
const SALE_END = new Date(Date.now() + 2*24*3600000 + 7*3600000 + 23*60000);

/* 運営かどうか。前は ?owner=1 を付ければ誰でも見られた。
   サーバーに聞く（答えを待つまでは運営ではない扱い）。 */
let ME = null;
const isOwner = () => !!(ME && ME.isOwner);

/* ═══════════════════════
   PETALS
═══════════════════════ */
function spawnPetals() {
  const hero = document.getElementById('hero');
  const petalEmojis = ['🌸','🌷','✿','·','◦'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'hero-petal';
    p.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
    p.style.cssText = `
      left: ${Math.random()*100}%;
      top: -10px;
      font-size: ${8 + Math.random()*10}px;
      animation-duration: ${4 + Math.random()*4}s;
      animation-delay: ${Math.random()*6}s;
    `;
    hero.appendChild(p);
  }
}

/* ═══════════════════════
   CLOCK
═══════════════════════ */
function startClock() {
  const el = document.getElementById('clock');
  const tick = () => el.textContent = new Date().toLocaleTimeString('ja-JP',{hour12:false});
  tick(); setInterval(tick, 1000);
}

/* ═══════════════════════
   COUNTDOWN
═══════════════════════ */
function startCountdown() {
  const el = document.getElementById('countdownTimer');
  const tick = () => {
    const d = SALE_END - Date.now();
    if (d <= 0) { el.textContent = 'セール終了'; return; }
    const h = String(Math.floor(d/3600000)).padStart(2,'0');
    const m = String(Math.floor(d%3600000/60000)).padStart(2,'0');
    const s = String(Math.floor(d%60000/1000)).padStart(2,'0');
    el.textContent = `${h}:${m}:${s}`;
  };
  tick(); setInterval(tick, 1000);
}

/* ═══════════════════════
   TABS
═══════════════════════ */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  const order = ['shops','sale','bag','owner'];
  const i = order.indexOf(tab);
  const btns = document.querySelectorAll('.tab-btn');
  if (i >= 0 && btns[i]) btns[i].classList.add('active');
  if (tab === 'bag') renderBag();
  const footer = document.getElementById('cartFooter');
  if (footer) footer.className = 'cart-footer' + (tab === 'bag' && cart.length > 0 ? ' visible' : '');
}

/* ═══════════════════════
   SHOP GRID
═══════════════════════ */
function renderShops() {
  const shops = currentFilter === 'all' ? SHOPS : SHOPS.filter(s => s.category === currentFilter);
  const grid = document.getElementById('shopGrid');
  if (shops.length === 0) {
    grid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text2);">
        <div style="font-size:48px;margin-bottom:14px;opacity:0.5">🛒</div>
        <div style="font-family:var(--font-serif);font-size:18px;font-style:italic;margin-bottom:6px">No shops yet</div>
        <div style="font-family:var(--font-sans);font-size:11px;color:var(--text3);letter-spacing:0.06em">ショップが登録されていません</div>
      </div>`;
    return;
  }
  grid.innerHTML = shops.map(shopCardHTML).join('');
}

function shopCardHTML(s) {
  const badgeClass = s.badge === 'NEW' ? 'badge-new' : s.badge === 'SALE' ? 'badge-sale' : s.badge === 'HOT' ? 'badge-hot' : '';
  const badgeLabel = s.badge === 'HOT' ? '✦ HOT' : s.badge === 'SALE' ? 'SALE' : s.badge || '';
  return `
  <div class="shop-card" onclick="openShop('${s.id}')">
    ${s.badge ? `<span class="shop-badge ${badgeClass}">${badgeLabel}</span>` : ''}
    <span class="shop-emoji">${s.emoji}</span>
    <div class="shop-name">${s.name}</div>

  const ex = cart.find(i => i.id === id);

  const btn = document.getElementById('cartBtn');

}

function changeQty(id, delta) {
  const item = cart.find(i => i.id === id);

/* 払い方。カートの全部が使えるものだけ出す。
   1つでも使えない商品があると、まとめて払えないため。 */
const METHOD_LABEL = {
  emuer_ledger: ['EMUER', 'まだ受け取っていない EMUER から引きます'],
  emuer_chain:  ['EMUER（ウォレット）', '受け取り済みの EMUER で払います'],
  jpyc:         ['JPYC', 'ウォレットから JPYC を送ります'],
  jpy_card:     ['円（カード）', 'カードの画面へ進みます'],
  jpy_cash:     ['円（会場で現金）', '当日その場でお支払いください']
};
const METHOD_CURRENCY = {
  emuer_ledger: 'EMUER', emuer_chain: 'EMUER', jpyc: 'JPYC', jpy_card: 'JPY', jpy_cash: 'JPY'
};
const MONEY = { EMUER: 'EMUER', JPYC: 'JPYC', JPY: '円' };

function cartProducts() {
  return cart.map(i => ({ line: i, product: productById(i.id) })).filter(x => x.product);
}
function payMethods() {
  const rows = cartProducts();
  if (!rows.length) return [];
  return Object.keys(METHOD_LABEL).filter(m => rows.every(r => r.product.methods.includes(m)));
}
function methodTotal(method) {
  const cur = METHOD_CURRENCY[method];
  return cartProducts().reduce((sum, r) => sum + Number(r.product.prices[cur] || 0) * r.line.qty, 0);
}

/* 画面に出す小窓。ショップの小窓と同じ作り（同じ見た目）を使う。 */

function purchase() {
  if (!cart.length) return;
  if (!ME) {
    showToast('購入にはログインが必要です', 'error');
    return;
  }
  const rows = cartProducts();
  if (rows.length !== cart.length) {
    showToast('販売が終わった商品がバッグに入っています', 'error');
    return;
  }
  const methods = payMethods();
  if (!methods.length) {
    sheet('お支払い', '<p style="font-family:var(--font-sans);font-size:12px;line-height:1.9;color:var(--text2)">'
      + 'バッグの中で、同じ払い方が使える組み合わせになっていません。<br>'
      + '商品を分けてお求めください。</p>');
    return;
  }
  const body = methods.map(m => {
    const cur = METHOD_CURRENCY[m];
    const total = methodTotal(m);
    return `
    <button class="add-cart-btn" style="width:100%;text-align:left;margin-bottom:8px;padding:14px"
      onclick="startPay('${m}')">
      <div style="font-size:13px;font-weight:600;margin-bottom:3px">${METHOD_LABEL[m][0]}　${total.toLocaleString()} ${MONEY[cur]}</div>
      <div style="font-size:11px;opacity:0.75;font-weight:400">${METHOD_LABEL[m][1]}</div>
    </button>`;
  }).join('');
  sheet('お支払い方法', body
    + '<p style="font-family:var(--font-sans);font-size:11px;color:var(--text3);line-height:1.8;margin-top:6px">'
    + 'お支払いが確かめられると、引換コードが出ます。当日はそのコードをお見せください。</p>');
}

async function startPay(method) {
  const rows = cartProducts();
  closeSheet();
  showToast('お手続きしています…', 'info');
  const done = [];
  const failed = [];
  try {
    for (const r of rows) {
      for (let n = 0; n < r.line.qty; n += 1) {
        try {
          const res = await call('/orders', { method: 'POST', body: { productId: r.product.id, method } });
          const after = await followUp(method, res);
          done.push(after);
        } catch (e) {
          failed.push({ name: r.product.name, why: String(e.message || e) });
        }
      }
    }
  } catch (e) {
    failed.push({ name: '', why: String(e.message || e) });
  }

  if (done.length) {
    const total = done.reduce((s, o) => s + Number(o.amount || 0), 0);
    const cur = METHOD_CURRENCY[method];
    cart = []; saveCart(); updateCartBadge(); renderBag();
    launchPetals();
    showToast('✦ ご購入ありがとうございます', 'success');
    window.top.postMessage({ type:'spActivityLog', logType:'shop', icon:'🧾',
      title:'ショッピングモールで購入しました',
      detail: `合計 ${total.toLocaleString()} ${MONEY[cur]}` }, '*');
    await loadShop();
    paintAll();
  }
  showOrders(done, failed, method);
}

/* 払い方ごとの、あとの手続き。
   未変換の EMUER はその場で終わる。現金は当日その場で。
   カードは決済の画面へ。JPYC とウォレットの EMUER はウォレットを動かす。 */
async function followUp(method, res) {
  const order = res.order || {};
  if (method === 'jpy_card' && order.stripeUrl) {
    window.open(order.stripeUrl, '_blank', 'noopener');
    return order;
  }
  if (method === 'jpyc' && order.jpyc) {
    const tx = await sendJpyc(order.jpyc);
    const c = await call('/orders/' + order.id + '/confirm', { method: 'POST', body: { txHash: tx } });
    return c.order || order;
  }
  if (method === 'emuer_chain' && res.exchange) {
    await payOnChain(res.exchange);
    const c = await call('/orders/' + order.id + '/confirm', { method: 'POST', body: {} });
    return c.order || order;
  }
  return order;
}

let _ethers = null;
async function ethersReady() {
  if (_ethers) return _ethers;
  if (!window.ethereum) throw new Error('WALLET_NOT_FOUND');
  if (!window.ethers) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js';
      s.onload = res; s.onerror = () => rej(new Error('WALLET_LIB_FAILED'));
      document.head.appendChild(s);
    });
  }
  await window.ethereum.request({ method: 'eth_requestAccounts' });
  const p = new window.ethers.providers.Web3Provider(window.ethereum);
  if (Number((await p.getNetwork()).chainId) !== 137) throw new Error('POLYGON_REQUIRED');
  _ethers = p;
  return p;
}

async function sendJpyc(j) {
  const p = await ethersReady();
  const c = new window.ethers.Contract(j.token,
    ['function transfer(address,uint256) returns (bool)'], p.getSigner());
  const tx = await c.transfer(j.receiver, j.amountWei);
  await tx.wait();
  return tx.hash;
}

async function payOnChain(x) {
  const p = await ethersReady();
  const c = new window.ethers.Contract(x.contract,
    ['function payExchange(bytes32,bytes32,uint256,uint256,bytes)'], p.getSigner());
  const tx = await c.payExchange(x.orderId, x.productId, x.price, x.deadline, x.authorization);
  await tx.wait();
  return tx.hash;
}

═══════════════════════ */
function launchPetals() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#e8a4b0','#f3c5cc','#c9a96e','#d4788a','#f9eef0','#fce7f3','#e0c9d0','#b8924d'];
  const pieces = Array.from({length:120},() => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * 80,
    r: 3 + Math.random() * 5,
    d: 1.5 + Math.random() * 2.5,
    color: colors[Math.floor(Math.random()*colors.length)],
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random()-0.5) * 0.15,
    drift: (Math.random()-0.5) * 1.5,
    opacity: 0.7 + Math.random() * 0.3,
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.opacity * Math.min(1, (180-frame)/30);
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r, p.r*0.45, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      p.y += p.d; p.angle += p.spin; p.x += p.drift;
    });
    frame++;
    if (frame < 180) requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  }
  draw();
}

function orderRow(o) {
  return `
  <div class="shop-manage-item">
    <span class="shop-manage-emoji" style="font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:0.1em">${o.pickupCode||''}</span>
    <div class="shop-manage-info">
      <div class="shop-manage-name">${o.productName||''}</div>
      <div class="shop-manage-cat">${Number(o.amount||0).toLocaleString()}${MONEY[o.currency]||''} · ${o.status==='paid'?'お渡し待ち':o.status}</div>
    </div>
    <div class="shop-manage-actions">
      <button class="edit-btn" onclick="fulfill('${o.id}')">渡した</button>
    </div>
  </div>`;
}

async function lookupCode() {
  const code = String(document.getElementById('ownLookup').value || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const out = document.getElementById('ownLookupOut');
  if (!code) { showToast('引換コードを入れてください', 'error'); return; }
  out.innerHTML = '<div style="font-family:var(--font-sans);font-size:11px;color:var(--text3)">探しています…</div>';
  try {
    const r = await call('/admin/orders?code=' + encodeURIComponent(code));
    const rows = r.orders || [];
    if (!rows.length) { out.innerHTML = '<div style="font-family:var(--font-sans);font-size:12px;color:var(--sale)">そのコードは見つかりません</div>'; return; }
    out.innerHTML = rows.map(o => {
      if (o.status === 'pending_payment' && o.method === 'jpy_cash') {
        return `<div class="shop-manage-item">
          <div class="shop-manage-info">
            <div class="shop-manage-name">${o.productName||''}</div>
            <div class="shop-manage-cat">${Number(o.amount||0).toLocaleString()}円 · 現金をお預かりしてください</div>
          </div>
          <div class="shop-manage-actions"><button class="edit-btn" onclick="cashAndFulfill('${o.id}')">現金を受け取って渡した</button></div>
        </div>`;
      }
      if (o.status === 'paid') return orderRow(o);
      return `<div class="shop-manage-item"><div class="shop-manage-info">
        <div class="shop-manage-name">${o.productName||''}</div>
        <div class="shop-manage-cat">${o.status === 'fulfilled' ? 'お渡し済み' : o.status}</div>
      </div></div>`;
    }).join('');
  } catch (e) {
    out.innerHTML = `<div style="font-family:var(--font-sans);font-size:12px;color:var(--sale)">${WHY[e.message]||e.message}</div>`;
  }
}

async function fulfill(id) {
  try {
    await call('/admin/orders/' + id + '/fulfill', { method: 'POST', body: {} });

    await loadOwner(); renderOwnerPanel();
    const el = document.getElementById('ownLookupOut'); if (el) el.innerHTML = '';
  } catch (e) { showToast(WHY[e.message] || e.message, 'error'); }
}
async function cashAndFulfill(id) {
  try {
    await call('/admin/orders/' + id + '/cash-paid', { method: 'POST', body: {} });
    await call('/admin/orders/' + id + '/fulfill', { method: 'POST', body: {} });
    showToast('現金を受け取り、お渡しを記録しました', 'success');
    await loadOwner(); renderOwnerPanel();
    const el = document.getElementById('ownLookupOut'); if (el) el.innerHTML = '';

}

async function addShop() {
  const name = document.getElementById('newShopName').value.trim();
  if (!name) { showToast('ショップ名を入力してください', 'error'); return; }
  try {
    await call('/admin/shops', { method: 'POST', body: {
      name,
      emoji: document.getElementById('newShopEmoji').value.trim() || '🏪',
      category: document.getElementById('newShopCat').value,
      description: document.getElementById('newShopDesc').value.trim(),
      paymentGuide: document.getElementById('newShopPaymentGuide').value.trim(),
      address: document.getElementById('newShopAddress').value.trim(),
      imageUrl: document.getElementById('newShopImage').value.trim(),
      storeType: document.getElementById('newShopType').value,
      badge: 'NEW', status: 'draft'
    }});
    showToast(`${name} を追加しました`, 'success');
    await loadOwner(); await loadShop(); paintAll();
  } catch (e) { showToast(WHY[e.message] || e.message, 'error'); }
}

async function addProduct() {
  const v = (id) => String(document.getElementById(id).value || '').trim();
  const num = (id) => (v(id) === '' ? null : Number(v(id)));
  const name = v('npName');
  if (!name) { showToast('商品名を入力してください', 'error'); return; }
  const prices = { EMUER: num('npEmuer'), JPYC: num('npJpyc'), JPY: num('npJpy') };
  const selectedShop = OWNER.shops.find(x => x.id === v('npShop'));
  if (selectedShop?.storeType === 'schoolpark_virtual' && (prices.EMUER == null || prices.JPYC != null || prices.JPY != null)) {
    showToast('公式仮想店舗はEMUER価格だけを設定してください', 'error'); return;
  }
  if (selectedShop?.storeType === 'real_partner' && (prices.EMUER != null || (prices.JPYC == null && prices.JPY == null))) {
    showToast('リアル提携店舗は円・JPYC価格のみ設定できます', 'error'); return;
  }
  if (prices.EMUER == null && prices.JPYC == null && prices.JPY == null) {
    showToast('値段をどれか1つは入れてください', 'error'); return;
  }
  const fulfillment = v('npFulfill') || '会場の受付でコードをお見せください';
  const cancelPolicy = v('npCancel') || 'お渡し前なら取り消せます';
  try {
    await call('/admin/products', { method: 'POST', body: {
      name, description: v('npDesc'), emoji: v('npEmoji') || '🎁',
      shopId: v('npShop'), prices, stock: v('npStock') === '' ? null : Number(v('npStock')),
      cashAtVenue: selectedShop?.storeType === 'schoolpark_virtual' || selectedShop?.storeType === 'real_partner'
        ? false : document.getElementById('npCash').checked,
      fulfillment, cancelPolicy, status: 'live'
    }});
    showToast(`${name} を販売中にしました`, 'success');
    await loadOwner(); await loadShop(); paintAll();
  } catch (e) { showToast(WHY[e.message] || e.message, 'error'); }
}

async function toggleShopLive(id, status) {
  try {
    await call('/admin/shops/' + id, { method: 'PUT', body: { status: status === 'live' ? 'draft' : 'live' } });
    await loadOwner(); await loadShop(); paintAll();
  } catch (e) { showToast(WHY[e.message] || e.message, 'error'); }
}
async function toggleProductLive(id, status) {
  try {
    await call('/admin/products/' + id, { method: 'PUT', body: { status: status === 'live' ? 'draft' : 'live' } });
    await loadOwner(); await loadShop(); paintAll();
  } catch (e) { showToast(WHY[e.message] || e.message, 'error'); }
}

async function confirmDeleteShop(id) {
  const shop = OWNER.shops.find(x => String(x.id) === String(id));
  if (!shop) return;
  if (!confirm(`「${shop.name}」を閉じますか？\n\n商品と注文の記録は残ります。`)) return;
  try {
    await call('/admin/shops/' + id, { method: 'DELETE' });
    showToast(`${shop.name} を閉じました`, 'info');
    await loadOwner(); await loadShop(); paintAll();
  } catch (e) { showToast(WHY[e.message] || e.message, 'error'); }
}

/* ═══════════════════════
   TOAST
═══════════════════════ */
function showToast(message, type) {
  const icons = {success:'✦', error:'✕', info:'·'};
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(()=>t.remove(),300); }, 3000);
}

   SERVER

   ログインは Emu・SchoolPark と同じ Firebase のものをそのまま使う。
   同じドメインなので、あちらで入っていればここでも入れている。
   （Camellia の画面と同じやり方。ログインの本体は写さない）

   ショップと商品は誰でも読める。注文だけ、証が要る。
═══════════════════════ */
const FB = {
  apiKey: "AIzaSyBKHS1D8Or6gfMd4NbzhDI7dG5Je7BLtbs",
  authDomain: "schoolpark-emu.vercel.app",
  projectId: "emusch-2a111",

  messagingSenderId: "795496371585",
  appId: "1:795496371585:web:51deec91b8a2152e4c8480"
};
let _auth = null;
async function authReady() {
  if (_auth) return _auth;
  const SDK = "https://www.gstatic.com/firebasejs/10.8.0/";
  const [app, auth] = await Promise.all([
    import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js")
  ]);
  const a = auth.getAuth(app.getApps().length ? app.getApp() : app.initializeApp(FB));
  /* 最初の答えが返るまで待つ。待たずに聞くと、入っている人でも
     未ログイン扱いになる。 */
  await new Promise(res => {
    const off = auth.onAuthStateChanged(a, () => { off(); res(); });
  });
  _auth = a;
  return a;
}
async function token() {
  const a = await authReady();
  if (!a.currentUser) return null;
  return a.currentUser.getIdToken();
}
async function call(path, options) {
  const o = options || {};
  const headers = {};
  if (o.auth !== false) {
    const t = await token();
    if (!t) throw new Error('LOGIN_REQUIRED');
    headers.Authorization = 'Bearer ' + t;
  }
  if (o.body) headers['Content-Type'] = 'application/json';
  const r = await fetch(API + path, {
    method: o.method || 'GET', headers,
    body: o.body ? JSON.stringify(o.body) : undefined,
    cache: 'no-store'
  });
  let d = null;
  try { d = await r.json(); } catch (_) { d = null; }
  if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
  return d || {};
}

/* サーバーの商品を、画面がそのまま使える形に直す。
   並べ方・見た目の関数は変えないので、同じ欄をそろえる。 */
function shapeProduct(p) {
  return {
    id: p.id,
    emoji: p.emoji || '\u{1F381}',
    name: p.name,
    desc: p.description || '',
    price: Number((p.prices && p.prices.EMUER) || 0),
    soldOut: !!p.soldOut,
    remaining: p.remaining,
    methods: p.methods || [],
    prices: p.prices || {},
    shopId: p.shopId || ''
  };
}

async function loadShop() {
  const [shopRes, prodRes] = await Promise.all([
    call('/shops', { auth: false }).catch(() => ({ shops: [] })),
    call('/products', { auth: false }).catch(() => ({ products: [] }))
  ]);
  PRODUCTS = (prodRes.products || []).map(shapeProduct);

  const shops = (shopRes.shops || []).map(sh => {
    const items = PRODUCTS.filter(p => p.shopId === sh.id);
    return {
      id: sh.id, name: sh.name, emoji: sh.emoji, category: sh.category,
      desc: sh.description || '', rating: sh.rating, badge: sh.badge || '',
      items: items.length, products: items
    };
  });
  /* どのショップにも属さない商品。捨てずに「その他」へまとめる。
     ショップを作らずに商品だけ置いても、ちゃんと売り場に出る。 */
  const loose = PRODUCTS.filter(p => !p.shopId || !shops.some(sh => sh.id === p.shopId));
  if (loose.length) {
    shops.push({
      id: '_loose', name: 'SchoolPark', emoji: '\u{1F3EB}', category: 'other',
      desc: '運営から出している品です。', rating: 5, badge: '',
      items: loose.length, products: loose
    });
  }
  SHOPS = shops;

  /* 新着は、新しく置かれた順の先頭から。セールは出していないので空のまま。
     （セールの仕組みはまだサーバーに無い。出せるようになるまで空で出す） */
  NEW_ITEMS = PRODUCTS.slice(0, 8).map(p => {
    const sh = SHOPS.find(x => x.products.some(q => q.id === p.id));
    return { id: p.id, emoji: p.emoji, name: p.name, price: p.price, shop: sh ? sh.name : '' };
  });
  SALE_ITEMS = [];

  try { ME = await call('/me'); } catch (_) { ME = null; }
}
