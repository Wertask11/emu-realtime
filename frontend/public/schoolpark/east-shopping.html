<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みてみる | SchoolPark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
/* みてみる — SchoolParkの交換所。
   いちばん大事な画面は「引換券」。会場で運営に見せて、その場で受け取るためのもの。
   色は CHES の基調（アイボリー・墨・椿の紅・金）。 */
:root {
  --ivory: #f6f1e6;
  --paper: #fffdf8;
  --ink: #1f1c2b;
  --ink2: #5e5868;
  --ink3: #9a93a3;
  --line: #e2d9c7;
  --tsubaki: #b3263a;
  --tsubaki-soft: #f6e3e2;
  --kin: #a8822f;
  --kin-soft: #f3ead2;
  --ok: #2f6b4f;
  --ok-soft: #e1efe6;
  --sans: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  --mincho: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ivory); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.7; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }

/* 上部 */
.top { position: sticky; top: 0; z-index: 5; background: var(--ivory); border-bottom: 1px solid var(--line); }
.top-row { max-width: 560px; margin: 0 auto; padding: 10px 16px 0; display: flex; align-items: center; gap: 10px; }
.back { border: 0; background: none; color: var(--ink2); font-size: 14px; padding: 6px 4px; }
.top h1 { font-family: var(--mincho); font-weight: 800; font-size: 22px; letter-spacing: .04em; flex: 1; }
.tabs { max-width: 560px; margin: 0 auto; padding: 8px 16px 0; display: flex; gap: 18px; }
.tab { border: 0; background: none; padding: 6px 0 10px; color: var(--ink3); font-weight: 700; border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--tsubaki); }
.tab .count { display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 6px; border-radius: 10px; background: var(--tsubaki); color: #fff; font-size: 12px; line-height: 20px; }

/* 残高 */
.purse { margin: 14px 0 4px; padding: 12px 14px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); font-size: 13px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.purse b { color: var(--ink); font-size: 16px; }

/* 商品 */
.list { list-style: none; margin-top: 10px; }
.item { display: grid; grid-template-columns: 84px 1fr; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.thumb { width: 84px; height: 84px; border-radius: 10px; background: var(--kin-soft); overflow: hidden; display: grid; place-items: center; font-family: var(--mincho); font-weight: 800; font-size: 30px; color: var(--kin); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.item h2 { font-family: var(--mincho); font-weight: 800; font-size: 18px; line-height: 1.4; }
.item p { color: var(--ink2); font-size: 13px; margin-top: 4px; }
.prices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.price { font-size: 13px; padding: 2px 9px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); }
.price b { font-size: 15px; }
.meta { font-size: 12px; color: var(--ink3); margin-top: 6px; }
.get { margin-top: 10px; border: 0; border-radius: 999px; padding: 9px 20px; background: var(--ink); color: var(--paper); font-weight: 700; }
.get[disabled] { background: var(--line); color: var(--ink3); cursor: default; }
.empty { padding: 48px 8px; text-align: center; color: var(--ink2); }
.empty strong { display: block; font-family: var(--mincho); font-size: 18px; color: var(--ink); margin-bottom: 6px; }

/* 引換券。この画面だけは大胆に。 */
.ticket { position: relative; margin: 18px 0; background: var(--paper); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 118px; width: 22px; height: 22px; border-radius: 50%; background: var(--ivory); border: 1px solid var(--line); }
.ticket::before { left: -12px; } .ticket::after { right: -12px; }
.ticket-head { padding: 16px 18px 14px; min-height: 129px; }
.ticket-head .name { font-family: var(--mincho); font-weight: 800; font-size: 20px; line-height: 1.4; }
.ticket-head .how { font-size: 13px; color: var(--ink2); margin-top: 6px; }
.ticket-code { border-top: 2px dashed var(--line); padding: 18px 18px 20px; text-align: center; }
.ticket-code .say { font-size: 13px; color: var(--ink2); }
.code { font-weight: 900; font-size: clamp(40px, 13vw, 58px); letter-spacing: .14em; line-height: 1.2; margin: 6px 0 4px; color: var(--tsubaki); font-variant-numeric: tabular-nums; }
.ticket.done .code { color: var(--ink3); text-decoration: line-through; text-decoration-thickness: 3px; }
.ticket.waiting .code { color: var(--kin); }
.state { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.state.paid { background: var(--tsubaki-soft); color: var(--tsubaki); }
.state.fulfilled { background: var(--ok-soft); color: var(--ok); }
.state.pending { background: var(--kin-soft); color: var(--kin); }
.state.closed { background: var(--line); color: var(--ink2); }
.ticket-foot { padding: 0 18px 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.ticket-foot .line { width: 100%; text-align: center; font-size: 12px; color: var(--ink3); }
.small-btn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
.small-btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.small-btn.danger { color: var(--tsubaki); }
.past { margin-top: 24px; font-size: 13px; color: var(--ink2); }
.past li { list-style: none; padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }

/* 支払いの選択（下から出る） */
.veil { position: fixed; inset: 0; background: rgba(31,28,43,.42); display: none; z-index: 20; }
.veil.open { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--paper); border-radius: 18px 18px 0 0; max-height: 86vh; overflow: auto; transform: translateY(100%); transition: transform .22s ease; }
.sheet.open { transform: none; }
.sheet-in { max-width: 560px; margin: 0 auto; padding: 18px 16px 28px; }
.sheet h3 { font-family: var(--mincho); font-weight: 800; font-size: 20px; }
.sheet .terms { font-size: 12px; color: var(--ink2); margin: 8px 0 14px; padding: 10px 12px; background: var(--ivory); border-radius: 10px; }
.way { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.way:hover:not([disabled]) { border-color: var(--ink2); }
.way[disabled] { background: var(--ivory); color: var(--ink3); cursor: default; }
.way .w-name { font-weight: 700; }
.way .w-amt { font-weight: 900; text-align: right; }
.way .w-note { grid-column: 1 / -1; font-size: 12px; color: var(--ink2); }
.way[disabled] .w-note { color: var(--ink3); }
.close-sheet { margin-top: 6px; width: 100%; border: 0; background: none; color: var(--ink2); padding: 10px; }
.busy { padding: 26px 4px; text-align: center; color: var(--ink2); }

/* 運営 */
.admin h2 { font-family: var(--mincho); font-weight: 800; font-size: 18px; margin: 22px 0 8px; }
.lookup { display: flex; gap: 8px; }
.lookup input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); font-weight: 900; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
.lookup button { border: 0; border-radius: 12px; background: var(--ink); color: var(--paper); font-weight: 700; padding: 0 18px; }
.orow { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.orow .top-line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.orow .ocode { font-weight: 900; letter-spacing: .1em; font-size: 16px; }
.orow .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.form { display: grid; gap: 10px; padding: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--ink2); }
.form input, .form textarea, .form select { padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
.form textarea { min-height: 64px; resize: vertical; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.check { display: flex !important; grid-template-columns: none; align-items: center; gap: 8px; color: var(--ink) !important; }
.prow { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.prow b { font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 14px; font-size: 14px; z-index: 30; display: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { display: block; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <button class="back" id="back" type="button">← もどる</button>
    <h1>みてみる</h1>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="shop" aria-selected="true">商品</button>
    <button class="tab" role="tab" data-tab="orders" aria-selected="false">引換券<span class="count hidden" id="ticketCount"></span></button>
    <button class="tab hidden" role="tab" data-tab="admin" aria-selected="false" id="adminTab">運営</button>
  </nav>
</header>

<main class="wrap">
  <section id="view-shop">
    <div class="purse hidden" id="purse"></div>
    <ul class="list" id="products"><li class="busy">読み込んでいます…</li></ul>
  </section>

  <section id="view-orders" class="hidden">
    <div id="tickets"></div>
  </section>

  <section id="view-admin" class="hidden admin">
    <h2>引換コードで探す</h2>
    <form class="lookup" id="lookupForm">
      <input id="lookupCode" maxlength="8" autocomplete="off" inputmode="latin" aria-label="引換コード" placeholder="ABC234">
      <button type="submit">探す</button>
    </form>
    <div id="lookupResult"></div>

    <h2>注文</h2>
    <div class="filter" id="orderFilter">
      <button class="small-btn primary" data-status="paid">受け取り待ち</button>
      <button class="small-btn" data-status="pending_payment">支払い待ち</button>
      <button class="small-btn" data-status="fulfilled">受け渡し済み</button>
      <button class="small-btn" data-status="">すべて</button>
    </div>
    <div id="adminOrders"></div>

    <h2>商品</h2>
    <div id="adminProducts"></div>
    <h2 id="formTitle">商品を出す</h2>
    <form class="form" id="productForm">
      <input type="hidden" id="pf-id">
      <label>名前<input id="pf-name" maxlength="60" required placeholder="ステッカー引換券"></label>
      <label>説明<textarea id="pf-desc" maxlength="600"></textarea></label>
      <label>画像のURL（https）<input id="pf-image" maxlength="500" placeholder="https://…"></label>
      <div class="row3">
        <label>EMUER<input id="pf-emuer" type="number" min="1" step="1" placeholder="—"></label>
        <label>JPYC<input id="pf-jpyc" type="number" min="1" step="1" placeholder="—"></label>
        <label>円<input id="pf-jpy" type="number" min="1" step="1" placeholder="—"></label>
      </div>
      <label class="check"><input type="checkbox" id="pf-cash"> 会場で現金を受け取る（円の価格が必要）</label>
      <label>在庫（空欄なら数を限らない）<input id="pf-stock" type="number" min="0" step="1"></label>
      <label>受け取り方<input id="pf-fulfill" maxlength="200" required placeholder="解剖フェス会場で手渡し"></label>
      <label>取消・返金の条件<textarea id="pf-cancel" maxlength="300" required placeholder="受け取り前で、運営の都合で渡せないときは全額返金します"></textarea></label>
      <label>状態
        <select id="pf-status">
          <option value="draft">下書き（並べない）</option>
          <option value="live">販売中</option>
          <option value="ended">終了</option>
        </select>
      </label>
      <div style="display:flex;gap:8px">
        <button type="submit" class="small-btn primary" id="pf-save">商品を出す</button>
        <button type="button" class="small-btn hidden" id="pf-reset">新しい商品にする</button>
      </div>
      <p class="meta" id="pf-note"></p>
    </form>
  </section>
</main>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  var API = "https://emu-realtime.onrender.com/api/mitemiru";
  var EMUER_ABI = [
    "function exchange(bytes32 orderId, bytes32 productId, uint256 price, uint256 deadline, bytes authorization)",
    "function refundExchange(bytes32 orderId)",
    "function markExchangeFulfilled(bytes32 orderId)"
  ];
  var ERC20_ABI = ["function transfer(address to, uint256 amount) returns (bool)"];

  var state = { products: [], me: null, orders: [], tab: "shop", adminStatus: "paid", adminProducts: [] };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var yen = function (n) { return Number(n).toLocaleString("ja-JP"); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  var MESSAGES = {
    PLAN_REQUIRED: "EMUERで払えるのは Emu Light 以上の方です。円かJPYCなら払えます。",
    PERIOD_LIMIT_REACHED: "この期間のEMUERでの交換回数を使い切りました（Lightは月1回、Plusは週1回）。円かJPYCなら払えます。",
    INSUFFICIENT_EMUER: "未変換のEMUERが足りません。",
    SOLD_OUT: "売り切れました。",
    NOT_FOR_SALE: "この商品はいまは手に入りません。",
    METHOD_NOT_AVAILABLE: "この支払い方法は使えません。",
    EMUER_NOT_ACTIVE: "EMUERの支払いはいま止まっています。",
    WALLET_REQUIRED: "この支払いにはウォレットが必要です。",
    CHAIN_UNAVAILABLE: "Polygonにつながりません。少し待ってからもう一度押してください。",
    AUTHORIZER_NOT_READY: "EMUERの支払いの準備ができていません。運営に知らせてください。",
    CARD_UNAVAILABLE: "カード払いの準備ができていません。",
    CARD_NOT_PAID: "カードの支払いはまだ終わっていません。",
    CHAIN_PAYMENT_NOT_FOUND: "鎖の上でまだ支払いが見つかりません。少し待ってから「支払いを確かめる」を押してください。",
    TX_PENDING: "送金の確定を待っています。",
    TX_NOT_FOUND: "その送金はまだ見つかりません。",
    TRANSFER_NOT_FOUND: "この注文の金額・宛先の送金が見つかりません。",
    TX_ALREADY_USED: "その送金は別の注文で使われています。",
    ORDER_EXPIRED: "取り置きの期限が過ぎました。もう一度最初から選んでください。",
    ORDER_NOT_PENDING: "この注文は支払い待ちではありません。",
    ALREADY_DONE: "すでに済んでいます。",
    NOT_PAID: "まだ支払われていません。",
    CHAIN_REFUND_NOT_CONFIRMED: "先に運営ウォレットで鎖の上の返金をしてください。",
    OWNER_ONLY: "運営だけが使えます。",
    RATE_LIMITED: "押す回数が多すぎます。少し待ってください。",
    AUTH_REQUIRED: "Emuにログインしてから開いてください。",
    INVALID_AUTH_TOKEN: "ログインし直してください。"
  };
  function say(code) { return MESSAGES[code] || code || "うまくいきませんでした。"; }
  function toast(text) {
    var t = $("toast"); t.textContent = text; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 4200);
  }

  /* ログインの証は親（Emu）からもらう。 */
  function canAuth() {
    try { return window.parent && window.parent !== window && typeof window.parent.emuAuthHeaders === "function"; }
    catch (e) { return false; }
  }
  async function headers() {
    if (!canAuth()) throw new Error("AUTH_REQUIRED");
    return window.parent.emuAuthHeaders(true);
  }
  async function api(path, opts) {
    var o = opts || {};
    var h = o.auth === false ? { "Content-Type": "application/json" } : await headers();
    var r = await fetch(API + path, { method: o.method || "GET", headers: h, body: o.body ? JSON.stringify(o.body) : undefined });
    var v = await r.json().catch(function () { return {}; });
    if (!r.ok) { var e = new Error(v.error || "FAILED"); e.data = v; throw e; }
    return v;
  }

  /* ウォレット（MetaMask など）。この部屋か親のどちらかに入っている。 */
  function injected() {
    if (window.ethereum) return window.ethereum;
    try { return window.parent && window.parent.ethereum; } catch (e) { return null; }
  }
  async function walletSigner(expected) {
    var eth = injected();
    if (!eth || typeof ethers === "undefined") throw new Error("ウォレット（MetaMaskなど）が入っているブラウザで開いてください。");
    await eth.request({ method: "eth_requestAccounts" });
    var chainId = await eth.request({ method: "eth_chainId" });
    if (parseInt(chainId, 16) !== 137) {
      await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x89" }] });
    }
    var provider = new ethers.providers.Web3Provider(eth);
    var signer = provider.getSigner();
    var addr = (await signer.getAddress()).toLowerCase();
    if (expected && addr !== String(expected).toLowerCase()) {
      throw new Error("ウォレットのアカウントが、Emuに登録したアドレス（" + expected.slice(0, 6) + "…" + expected.slice(-4) + "）と違います。切り替えてください。");
    }
    return signer;
  }

  /* ───── タブ ───── */
  function show(tab) {
    state.tab = tab;
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
    ["shop", "orders", "admin"].forEach(function (k) { $("view-" + k).classList.toggle("hidden", k !== tab); });
    if (tab === "orders") loadOrders();
    if (tab === "admin") { loadAdminOrders(); loadAdminProducts(); }
  }
  document.querySelectorAll(".tab").forEach(function (b) { b.addEventListener("click", function () { show(b.dataset.tab); }); });
  $("back").addEventListener("click", function () {
    try { if (window.parent !== window) { window.parent.postMessage({ type: "spContentClose" }, location.origin); return; } } catch (e) {}
    location.href = "/";
  });

  /* ───── 商品 ───── */
  var WAYS = {
    emuer_ledger: { name: "EMUER（未変換）", cur: "EMUER", note: "まだ受け取っていないEMUERから払います。ウォレットもガス代もいりません。" },
    emuer_chain:  { name: "EMUER（ウォレット）", cur: "EMUER", note: "受け取り済みのEMUERで払います。ガス代（POL）が少しかかります。" },
    jpyc:         { name: "JPYC", cur: "JPYC", note: "ウォレットからJPYCを送ります。ガス代（POL）が少しかかります。" },
    jpy_card:     { name: "カード", cur: "JPY", note: "Stripeの支払い画面に移ります。" },
    jpy_cash:     { name: "会場で現金", cur: "JPY", note: "コードを会場で見せて、その場で現金で払います。" }
  };
  function amountText(cur, n) { return cur === "JPY" ? yen(n) + "円" : yen(n) + " " + cur; }

  function renderPurse() {
    var me = state.me, el = $("purse");
    if (!me || !me.emuer) { el.classList.add("hidden"); return; }
    var e = me.emuer, plan = { light: "Emu Light", plus: "Emu Plus", pro: "Emu Pro" }[e.plan] || "無料プラン";
    var quota = e.error === "PLAN_REQUIRED" ? "EMUERでの交換は Light から"
      : e.limit === null ? "EMUERでの交換は回数の制限なし"
      : "EMUERでの交換 " + (e.limit - e.used > 0 ? "あと" + (e.limit - e.used) + "回" : "この期間は使い切り");
    el.innerHTML = "<span>未変換のEMUER <b>" + esc(e.unconverted) + "</b></span><span>" + esc(plan) + "：" + esc(quota) + "</span>";
    el.classList.remove("hidden");
  }

  function renderProducts() {
    var ul = $("products");
    if (!state.products.length) {
      ul.innerHTML = '<li class="empty"><strong>まだ商品がありません</strong>イベントの引換券などが並んだら、ここから手に入れられます。</li>';
      return;
    }
    ul.innerHTML = state.products.map(function (p) {
      var prices = [];
      if (p.prices.EMUER !== null) prices.push('<span class="price"><b>' + yen(p.prices.EMUER) + "</b> EMUER</span>");
      if (p.prices.JPYC !== null) prices.push('<span class="price"><b>' + yen(p.prices.JPYC) + "</b> JPYC</span>");
      if (p.prices.JPY !== null) prices.push('<span class="price"><b>' + yen(p.prices.JPY) + "</b> 円</span>");
      var thumb = p.imageUrl ? '<img alt="" src="' + esc(p.imageUrl) + '">' : esc(p.name.slice(0, 1));
      var left = p.remaining === null ? "" : (p.soldOut ? "売り切れ" : "のこり " + p.remaining);
      return '<li class="item"><div class="thumb">' + thumb + "</div><div>" +
        "<h2>" + esc(p.name) + "</h2>" + (p.description ? "<p>" + esc(p.description) + "</p>" : "") +
        '<div class="prices">' + prices.join("") + "</div>" +
        '<div class="meta">' + esc(p.fulfillment) + (left ? "／" + left : "") + "</div>" +
        '<button class="get" data-id="' + esc(p.id) + '"' + (p.soldOut || !p.methods.length ? " disabled" : "") + ">" + (p.soldOut ? "売り切れ" : "手に入れる") + "</button>" +
        "</div></li>";
    }).join("");
    ul.querySelectorAll(".get").forEach(function (b) { b.addEventListener("click", function () { openSheet(b.dataset.id); }); });
  }

  async function loadProducts() {
    try {
      var v = await api("/products", { auth: false });
      state.products = v.products || [];
      renderProducts();
    } catch (e) { $("products").innerHTML = '<li class="empty"><strong>商品を読み込めませんでした</strong>通信を確かめて、開き直してください。</li>'; }
  }
  async function loadMe() {
    if (!canAuth()) return;
    try {
      state.me = await api("/me");
      renderPurse();
      if (state.me.isOwner) $("adminTab").classList.remove("hidden");
    } catch (e) { /* 未ログインなら商品だけ見せる */ }
  }

  /* ───── 支払いの選択 ───── */
  function openSheetHtml(html) {
    $("sheetIn").innerHTML = html;
    $("veil").classList.add("open"); $("sheet").classList.add("open");
  }
  function closeSheet() { $("veil").classList.remove("open"); $("sheet").classList.remove("open"); }
  $("veil").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  function wayBlocked(method, p) {
    var me = state.me;
    if (!canAuth() || !me) return "Emuにログインすると選べます。";
    if (WAYS[method].cur === "EMUER") {
      if (me.emuer.error === "PLAN_REQUIRED") return "Emu Light 以上で使えます。";
      if (me.emuer.error === "PERIOD_LIMIT_REACHED") return "この期間の回数を使い切りました。";
      if (me.emuer.error) return say(me.emuer.error);
      if (method === "emuer_ledger" && Number(me.emuer.unconverted) < p.prices.EMUER) return "未変換のEMUERが足りません（" + me.emuer.unconverted + "）。";
    }
    if ((method === "emuer_chain" || method === "jpyc") && !injected()) return "ウォレット（MetaMaskなど）が入っているブラウザで使えます。";
    return "";
  }

  function openSheet(id) {
    var p = state.products.find(function (x) { return x.id === id; });
    if (!p) return;
    var ways = p.methods.map(function (m) {
      var cur = WAYS[m].cur, blocked = wayBlocked(m, p);
      return '<button class="way" data-m="' + m + '"' + (blocked ? " disabled" : "") + '><span class="w-name">' + WAYS[m].name +
        '</span><span class="w-amt">' + amountText(cur, p.prices[cur]) + '</span><span class="w-note">' + esc(blocked || WAYS[m].note) + "</span></button>";
    }).join("");
    openSheetHtml('<h3 id="sheetTitle">' + esc(p.name) + "</h3>" +
      '<div class="terms">受け取り方：' + esc(p.fulfillment) + "<br>取消・返金：" + esc(p.cancelPolicy) + "</div>" +
      ways + '<button class="close-sheet" type="button">やめる</button>');
    $("sheetIn").querySelector(".close-sheet").addEventListener("click", closeSheet);
    $("sheetIn").querySelectorAll(".way").forEach(function (b) { b.addEventListener("click", function () { buy(p, b.dataset.m); }); });
  }

  function busy(text) { $("sheetIn").innerHTML = '<div class="busy">' + esc(text) + "</div>"; }

  async function confirmLoop(orderId, body, tries) {
    for (var i = 0; i < (tries || 12); i += 1) {
      try { return await api("/orders/" + orderId + "/confirm", { method: "POST", body: body || {} }); }
      catch (e) {
        if (["CHAIN_PAYMENT_NOT_FOUND", "TX_PENDING", "TX_NOT_FOUND", "CHAIN_UNAVAILABLE"].indexOf(e.message) < 0) throw e;
        await sleep(4000);
      }
    }
    throw new Error("CHAIN_PAYMENT_NOT_FOUND");
  }

  async function buy(p, method) {
    busy("注文を作っています…");
    try {
      var created = await api("/orders", { method: "POST", body: { productId: p.id, method: method } });
      var order = created.order;
      if (method === "jpy_card") {
        busy("カードの支払い画面に移ります…");
        try { window.top.location.href = order.stripeUrl; } catch (e) { location.href = order.stripeUrl; }
        return;
      }
      if (method === "emuer_chain") {
        busy("ウォレットで支払いを承認してください…");
        var signer = await walletSigner(state.me.wallet);
        var ex = created.exchange;
        var c = new ethers.Contract(ex.contract, EMUER_ABI, signer);
        var tx = await c.exchange(ex.orderId, ex.productId, ex.price, ex.deadline, ex.authorization);
        busy("Polygonで確定するのを待っています…");
        await tx.wait(1);
        order = (await confirmLoop(order.id)).order;
      }
      if (method === "jpyc") {
        busy("ウォレットでJPYCの送金を承認してください…");
        var s2 = await walletSigner(state.me.wallet);
        var token = new ethers.Contract(order.jpyc.token, ERC20_ABI, s2);
        var tx2 = await token.transfer(order.jpyc.receiver, order.jpyc.amountWei);
        try { localStorage.setItem("mitemiru_tx_" + order.id, tx2.hash); } catch (e) {}
        busy("送金の確定を待っています…");
        await tx2.wait(2);
        order = (await confirmLoop(order.id, { txHash: tx2.hash })).order;
      }
      closeSheet();
      await loadMe(); await loadProducts();
      show("orders");
      toast(order.status === "paid" ? "引換券ができました。会場でこのコードを見せてください。" : "注文しました。会場でコードを見せて、現金で払ってください。");
    } catch (e) {
      var msg = say(e.message);
      if (e.message === "INSUFFICIENT_EMUER" && e.data && e.data.available) msg += "（いま " + e.data.available + " EMUER）";
      if (e.code === 4001 || e.code === "ACTION_REJECTED") msg = "ウォレットで取り消しました。引換券のタブから続きができます。";
      openSheetHtml('<h3 id="sheetTitle">' + esc(p.name) + '</h3><div class="busy">' + esc(msg) + '</div><button class="close-sheet" type="button">閉じる</button>');
      $("sheetIn").querySelector(".close-sheet").addEventListener("click", closeSheet);
      loadMe(); loadProducts();
    }
  }

  /* ───── 引換券 ───── */
  var STATE_LABEL = { paid: ["paid", "受け取り前"], fulfilled: ["fulfilled", "受け取り済み"], pending_payment: ["pending", "支払い待ち"],
    refunded: ["closed", "返金済み"], cancelled: ["closed", "取り消し"], expired: ["closed", "期限切れ"] };

  function ticketHtml(o) {
    var st = STATE_LABEL[o.status] || ["closed", o.status];
    var cls = o.status === "fulfilled" ? " done" : o.status === "pending_payment" ? " waiting" : "";
    var code = o.pickupCode || o.waitingCode || "------";
    var sayLine = o.status === "paid" ? "この画面を運営に見せて、受け取ってください"
      : o.status === "fulfilled" ? "受け取り済みです"
      : o.method === "jpy_cash" ? "会場でこのコードを見せて、現金で払ってください"
      : "支払いが終わるとコードが出ます";
    var acts = [];
    if (o.status === "pending_payment") {
      if (o.method === "jpy_card" && o.stripeUrl) acts.push('<button class="small-btn primary" data-act="pay" data-url="' + esc(o.stripeUrl) + '">カードで払う</button>');
      if (o.method !== "jpy_cash") acts.push('<button class="small-btn" data-act="confirm" data-id="' + esc(o.id) + '">支払いを確かめる</button>');
      acts.push('<button class="small-btn danger" data-act="cancel" data-id="' + esc(o.id) + '">取り消す</button>');
    }
    var when = o.expiresAt ? '<span class="line">取り置きは ' + new Date(o.expiresAt).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) + " まで</span>" : "";
    return '<article class="ticket' + cls + '"><div class="ticket-head"><span class="state ' + st[0] + '">' + st[1] + "</span>" +
      '<div class="name">' + esc(o.productName) + '</div><div class="how">' + esc(o.fulfillment) + "／" + amountText(o.currency, o.amount) + "</div></div>" +
      '<div class="ticket-code"><div class="say">' + esc(sayLine) + '</div><div class="code">' + esc(o.status === "pending_payment" && o.method !== "jpy_cash" ? "······" : code) + "</div></div>" +
      '<div class="ticket-foot">' + acts.join("") + when + "</div></article>";
  }

  async function loadOrders() {
    var box = $("tickets");
    if (!canAuth()) { box.innerHTML = '<div class="empty"><strong>Emuにログインしてから開いてください</strong></div>'; return; }
    box.innerHTML = '<div class="busy">読み込んでいます…</div>';
    try {
      state.orders = (await api("/orders")).orders || [];
      var live = state.orders.filter(function (o) { return ["paid", "pending_payment"].indexOf(o.status) >= 0; });
      var rest = state.orders.filter(function (o) { return ["paid", "pending_payment"].indexOf(o.status) < 0; });
      var count = state.orders.filter(function (o) { return o.status === "paid"; }).length;
      $("ticketCount").textContent = String(count); $("ticketCount").classList.toggle("hidden", !count);
      if (!state.orders.length) { box.innerHTML = '<div class="empty"><strong>引換券はまだありません</strong>商品を手に入れると、ここに引換コードが出ます。</div>'; return; }
      box.innerHTML = live.map(ticketHtml).join("") +
        (rest.length ? '<ul class="past">' + rest.map(function (o) {
          var st = STATE_LABEL[o.status] || ["closed", o.status];
          return "<li><span>" + esc(o.productName) + "</span><span>" + st[1] + (o.pickupCode ? "（" + esc(o.pickupCode) + "）" : "") + "</span></li>";
        }).join("") + "</ul>" : "");
      box.querySelectorAll("[data-act]").forEach(function (b) { b.addEventListener("click", function () { ticketAction(b); }); });
    } catch (e) { box.innerHTML = '<div class="empty"><strong>' + esc(say(e.message)) + "</strong></div>"; }
  }

  async function ticketAction(b) {
    var act = b.dataset.act, id = b.dataset.id;
    try {
      if (act === "pay") { try { window.top.location.href = b.dataset.url; } catch (e) { location.href = b.dataset.url; } return; }
      b.disabled = true;
      if (act === "cancel") {
        if (!confirm("この注文を取り消しますか？")) { b.disabled = false; return; }
        await api("/orders/" + id + "/cancel", { method: "POST", body: {} });
        toast("取り消しました。");
      }
      if (act === "confirm") {
        var o = state.orders.find(function (x) { return x.id === id; }) || {};
        var body = {};
        if (o.method === "jpyc") {
          var saved = ""; try { saved = localStorage.getItem("mitemiru_tx_" + id) || ""; } catch (e) {}
          var h = saved || prompt("JPYCを送ったときのトランザクションハッシュ（0x…）を貼ってください");
          if (!h) { b.disabled = false; return; }
          body.txHash = h.trim();
        }
        await api("/orders/" + id + "/confirm", { method: "POST", body: body });
        toast("支払いを確かめました。引換コードが出ています。");
      }
    } catch (e) { toast(say(e.message)); }
    loadOrders(); loadProducts();
  }

  /* ───── 運営 ───── */
  var METHOD_NAME = { emuer_ledger: "EMUER（未変換）", emuer_chain: "EMUER（ウォレット）", jpyc: "JPYC", jpy_card: "カード", jpy_cash: "現金" };
  function adminRow(o) {
    var st = STATE_LABEL[o.status] || ["closed", o.status];
    var acts = [];
    if (o.status === "pending_payment" && o.method === "jpy_cash") acts.push('<button class="small-btn primary" data-a="cash" data-id="' + o.id + '">現金を受け取って渡した</button>');
    if (o.status === "paid") acts.push('<button class="small-btn primary" data-a="fulfill" data-id="' + o.id + '">渡した</button>');
    if (o.status === "fulfilled" && o.method === "emuer_chain") acts.push('<button class="small-btn" data-a="chainDone" data-id="' + o.id + '" data-chain="' + esc(o.chainOrderId) + '">鎖の上でも渡し済みにする</button>');
    if (o.status === "paid" || o.status === "fulfilled") acts.push('<button class="small-btn danger" data-a="refund" data-id="' + o.id + '" data-m="' + o.method + '" data-chain="' + esc(o.chainOrderId || "") + '">返金</button>');
    return '<div class="orow"><div class="top-line"><span class="ocode">' + esc(o.pickupCode) + '</span><span class="state ' + st[0] + '">' + st[1] + "</span></div>" +
      "<div>" + esc(o.productName) + "／" + METHOD_NAME[o.method] + " " + amountText(o.currency, o.amount) + "</div>" +
      '<div class="meta">' + new Date(o.createdAt).toLocaleString("ja-JP") + (o.lateAfterExpiry ? "／取り置きの期限後に支払い" : "") + "</div>" +
      '<div class="acts">' + acts.join("") + "</div></div>";
  }
  function bindAdminActs(root, after) {
    root.querySelectorAll("[data-a]").forEach(function (b) {
      b.addEventListener("click", async function () {
        var id = b.dataset.id, a = b.dataset.a;
        b.disabled = true;
        try {
          if (a === "cash") await api("/admin/orders/" + id + "/cash-paid", { method: "POST", body: { fulfill: true } });
          if (a === "fulfill") await api("/admin/orders/" + id + "/fulfill", { method: "POST", body: {} });
          if (a === "chainDone") {
            var s = await walletSigner(null);
            await (await new ethers.Contract("0x9c102cC3016C70767082b60196565878D9314864", EMUER_ABI, s).markExchangeFulfilled(b.dataset.chain)).wait(1);
          }
          if (a === "refund") {
            if (!confirm("全額を返金します。よろしいですか？")) { b.disabled = false; return; }
            var body = { note: prompt("返金の理由（運営用のメモ）") || "" };
            if (b.dataset.m === "emuer_chain") {
              var s2 = await walletSigner(null);
              await (await new ethers.Contract("0x9c102cC3016C70767082b60196565878D9314864", EMUER_ABI, s2).refundExchange(b.dataset.chain)).wait(1);
            }
            if (b.dataset.m === "jpyc") {
              body.txHash = (prompt("購入者へJPYCを送り返したトランザクションハッシュ（0x…）") || "").trim();
              if (!body.txHash) { b.disabled = false; return; }
            }
            if (b.dataset.m === "jpy_cash" && !confirm("現金は手渡しで返してください。返したことを記録しますか？")) { b.disabled = false; return; }
            await api("/admin/orders/" + id + "/refund", { method: "POST", body: body });
          }
          toast({ cash: "受け取って渡したと記録しました。", fulfill: "渡したと記録しました。", chainDone: "鎖の上でも渡し済みにしました。", refund: "返金しました。" }[a]);
        } catch (e) { toast(say(e.message)); }
        after();
      });
    });
  }

  $("lookupForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var code = $("lookupCode").value.trim().toUpperCase();
    if (!code) return;
    var box = $("lookupResult");
    box.innerHTML = '<div class="busy">探しています…</div>';
    try {
      var v = await api("/admin/orders?code=" + encodeURIComponent(code));
      if (!v.orders.length) { box.innerHTML = '<div class="busy">「' + esc(code) + "」の注文は見つかりません。</div>"; return; }
      box.innerHTML = v.orders.map(adminRow).join("");
      bindAdminActs(box, function () { $("lookupForm").dispatchEvent(new Event("submit")); loadAdminOrders(); });
    } catch (err) { box.innerHTML = '<div class="busy">' + esc(say(err.message)) + "</div>"; }
  });

  $("orderFilter").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.adminStatus = b.dataset.status;
      $("orderFilter").querySelectorAll("button").forEach(function (x) { x.classList.toggle("primary", x === b); });
      loadAdminOrders();
    });
  });
  async function loadAdminOrders() {
    var box = $("adminOrders");
    box.innerHTML = '<div class="busy">読み込んでいます…</div>';
    try {
      var v = await api("/admin/orders" + (state.adminStatus ? "?status=" + state.adminStatus : ""));
      box.innerHTML = v.orders.length ? v.orders.map(adminRow).join("") : '<div class="busy">該当する注文はありません。</div>';
      bindAdminActs(box, loadAdminOrders);
    } catch (e) { box.innerHTML = '<div class="busy">' + esc(say(e.message)) + "</div>"; }
  }

  async function loadAdminProducts() {
    var box = $("adminProducts");
    try {
      var v = await api("/admin/products");
      state.adminProducts = v.products;
      var notes = [];
      if (!v.cardReady) notes.push("カード払いは使えません（サーバーにStripeの鍵がありません）。");
      if (!v.emuerActive) notes.push("EMUERの支払いはいま止まっています。");
      notes.push("JPYCの受取先：" + v.jpycReceiver);
      $("pf-note").textContent = notes.join(" ");
      var label = { draft: "下書き", live: "販売中", ended: "終了" };
      box.innerHTML = v.products.length ? v.products.map(function (p) {
        var price = [p.prices.EMUER !== null ? p.prices.EMUER + " EMUER" : "", p.prices.JPYC !== null ? p.prices.JPYC + " JPYC" : "", p.prices.JPY !== null ? yen(p.prices.JPY) + "円" : ""].filter(Boolean).join("／");
        var stock = p.stock === null ? "在庫の制限なし" : "在庫 " + p.stock + "（売れた " + (p.sold || 0) + "・取り置き " + (p.reserved || 0) + "）";
        return '<div class="prow"><div><b>' + esc(p.name) + "</b><div class=\"meta\">" + esc(price) + "／" + stock + (p.oversold ? "／在庫を超えて売れています" : "") + "</div></div>" +
          '<div><span class="state ' + (p.status === "live" ? "paid" : "closed") + '">' + label[p.status] + '</span> <button class="small-btn" data-edit="' + p.id + '">直す</button></div></div>';
      }).join("") : '<div class="busy">まだ商品はありません。下から出せます。</div>';
      box.querySelectorAll("[data-edit]").forEach(function (b) { b.addEventListener("click", function () { editProduct(b.dataset.edit); }); });
    } catch (e) { box.innerHTML = '<div class="busy">' + esc(say(e.message)) + "</div>"; }
  }

  function editProduct(id) {
    var p = state.adminProducts.find(function (x) { return x.id === id; });
    if (!p) return;
    $("pf-id").value = p.id; $("pf-name").value = p.name; $("pf-desc").value = p.description || ""; $("pf-image").value = p.imageUrl || "";
    $("pf-emuer").value = p.prices.EMUER == null ? "" : p.prices.EMUER; $("pf-jpyc").value = p.prices.JPYC == null ? "" : p.prices.JPYC;
    $("pf-jpy").value = p.prices.JPY == null ? "" : p.prices.JPY; $("pf-cash").checked = !!p.cashAtVenue;
    $("pf-stock").value = p.stock == null ? "" : p.stock; $("pf-fulfill").value = p.fulfillment; $("pf-cancel").value = p.cancelPolicy;
    $("pf-status").value = p.status; $("formTitle").textContent = "商品を直す"; $("pf-save").textContent = "変更を保存";
    $("pf-reset").classList.remove("hidden");
    $("productForm").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function resetForm() {
    $("productForm").reset(); $("pf-id").value = ""; $("formTitle").textContent = "商品を出す";
    $("pf-save").textContent = "商品を出す"; $("pf-reset").classList.add("hidden");
  }
  $("pf-reset").addEventListener("click", resetForm);
  $("productForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var num = function (id) { var v = $(id).value.trim(); return v === "" ? null : Number(v); };
    var body = {
      name: $("pf-name").value, description: $("pf-desc").value, imageUrl: $("pf-image").value.trim(),
      prices: { EMUER: num("pf-emuer"), JPYC: num("pf-jpyc"), JPY: num("pf-jpy") },
      cashAtVenue: $("pf-cash").checked, stock: num("pf-stock"),
      fulfillment: $("pf-fulfill").value, cancelPolicy: $("pf-cancel").value, status: $("pf-status").value
    };
    var id = $("pf-id").value;
    var errs = { NAME_REQUIRED: "名前を入れてください。", FULFILLMENT_REQUIRED: "受け取り方を入れてください。", CANCEL_POLICY_REQUIRED: "取消・返金の条件を入れてください。",
      PRICE_REQUIRED: "EMUER・JPYC・円のどれか1つ以上に価格を入れてください。", INVALID_PRICE: "価格は1以上の整数にしてください。",
      CASH_NEEDS_JPY_PRICE: "会場で現金を受け取るなら、円の価格を入れてください。", INVALID_STOCK: "在庫は、売れた数と取り置きの数より少なくできません。",
      INVALID_IMAGE_URL: "画像のURLは https:// で始まるものにしてください。" };
    try {
      await api(id ? "/admin/products/" + id : "/admin/products", { method: id ? "PUT" : "POST", body: body });
      toast(id ? "変更を保存しました。" : "商品を出しました。");
      resetForm(); loadAdminProducts(); loadProducts();
    } catch (err) { toast(errs[err.message] || say(err.message)); }
  });

  /* ───── はじめ ───── */
  (async function start() {
    await Promise.all([loadProducts(), loadMe()]);
    if (/orders/.test(location.hash)) show("orders");
    else if (canAuth()) loadOrders();   // 引換券の数をタブに出すため
  })();
})();
</script>
</body>
</html>
