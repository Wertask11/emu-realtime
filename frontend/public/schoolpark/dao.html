function tamaAgo(ms) {
  const d = Math.max(0, Date.now() - Number(ms || 0)) / 1000;
  if (d < 60) return 'いま';
  if (d < 3600) return Math.floor(d / 60) + '分前';
  if (d < 86400) return Math.floor(d / 3600) + '時間前';
  const t = new Date(Number(ms));
  return (t.getMonth() + 1) + '/' + t.getDate();
}

  /* ───── たまり場（サーバーは backend/tamariba.js） ───── */
  async tamaFetch(path, body){
    const P = window.parent;
    const headers = Object.assign({ 'Content-Type': 'application/json' }, await P.emuAuthHeaders());
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(TAMA_API + path, { method: body ? 'POST' : 'GET', headers, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { const e = new Error(j.error || 'TAMARIBA_UNAVAILABLE'); e.code = j.error || 'TAMARIBA_UNAVAILABLE'; throw e; }
      return j;
    } finally { clearTimeout(timer); }
  }
  tamaMsg(e){ return TAMA_ERRORS[e && e.code] || 'たまり場に届きませんでした。少し時間をおいて、もう一度どうぞ。'; }

      const [j, b] = await Promise.all([this.tamaFetch('/rooms'), this.tamaFetch('/blocks').catch(() => ({ keys: [] }))]);
      const cur = (this.state.tama || {}).room;
      this.tamaSet({ loading: false, rooms: j.rooms || [], me: j.me || {}, blocked: b.keys || [] });
      this.tamaOpen(cur || ((j.rooms || [])[0] || {}).id);
    } catch (e) { this.tamaSet({ loading: false, error: this.tamaMsg(e) }); }
  }
  async tamaOpen(room, before){
    if (!room) return;
    this.tamaSet(before ? { postsLoading: true } : { room, posts: [], next: null, postsLoading: true, openReplies: {}, replies: {}, menu: '', notice: '' });
    try {
      const j = await this.tamaFetch('/rooms/' + encodeURIComponent(room) + '/posts' + (before ? '?before=' + Number(before) : ''));
      if ((this.state.tama || {}).room !== room) return;
      const prev = before ? ((this.state.tama || {}).posts || []) : [];
      this.tamaSet({ posts: prev.concat(j.posts || []), next: j.next || null, postsLoading: false });
    } catch (e) { this.tamaSet({ postsLoading: false, notice: this.tamaMsg(e) }); }

  async tamaPost(){

    if (!body) { this.tamaSet({ notice: TAMA_ERRORS.BODY_REQUIRED }); return; }
    this.tamaSet({ sending: true, notice: '' });
    try {
      await this.tamaFetch('/rooms/' + encodeURIComponent(t.room) + '/posts', { body });
      this._tamaDraft = '';
      this.tamaSet({ sending: false });
      await this.tamaOpen(t.room);
      this.tamaRoomsCountOnly();
    } catch (e) { this.tamaSet({ sending: false, notice: this.tamaMsg(e) }); }
  }

    if (open[pid]) { delete open[pid]; this.tamaSet({ openReplies: open }); return; }
    open[pid] = true;

  async tamaReply(pid){
    const t = this.state.tama || {};

    if (!body) { this.tamaSet({ notice: TAMA_ERRORS.BODY_REQUIRED }); return; }
    if (this._tamaReplying) return;

      const j = await this.tamaFetch('/rooms/' + encodeURIComponent(t.room) + '/posts/' + pid + '/replies');
      this.setState(st => ({ tama: Object.assign({}, st.tama, {
        replies: (this._tamaReplyDraft && (this._tamaReplyDraft[pid] = ''), Object.assign({}, st.tama.replies || {}, { [pid]: j.replies || [] })),
        posts: (st.tama.posts || []).map(p => p.id === pid ? Object.assign({}, p, { replyCount: (j.replies || []).length }) : p),

  workVals(s, cg, def){

      const lines = String(q.intro || '').split(/\n/);
      const head = lines[0] || '', bar = head.indexOf('｜'), slash = head.indexOf('／');
      const job = (bar > 0 ? head.slice(0, bar) : '').trim();
      const partner = (slash > 0 ? head.slice(slash + 1) : '').replace(/（.*$/, '').trim();
      const days = ((lines[1] || '').match(/^\s*(\d+日)/) || [])[1] || '';
      const br = String(q.title || '').match(/^#\d{3}-(\d+)/);
      const live = (q.status === 'OPEN' || q.status === 'RUNNING');
      const mark = q.iTook && q.iDone ? 'done' : q.iTook ? 'took' : live ? '' : 'closed';

        markLabel: { done: '✓ 完走', took: '✓ 受けている', closed: '受付終了', '': '' }[mark], empty: 'false', open: open(q.id) };
    });

    const pass = it => (wf.stage === 'all' || it.stage === wf.stage)
      && (wf.job === 'all' || it.job === wf.job)
      && (wf.state === 'all' || (wf.state === 'open' && it.live) || (wf.state === 'mine' && (it.mark === 'took' || it.mark === 'done')));
    const practice = items.filter(isPractice), real = items.filter(it => !isPractice(it));

    const shownExps = s.entryOnly ? statusExps.filter(e => e.stage === '入門') : statusExps;
    const qTab = ['find','mine','done'].includes(s.qTab) ? s.qTab : 'find';
    const kind = k => k==='つまずいた' ? ['#F0DCD2','#A85A33'] : k==='気づいた' ? ['#0F5C3F','#F4F1EA'] : ['#E7E2D6','#3B382F'];
    const logs = LOGS.map(l => { const c = kind(l.kind); return {...l, kindBg:c[0], kindFg:c[1]}; });

    /* ───── 自分の宿題 ───── */

    /* 締切まであと何日か。きょうの日付は親からもらう（端末の時計で作っている）。 */
    const today = s.today || '';
    const daysTo = (due) => {
      if (!due || !today) return null;
      const a = new Date(today + 'T00:00:00'), b = new Date(due + 'T00:00:00');
      if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
      return Math.round((b - a) / 86400000);
    };
    const dueText = (due) => {
      if (!due) return '締切なし';
      const when = Number(due.slice(5,7)) + '/' + Number(due.slice(8,10));
      const n = daysTo(due);
      if (n === null) return when;
      if (n < 0)  return when + '・' + (-n) + '日すぎている';
      if (n === 0) return when + '・きょうまで';
      if (n === 1) return when + '・あした';
      return when + '・あと' + n + '日';
    };

    const brandOf = (id) => TASK_BRANDS.find(b => b[0] === id) || TASK_BRANDS[3];
    const shapeTask = (t) => {
      const b = brandOf(t.brand);
      const n = daysTo(t.due);
      const late  = !t.done && t.due && n !== null && n < 0;
      const soon  = !t.done && t.due && n !== null && n === 0;
      return {...t,
        brandLabel:b[1], brandColor:b[2],
        dueLabel:dueText(t.due),
        dueColor: late ? '#A32020' : soon ? '#C2703D' : '#6E695C',
        meta: b[1] + '・' + dueText(t.due),
        label: t.title,
        mark: t.done ? '✓' : '',
        markBg: t.done ? '#f08300' : 'transparent',
        markFg: t.done ? '#F4F1EA' : '#b85f00',
        titleColor: t.done ? '#9A9484' : '#141310',
        titleLine: t.done ? 'line-through' : 'none',
        hasNote: !!t.note, hasQuest: !!t.questTitle,
        questLabel: t.questTitle ? ('クエスト：' + t.questTitle) : '',
        toggle: () => { try { window.parent.spTaskToggle(this, t.id, !t.done); } catch (e) {} },
        remove: () => { try { window.parent.spTaskDelete(this, t.id, t.title); } catch (e) {} }
      };
    };

    /* 締切のあるものが先。日付の早い順。締切なしは後ろで、書いた順。 */
    const byDue = (a, b) => {
      const ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
      if (ad !== bd) return ad < bd ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    };
    const allTasks = s.tasks || [];
    const openTasks = allTasks.filter(t => !t.done).sort(byDue).map(shapeTask);
    /* 受けているクエストも、宿題として並べる（自分で書かなくても出る）。
       どこにあったか探さなくていいように、押すとそのクエストの詳細が開く。
       次にやることは、まだ出していない報告（完走までの手順）から決める。
       #000（原点）は受けるものではないので出さない。 */
    /* 完走した（運営が認めた）クエストは宿題から外し、「終わったこと」に移す。 */
    const doneQuests = (s.quests || []).filter(q => q.iTook && q.iDone && !q.isFounder)
      .sort((a, b) => (b.iDoneAt || 0) - (a.iDoneAt || 0))
      .map(q => { const r = Math.max(1, Number(q.myRounds) || 0);
        return { title: q.fullTitle || q.title || '', doneLabel: '✓ 完走した' + (r > 1 ? '（' + r + '周）' : ''), open: this.openExp(q.id) }; });
    const myQuests = (s.quests || []).filter(q => q.iTook && !q.iDone && !q.isFounder).map(q => {
      const steps = (q.reportSteps || []).slice(0, 3);
      const next = steps.find(st => !st.mark);
      return {
        title: q.fullTitle || q.title || '',
        next: next ? ('次：' + next.head + ' を出す')
          : q.iWisdom ? '次：運営の確認を待つ（報告3つと知恵カードはそろっています）'
          : '次：知恵カードを置く（報告は3つそろっています）',
        meta: (q.due && q.due !== '締切なし') ? ('締切 ' + q.due) : '',
        metaShow: (q.due && q.due !== '締切なし') ? 'block' : 'none',
        open: this.openExp(q.id)
      };
    });
    const doneTasks = allTasks.filter(t => t.done)
      .sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 20).map(shapeTask);
    const lateCount  = openTasks.filter(t => t.due && daysTo(t.due) < 0).length;
    const todayCount = openTasks.filter(t => t.due && daysTo(t.due) === 0).length;
    /* 年末まで。「年末までに結果を出す」ための残り日数。 */
    const yearEnd = today ? daysTo(today.slice(0,4) + '-12-31') : null;

    const setDraft = (k, v) => { this.draft[k] = v; };
    const isMobile = s.device === 'mobile';

    return {
      L, word:W, wordShort:'経験', scrollRef:this.scroller, bottomRef:this.bottomRef,

      toggleFounderSummary:() => { this.founderExpanded = !this.founderExpanded; this.setState({}); },
      showLibraryToggle:isMobile,

      toggleLibrarySummary:() => { this.libraryExpanded = !this.libraryExpanded; this.setState({}); },
      me:s.me,
      openMenu:() => { try { window.parent.openSpMobileMenu(); } catch (e) {} },
      canGuild:s.canGuild, trust:s.trust,
      /* ギルド。中身は枠の外（親）が記録から作って渡す */
      guilds:s.guilds || [], guildCount:s.guildCount || '',
      guildUnsorted:s.guildUnsorted || {label:'', open:function(){}},
      hasUnsorted:!!s.hasUnsorted, curGuild:s.curGuild || {}, ...this.guildSimpleVals(s),
      entryOnly:!!s.entryOnly, toggleEntryOnly:()=>this.setQuestFilter({entryOnly:!s.entryOnly}), noShownQuests:exps.length>0 && shownExps.length===0, resetQuestFilters:()=>this.setQuestFilter({entryOnly:false,filter:'すべて',qPick:'all',series:'general'}),
      noQuests:exps.length === 0,

      head: {kicker: (heads[s.screen] || heads.experiments)[0], title: (heads[s.screen] || heads.experiments)[1]},
      headScreen: String(s.screen || ''),

      showFounder:!!founder && s.screen==='experiments',

      isYearGoals:s.screen==='yeargoals',
      yearDoc:s.yearDoc || {},
      openYearGoals:() => { this.setState({screen:'yeargoals'}); this.toTop(); },
      founder:founder || {}, founderSections:(founder && Array.isArray(founder.founderSections)) ? founder.founderSections : [],
      /* SchoolPark論文のすぐ下に EMUER論文を置くため、節を2つに分けて出す（11/6）。 */
      founderLead:((founder && Array.isArray(founder.founderSections)) ? founder.founderSections : []).filter(x => x && x.title === 'SchoolPark論文'),
      founderRest:((founder && Array.isArray(founder.founderSections)) ? founder.founderSections : []).filter(x => !(x && x.title === 'SchoolPark論文')),
      isLogs:s.screen==='logs', isGuild:s.screen==='guild', isLibrary:s.screen==='library',
      /* ギルドの決まり（11/18）。「詳細」を押したときだけ出す。ほかの画面へ移ったら閉じたことにする */
      guildRulesOpen:!!s.guildRulesOpen && s.screen==='logs',
      /* ギルドホールの扉（11/18）。決まった5つは扉に、それ以外（あとから増えたギルド）は今までのカードで出す */
      guildDoors:(s.guilds || []).filter(g => GH_KEYS.includes(g.id)).map(g => {
        const k = g.id, at = GH_KEYS.indexOf(k);
        /* ?v= は絵の版。絵を差し替えたら上げる（名前が同じなので、上げないと前の絵がブラウザに残る。11/19） */
        return {...g, glow:'guild-hall/' + k + '-glow.webp' + GH_V, left:'guild-hall/' + k + '-door-left.webp' + GH_V, right:'guild-hall/' + k + '-door-right.webp' + GH_V, frame:'guild-hall/' + k + '-frame.webp' + GH_V,
          pos:'left:' + (GH_LEFTS[at] / 24) + '%', infoPos:'left:' + ((GH_LEFTS[at] + 200) / 24 - 7.5) + '%', isOpen: s.doorOpen === k ? '1' : '0', aria:(g.short || '') + ' ギルドに入る', tour: at === 0 ? 'guild-card' : '',
          enter:() => this.enterGuild(g)};
      }),
      guildsOther:(s.guilds || []).filter(g => !GH_KEYS.includes(g.id)),
      hasOtherGuilds:(s.guilds || []).some(g => !GH_KEYS.includes(g.id)),
      ghEntering: s.doorOpen ? '1' : '0',
      openGuildRules:() => this.setState({guildRulesOpen:true}),
      closeGuildRules:() => this.setState({guildRulesOpen:false}),
      isPropose:s.screen==='propose', isTasks:s.screen==='tasks',
      goTasks:this.go('tasks'), goPractice:() => { try { window.parent.showEmuPractice(); } catch (_) {} },
      goPropose:() => { try { window.parent.openSpQuestForm(this); } catch (e) { this.setState({screen:'propose'}); } }, goLibrary:this.go('library'), goExperiments:this.go('experiments'), goLogs:this.go('logs'),
      /* 知恵の数は、読んだ全部の枚数（親が wisdomTotal で渡す）。前は画面に出した50枚までしか数えていなかった */
      stats: {wisdomTotal:(typeof s.wisdomTotal === 'number' ? s.wisdomTotal : (s.wisdom || []).length), citations:s.citations || 0},
      myQuests, hasMyQuests: myQuests.length > 0,
      noHomework: openTasks.length === 0 && myQuests.length === 0,
      openTasks, doneTasks,
      noOpenTasks: openTasks.length === 0,
      noDoneTasks: doneTasks.length === 0 && doneQuests.length === 0,
      doneQuests,
      taskHead: openTasks.length === 0
        ? (myQuests.length ? ('受けているクエストが' + myQuests.length + '本ある。') : '宿題は残っていない。')
        : ('残っている宿題は、' + openTasks.length + '個。'),
      taskLine: (lateCount ? ('すぎているものが' + lateCount + '個。') : 'すぎているものはない。')
        + (todayCount ? ('きょうまでが' + todayCount + '個。') : '')
        + (yearEnd === null ? '' : ('　年末まで、あと' + yearEnd + '日。')),
      taskStats: [
        ['残っている', String(openTasks.length)],
        ['きょうまで', String(todayCount)],
        ['すぎている', String(lateCount)],
        ['年末まで', yearEnd === null ? '—' : (yearEnd + '日')]
      ].map(([label, value]) => ({label, value})),
      draft: this.draft,
      onTaskTitle: (ev) => setDraft('title', ev.target.value),
      onTaskNote:  (ev) => setDraft('note',  ev.target.value),
      onTaskDue:   (ev) => setDraft('due',   ev.target.value),
      taskBrands: TASK_BRANDS.map(([id, label, color]) => ({
        label, go: () => { this.draft.brand = id; this.setState({}); },
        bg: this.draft.brand === id ? color : 'transparent',
        fg: this.draft.brand === id ? '#F4F1EA' : color,
        border: color })),
      /* つなぐ先は、まだ終わっていないクエストだけ */
      taskQuests: [{id:'', title:'どれにもつながない'}]
        .concat(exps.filter(e => e.status !== 'CLOSED').map(e => ({id:e.id, title:e.fullTitle || e.title})))
        .map(q => ({ label: q.title,
          go: () => { this.draft.questId = q.id; this.draft.questTitle = q.id ? q.title : ''; this.setState({}); },
          bg: this.draft.questId === q.id ? SEL_DARK : 'transparent',
          fg: this.draft.questId === q.id ? '#F4F1EA' : '#3B382F',
          border: this.draft.questId === q.id ? '#141310' : 'rgba(20,19,16,.16)' })),
      addTask: async () => {
        let ok = false;
        try { ok = await window.parent.spTaskAdd(this, this.draft); } catch (e) {}
        if (!ok) return;
        /* 続けて書けるように、どの仕事かだけは残す */
        this.draft = { title:'', note:'', brand:this.draft.brand, questId:'', questTitle:'', due:'' };
        this.setState({});
      },
      filters, qhPicks, shownExps, cur,
      /* クエストの拠点（11/19）：タブ・ギルドへの入口・パスポート */
      qhTabs: [['find', '挑戦を探す', exps.filter(e => e.status === 'OPEN' || e.status === 'RUNNING').length],
        ['mine', '自分の挑戦', myQuests.length], ['done', '完走した実績', doneQuests.length]]
        .map(([id, label, n]) => ({ label, n: String(n), on: qTab === id ? 'true' : 'false', go: () => this.setState({ qTab: id }) })),
      qhFind: qTab === 'find', qhMine: qTab === 'mine', qhDone: qTab === 'done',
      qhGoFind: () => this.setState({ qTab: 'find' }),
      noMyQuests: myQuests.length === 0, noDoneQuests: doneQuests.length === 0, hasDoneQuests: doneQuests.length > 0,
      qhPassport: () => { try { window.parent.openSpPassport(); } catch (e) {} },
      qhGuilds: GH_KEYS.map(k => {
        const g = (s.guilds || []).find(x => x.id === k);
        const short = (g && g.short) || k.toUpperCase();
        return { short, color: QH_GUILD_COLORS[k], aria: short + ' ギルドに入る',
          /* 11/20 オーナー：ギルドは扉から入る。ギルドホールを開き、少し見せてから、そのギルドの扉を開けて入る（動きを減らす設定ではすぐ入る） */
          go: () => { this.setState({ screen: 'logs' }); this.toTop();
            if (g && typeof g.open === 'function') setTimeout(() => { if (this.state.screen === 'logs') this.enterGuild(g); }, 450); } };
      }),
      questsDenied:!!s.questsDenied, questsNote:s.questsNote || '',
      curLogs: cur.logs || [],
      logs, ...this.wisdomVals(s),
      /* 棚はギルドと揃える。色は guild-store.js の accent と同じ。 */
      /* 棚はギルドと揃える。11/19 オーナー：文字はギルドそれぞれの色（絵本の色。emu-ehon.css の --ehon-learn など）。
         選んだ札は、その色の地にクリームの字。色は CSS（.sp-wtag）で付ける */
      tags: WISDOM_TAGS.map(x => ({
        label:x.t, c:x.c, on: s.wtag===x.t ? 'true' : 'false', go:()=>this.setState({wtag:x.t, wlimit:30})})),
      steps: STEPS.map((st,i) => ({num:'0'+(i+1), label:st.label, hint:st.hint, go:()=>this.setState({step:i}),
        bg: s.step===i ? '#E7E2D6' : 'transparent',
        fg: s.step===i ? '#141310' : '#6E695C',
        numFg: s.step===i ? '#b85f00' : '#9A9484'})),
      step: STEPS[s.step], stepNum: s.step+1,
      nextLabel: s.step===3 ? '公開してコミットを募る' : '次へ',
      nextStep: () => this.setState(p => ({step: Math.min(3, p.step+1)})),
      prevStep: () => this.setState(p => ({step: Math.max(0, p.step-1)}))
    };
  }
}

/* ───── テンプレートを解釈して画面に出す仕組み ─────

   元は React が担っていた部分。使われている記法は3つだけだった。
     {{ 参照 }}                     … 値を差し込む（211か所、すべて単純な参照）
     <sc-for list="{{ 配列 }}" as="x"> … 繰り返す
     <sc-if value="{{ 真偽 }}">        … 出す・出さない
   ほかに onClick と ref。それだけを実装する。 */

/* 「a.b.c」をたどって値を取る */
function pick(scope, path) {
  var parts = String(path).trim().split('.');
  var v = scope;
  for (var i = 0; i < parts.length; i++) {
    if (v == null) return undefined;
    v = v[parts[i]];
  }
  return v;
}

var MUSTACHE = /\{\{([^}]+)\}\}/g;

/* 文字列の中の {{ }} を置き換える */
function fill(text, scope) {
  return text.replace(MUSTACHE, function (_, path) {
    var v = pick(scope, path);
    return (v === undefined || v === null) ? '' : String(v);
  });
}

/* 属性の値がまるごと1つの参照なら、値そのもの（関数など）を返す */
function whole(text, scope) {
  var m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(text);
  return m ? pick(scope, m[1]) : undefined;
}

function walk(node, scope, out) {
  for (var i = 0; i < node.childNodes.length; i++) {
    var n = node.childNodes[i];

    if (n.nodeType === 3) {                       // 文字
      out.appendChild(document.createTextNode(fill(n.nodeValue, scope)));
      continue;
    }
    if (n.nodeType !== 1) continue;

    var tag = n.tagName.toLowerCase();

    if (tag === 'sc-for') {
      var list = whole(n.getAttribute('list') || '', scope) || [];
      var as = n.getAttribute('as') || 'item';
      for (var j = 0; j < list.length; j++) {
        var child = Object.create(scope);
        child[as] = list[j];
        walk(n, child, out);
      }
      continue;
    }

    if (tag === 'sc-if') {
      if (whole(n.getAttribute('value') || '', scope)) walk(n, scope, out);
      continue;
    }

    var el = document.createElementNS(n.namespaceURI, tag);
    for (var a = 0; a < n.attributes.length; a++) {
      var at = n.attributes[a], name = at.name, val = at.value;

      if (name === 'ref') {                        // 要素を控えておく
        var box = whole(val, scope);
        if (box) box.current = el;
        continue;
      }
      /* onClick は、テンプレートを読み込んだ時点で onclick に小文字化される。
         大文字で判定すると空振りするので、大小を区別せずに見る。 */
      if (/^on[a-z]+$/i.test(name)) {
        var fn = whole(val, scope);
        if (typeof fn === 'function') {
          el.addEventListener(name.slice(2).toLowerCase(), fn);
          if (name.toLowerCase() === 'onclick' && /^(DIV|SPAN)$/.test(el.tagName)) {
            el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0');
          }
        }
        continue;
      }
      if (name.indexOf('hint-') === 0) continue;   // 編集画面用の目印。表示には要らない

      el.setAttribute(name, fill(val, scope));
    }
    walk(n, scope, el);
    out.appendChild(el);
  }
}

/* ───── 起動 ───── */
var app = new Component();
var host = document.getElementById('dao-root');
var tpl = document.getElementById('dao-template');
var queued = false;
/* Preserve City's DOM across the existing whole-frame redraws. Its module,
   styles and data are not requested until the user opens 08. */
var cityHost = null;
var cityModule = null;
function mountCity() {
  var slot = host.querySelector('[data-city-slot]');
  if (!slot) return;
  if (!cityHost) { cityHost = document.createElement('section'); cityHost.id = 'sp-city'; }
  slot.replaceWith(cityHost);
  if (!cityModule) cityModule = import('./city.js').catch(function (err) { cityModule = null; throw err; });
  cityModule.then(function (mod) { if (cityHost.isConnected) mod.mount(cityHost, app); }).catch(function () {
    cityHost.textContent = 'Cityを読み込めませんでした。';
    var retry = document.createElement('button');
    retry.type = 'button'; retry.textContent = 'もう一度読み込む';
    /* 描き直す（app.setState）だけでは直らない。一度失敗した import() は、
       ブラウザが同じページのあいだ失敗として覚えていて、取りに行き直さない。
       押しても何も起きないように見えていた。枠（この dao.html）を City の画面のまま開き直す。 */
    retry.onclick = function () {
      var u = new URL(window.location.href);
      u.searchParams.set('screen', 'city');
      window.location.replace(u.toString());
    };
    cityHost.appendChild(retry);
  });
}

/* 開いている <details> を覚えておく。

   描き直しは画面をまるごと作り直すので、<details> は毎回「閉じた」状態で
   生まれ直す。親（index.html）は、タブに戻ったとき・画面に戻ったとき・
   5分ごとに中身を読み直し、そのたびに描き直す。現場の資料を開いて
   読んでいるあいだにそれが来ると、資料が勝手に閉じていた。

   data-keep-open に名前を付けた <details> だけ、開いていたものを開いたまま
   作り直す。名前にクエストの番号を入れておけば、別のクエストを開いたときに
   前の開き方が持ち越されることはない。 */
function keptOpen() {
  var open = {};
  host.querySelectorAll('details[data-keep-open]').forEach(function (d) {
    if (d.open) open[d.getAttribute('data-keep-open')] = true;
  });
  return open;
}
function reopen(frag, open) {
  frag.querySelectorAll('details[data-keep-open]').forEach(function (d) {
    if (open[d.getAttribute('data-keep-open')]) d.open = true;
  });
}
/* 上の見出しの高さ。右の列（ACCEPT）を、見出しのすぐ下で止めるのに使う。
   見出しは幅によって高さが変わるので、決め打ちせずに測る。 */
function syncHeadHeight() {
  var head = host.querySelector('[data-sp-head]');
  if (!head) return;
  /* 11/2 の画面統合から、見出しは止まらず一緒に流れる。そのときに見出しの高さぶん
     空けると、ACCEPT の上に約100pxの空きができていた（11/3 点検 8）。
     見出しが止まっている（sticky・fixed）ときだけ、その高さを空ける。 */
  var pos = getComputedStyle(head).position;
  host.style.setProperty('--sp-head-h', (pos === 'sticky' || pos === 'fixed') ? head.offsetHeight + 'px' : '0px');
}

function draw() {
  queued = false;
  const switchFocus = document.hasFocus() && document.activeElement?.matches('.service-switch,.sp-sidebar-switch')
    ? (document.activeElement.matches('.service-switch') ? '.service-switch' : '.sp-sidebar-switch') : null;
  /* replaceChildren はスクロール中の要素も破棄する。差し替え前の位置を
     覚え、新しい要素へ同じ描画処理内で戻す（描画後の rAF では一度上に跳ぶ）。 */
  var scrollTop = app.scroller.current ? app.scroller.current.scrollTop : 0;
  var pageY = window.scrollY;
  var open = keptOpen();
  var vals = app.renderVals();
  var frag = document.createDocumentFragment();
  walk(tpl.content, vals, frag);
  reopen(frag, open);
  host.replaceChildren(frag);
  if (switchFocus) host.querySelector(switchFocus)?.focus({preventScroll:true});
  syncHeadHeight();
  mountCity();
  if (app.scroller.current) app.scroller.current.scrollTop = scrollTop;
  if (window.scrollY !== pageY) window.scrollTo(0, pageY);
  /* タブを押して画面を描き直しても、利用者が横に動かした位置を保つ。
     先頭へ戻ると、タブと画面全体が勝手に動いたように見えるため。 */
  if (app.bottomRef.current) app.bottomRef.current.scrollLeft = app.tabScrollLeft || 0;
  app.tourRenderedDataReady = Object.assign({}, app.tourDataReady);
  app.tourRenderedScreen = app.state.screen;
  try { if (window.parent.ReizoTourSchoolParkRendered) window.parent.ReizoTourSchoolParkRendered(); } catch (e) {}
  /* 描き直すと右上のボタンは👤で作り直される。親（Emu）に、写真か名前を入れ直してもらう。
     親の見張り（MutationObserver）だけに頼ると、枠が読み直されたときなどに見張りが外れて
     👤のまま残ることがあった（10/30 スマホ）。 */
  try { if (window.parent !== window && window.parent.emuPaintHeaderIdentity) window.parent.emuPaintHeaderIdentity(); } catch (e) {}
}
/* まとめて1回だけ描き直す。
   requestAnimationFrame は、画面が描画されていない状態（背景タブなど）では
   進まないため使わない。押したのに変わらない、が起きる。 */
function schedule() {
  if (queued) return;
  queued = true;
  Promise.resolve().then(draw);
}

draw();
window.addEventListener('resize', syncHeadHeight);
if (app.componentDidMount) app.componentDidMount();
// Explorer links only open the existing read-only detail UI. Membership writes stay in existing explicit actions.
(() => {
  const p = new URLSearchParams(location.search), quest = p.get('explorerQuest'), guild = p.get('explorerGuild');
  if (quest && /^[A-Za-z0-9_-]{1,100}$/.test(quest)) { try { window.parent.spQuestOpen(app, quest); } catch (_) {} }
  else if (guild && /^[a-z0-9-]{1,40}$/.test(guild)) { try { window.parent.spGuildOpen(guild, app); } catch (_) {} }
})();

</script>
<script>
// Match click behaviour for all custom controls, including wisdom details/cite.
document.addEventListener('keydown', function(e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')
      && !/^(BUTTON|A)$/.test(e.target.tagName) && e.target.getAttribute('aria-disabled') !== 'true') {
    e.preventDefault(); if (!e.repeat) e.target.click();
  }
});
// Clicking elsewhere inside the SchoolPark frame dismisses the shared profile.
document.addEventListener('click', function(e) {
  if (!e.target.closest('.service-profile')) { try { window.parent.closeAccountMenu(); } catch (_) {} }
});
</script>
</body>
