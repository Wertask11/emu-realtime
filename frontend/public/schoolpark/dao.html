<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="stylesheet" href="/emu-theme.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolPark DAO</title>
<link rel="stylesheet" href="/service-header.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@700;900&family=Inter:wght@400;500;600;700&family=Kiwi+Maru:wght@500&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#faf8f5; }
  a { color:var(--emu-brand-strong); text-decoration:none; }
  a:hover { color:#b85f00; }
  ::-webkit-scrollbar { width:10px; height:10px }
  ::-webkit-scrollbar-thumb { background:rgba(20,19,16,.18); border-radius:8px }

.sp-section-header {padding:18px 24px;border-bottom:1px solid #e1dcd2;background:var(--emu-paper);}
.sp-section-header p {margin:0;color:var(--emu-brand-strong);font-size:11px;letter-spacing:.1em;}
.sp-section-header h2 {margin:4px 0 0;font-size:21px;}
/* 知恵ライブラリ・City（11/7）：上の見出し（WISDOM／CITY・画面名・EMUER・サービス）を出さず、空いた分を詰める。
   EMUER・サービスへは冷蔵庫くんから入る。ほかの画面（ギルド・クエスト・自分の宿題など）の見出しは今までどおり。 */
.sp-section-header[data-sp-screen="library"],
.sp-section-header[data-sp-screen="city"],
.sp-section-header[data-sp-screen="logs"],
.sp-section-header[data-sp-screen="experiments"],
.sp-section-header[data-sp-screen="tasks"],
/* 11/18 オーナー：ギルドの中の画面も、上の見出し（GUILD・ギルド名・EMUER・サービス）を出さない。名前は下の黒いカードに出ている */
.sp-section-header[data-sp-screen="guild"] {display:none;}
/* 11/19 オーナー：クエスト・クエストの詳細・年内目標などに残っていた上の見出し（QUEST・画面名・EMUER・サービス）も出さない。これで全部の画面で出さない。
   冷蔵庫くんの案内（screen-heading）は、それぞれの画面の中の札を指す */
.sp-section-header {display:none;}
/* 知恵ライブラリの棚の札（11/19）。文字はギルドそれぞれの色、選んだ札はその色の地。
   絵本の CSS（emu-ehon.css）の札の決まりより強くするため、親の data-tour から書く */
[data-tour="wisdom-tags"] .sp-wtag{appearance:none;margin:0;padding:8px 16px;border:2px solid var(--wt);border-radius:999px;background:#fffaf0;color:var(--wt);font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer;line-height:1.4;white-space:nowrap}
[data-tour="wisdom-tags"] .sp-wtag:hover{background:#fbf3df}
[data-tour="wisdom-tags"] .sp-wtag[aria-pressed="true"]{background:var(--wt)!important;color:#fffaf0!important}
[data-tour="wisdom-tags"] .sp-wtag:focus-visible{outline:3px solid var(--wt);outline-offset:2px}
/* ───── 知恵ライブラリ（11/20 オーナー）：検索・並べ替え・自分の知恵だけ・つながりの名前 ───── */
.sp-wl-tools{display:flex;flex-direction:column;gap:12px}
.sp-wl-search{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp-wl-input{flex:1 1 260px;min-width:0;box-sizing:border-box;min-height:44px;padding:10px 14px;border:2px solid #3a2a20;border-radius:12px;background:#fffaf0;color:#3a2a20;font:inherit;font-size:16px}
.sp-wl-search .sp-wl-go,.sp-wl-search .sp-wl-clear{appearance:none;min-height:44px;padding:8px 18px;border-radius:999px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.sp-wl-search .sp-wl-go{border:2px solid #3a2a20;background:#3a2a20;color:#fffaf0}
.sp-wl-search .sp-wl-clear{border:2px solid #b85f00;background:#fffaf0;color:#b85f00}
.sp-wl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp-wl-row .sp-wl-chip{appearance:none;margin:0;padding:8px 16px;min-height:40px;border:2px solid #3a2a20;border-radius:999px;background:#fffaf0;color:#3a2a20;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.sp-wl-row .sp-wl-chip[aria-pressed="true"]{background:#3a2a20!important;color:#fffaf0!important}
.sp-wl-count{font-size:13px;color:#6E695C;margin-left:auto}
.sp-wl-chain{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:12px;line-height:1.75;color:#6E695C}
.sp-wl-k{color:#9A9484;white-space:nowrap}
.sp-wl-v{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sp-wl-quest{appearance:none;border:0;background:none;padding:0;font:inherit;font-size:12px;color:#b85f00;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
@media(max-width:700px){.sp-wl-count{margin-left:0;width:100%}}
/* ───── クエストの拠点（11/19 オーナー）：挑戦を探す・自分の挑戦・完走した実績。ギルドへの入口もここに ───── */
.sp-qh{display:flex;flex-direction:column;gap:22px;min-width:0}
.sp-qh-origin{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sp-qh .sp-qh-origin button{appearance:none;font:inherit;font-size:13px;font-weight:700;min-height:40px;padding:8px 16px;border-radius:999px;cursor:pointer}
.sp-qh-guilds{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:12px;background:#fbf3df;border:2px solid #3a2a20}
.sp-qh-doors{display:flex;flex-wrap:nowrap;gap:8px;width:100%;min-width:0}
.sp-qh .sp-qh-door{flex:1 1 auto;min-width:0;padding-left:6px;padding-right:6px;text-align:center;white-space:nowrap}
.sp-qh-label{font-size:13px;font-weight:700;color:#3a2a20;margin-right:4px}
.sp-qh .sp-qh-chip{appearance:none;margin:0;padding:8px 16px;min-height:40px;border:2px solid var(--wt,#3a2a20);border-radius:999px;background:#fffaf0;color:var(--wt,#3a2a20);font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer;line-height:1.4;white-space:nowrap}
.sp-qh .sp-qh-chip:hover{background:#fbf3df}
.sp-qh .sp-qh-chip[aria-pressed="true"]{background:var(--wt,#3a2a20)!important;color:#fffaf0!important}
.sp-qh .sp-qh-chip:focus-visible,.sp-qh .sp-qh-tab:focus-visible{outline:3px solid #b85f00;outline-offset:2px}
.sp-qh .sp-qh-hall{appearance:none;border:0;background:none;color:#b85f00;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:40px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.sp-qh-tabs{display:flex;gap:6px;border-bottom:2px solid #3a2a20;overflow-x:auto;scrollbar-width:none}
.sp-qh .sp-qh-tab{appearance:none;flex:0 0 auto;border:2px solid transparent;border-bottom:0;border-radius:12px 12px 0 0;background:transparent;color:#6e5a48;font:inherit;font-size:15px;font-weight:700;padding:10px 18px;min-height:46px;cursor:pointer;margin-bottom:-2px}
.sp-qh .sp-qh-tab[aria-selected="true"]{background:#fffaf0;color:#3a2a20;border-color:#3a2a20}
.sp-qh-n{display:inline-block;min-width:1.6em;margin-left:6px;padding:1px 7px;border-radius:999px;background:#e9dcc3;color:#3a2a20;font-size:12px;text-align:center}
.sp-qh-rows{display:flex;flex-direction:column;gap:10px}
.sp-qh-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp-qh-row-label{flex-basis:100%;font-size:12px;font-weight:700;color:#6e5a48}
.sp-qh-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:999px;border:1.5px solid var(--wt,#7a6a55);color:var(--wt,#7a6a55);background:#fffaf0}
.sp-qh-mine{display:flex;flex-direction:column;gap:14px}
.sp-qh-item{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#FBF9F3;border:1px solid rgba(20,19,16,.12);border-radius:12px;padding:18px 20px}
.sp-qh-item-main{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:6px}
.sp-qh-item-title{font-size:16px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.sp-qh-item-next{font-size:13px;line-height:1.8;color:#b85f00;font-weight:700}
.sp-qh-item-meta{font-size:12px;color:#6E695C}
.sp-qh-empty{background:#FBF9F3;border:1px dashed rgba(20,19,16,.3);border-radius:12px;padding:22px;font-size:14px;line-height:1.9;color:#3B382F;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
@media(max-width:700px){.sp-qh-row,.sp-qh-doors{gap:6px}.sp-qh .sp-qh-chip{padding:6px 10px;min-height:36px;font-size:12px;letter-spacing:0}.sp-qh .sp-qh-door{padding:6px 4px;font-size:11.5px}[data-tour="wisdom-tags"]{gap:6px!important}[data-tour="wisdom-tags"] .sp-wtag{padding:6px 10px;font-size:12px;letter-spacing:0}.sp-qh-tabs{gap:2px}.sp-qh .sp-qh-tab{font-size:13px;padding:9px 8px;letter-spacing:0}.sp-qh-n{margin-left:4px;padding:1px 5px;min-width:1.4em;font-size:11px}.sp-qh .sp-qh-hall{margin-left:0}.sp-qh-origin{margin-top:10px;gap:8px}}
/* ───── LEARN（11/19）：かんたんな形。見出しに「参加する」と「詳細」、その下に 学ぶ・やってみる・残す の3つ ───── */
.sp-gs-hero-acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.sp-gs-join{appearance:none;border:2px solid #b85f00;background:#fff8ee;color:#b85f00;border-radius:999px;padding:10px 22px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.sp-gs-join[aria-pressed="true"]{background:#b85f00;color:#fff}
.sp-gs-count{font-size:13px;color:#6E695C}
.sp-gs-more,.sp-gs-sub{appearance:none;border:1px solid rgba(20,19,16,.3);background:#fff;color:#3B382F;border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.sp-gs-sub{align-self:flex-start}
.sp-gs-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sp-gs-step{background:#FBF9F3;border:1px solid rgba(20,19,16,.12);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sp-gs-step-num{font-size:12px;font-weight:700;letter-spacing:.12em;color:#b85f00}
.sp-gs-step-title{font-size:20px;font-weight:700;line-height:1.4}
.sp-gs-step p{margin:0;font-size:14px;line-height:1.8;color:#3B382F;flex:1}
.sp-gs-step-links{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.sp-gs-link{appearance:none;border:1px solid #b85f00;background:#fff;color:#b85f00;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.sp-gs-link:hover{background:#fff4e6}
.sp-gs-closed summary{cursor:pointer;font-size:13px;color:#6E695C;padding:6px 2px}
@media (max-width:760px){.sp-gs-steps{grid-template-columns:minmax(0,1fr)}.sp-gs-step-title{font-size:18px}}
/* ───── WORK（11/19）：まずはこれから・絞り込み・本物の案件・練習案件（職種 × 段階の表） ───── */
.sp-wk-first{background:#FBF9F3;border:1px solid rgba(20,19,16,.12);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:8px}
.sp-wk-first-kicker{font-size:12px;font-weight:700;letter-spacing:.12em;color:#b85f00}
.sp-wk-first-title{font-size:22px;font-weight:700;line-height:1.45}
.sp-wk-first-meta{font-size:13px;color:#6E695C}
.sp-wk-first-tags{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.sp-wk-first-tags span{font-size:12px;padding:4px 10px;border-radius:999px;background:#fff4e6;color:#8a4a00}
.sp-wk-go{align-self:flex-start;appearance:none;border:0;background:#b85f00;color:#fff;border-radius:999px;padding:12px 22px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.sp-wk-filters{display:flex;flex-direction:column;gap:8px}
.sp-wk-frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sp-wk-frow>span{flex:0 0 40px;font-size:12px;color:#6E695C}
.sp-wk-chip{appearance:none;border:1px solid rgba(20,19,16,.2);background:#fff;color:#3B382F;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.sp-wk-chip[aria-pressed="true"]{background:#3b58a3;border-color:#3b58a3;color:#fff}
.sp-wk-sec{display:flex;flex-direction:column;gap:12px}
.sp-wk-sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sp-wk-sec-title{font-size:17px;font-weight:700}
.sp-wk-sec-sub{font-size:12px;color:#6E695C}
.sp-wk-empty{background:#FBF9F3;border:1px dashed rgba(20,19,16,.2);border-radius:12px;padding:16px 18px;font-size:14px;line-height:1.8;color:#6E695C}
.sp-wk-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#FBF9F3;border:1px solid rgba(20,19,16,.12);border-radius:12px;padding:16px 18px;cursor:pointer}
.sp-wk-row-main{flex:1;min-width:180px}.sp-wk-row-title{font-size:15px;font-weight:700;line-height:1.6}.sp-wk-row-meta{font-size:12px;color:#6E695C}
.sp-wk-row-side{display:flex;gap:10px;align-items:center;font-size:12px;color:#3B382F;flex-wrap:wrap}
.sp-wk-table{display:grid;grid-template-columns:minmax(120px,.8fr) repeat(var(--cols),minmax(0,1fr));gap:8px;align-items:stretch}
.sp-wk-th{font-size:12px;font-weight:700;color:#6E695C;padding:0 4px}
.sp-wk-job{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 4px}
.sp-wk-job b{font-size:14px}.sp-wk-job small{font-size:11px;color:#6E695C}
.sp-wk-cell{background:#fff;border:1px solid rgba(20,19,16,.14);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.sp-wk-cell:hover{border-color:#3b58a3}
.sp-wk-cell[data-empty="true"]{visibility:hidden;pointer-events:none}
.sp-wk-cell[data-mark="closed"]{opacity:.55}
.sp-wk-cell-stage{display:none;font-size:11px;font-weight:700;color:#3b58a3}
.sp-wk-cell-title{font-size:14px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.sp-wk-cell-meta{font-size:12px;color:#6E695C}
.sp-wk-mark{font-size:11px;font-weight:700;color:#3f7d4a}.sp-wk-mark:empty{display:none}
.sp-wk-mark[data-mark="closed"]{color:#8A8474}
.sp-gs-steps-flow .sp-gs-step-title{font-size:18px}
/* ───── PLAY・CONNECT・WEB3（11/19） ───── */
.sp-pl-grid,.sp-w3-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.sp-pl-card{background:#FBF9F3;border:1px solid rgba(20,19,16,.12);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sp-pl-badge{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:#fff4e6;color:#8a4a00}
.sp-pl-badge[data-kind="city"]{background:#e8eef9;color:#3b58a3}.sp-pl-badge[data-kind="genba"]{background:#e9f3e6;color:#3f7d4a}
.sp-pl-title{font-size:18px;font-weight:700;line-height:1.45}
.sp-pl-card p{margin:0;font-size:14px;line-height:1.8;color:#3B382F;flex:1}
.sp-pl-note{font-size:12px;color:#6E695C}.sp-pl-note:empty{display:none}
.sp-pl-card .sp-gs-link,.sp-pl-card .sp-wk-go{align-self:flex-start}
.sp-cn-crowd{font-size:14px;color:#3B382F}
.sp-cn-tama{display:flex;flex-direction:column;gap:12px}
.sp-cn-rooms{display:flex;flex-wrap:wrap;gap:6px}.sp-cn-rooms small{opacity:.7;margin-left:2px}
.sp-cn-hint{font-size:13px;color:#6E695C}
.sp-cn-write{display:flex;flex-direction:column;gap:6px}
.sp-cn-input{width:100%;min-height:76px;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid rgba(20,19,16,.2);font:inherit;font-size:16px;line-height:1.7;resize:vertical}
.sp-cn-write-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.sp-cn-write-foot small{font-size:12px;color:#6E695C}
.sp-cn-notice{font-size:13px;padding:8px 12px;border-radius:8px;background:#fff4e6;color:#8a4a00}
.sp-cn-post{background:#FBF9F3;border:1px solid rgba(20,19,16,.12);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sp-cn-head{display:flex;align-items:center;gap:8px;min-width:0}.sp-cn-head b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sp-cn-head small{font-size:12px;color:#6E695C;flex:1}
.sp-cn-avatar{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#E7E2D6;font-size:13px;font-weight:700}
.sp-cn-more{appearance:none;border:0;background:none;font:inherit;font-size:18px;line-height:1;padding:4px 8px;cursor:pointer;color:#6E695C}
.sp-cn-body{font-size:15px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.sp-cn-body[data-deleted="true"]{color:#8A8474;font-size:13px}
.sp-cn-flag{font-size:12px;color:#8a4a00}
.sp-cn-menu{display:flex;flex-wrap:wrap;gap:6px}.sp-cn-menu button{appearance:none;border:1px solid rgba(20,19,16,.2);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.sp-cn-replies-btn{align-self:flex-start;appearance:none;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:#b85f00;cursor:pointer;padding:2px 0}
.sp-cn-replies{display:flex;flex-direction:column;gap:8px;padding-left:14px;border-left:2px dashed rgba(20,19,16,.15)}
.sp-cn-reply{display:flex;flex-direction:column;gap:6px}
.sp-w3-needs{display:flex;flex-wrap:wrap;gap:6px}.sp-w3-needs span{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid rgba(20,19,16,.2);color:#3B382F}
.sp-w3-roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sp-w3-role{background:#FBF9F3;border:1px solid rgba(20,19,16,.12);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}.sp-w3-role b{font-size:14px}.sp-w3-role span{font-size:13px;line-height:1.7;color:#3B382F}
@media (max-width:760px){
  .sp-wk-table{grid-template-columns:minmax(0,1fr)}
  .sp-wk-th{display:none}
  .sp-wk-job{padding:12px 2px 0;border-top:1px dashed rgba(20,19,16,.2)}
  .sp-wk-cell[data-empty="true"]{display:none}
  .sp-wk-cell-stage{display:block}
  .sp-wk-first-title{font-size:19px}
}
/* 11/18 オーナー：ギルドの決まりは「詳細」を押したときだけ出す */
.sp-guild-rules-btn{flex:none;border:1px solid rgba(240,131,0,.45);background:#fff;color:#b85f00;border-radius:999px;padding:6px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.sp-guild-rules-btn:hover{background:#fff4e6}
.sp-guild-rules-back{position:fixed;inset:0;z-index:60;background:rgba(20,19,16,.32)}
.sp-guild-rules-panel{box-sizing:border-box;position:fixed;z-index:61;top:16px;right:16px;bottom:16px;width:min(420px,calc(100vw - 32px));overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 18px 50px rgba(20,19,16,.28)}
/* ───── ギルドホール（11/18）：扉の絵は guild-hall/。位置と文字の場所は Claude Design の見本どおり ───── */
.gh-hall{position:relative;width:100%;aspect-ratio:2/1;border-radius:12px;overflow:hidden;background:#e8efd9 url(guild-hall/hall-pc.webp?v=1119) center/100% 100% no-repeat;box-shadow:0 10px 30px rgba(60,40,15,.14)}
.gh-swipe{display:none}
.gh-swipe-hint{display:none}
.gh-door{position:absolute;display:block;appearance:none;border:0;padding:0;margin:0;background:none;cursor:pointer;container-type:inline-size;perspective:900px;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}
.gh-hall .gh-door{top:30.58%;width:16.667%;height:54.17%}
.gh-door:focus-visible{outline:3px solid #f08300;outline-offset:4px;border-radius:12px}
.gh-l{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.gh-leaf{transition:transform 1.1s cubic-bezier(.6,0,.2,1);backface-visibility:hidden}
.gh-leaf-l{transform-origin:23.75% 50%}
.gh-leaf-r{transform-origin:76.25% 50%}
/* 押すと画面が描き直されて扉が新しく作られるので、transition では動かない（いきなり開いた形になる）。animation で開く（11/19） */
.gh-door[data-open="1"] .gh-leaf-l{animation:ghOpenL 1.1s cubic-bezier(.6,0,.2,1) forwards}
.gh-door[data-open="1"] .gh-leaf-r{animation:ghOpenR 1.1s cubic-bezier(.6,0,.2,1) forwards}
@keyframes ghOpenL{from{transform:rotateY(0)}to{transform:rotateY(78deg)}}
@keyframes ghOpenR{from{transform:rotateY(0)}to{transform:rotateY(-78deg)}}
@keyframes ghFadeIn{from{opacity:0}to{opacity:1}}
@keyframes ghFadeOut{from{opacity:1}to{opacity:0}}
@keyframes ghSparkle{from{opacity:0;transform:none}to{opacity:1;transform:translateY(-6%) scale(1.08)}}
.gh-bloom{position:absolute;left:-20%;right:-20%;top:20%;height:70%;pointer-events:none;background:radial-gradient(closest-side,rgba(255,240,200,.85),rgba(255,210,140,0));mix-blend-mode:screen;opacity:0;transition:opacity .9s .3s}
.gh-sparkle{position:absolute;left:-15%;width:130%;top:25%;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity .8s .5s, transform 1.4s .4s ease-out}
.gh-door[data-open="1"] .gh-bloom{animation:ghFadeIn .9s .3s ease both}
.gh-door[data-open="1"] .gh-sparkle{animation:ghSparkle 1s .4s ease-out both}
.gh-text{position:absolute;inset:0;pointer-events:none;color:#fbf3df;text-align:center;transition:opacity .4s}
.gh-door[data-open="1"] .gh-text{animation:ghFadeOut .4s ease both}
.gh-text > span{position:absolute;box-sizing:border-box}
.gh-name{left:0;right:0;top:32%;height:8%;display:flex;align-items:center;justify-content:center;font-family:'Kiwi Maru',serif;font-weight:500;font-size:max(13px,8.4cqw);letter-spacing:.06em;color:#fbf3df;text-shadow:.04em .05em 0 rgba(58,42,32,.55)}
.gh-hall{container-type:inline-size;isolation:isolate}
/* 横断幕（PC だけ）：看板の絵は背景（hall-pc）に描いてある。ここは文字だけ（11/19 絵本の絵柄） */
.gh-banner{position:absolute;left:28.5%;right:28.5%;top:2.5%;height:10.5%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.gh-banner-title{font-family:'Kiwi Maru',serif;font-weight:500;font-size:max(20px,3.4cqw);line-height:1;letter-spacing:.06em;color:#3b58a3;text-shadow:.16cqw .16cqw 0 #f2c35a}
/* 扉の上の札（ひとこと）と、扉の前の札（参加したいの印・数）。扉には名前だけ */
.gh-info,.gh-floor{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;
  border-radius:14px 10px 16px 9px;background:#f8eed6;border:1.5px solid #3a2a20;box-shadow:4px 5px 0 rgba(58,42,32,.35);color:#3a2a20;font-family:'Klee One',sans-serif;font-weight:600}
.gh-info{padding:.55cqw .8cqw}
.gh-info::after{content:"";position:absolute;left:50%;bottom:-.6cqw;width:1cqw;height:1cqw;background:inherit;border-right:1.5px solid #3a2a20;border-bottom:1.5px solid #3a2a20;transform:translateX(-50%) rotate(45deg)}
.gh-floor{gap:.35cqw;padding:.45cqw .6cqw}
.gh-hall .gh-info{bottom:70.4%;width:15%;max-height:16%}
.gh-hall .gh-floor{top:86.2%;width:15%}
.gh-line{font-size:max(11px,.98cqw);line-height:1.5;text-wrap:balance;word-break:auto-phrase}
.gh-stats{display:grid;grid-template-columns:auto auto;gap:.1cqw .9cqw;font-size:max(10px,.78cqw);font-weight:600;line-height:1.5;white-space:nowrap}
.gh-stats b{color:#c0561f;font-size:1.12em}
.gh-me{padding:.1cqw .7cqw;border-radius:99px;background:#3b58a3;color:#fbf3df;font-size:max(9px,.7cqw);line-height:1.6}
.gh-info:hover,.gh-floor:hover{background:#fdf6e6}
@media (hover:hover){
  .gh-door:hover .gh-leaf-l{transform:rotateY(10deg)}
  .gh-door:hover .gh-leaf-r{transform:rotateY(-10deg)}
  .gh-door:hover{filter:drop-shadow(0 0 14px rgba(255,214,140,.6))}
}
.gh-hall[data-entering="1"]::after,.gh-swipe[data-entering="1"]::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 55%,rgba(255,248,225,.95),rgba(255,236,190,.55) 40%,rgba(255,236,190,0) 75%);animation:ghFlash 1.15s ease-in forwards}
@keyframes ghFlash{0%,45%{opacity:0}100%{opacity:1}}
/* スマホ・狭い画面：扉を1枚ずつ横にスワイプ */
@media (max-width:899px){
  .gh-hall{display:none}
  .gh-swipe{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:0 5% 8px;margin:0 -4px;scrollbar-width:none}
  .gh-swipe::-webkit-scrollbar{display:none}
  .gh-slide{position:relative;flex:0 0 90%;max-width:420px;aspect-ratio:1080/1920;scroll-snap-align:center;border-radius:16px;overflow:hidden;background:#e8efd9 url(guild-hall/hall-sp.webp?v=1119) center/100% 100% no-repeat;box-shadow:0 8px 24px rgba(60,40,15,.18)}
  .gh-slide .gh-door{left:12.96%;top:19.48%;width:74.07%;height:67.71%}
  .gh-slide{container-type:inline-size}
  .gh-slide .gh-info{left:15%;right:15%;bottom:81.5%;padding:2.2cqw 3cqw;border-radius:14px 10px 16px 9px}
  .gh-slide .gh-info::after{bottom:-1.6cqw;width:3cqw;height:3cqw}
  .gh-slide .gh-line{font-size:max(12px,4.4cqw)}
  .gh-slide .gh-floor{left:14%;right:14%;top:88.2%;padding:1.6cqw 3cqw;gap:1cqw;border-radius:14px 10px 16px 9px;flex-direction:row;flex-wrap:wrap}
  .gh-slide .gh-stats{grid-template-columns:auto auto auto auto;gap:0 2.4cqw;font-size:max(10px,3.3cqw)}
  .gh-slide .gh-me{font-size:max(10px,3.1cqw);padding:.4cqw 2.4cqw}
  .gh-swipe-hint{display:block;text-align:center;font-size:12px;color:#8a7a62}
}
@media (prefers-reduced-motion:reduce){
  .gh-leaf,.gh-bloom,.gh-sparkle,.gh-text{transition:none;animation:none !important}
  .gh-hall[data-entering="1"]::after,.gh-swipe[data-entering="1"]::after{animation:none}
}
.sp-guild-rules-close{border:0;background:transparent;font-size:22px;line-height:1;color:#6E695C;cursor:pointer;padding:4px 6px}
/* スマホ（11/7）：#000 のカードは「SchoolPark／−物語はこの場所から−（小さめ）／全文を読む」だけ。パソコンは変えない */
@media (max-width:760px){
  .sp-founder-kicker,.sp-founder-line{display:none !important;}
  .sp-founder-sub{display:block !important; margin:2px 0 14px !important; font-size:13px !important; font-weight:500 !important; letter-spacing:.08em; opacity:.92;}
  .sp-founder-sub::before{content:"−";} .sp-founder-sub::after{content:"−";}
}

<style>
/* 枠のまわりの余白・角丸・影を外す。
   これらはテンプレートに直に書かれていて、「確かめるための枠」を
   見せるためのもの。本番では画面いっぱいに出すので要らない。
   入れ子はこの3段で固定されている:
     いちばん外（背景）> 枠の入れ物 > 枠 */
#dao-root > div            { padding-bottom: 0 !important; }
#dao-root > div > div      { padding: 0 !important; }
#dao-root > div > div > div{ border-radius: 0 !important; box-shadow: none !important; }
html, body                 { height: 100%; width:100%; overflow-x:hidden; }
#dao-root                  { width:100%; overflow-x:hidden; }
.sp-quest-detail-grid > div { min-width:0; }
@media (max-width:1350px) {
  .sp-quest-detail-grid { grid-template-columns:minmax(0,1fr) !important; }
}
/* クエスト詳細の右の列（ACCEPT・受けている人）。
   左の現場資料は長い。読み進めると、右の列も一緒に上へ流れていき、
   「受ける」「知恵カードを置く」「完了にする」が見えなくなっていた。
   2列で出ているときだけ、上の見出しのすぐ下で止めておく。

   前は top:24px で止めていた。見出し（高さおよそ90px）より浅いので、
   列の上側が見出しの下に潜って切れた。それで止めるのをやめていた。
   止める高さは見出しの高さから決める（描くたびに測って --sp-head-h に入れる）。
   画面が低くて列が収まらないときは、列の中だけで動かせるようにする。 */
@media (min-width:1351px) {
  .sp-quest-detail-grid > .sp-quest-side {
    position:sticky;
    top:calc(var(--sp-head-h, 92px) + 20px);
    max-height:calc(100vh - var(--sp-head-h, 92px) - 40px);
    overflow:auto;
  }
}
