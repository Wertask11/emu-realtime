      showYearGoals:!!(s.yearDoc && s.yearDoc.blocks) && s.screen==='experiments',
      isYearGoals:s.screen==='yeargoals',
      yearDoc:s.yearDoc || {},
      openYearGoals:() => { this.setState({screen:'yeargoals'}); this.toTop(); },
      founder:founder || {}, founderSections:(founder && Array.isArray(founder.founderSections)) ? founder.founderSections : [],
      isLogs:s.screen==='logs', isGuild:s.screen==='guild', isLibrary:s.screen==='library',
      isPropose:s.screen==='propose', isTasks:s.screen==='tasks',
      goTasks:this.go('tasks'), goPractice:() => { try { window.parent.showEmuPractice(); } catch (_) {} },
      goPropose:() => { try { window.parent.openSpQuestForm(this); } catch (e) { this.setState({screen:'propose'}); } }, goLibrary:this.go('library'), goExperiments:this.go('experiments'), goLogs:this.go('logs'),
      stats: {wisdomTotal:(s.wisdom || []).length, citations:s.citations || 0},
      myQuests, hasMyQuests: myQuests.length > 0,
      noHomework: openTasks.length === 0 && myQuests.length === 0,
      openTasks, doneTasks,
      noOpenTasks: openTasks.length === 0,
      noDoneTasks: doneTasks.length === 0 && doneQuests.length === 0,
      doneQuests,
      taskHead: openTasks.length === 0
        ? (myQuests.length ? ('受けているクエストが' + myQuests.length + '本ある。') : '宿題は残っていない。')
        : ('残っている宿題は、' + openTasks.length + '個。'),
      taskLine: (lateCount ? ('すぎているものが' + lateCount + '個。') : 'すぎているものはない。')
        + (todayCount ? ('きょうまでが' + todayCount + '個。') : '')
        + (yearEnd === null ? '' : ('　年末まで、あと' + yearEnd + '日。')),
      taskStats: [
        ['残っている', String(openTasks.length)],
        ['きょうまで', String(todayCount)],
        ['すぎている', String(lateCount)],
        ['年末まで', yearEnd === null ? '—' : (yearEnd + '日')]
      ].map(([label, value]) => ({label, value})),
      draft: this.draft,
      onTaskTitle: (ev) => setDraft('title', ev.target.value),
      onTaskNote:  (ev) => setDraft('note',  ev.target.value),
      onTaskDue:   (ev) => setDraft('due',   ev.target.value),
      taskBrands: TASK_BRANDS.map(([id, label, color]) => ({
        label, go: () => { this.draft.brand = id; this.setState({}); },
        bg: this.draft.brand === id ? color : 'transparent',
        fg: this.draft.brand === id ? '#F4F1EA' : color,
        border: color })),
      /* つなぐ先は、まだ終わっていないクエストだけ */
      taskQuests: [{id:'', title:'どれにもつながない'}]
        .concat(exps.filter(e => e.status !== 'CLOSED').map(e => ({id:e.id, title:e.fullTitle || e.title})))
        .map(q => ({ label: q.title,
          go: () => { this.draft.questId = q.id; this.draft.questTitle = q.id ? q.title : ''; this.setState({}); },
          bg: this.draft.questId === q.id ? '#141310' : 'transparent',
          fg: this.draft.questId === q.id ? '#F4F1EA' : '#3B382F',
          border: this.draft.questId === q.id ? '#141310' : 'rgba(20,19,16,.16)' })),
      addTask: async () => {
        let ok = false;
        try { ok = await window.parent.spTaskAdd(this, this.draft); } catch (e) {}
        if (!ok) return;
        /* 続けて書けるように、どの仕事かだけは残す */
        this.draft = { title:'', note:'', brand:this.draft.brand, questId:'', questTitle:'', due:'' };
        this.setState({});
      },
      filters, seriesFilters, shownExps, cur,
      questsDenied:!!s.questsDenied, questsNote:s.questsNote || '',
      curLogs: cur.logs || [],
      logs, wisdom: ((s.wtag && s.wtag !== 'すべて') ? (s.wisdom || []).filter(w => w.tag === s.wtag) : (s.wisdom || [])).map(w => this.foldWisdom(w, s)),
      /* 棚はギルドと揃える。色は guild-store.js の accent と同じ。 */
      tags: [{t:'すべて',c:'#3B382F'},{t:'LEARN',c:'#0F5C3F'},{t:'WORK',c:'#141310'},{t:'PLAY',c:'#C2703D'},{t:'CONNECT',c:'#B0405A'},{t:'WEB3',c:'#3B382F'},{t:'Emu',c:'#F08300'},{t:'その他',c:'#6E695C'}].map(x => ({
        label:x.t, go:()=>this.setState({wtag:x.t}),
        bg: s.wtag===x.t ? x.c : 'transparent',
        fg: s.wtag===x.t ? '#F4F1EA' : x.c,
        border: s.wtag===x.t ? x.c : 'rgba(20,19,16,.16)'})),
      steps: STEPS.map((st,i) => ({num:'0'+(i+1), label:st.label, hint:st.hint, go:()=>this.setState({step:i}),
        bg: s.step===i ? '#E7E2D6' : 'transparent',
        fg: s.step===i ? '#141310' : '#6E695C',
        numFg: s.step===i ? '#b85f00' : '#9A9484'})),
      step: STEPS[s.step], stepNum: s.step+1,
      nextLabel: s.step===3 ? '公開してコミットを募る' : '次へ',
      nextStep: () => this.setState(p => ({step: Math.min(3, p.step+1)})),
      prevStep: () => this.setState(p => ({step: Math.max(0, p.step-1)}))
    };
  }
}

/* ───── テンプレートを解釈して画面に出す仕組み ─────

   元は React が担っていた部分。使われている記法は3つだけだった。
     {{ 参照 }}                     … 値を差し込む（211か所、すべて単純な参照）
     <sc-for list="{{ 配列 }}" as="x"> … 繰り返す
     <sc-if value="{{ 真偽 }}">        … 出す・出さない
   ほかに onClick と ref。それだけを実装する。 */

/* 「a.b.c」をたどって値を取る */
function pick(scope, path) {
  var parts = String(path).trim().split('.');
  var v = scope;
  for (var i = 0; i < parts.length; i++) {
    if (v == null) return undefined;
    v = v[parts[i]];
  }
  return v;
}

var MUSTACHE = /\{\{([^}]+)\}\}/g;

/* 文字列の中の {{ }} を置き換える */
function fill(text, scope) {
  return text.replace(MUSTACHE, function (_, path) {
    var v = pick(scope, path);
    return (v === undefined || v === null) ? '' : String(v);
  });
}

/* 属性の値がまるごと1つの参照なら、値そのもの（関数など）を返す */
function whole(text, scope) {
  var m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(text);
  return m ? pick(scope, m[1]) : undefined;
}

function walk(node, scope, out) {
  for (var i = 0; i < node.childNodes.length; i++) {
    var n = node.childNodes[i];

    if (n.nodeType === 3) {                       // 文字
      out.appendChild(document.createTextNode(fill(n.nodeValue, scope)));
      continue;
    }
    if (n.nodeType !== 1) continue;

    var tag = n.tagName.toLowerCase();

    if (tag === 'sc-for') {
      var list = whole(n.getAttribute('list') || '', scope) || [];
      var as = n.getAttribute('as') || 'item';
      for (var j = 0; j < list.length; j++) {
        var child = Object.create(scope);
        child[as] = list[j];
        walk(n, child, out);
      }
      continue;
    }

    if (tag === 'sc-if') {
      if (whole(n.getAttribute('value') || '', scope)) walk(n, scope, out);
      continue;
    }

    var el = document.createElementNS(n.namespaceURI, tag);
    for (var a = 0; a < n.attributes.length; a++) {
      var at = n.attributes[a], name = at.name, val = at.value;

      if (name === 'ref') {                        // 要素を控えておく
        var box = whole(val, scope);
        if (box) box.current = el;
        continue;
      }
      /* onClick は、テンプレートを読み込んだ時点で onclick に小文字化される。
         大文字で判定すると空振りするので、大小を区別せずに見る。 */
      if (/^on[a-z]+$/i.test(name)) {
        var fn = whole(val, scope);
        if (typeof fn === 'function') {
          el.addEventListener(name.slice(2).toLowerCase(), fn);
          if (name.toLowerCase() === 'onclick' && /^(DIV|SPAN)$/.test(el.tagName)) {
            el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0');
          }
        }
        continue;
      }
      if (name.indexOf('hint-') === 0) continue;   // 編集画面用の目印。表示には要らない

      el.setAttribute(name, fill(val, scope));
    }
    walk(n, scope, el);
    out.appendChild(el);
  }
}

/* ───── 起動 ───── */
var app = new Component();
var host = document.getElementById('dao-root');
var tpl = document.getElementById('dao-template');
var queued = false;
/* Preserve City's DOM across the existing whole-frame redraws. Its module,
   styles and data are not requested until the user opens 08. */
var cityHost = null;
var cityModule = null;
function mountCity() {
  var slot = host.querySelector('[data-city-slot]');
  if (!slot) return;
  if (!cityHost) { cityHost = document.createElement('section'); cityHost.id = 'sp-city'; }
  slot.replaceWith(cityHost);
  if (!cityModule) cityModule = import('./city.js').catch(function (err) { cityModule = null; throw err; });
  cityModule.then(function (mod) { if (cityHost.isConnected) mod.mount(cityHost, app); }).catch(function () {
    cityHost.textContent = 'Cityを読み込めませんでした。';
    var retry = document.createElement('button');
    retry.type = 'button'; retry.textContent = 'もう一度読み込む';
    /* 描き直す（app.setState）だけでは直らない。一度失敗した import() は、
       ブラウザが同じページのあいだ失敗として覚えていて、取りに行き直さない。
       押しても何も起きないように見えていた。枠（この dao.html）を City の画面のまま開き直す。 */
    retry.onclick = function () {
      var u = new URL(window.location.href);
      u.searchParams.set('screen', 'city');
      window.location.replace(u.toString());
    };
    cityHost.appendChild(retry);
  });
}

/* 開いている <details> を覚えておく。

   描き直しは画面をまるごと作り直すので、<details> は毎回「閉じた」状態で
   生まれ直す。親（index.html）は、タブに戻ったとき・画面に戻ったとき・
   5分ごとに中身を読み直し、そのたびに描き直す。現場の資料を開いて
   読んでいるあいだにそれが来ると、資料が勝手に閉じていた。

   data-keep-open に名前を付けた <details> だけ、開いていたものを開いたまま
   作り直す。名前にクエストの番号を入れておけば、別のクエストを開いたときに
   前の開き方が持ち越されることはない。 */
function keptOpen() {
  var open = {};
  host.querySelectorAll('details[data-keep-open]').forEach(function (d) {
    if (d.open) open[d.getAttribute('data-keep-open')] = true;
  });
  return open;
}
function reopen(frag, open) {
  frag.querySelectorAll('details[data-keep-open]').forEach(function (d) {
    if (open[d.getAttribute('data-keep-open')]) d.open = true;
  });
}
/* 上の見出しの高さ。右の列（ACCEPT）を、見出しのすぐ下で止めるのに使う。
   見出しは幅によって高さが変わるので、決め打ちせずに測る。 */
function syncHeadHeight() {
  var head = host.querySelector('[data-sp-head]');
  if (!head) return;
  /* 11/2 の画面統合から、見出しは止まらず一緒に流れる。そのときに見出しの高さぶん
     空けると、ACCEPT の上に約100pxの空きができていた（11/3 点検 8）。
     見出しが止まっている（sticky・fixed）ときだけ、その高さを空ける。 */
  var pos = getComputedStyle(head).position;
  host.style.setProperty('--sp-head-h', (pos === 'sticky' || pos === 'fixed') ? head.offsetHeight + 'px' : '0px');
}

function draw() {
  queued = false;
  const switchFocus = document.hasFocus() && document.activeElement?.matches('.service-switch,.sp-sidebar-switch')
    ? (document.activeElement.matches('.service-switch') ? '.service-switch' : '.sp-sidebar-switch') : null;
  /* replaceChildren はスクロール中の要素も破棄する。差し替え前の位置を
     覚え、新しい要素へ同じ描画処理内で戻す（描画後の rAF では一度上に跳ぶ）。 */
  var scrollTop = app.scroller.current ? app.scroller.current.scrollTop : 0;
  var pageY = window.scrollY;
  var open = keptOpen();
  var vals = app.renderVals();
  var frag = document.createDocumentFragment();
  walk(tpl.content, vals, frag);
  reopen(frag, open);
  host.replaceChildren(frag);
  if (switchFocus) host.querySelector(switchFocus)?.focus({preventScroll:true});
  syncHeadHeight();
  mountCity();
  if (app.scroller.current) app.scroller.current.scrollTop = scrollTop;
  if (window.scrollY !== pageY) window.scrollTo(0, pageY);
  /* タブを押して画面を描き直しても、利用者が横に動かした位置を保つ。
     先頭へ戻ると、タブと画面全体が勝手に動いたように見えるため。 */
  if (app.bottomRef.current) app.bottomRef.current.scrollLeft = app.tabScrollLeft || 0;
  app.tourRenderedDataReady = Object.assign({}, app.tourDataReady);
  app.tourRenderedScreen = app.state.screen;
  try { if (window.parent.ReizoTourSchoolParkRendered) window.parent.ReizoTourSchoolParkRendered(); } catch (e) {}
  /* 描き直すと右上のボタンは👤で作り直される。親（Emu）に、写真か名前を入れ直してもらう。
     親の見張り（MutationObserver）だけに頼ると、枠が読み直されたときなどに見張りが外れて
     👤のまま残ることがあった（10/30 スマホ）。 */
  try { if (window.parent !== window && window.parent.emuPaintHeaderIdentity) window.parent.emuPaintHeaderIdentity(); } catch (e) {}
}
/* まとめて1回だけ描き直す。
   requestAnimationFrame は、画面が描画されていない状態（背景タブなど）では
   進まないため使わない。押したのに変わらない、が起きる。 */
function schedule() {
  if (queued) return;
  queued = true;
  Promise.resolve().then(draw);
}

draw();
window.addEventListener('resize', syncHeadHeight);
if (app.componentDidMount) app.componentDidMount();

</script>
<script>
// Match click behaviour for all custom controls, including wisdom details/cite.
document.addEventListener('keydown', function(e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')
      && !/^(BUTTON|A)$/.test(e.target.tagName) && e.target.getAttribute('aria-disabled') !== 'true') {
    e.preventDefault(); if (!e.repeat) e.target.click();
  }
});
// Clicking elsewhere inside the SchoolPark frame dismisses the shared profile.
document.addEventListener('click', function(e) {
  if (!e.target.closest('.service-profile')) { try { window.parent.closeAccountMenu(); } catch (_) {} }
});
</script>
