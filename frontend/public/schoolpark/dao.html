<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="stylesheet" href="/emu-theme.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolPark DAO</title>
<link rel="stylesheet" href="/service-header.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#faf8f5; }
  a { color:var(--emu-brand-strong); text-decoration:none; }
  a:hover { color:#b85f00; }
  ::-webkit-scrollbar { width:10px; height:10px }
  ::-webkit-scrollbar-thumb { background:rgba(20,19,16,.18); border-radius:8px }

.sp-section-header {padding:18px 24px;border-bottom:1px solid #e1dcd2;background:var(--emu-paper);}
.sp-section-header p {margin:0;color:var(--emu-brand-strong);font-size:11px;letter-spacing:.1em;}
.sp-section-header h2 {margin:4px 0 0;font-size:21px;}
[role="button"]:focus-visible { outline: 3px solid var(--emu-brand-strong); outline-offset: 4px; }
</style>
<style>
/* 枠のまわりの余白・角丸・影を外す。
   これらはテンプレートに直に書かれていて、「確かめるための枠」を
   見せるためのもの。本番では画面いっぱいに出すので要らない。
   入れ子はこの3段で固定されている:
     いちばん外（背景）> 枠の入れ物 > 枠 */
#dao-root > div            { padding-bottom: 0 !important; }
#dao-root > div > div      { padding: 0 !important; }
#dao-root > div > div > div{ border-radius: 0 !important; box-shadow: none !important; }
html, body                 { height: 100%; width:100%; overflow-x:hidden; }
#dao-root                  { width:100%; overflow-x:hidden; }
.sp-quest-detail-grid > div { min-width:0; }
@media (max-width:1350px) {
  .sp-quest-detail-grid { grid-template-columns:minmax(0,1fr) !important; }
}
/* クエスト詳細の右の列（ACCEPT・受けている人）。
   左の現場資料は長い。読み進めると、右の列も一緒に上へ流れていき、
   「受ける」「知恵カードを置く」「完了にする」が見えなくなっていた。
   2列で出ているときだけ、上の見出しのすぐ下で止めておく。

   前は top:24px で止めていた。見出し（高さおよそ90px）より浅いので、
   列の上側が見出しの下に潜って切れた。それで止めるのをやめていた。
   止める高さは見出しの高さから決める（描くたびに測って --sp-head-h に入れる）。
   画面が低くて列が収まらないときは、列の中だけで動かせるようにする。 */
@media (min-width:1351px) {
  .sp-quest-detail-grid > .sp-quest-side {
    position:sticky;
    top:calc(var(--sp-head-h, 92px) + 20px);
    max-height:calc(100vh - var(--sp-head-h, 92px) - 40px);
    overflow:auto;
  }
}
</style>
  <script src="/client-errors.js"></script><!-- 画面のエラーを運営に知らせる（人を特定する情報は送らない） -->
  <script src="/emu-analytics.js"></script>
</head>
<body>
<script>
/* SchoolPark は親画面で認証・公開時期を確認してから iframe として開く。
   このHTMLをURL直打ちしても内部画面を描画せず、正規の入口へ戻す。 */
if (window.top === window.self) window.location.replace('/');
</script>
<div id="dao-root"></div>

<!-- Existing activity/workspace templates; global navigation is owned by the unified parent. -->
<template id="dao-template">

<div style="min-height:100vh; background:var(--emu-paper); font-family:'Zen Kaku Gothic New',sans-serif; padding:0">


  <div style="padding:0; display:flex; justify-content:center; overflow:hidden; height:{{ L.boxH }}">
  <div style="width:{{ L.w }}; height:{{ L.h }}; flex:none; transform:{{ L.scale }}; transform-origin:top center; background:#F4F1EA; color:#141310; border-radius:{{ L.frameR }}; overflow:hidden; box-shadow:0 18px 48px rgba(20,19,16,.14); display:flex">



    <div style="flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:{{ L.scrollY }}" ref="{{ scrollRef }}">

      <header class="sp-section-header" data-sp-head data-tour="screen-heading guild-intro quest-intro"><p>{{ head.kicker }}</p><h2>{{ head.title }}</h2></header>

      <div style="padding:{{ L.pad }}; display:flex; flex-direction:column; gap:36px">

        <sc-if value="{{ showCityReturn }}">
          <button type="button" onClick="{{ goCity }}" style="align-self:flex-start; min-height:44px; padding:10px 16px; border:1px solid var(--emu-brand-strong); border-radius:7px; background:transparent; color:var(--emu-brand-strong); font:inherit; cursor:pointer">← Cityへ戻る</button>
        </sc-if>
        <sc-if value="{{ isCity }}"><div data-city-slot=""></div></sc-if>


        <sc-if value="{{ showFounder }}">
          <section style="background:var(--emu-brand-strong); color:#F4F1EA; border-radius:12px; padding:24px; margin-bottom:24px; overflow-wrap:anywhere">
            <div style="font-size:11px; letter-spacing:.12em; color:var(--emu-brand-soft)">FOUNDER QUEST · 恒久の原点</div>
            <h2 style="font-size:24px; line-height:1.5">SchoolPark Quest #000</h2>
            <p style="line-height:1.9">目印にしてスタート、ゴールにして原点、原点にして頂点</p>
            <sc-if value="{{ showFounderToggle }}"><button onClick="{{ toggleFounderSummary }}" style="font:inherit; background:#fff2e5; color:#141310; border:0; border-radius:6px; padding:10px 16px; cursor:pointer">{{ founderToggleLabel }}</button></sc-if>
            <sc-if value="{{ showFounderDetails }}">
              <p style="font-size:13px; line-height:1.9">SchoolParkは何のために存在するのか。どんな社会をつくりたいのか。何を大切にするのか。その原点を記録する。</p>
              <p style="font-size:13px">報酬 0円 · Founder 1人 · 期限なし</p>
              <button onClick="{{ founder.open }}" style="font:inherit; background:#fff2e5; color:#141310; border:0; border-radius:6px; padding:12px 18px; cursor:pointer">#000の全文を読む</button>
              <p style="font-size:12px; line-height:1.8">実際の活動・行動・検証は #001 から開始します。</p>
            </sc-if>
          </section>
        </sc-if>
        <!-- SchoolParkの年内目標。中身は Firestore の sp_docs/year-goals に1件だけ。
             ここでは見出しと要約と入口だけを出す。#000 バナーと同じ考え方。
             記録がまだ無いときは showYearGoals が false になり、カードごと出ない。 -->
        <sc-if value="{{ showYearGoals }}">
          <section style="background:#FBF9F3; border:1px solid rgba(20,19,16,.16); border-radius:12px; padding:24px; margin-bottom:24px; overflow-wrap:anywhere">
            <div style="font-family:Inter,sans-serif; font-size:11px; letter-spacing:.12em; color:var(--emu-brand-strong)">YEAR GOALS</div>
            <h2 style="font-size:24px; line-height:1.5; margin:6px 0 8px">{{ yearDoc.title }}</h2>
            <p style="font-size:13px; line-height:1.9; color:#3B382F; margin:0 0 16px" data-tour="year-goals">{{ yearDoc.summary }}</p>
            <button onClick="{{ openYearGoals }}" style="font:inherit; background:var(--emu-brand-strong); color:#F4F1EA; border:0; border-radius:6px; padding:12px 18px; cursor:pointer">全文を読む</button>
          </section>
        </sc-if>
        <sc-if value="{{ isFounderDetail }}">
          <article style="max-width:860px; width:100%; min-width:0; margin:0 auto; overflow-wrap:anywhere">
            <button onClick="{{ goExperiments }}" style="font:inherit; padding:10px 16px; cursor:pointer">← クエスト</button>
            <p style="color:var(--emu-brand-strong); font-weight:700">FOUNDER QUEST · 恒久の原点</p>
            <h1 style="font-size:28px; line-height:1.5">SchoolPark Quest #000</h1>
            <p style="font-weight:700; line-height:1.9">目印にしてスタート、ゴールにして原点、原点にして頂点</p>
            <p style="line-height:1.9">SchoolParkは何のために存在するのか。どんな社会をつくりたいのか。何を大切にするのか。その原点を記録する。</p>
            <p style="line-height:1.9">報酬 0円 · 参加必要人数 1人（Founder） · 期限なし<br>実際の活動・行動・検証は #001 から開始します。</p>
            <sc-for list="{{ founderSections }}" as="section">
              <details data-keep-open="founder-{{ section.title }}" style="background:#FBF9F3; border:1px solid rgba(20,19,16,.16); border-radius:10px; padding:18px; margin:16px 0; min-width:0">
                <summary style="font-size:17px; font-weight:700; line-height:1.7; cursor:pointer">{{ section.title }}</summary>
                <div style="white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px; line-height:2; margin-top:20px">{{ section.body }}</div>
              </details>
            </sc-for>
            <!-- 手書きの言葉（創業者の写真そのまま）。Firestore の founderSections とは別に、
                 画面側に固定で置く。#000 の照合用ハッシュには入らない。
                 元写真の右下にあった印刷イラスト（©表記つき）は消してある。 -->
            <details style="background:#FBF9F3; border:1px solid rgba(20,19,16,.16); border-radius:10px; padding:18px; margin:16px 0; min-width:0">
              <summary style="font-size:17px; font-weight:700; line-height:1.7; cursor:pointer">7. 手書きの言葉</summary>
              <img src="/schoolpark/images/quest-000-tegaki.webp" alt="方眼紙に手書きされた言葉。「私はなんでもできる」「私は私のままでいい」などが並び、最後に「いつもありがとうございます。感謝しています！！ Tsubaki」と書かれている。" loading="lazy" width="886" height="1380" style="display:block; width:100%; max-width:560px; height:auto; margin:20px auto 0; border-radius:6px">
            </details>
            <!-- 8. EMUER論文（11/3 オーナーから）。#000 を思想的原点とする研究論文（2026年11月2日 精査改訂版）。
                 手書きの言葉と同じく、Firestore の founderSections とは別に画面側に置く（#000 の照合用ハッシュには入らない）。
                 全文は長いので別のページ（/schoolpark/emuer-paper.html）で読む。ここには要旨と章立てだけを出す。 -->
            <details data-keep-open="founder-emuer-paper" style="background:#FBF9F3; border:1px solid rgba(20,19,16,.16); border-radius:10px; padding:18px; margin:16px 0; min-width:0">
              <summary style="font-size:17px; font-weight:700; line-height:1.7; cursor:pointer">8. EMUER論文</summary>
              <div style="font-size:15px; line-height:2; margin-top:16px">
                <p style="margin:0; font-weight:700">貢献価値の創出・評価・循環に基づく分散型経済圏の理論と制度設計</p>
                <p style="margin:0 0 12px; font-size:13px; color:#6E695C">SchoolParkの創設思想を起点とした経済・技術・法制度・実証の統合的研究｜研究論文・精査改訂版（2026年11月2日）</p>
                <p style="margin:0 0 6px; font-weight:700">要旨</p>
                <p style="margin:0 0 14px">本論文は、学校、企業、地域、オンラインサービスに分散して存在する知識、経験、挑戦、貢献を、本人の尊厳と自律性を保ちながら次の学習・仕事・消費の機会へ接続する制度の可能性を研究する。創設資料であるSchoolPark Quest #000とSchool Park論文を思想的原点とし、EMUERを人間の価値そのものではなく、限定的に認定された貢献と利用可能な便益を接続する単位として定義する。コモンズ、公共財、外部性、内発的動機に関する理論を参照し、貢献認定、有限予算による配分、未使用残高、交換原資、加盟店の経済合理性、本人性確認、技術基盤、法的分類、共同ガバナンスを一体的に検討する。数量台帳と交換費用のモデルを提示し、SchoolPark Cityおよび外部加盟店での段階的な実証計画を提案する。EMUERの外部利用と自由流通を区別し、暗号資産化を制度成立の前提としない。実際の外部経済圏が成立したという実証結果はなく、本論文の結論は、成立に必要な条件と反証可能な仮説の整理である。</p>
                <p style="margin:0 0 6px; font-weight:700">章立て</p>
                <p style="margin:0 0 14px; font-size:14px; line-height:1.9">第1章 序論／第2章 思想的基盤――Quest #000とCHES・DXR／第3章 先行研究と理論的枠組み／第4章 EMUERの定義と権利構造／第5章 貢献の認定と配分／第6章 発行・交換・財務の数理モデル／第7章 外部経済圏と加盟店設計／第8章 技術アーキテクチャと安全性／第9章 法制度・倫理・ガバナンス／第10章 実証研究の設計／第11章 批判的検討と代替案／第12章 結論と段階的な展望／付録A〜E・参考文献</p>
                <a href="/schoolpark/emuer-paper.html" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; min-height:44px; padding:10px 18px; border-radius:6px; background:var(--emu-brand-strong); color:#fff; font-weight:700; text-decoration:none">全文を読む（別のページ）→</a>
                <p style="margin:12px 0 0; font-size:12px; color:#6E695C">制度の考え方と確かめるための仮説をまとめたもので、外の経済圏が実際にできたことを示すものではありません。査読・法務意見・監査を経た文書でもありません。</p>
              </div>
            </details>
            <p><a href="https://note.com/paberuuu11/n/nb4417c69b0c6" target="_blank" rel="noopener noreferrer">SchoolPark論文の出典（note）</a></p>
          </article>
        </sc-if>
        <!-- 年内目標の全文。1ページにまとめて出す。中身は上から順に並べるだけ。 -->
        <sc-if value="{{ isYearGoals }}">
          <article style="max-width:860px; width:100%; min-width:0; margin:0 auto; overflow-wrap:anywhere">
            <button onClick="{{ goExperiments }}" style="font:inherit; padding:10px 16px; cursor:pointer">← クエスト</button>
            <p style="font-family:Inter,sans-serif; color:var(--emu-brand-strong); font-weight:700; letter-spacing:.12em; font-size:11px">YEAR GOALS</p>
            <h1 style="font-size:28px; line-height:1.5">{{ yearDoc.title }}</h1>
            <p data-tour="year-goals" style="line-height:1.9">{{ yearDoc.summary }}</p>
            <sc-if value="{{ yearDoc.hasUpdated }}">
              <p style="font-size:12px; color:#6E695C">最終更新：{{ yearDoc.updatedLabel }}</p>
            </sc-if>
            <sc-for list="{{ yearDoc.blocks }}" as="b">
              <sc-if value="{{ b.isHeading }}">
                <h2 style="font-size:19px; font-weight:700; line-height:1.6; margin:28px 0 4px; color:var(--emu-brand-strong)">{{ b.text }}</h2>
              </sc-if>
              <sc-if value="{{ b.isText }}">
                <p style="white-space:pre-wrap; line-height:1.95; margin:10px 0">{{ b.text }}</p>
              </sc-if>
              <!-- 表は div の display:table で組む。表のタグ（table・thead・tbody・tr）の
                   中に置いた独自タグ（sc-for・sc-if）は、HTML の決まりで表の外へ
                   追い出される（foster parenting）。追い出された繰り返しは中身が空になり、
                   表には見出し1セルと中身1セルだけが、しかも繰り返しの外に残る。
                   年内目標の表が10個とも空で出ていたのはこれ。div なら追い出しは
                   起きず、見た目も表のまま保てる。role で表の意味も残す。
                   表のタグで書き直すと同じことが起きる。tools/year-goals-tests で見張っている。 -->
              <sc-if value="{{ b.isTable }}">
                <div style="overflow-x:auto; margin:12px 0">
                  <div role="table" style="display:table; width:100%; border-collapse:collapse; font-size:14px; line-height:1.9">
                    <sc-if value="{{ b.hasHead }}">
                      <div role="row" style="display:table-row">
                        <sc-for list="{{ b.head }}" as="h">
                          <div role="columnheader" style="display:table-cell; text-align:left; padding:10px 12px; border-bottom:1px solid rgba(20,19,16,.22); font-size:12px; letter-spacing:.06em; color:#6E695C; vertical-align:top">{{ h }}</div>
                        </sc-for>
                      </div>
                    </sc-if>
                    <sc-for list="{{ b.rows }}" as="r">
                      <div role="row" style="display:table-row">
                        <sc-for list="{{ r.cells }}" as="c">
                          <div role="cell" style="display:table-cell; padding:10px 12px; border-bottom:1px solid rgba(20,19,16,.1); vertical-align:top">{{ c }}</div>
                        </sc-for>
                      </div>
                    </sc-for>
                  </div>
                </div>
              </sc-if>
              <sc-if value="{{ b.isImage }}">
                <figure style="margin:20px 0">
                  <img src="{{ b.url }}" alt="{{ b.caption }}" style="width:100%; height:auto; display:block; border:1px solid rgba(20,19,16,.12); border-radius:10px; background:#fff">
                  <sc-if value="{{ b.hasCaption }}">
                    <figcaption style="font-size:13px; line-height:1.9; color:#6E695C; margin-top:6px">{{ b.caption }}</figcaption>
                  </sc-if>
                </figure>
              </sc-if>
            </sc-for>
          </article>
        </sc-if>





        <!-- 広場。地図の広場を押すと来る。公園に建てられたものが並ぶ。 -->


        <sc-if value="{{ isExperiments }}" hint-placeholder-val="{{ false }}">
          <p class="sp-ux-note">Emuで読んだ知識や自分の経験を、実際の課題で試してみる。結果やつまずきを報告し、次にも使える学びを知恵カードに残せます。気になる課題の「内容を見る」から、試したいことを探してみてください。閲覧だけでは参加登録されません。</p>
          <div class="sp-ux-actions"><button type="button" class="sp-ux-button" aria-pressed="{{ entryOnly }}" onClick="{{ toggleEntryOnly }}">「入門」のクエストに絞る</button><span class="sp-ux-note">運営が「入門」と設定したものだけを表示します。</span></div>
          <sc-if value="{{ noShownQuests }}"><p class="sp-ux-note">この条件に合うクエストはありません。<button type="button" class="sp-ux-button" onClick="{{ resetQuestFilters }}">絞り込みを解除する</button></p></sc-if>
          <div style="display:flex; flex-direction:column; gap:24px">
            <div style="background:#E7E2D6; border-radius:12px; padding:20px 22px; display:flex; gap:18px; align-items:center; flex-wrap:wrap">
              <details data-keep-open="quest-purpose" style="flex:1 1 380px; min-width:0; font-size:13px; line-height:1.95; color:#3B382F"><summary style="cursor:pointer; min-height:44px; font-weight:700">クエストの位置づけ・報酬・税の説明</summary><div>クエストは<b>仕事</b>です。SchoolPark・Emu・Camellia などの仕事を、DAOのメンバーやそれ以外の方が引き受けて動かします。<br><b>予算は SchoolPark が決めて出します。</b>報酬は EMUER・JPYC・円 のいずれかです。<br>受け取ったぶんは<b>雑所得</b>にあたります。ほかの所得と合わせて年20万円を超えると、確定申告が必要になります。<br>クエストの始まり方は2つあります。<b>ギルド</b>の議題をみんなで決めてから動かす道と、小さな実験・個人の挑戦をここから直接出す道です。どちらも残しています。</div></details>
              <div onClick="{{ goPropose }}" style="padding:12px 18px; background:var(--emu-brand-strong); color:#F4F1EA; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap; flex:0 0 auto" style-hover="background:#d97600">＋ クエストを出す</div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
              <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.16em; color:#6E695C; margin-right:2px">SERIES</div>
              <sc-for list="{{ seriesFilters }}" as="f" hint-placeholder-count="2">
                <div onClick="{{ f.go }}" style="padding:9px 18px; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid {{ f.border }}; background:{{ f.bg }}; color:{{ f.fg }}">{{ f.label }}</div>
              </sc-for>
            </div>
            <div data-tour="quest-filter quest-filters" style="display:flex; gap:8px; flex-wrap:wrap">
              <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
                <div onClick="{{ f.go }}" style="padding:9px 16px; border-radius:20px; font-size:13px; font-weight:500; cursor:pointer; border:1px solid rgba(20,19,16,.16); background:{{ f.bg }}; color:{{ f.fg }}">{{ f.label }}</div>
              </sc-for>
            </div>
            <sc-if value="{{ questsDenied }}">
              <div style="background:#FBF9F3; border:1px solid #A32020; border-radius:12px; padding:22px; font-size:13px; line-height:1.9; color:#A32020">{{ questsNote }}</div>
            </sc-if>
            <sc-if value="{{ noQuests }}">
              <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:22px; font-size:13px; line-height:1.9; color:#6E695C">まだクエストがありません。上の「＋ クエストを出す」から出せます（運営のみ）。</div>
            </sc-if>
            <div style="display:grid; grid-template-columns:{{ L.g2 }}; gap:18px">
              <sc-for list="{{ shownExps }}" as="e" hint-placeholder-count="4">
                <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:24px; display:flex; flex-direction:column; gap:16px">
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap">
                    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
                      <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.16em; padding:5px 10px; border-radius:4px; background:{{ e.statusBg }}; color:{{ e.statusFg }}">{{ e.status }}</div>
                      <div style="display:{{ e.guildShow }}; font-family:Inter,sans-serif; font-size:10px; letter-spacing:.1em; padding:5px 10px; border-radius:4px; background:#E7E2D6; color:#3B382F">{{ e.guildLabel }}</div>
                    </div>
                    <div style="font-size:12px; color:#6E695C">締切 {{ e.due }}</div>
                  </div>
                  <div onClick="{{ e.open }}" style="font-size:19px; font-weight:700; line-height:1.55; cursor:pointer; text-wrap:pretty" style-hover="color:var(--emu-brand-strong)" data-tour="quest-list">{{ e.title }}</div>
                  <div style="font-size:13px; line-height:1.9; color:#3B382F; white-space:pre-wrap">{{ e.cardText }}</div>
                  <div style="display:{{ e.knowledgeShow }}; align-items:center; gap:8px; font-size:12px; color:#6E695C; padding:10px 12px; background:#F4F1EA; border-radius:8px; line-height:1.6">
                    <span style="color:var(--emu-brand-strong); font-weight:700">元の知識</span>{{ e.knowledge }}
                  </div>
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; padding-top:4px; border-top:1px solid rgba(20,19,16,.1); flex-wrap:wrap">
                    <div style="display:flex; flex-direction:column; gap:4px">
                      <div style="font-family:Inter,sans-serif; font-size:15px; font-weight:600; color:var(--emu-brand-strong)">{{ e.commits }} / {{ e.need }} 人が受けた</div>
                      <div style="font-size:11px; color:#6E695C">予算 {{ e.budget }} · {{ e.owner }}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px">
                      <button type="button" class="sp-ux-button" data-tour="quest-card" onClick="{{ e.open }}">{{ e.previewLabel }}</button>
                    </div>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
          <div class="sp-quest-detail-grid" style="display:grid; grid-template-columns:{{ L.gDetail }}; gap:32px; align-items:start; min-width:0">
            <div style="display:flex; flex-direction:column; gap:28px; min-width:0">
              <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:{{ L.cardPad }}; display:flex; flex-direction:column; gap:22px">
                <div style="display:flex; align-items:center; gap:12px">
                  <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.16em; padding:5px 10px; border-radius:4px; background:{{ cur.statusBg }}; color:{{ cur.statusFg }}">{{ cur.status }}</div>
                  <div data-tour="home-quests" onClick="{{ goExperiments }}" style="font-size:12px; color:#6E695C; cursor:pointer">← {{ word }}一覧</div>
                </div>
                <div style="font-family:'Zen Old Mincho',serif; font-size:{{ L.heroSize }}; font-weight:900; line-height:1.5; text-wrap:pretty" data-tour="quest-detail">{{ cur.fullTitle }}</div>
                <sc-if value="{{ cur.hasFrom }}">
                  <div onClick="{{ cur.goFrom }}" style="background:#E7E2D6; border-radius:8px; padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; flex-wrap:wrap" style-hover="background:#DDD7C8">
                    <div style="flex:1 1 200px; min-width:0; font-size:12px; line-height:1.85; color:#3B382F">{{ cur.fromLabel }}</div>
                    <div style="font-size:12px; font-weight:700; color:var(--emu-brand-strong); white-space:nowrap">議題を見る →</div>
                  </div>
                </sc-if>
                <div style="display:{{ cur.introShow }}; font-size:14px; line-height:2.05; color:#3B382F; white-space:pre-wrap; background:#F4F1EA; border-radius:10px; padding:18px 20px">{{ cur.intro }}</div>
                <!-- 仮説検証の形（#001 LEARN など）。案件ものでは出さない。 -->
                <sc-if value="{{ cur.showTrial }}">
                  <div style="display:flex; flex-direction:column; gap:18px">
                    <div style="display:grid; grid-template-columns:88px 1fr; gap:16px; font-size:14px; line-height:1.95">
                      <div style="color:var(--emu-brand-strong); font-weight:700">元の知識</div><div style="color:#3B382F">{{ cur.knowledge }}</div>
                    </div>
                    <div style="display:grid; grid-template-columns:88px 1fr; gap:16px; font-size:14px; line-height:1.95">
                      <div style="color:var(--emu-brand-strong); font-weight:700">予想</div><div style="color:#3B382F">{{ cur.hypothesis }}</div>
                    </div>
                    <div style="display:grid; grid-template-columns:88px 1fr; gap:16px; font-size:14px; line-height:1.95">
                      <div style="color:var(--emu-brand-strong); font-weight:700">やること</div><div style="color:#3B382F">{{ cur.action }}</div>
                    </div>
                    <div style="display:grid; grid-template-columns:88px 1fr; gap:16px; font-size:14px; line-height:1.95">
                      <div style="color:var(--emu-brand-strong); font-weight:700">確かめ方</div><div style="color:#3B382F">{{ cur.measure }}</div>
                    </div>
                  </div>
                </sc-if>

                <!-- 案件の形（#002 WORK など）。現場資料は長いので、たたんで置く。
                     受ける前に全部を読ませると、何をする仕事なのかが埋もれる。 -->
                <sc-if value="{{ cur.isCase }}">
                  <div style="display:flex; flex-direction:column; gap:18px">
                    <details data-keep-open="brief-{{ cur.id }}" style="display:{{ cur.briefShow }}; background:#F4F1EA; border-radius:10px; border:1px solid rgba(20,19,16,.12)">
                      <summary style="cursor:pointer; padding:14px 18px; font-size:14px; font-weight:700; color:var(--emu-brand-strong)">現場の資料を読む</summary>
                      <div style="padding:0 18px 18px; font-size:14px; line-height:2.05; color:#3B382F; white-space:pre-wrap">{{ cur.brief }}</div>
                      <!-- 現場の図。文字だけでは位置関係が掴めないので、資料の中に置く。 -->
                      <div style="display:{{ cur.briefImageShow }}; padding:0 18px 18px">
                        <img src="{{ cur.briefImage }}" alt="{{ cur.briefImageAlt }}" loading="lazy"
                             style="display:block; width:100%; height:auto; border-radius:8px; border:1px solid rgba(20,19,16,.12); background:#FDFCF9">
                      </div>
                    </details>
                    <div style="display:flex; flex-direction:column; gap:6px">
                      <div style="color:var(--emu-brand-strong); font-weight:700; font-size:14px">与件</div>
                      <div style="color:#3B382F; font-size:14px; line-height:2.05; white-space:pre-wrap">{{ cur.given }}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:6px">
                      <div style="color:var(--emu-brand-strong); font-weight:700; font-size:14px">提出するもの</div>
                      <div style="color:#3B382F; font-size:14px; line-height:2.05; white-space:pre-wrap">{{ cur.deliverable }}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:6px">
                      <div style="color:var(--emu-brand-strong); font-weight:700; font-size:14px">評価</div>
                      <div style="color:#3B382F; font-size:14px; line-height:2.05; white-space:pre-wrap">{{ cur.criteria }}</div>
                    </div>
                  </div>
                </sc-if>
                <!-- participation-value:start -->
                <sc-if value="{{ cur.showSteps }}">
                <section class="sp-ux-value" data-ux-value="quest" aria-label="このクエストでできること">
                  <h2>知ったことを試して、自分の学びにする</h2>
                  <p>この課題で試したことを、結果だけでなく考え方や気づきまで記録できます。</p>
                  <dl>
                    <div><dt>使う知識</dt><dd>「元の知識」や現場の資料を手がかりに、自分の経験も課題の条件に照らして使い方を考えます。</dd></div>
                    <div><dt>関わる人・視点</dt><dd>同じ課題を受けている人は参加者一覧で確認できます。報告があれば、ほかの人の試し方や気づきも読めます。</dd></div>
                    <div><dt>残せるもの</dt><dd>自分が試した結果・つまずき・気づきの報告と、学びを一文にした知恵カード。次の実践で振り返る記録になります。</dd></div>
                  </dl>
                  <p>参加後は、課題に取り組み、3種類の報告と知恵カードを提出します。完走には運営の確認も必要です。手順・締切・報酬条件を確かめてから選べます。</p>
                </section>
                </sc-if>
                <!-- participation-value:end -->
              </div>

              <!-- 完走までの手順。完走の決まりはどのクエストも同じだが、
                   3つの報告がそのクエストで何を指すかはクエストごとに違う。
                   中身は親（index.html の spQuestReportGuide）が決めて渡す。 -->
              <sc-if value="{{ cur.showSteps }}">
                <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:{{ L.cardPad }}; display:flex; flex-direction:column; gap:14px">
                  <div style="font-size:15px; font-weight:700">完走までの手順</div>
                  <div style="display:grid; grid-template-columns:28px 1fr; gap:10px; font-size:13px; line-height:1.85">
                    <div style="font-family:Inter,sans-serif; font-size:11px; color:var(--emu-brand-strong); padding-top:2px">1</div>
                    <div style="color:#3B382F"><b>このクエストを受ける</b></div>
                  </div>
                  <sc-for list="{{ cur.reportSteps }}" as="s" hint-placeholder-count="4">
                    <div style="display:grid; grid-template-columns:28px 1fr; gap:10px; font-size:13px; line-height:1.85">
                      <div style="font-family:Inter,sans-serif; font-size:11px; color:var(--emu-brand-strong); padding-top:2px">{{ s.no }}</div>
                      <div style="display:flex; flex-direction:column; gap:2px; min-width:0">
                        <div style="color:#3B382F"><b>{{ s.head }}</b> <span style="display:{{ s.markShow }}; font-size:11px; color:var(--emu-brand-strong); font-weight:700; margin-left:6px">{{ s.mark }}</span></div>
                        <div style="color:#6E695C; white-space:pre-wrap; overflow-wrap:anywhere">{{ s.ask }}</div>
                      </div>
                    </div>
                  </sc-for>
                  <div style="display:grid; grid-template-columns:28px 1fr; gap:10px; font-size:13px; line-height:1.85">
                    <div style="font-family:Inter,sans-serif; font-size:11px; color:var(--emu-brand-strong); padding-top:2px">6</div>
                    <div style="color:#3B382F"><b>運営が確認して完走</b></div>
                  </div>
                  <div style="font-size:12px; line-height:1.8; color:#6E695C; padding-top:10px; border-top:1px solid rgba(20,19,16,.1)">報告は3種類すべてが必要です。「つまずいた」「気づいた」は「やってみた」のあとに出せます。</div>
                </div>
              </sc-if>

              <div style="display:flex; flex-direction:column; gap:16px">
                <div style="display:flex; align-items:baseline; gap:14px">
                  <div style="font-size:17px; font-weight:700">{{ word }}ログ</div>
                  <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                  <div style="font-size:12px; color:#6E695C">{{ cur.logCount }} 件</div>
                </div>
                <sc-if value="{{ cur.canLog }}">
                  <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:20px; display:flex; align-items:center; gap:8px; flex-wrap:wrap">
                    <div style="font-size:13px; color:#6E695C; flex:1; min-width:160px">{{ cur.logLead }}</div>
                    <div onClick="{{ cur.logDid }}" style="padding:8px 14px; border:1px solid rgba(20,19,16,.16); border-radius:16px; font-size:12px; cursor:pointer" style-hover="border-color:var(--emu-brand-strong); color:var(--emu-brand-strong)">やってみた</div>
                    <div onClick="{{ cur.logStuck }}" style="padding:8px 14px; border:1px solid rgba(20,19,16,.16); border-radius:16px; font-size:12px; cursor:pointer" style-hover="border-color:var(--emu-brand-strong); color:var(--emu-brand-strong)">つまずいた</div>
                    <div onClick="{{ cur.logFound }}" style="padding:8px 14px; border:1px solid rgba(20,19,16,.16); border-radius:16px; font-size:12px; cursor:pointer" style-hover="border-color:var(--emu-brand-strong); color:var(--emu-brand-strong)">気づいた</div>
                  </div>
                  <!-- ここに「Emuに投稿する」を置いていた。#003 PLAY を出すときに戻す。

                       いまは要らない。この入口が要るのは #003（拾う前と後の写真と
                       袋の数をEmuに投稿し、その投稿を途中報告で紐づける）だけで、
                       #001 LEARN の中に出ているのは場違いだった。

                       戻すときは、この位置に下を貼り、cur.postEmu も戻す。
                       出す条件は #003 だけに絞ること（例：cur.needsEmuPost）。

                       <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:20px; display:flex; align-items:center; gap:8px; flex-wrap:wrap">
                         <div style="font-size:13px; color:#6E695C; flex:1; min-width:160px">写真や記録をEmuに残す（月の投稿回数に数えません）</div>
                         <div onClick="{{ cur.postEmu }}" style="padding:8px 14px; border:1px solid rgba(20,19,16,.16); border-radius:16px; font-size:12px; cursor:pointer" style-hover="border-color:var(--emu-brand-strong); color:var(--emu-brand-strong)">Emuに投稿する</div>
                       </div>
                  -->
                </sc-if>
                <sc-if value="{{ cur.noLogs }}">
                  <div style="font-size:13px; line-height:1.9; color:#6E695C">まだ報告がありません。受けた人が書くと、ここに並びます。</div>
                </sc-if>
                <sc-for list="{{ curLogs }}" as="l" hint-placeholder-count="3">
                  <div style="display:flex; gap:16px; padding:20px 0; border-bottom:1px solid rgba(20,19,16,.1)">
                    <div style="width:36px; height:36px; flex:0 0 36px; border-radius:50%; background:#E7E2D6; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--emu-brand-strong)">{{ l.initial }}</div>
                    <div style="display:flex; flex-direction:column; gap:8px; min-width:0">
                      <div style="display:flex; gap:10px; align-items:baseline; flex-wrap:wrap">
                        <div style="font-size:14px; font-weight:700">{{ l.author }}</div>
                        <div style="font-size:11px; color:#6E695C">{{ l.time }}</div>
                        <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.12em; padding:3px 8px; border-radius:3px; background:{{ l.kindBg }}; color:{{ l.kindFg }}">{{ l.kind }}</div>
                      </div>
                      <!-- 本文。長い URL がそのまま1行になると、スマホで画面の外まで伸びて
                           横に崩れていた。どこでも折り返す。URL は押して開けるリンクにする
                           （欠片は親の _spTextParts が作る。sc-for の間に空白を入れないこと。
                           改行を残すので、空白もそのまま出る）。 -->
                      <div style="font-size:14px; line-height:1.95; color:#3B382F; text-wrap:pretty; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; min-width:0"><sc-for list="{{ l.bodyParts }}" as="t"><span style="display:{{ t.textShow }}">{{ t.text }}</span><a href="{{ t.href }}" target="_blank" rel="noopener noreferrer" style="display:{{ t.linkShow }}; color:var(--emu-brand-strong); text-decoration:underline">{{ t.text }}</a></sc-for></div>
                      <!-- 報告に添えた画像（「やってみた」）。押すと大きく開く。 -->
                      <div style="display:{{ l.imagesShow }}; flex-wrap:wrap; gap:8px; min-width:0"><sc-for list="{{ l.images }}" as="im"><img src="{{ im.src }}" alt="報告に添えた画像" title="押すと大きく開きます" onClick="{{ im.open }}" loading="lazy" style="display:block; max-width:100%; max-height:420px; width:auto; height:auto; border:1px solid rgba(20,19,16,.12); border-radius:8px; background:#fff; cursor:zoom-in"></sc-for></div>
                      <div style="display:{{ l.threadShow }}; font-size:12px; line-height:1.7; color:var(--emu-brand-strong)">{{ l.threadLabel }}</div>
                      <div onClick="{{ l.openPost }}" style="display:{{ l.fromShow }}; align-items:center; gap:10px; flex-wrap:wrap; background:#F4F1EA; border-radius:8px; padding:10px 12px; cursor:pointer; font-size:12px; line-height:1.7" style-hover="background:#E7E2D6">
                        <span style="color:var(--emu-brand-strong); font-weight:700">元にした知識</span>
                        <span style="flex:1 1 140px; min-width:0; color:#3B382F">{{ l.fromTitle }}</span>
                        <span style="color:var(--emu-brand-strong); font-weight:700; white-space:nowrap">投稿を見る →</span>
                      </div>
                    </div>
                  </div>
                </sc-for>
              </div>
            </div>

            <div class="sp-quest-side" style="display:flex; flex-direction:column; gap:20px; min-width:0; max-width:100%">
              <div style="background:#141310; color:#F4F1EA; border-radius:12px; padding:26px; display:flex; flex-direction:column; gap:20px; min-width:0; box-sizing:border-box; overflow-wrap:anywhere">
                <div style="display:flex; flex-direction:column; gap:8px">
                  <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.2em; color:var(--emu-brand-soft)">ACCEPT</div>
                  <div style="font-size:14px; line-height:1.8; color:rgba(244,241,234,.72)">賛成/反対ではなく、<b style="color:#F4F1EA">自分も受けるか</b>で決める。受けた人数が予算配分になる。</div>
                </div>
                <div style="display:flex; align-items:baseline; gap:8px">
                  <div style="font-family:Inter,sans-serif; font-size:38px; font-weight:600; color:var(--emu-brand-soft)">{{ cur.commits }}</div>
                  <div style="font-size:13px; color:rgba(244,241,234,.6)">/ 成立ライン {{ cur.need }}人</div>
                </div>
                <div style="height:6px; background:rgba(244,241,234,.14); border-radius:3px; overflow:hidden">
                  <div style="height:100%; background:#ffb366; width:{{ cur.progress }}"></div>
                </div>
                <section class="sp-ux-before-accept" data-tour="quest-before-join"><b>参加前に確認</b><p>内容を見るだけでは参加になりません。「受ける」を押すと、あなたの名前が参加者一覧に載り、報告を書けるようになります。</p><dl><div><dt>締切</dt><dd>{{ cur.due }}</dd></div><div><dt>所要時間</dt><dd>要確認（本文・提出物・手順を確認）</dd></div><div><dt>配分予算</dt><dd>{{ cur.budget }}</dd></div></dl><p>完走には、3種類の報告と知恵カード、運営の確認が必要です。個別のやること・評価・手順も確認してください。受けるだけで報酬は確定しません。</p></section>
                <button type="button" class="sp-ux-accept" onClick="{{ cur.commit }}" style="text-align:center; padding:14px; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; background:{{ cur.btnBg2 }}; color:{{ cur.btnFg2 }}; border:1px solid #ffb366">{{ cur.btnLabel }}</button>
                <sc-if value="{{ cur.canWisdom }}">
                  <div onClick="{{ cur.wisdom }}" style="text-align:center; padding:12px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; background:transparent; color:var(--emu-brand-soft); border:1px solid rgba(208,226,190,.45)" style-hover="background:rgba(208,226,190,.12)">知恵カードを置く</div>
                </sc-if>
                <sc-if value="{{ cur.canClose }}">
                  <div onClick="{{ cur.close }}" style="text-align:center; padding:12px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; background:transparent; color:rgba(244,241,234,.66); border:1px solid rgba(244,241,234,.28)" style-hover="background:rgba(244,241,234,.08)">クエストを完了にする</div>
                </sc-if>
                <div style="font-size:12px; line-height:1.8; color:rgba(244,241,234,.5)">未完走なら「受けている」を押して降りる確認に進めます。完走後は記録を守るため降りられません。<br>出した報告は編集・削除できません。</div>
              </div>

              <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:24px; display:flex; flex-direction:column; gap:16px">
                <div style="font-size:14px; font-weight:700">受けている人 {{ cur.commits }}人</div>
                <div style="display:flex; flex-wrap:wrap; gap:8px">
                  <sc-for list="{{ cur.people }}" as="p" hint-placeholder-count="5">
                    <div style="padding:7px 12px; background:#E7E2D6; border-radius:16px; font-size:12px">{{ p }}</div>
                  </sc-for>
                </div>
                <!-- 右の列は狭い。「EMUER個別予算は未公開」のような長い値は、
                     flex のまま入れると縮まずに枠からはみ出して切れる。
                     折り返しを許し、入らなければ値を次の行へ落とす。 -->
                <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; font-size:13px; padding-top:14px; border-top:1px solid rgba(20,19,16,.1)">
                  <div style="color:#6E695C; min-width:0">配分予算</div>
                  <div style="font-family:Inter,sans-serif; font-weight:600; color:var(--emu-brand-strong); min-width:0; text-align:right; overflow-wrap:anywhere">{{ cur.budget }}</div>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; font-size:13px">
                  <div style="color:#6E695C; min-width:0">完走1人あたりの目安</div>
                  <div style="font-family:Inter,sans-serif; font-weight:600; color:var(--emu-brand-strong); min-width:0; text-align:right; overflow-wrap:anywhere">{{ cur.perHead }} / 人</div>
                </div>
              </div>
            </div>
          </div>
        </sc-if>

        <!-- ───── ギルド一覧 ─────
             ここが SchoolPark の「活動領域」の入口。
             議題はギルドの中にあるので、まずギルドを選ぶ。 -->
        <sc-if value="{{ isLogs }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid; grid-template-columns:{{ L.gLogs }}; gap:32px; align-items:start">
            <div style="display:flex; flex-direction:column; gap:22px">

              <div style="display:flex; align-items:baseline; gap:14px">
                <div data-tour="guild-list" style="font-size:17px; font-weight:700">まずは、ギルドの活動を見る</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                <div style="font-size:12px; color:#6E695C">{{ guildCount }}</div>
              </div>

              <p class="sp-ux-note">関心の近い人が、どんなことを考え、試そうとしているのか。ギルドの議題やクエストから、自分の知識・経験を使いたいテーマを探せます。カードを開いても参加登録はされません。</p>
              <div style="display:grid; grid-template-columns:{{ L.g2 }}; gap:14px">
                <sc-for list="{{ guilds }}" as="g" hint-placeholder-count="5">
                  <div role="button" tabindex="0" class="sp-ux-guild-card" data-tour="guild-card" onClick="{{ g.open }}" style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-left:4px solid {{ g.accent }}; border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:12px; cursor:pointer" style-hover="background:#F4F1EA">
                    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
                      <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.16em; color:#9A9484">{{ g.code }}</div>
                      <div style="font-family:Inter,sans-serif; font-size:15px; font-weight:700; letter-spacing:.08em; color:{{ g.accent }}">{{ g.short }}</div>
                      <div style="flex:1; min-width:0"></div>
                      <div style="display:{{ g.meShow }}; font-size:10px; padding:4px 8px; border-radius:4px; background:#fff2e5; color:var(--emu-brand-strong); white-space:nowrap">{{ g.meLabel }}</div>
                    </div>
                    <div style="font-size:15px; font-weight:700; line-height:1.6; text-wrap:pretty">{{ g.concept }}</div>
                    <div style="display:flex; flex-wrap:wrap; gap:6px 16px; padding-top:10px; border-top:1px solid rgba(20,19,16,.1); font-size:11px; color:#6E695C">
                      <div>参加したい <b style="font-family:Inter,sans-serif; font-size:13px; color:var(--emu-brand-strong)">{{ g.joinCount }}</b></div>
                      <div>応援 <b style="font-family:Inter,sans-serif; font-size:13px; color:var(--emu-brand-strong)">{{ g.supportCount }}</b></div>
                      <div>議題 <b style="font-family:Inter,sans-serif; font-size:13px; color:var(--emu-brand-strong)">{{ g.proposalCount }}</b></div>
                      <div>クエスト <b style="font-family:Inter,sans-serif; font-size:13px; color:var(--emu-brand-strong)">{{ g.questCount }}</b></div>
                      <span class="sp-ux-browse-label">活動を見る →</span>
                    </div>
                  </div>
                </sc-for>
              </div>

              <sc-if value="{{ hasUnsorted }}">
                <div onClick="{{ guildUnsorted.open }}" style="background:#FBF9F3; border:1px dashed rgba(20,19,16,.22); border-radius:12px; padding:18px 20px; display:flex; align-items:center; gap:12px; cursor:pointer; flex-wrap:wrap" style-hover="background:#F4F1EA">
                  <div style="flex:1; min-width:0; font-size:13px; line-height:1.8; color:#6E695C">ギルドができる前に出された議題があります。投票はこれまでどおりできます。</div>
                  <div style="font-size:13px; font-weight:700; color:var(--emu-brand-strong); white-space:nowrap">{{ guildUnsorted.label }} →</div>
                </div>
              </sc-if>
            </div>

            <div style="background:#E7E2D6; border-radius:12px; padding:26px; display:flex; flex-direction:column; gap:18px">
              <div data-tour="guild-rules" style="font-size:15px; font-weight:700">ギルドの決まり</div>
              <div style="background:#F4F1EA; border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:8px">
                <div style="font-size:13px; line-height:1.85; color:#3B382F"><b>ギルド</b>　同じ目的を持つ人が集まる活動領域</div>
                <div style="font-size:13px; line-height:1.85; color:#3B382F"><b>議題</b>　みんなで考え、決めること</div>
                <div style="font-size:13px; line-height:1.85; color:#3B382F"><b>クエスト</b>　決めたこと・試したいことを実際にやる</div>
              </div>
              <div style="font-size:13px; line-height:1.95; color:#3B382F">議題を出せるのは、運営・有料の方・信用が足りている方です。<b>一般議題</b>は誰でも投票できます。<b>特殊議題</b>は、関われる方だけが投票できます。これはギルドの分類ではなく、議題ごとの決め方です。同じギルドの中に両方が並びます。票は1つのパスポートにつき1票で、入れた票は取り消しも書き換えもできません。</div>
              <div style="background:#F4F1EA; border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:6px">
                <div style="font-size:12px; color:#6E695C">あなたの信用スコア</div>
                <div style="font-family:Inter,sans-serif; font-size:22px; font-weight:600; color:var(--emu-brand-strong)">{{ trust.total }} <span style="font-size:12px; color:#6E695C">/ {{ trust.need }}</span></div>
                <div style="font-size:11px; line-height:1.8; color:#6E695C">{{ trust.detail }}</div>
              </div>
              <div style="display:flex; flex-direction:column; gap:10px; padding-top:6px">
                <div style="display:flex; gap:12px; align-items:center; font-size:13px"><div style="font-family:Inter,sans-serif; font-size:10px; color:var(--emu-brand-strong); letter-spacing:.1em">01</div>ギルドを選ぶ</div>
                <div style="display:flex; gap:12px; align-items:center; font-size:13px"><div style="font-family:Inter,sans-serif; font-size:10px; color:var(--emu-brand-strong); letter-spacing:.1em">02</div>議題を出す</div>
                <div style="display:flex; gap:12px; align-items:center; font-size:13px"><div style="font-family:Inter,sans-serif; font-size:10px; color:var(--emu-brand-strong); letter-spacing:.1em">03</div>締切まで投票する</div>
                <div style="display:flex; gap:12px; align-items:center; font-size:13px"><div style="font-family:Inter,sans-serif; font-size:10px; color:var(--emu-brand-strong); letter-spacing:.1em">04</div>採択された議題をクエストにする</div>
                <div style="display:flex; gap:12px; align-items:center; font-size:13px"><div style="font-family:Inter,sans-serif; font-size:10px; color:var(--emu-brand-strong); letter-spacing:.1em">05</div>実際にやって、結果が残る</div>
              </div>
              <div style="font-size:12px; line-height:1.9; color:#6E695C; padding-top:4px; border-top:1px solid rgba(20,19,16,.12)">小さな実験や個人の挑戦は、議題を通さずクエストから直接始められます。</div>
            </div>
          </div>
        </sc-if>

        <!-- ───── ギルドの中 ─────
             そのギルドの議題と、そこから生まれたクエストが並ぶ。 -->
        <sc-if value="{{ isGuild }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; gap:26px">

            <div onClick="{{ goLogs }}" style="font-size:12px; color:#6E695C; cursor:pointer">← ギルド</div>

            <div style="background:#141310; color:#F4F1EA; border-radius:12px; padding:{{ L.cardPad }}; display:flex; flex-direction:column; gap:16px">
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
                <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.22em; color:#9A9484">{{ curGuild.code }}</div>
                <div style="font-family:Inter,sans-serif; font-size:16px; font-weight:700; letter-spacing:.1em; color:var(--emu-brand-soft)" data-tour="guild-detail">{{ curGuild.short }}</div>
              </div>
              <div style="font-family:'Zen Old Mincho',serif; font-size:{{ L.heroSize }}; font-weight:900; line-height:1.5; text-wrap:pretty">{{ curGuild.concept }}</div>
              <div style="font-size:14px; line-height:1.95; color:rgba(244,241,234,.72)">{{ curGuild.body }}</div>
              <sc-if value="{{ curGuild.hasThemes }}">
                <div style="display:flex; flex-wrap:wrap; gap:8px; padding-top:6px">
                  <sc-for list="{{ curGuild.themes }}" as="t" hint-placeholder-count="6">
                    <div style="padding:6px 12px; border:1px solid rgba(244,241,234,.22); border-radius:16px; font-size:12px; color:rgba(244,241,234,.82)">{{ t }}</div>
                  </sc-for>
                </div>
              </sc-if>
            </div>

            <!-- participation-value:start -->
            <section class="sp-ux-value" data-ux-value="guild" aria-label="このギルドでできること">
              <h2>「{{ curGuild.short }}」で、関心を次の行動へ</h2>
              <dl>
                <div><dt>知識を使うテーマを探す</dt><dd>上のテーマと、下の議題・クエストから、自分の知識や経験を活かして考えたいこと・試したいことを選べます。</dd></div>
                <div><dt>関心の近い人の視点を知る</dt><dd>この分野に関心を持つ人が出した議題や、クエストの報告を読めます。投票資格を満たす議題では、自分の意思を投票で示せます。</dd></div>
                <div><dt>考えたことを実践へつなぐ</dt><dd>気になるクエストがあれば、条件を確かめて選べます。実際に取り組んだことは、報告や知恵カードとして残せます。</dd></div>
              </dl>
            </section>
            <!-- participation-value:end -->
            <section class="sp-ux-note" data-tour="guild-before-join"><b>まずは、活動したい分野を伝える</b><p>「参加したい」は、この分野で活動したい意思の登録です。押すと参加希望の人数に加わります。次に関わる議題やクエストは自分で選びます。仕事・クエストの受注や締切の設定は行われません。クエストを受ける・議題に投票するのは、それぞれ別の操作です。</p><p>登録せずに議題やクエストを読むこともできます。「参加したい」「応援する」は同じボタンをもう一度押すと取り消せます。登録した名前は公開の記録になります。</p></section>
            <sc-if value="{{ curGuild.canAct }}">
              <div style="display:grid; grid-template-columns:{{ L.g2 }}; gap:14px">
                <div style="display:flex; flex-direction:column; gap:8px">
                  <button type="button" class="sp-ux-guild-action" onClick="{{ curGuild.join }}" style="text-align:center; padding:14px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; background:{{ curGuild.joinBg }}; color:{{ curGuild.joinFg }}; border:1px solid var(--emu-brand-strong)">{{ curGuild.joinLabel }}　{{ curGuild.joinCount }}</button>
                  <div style="font-size:11px; line-height:1.8; color:#6E695C; text-align:center">{{ curGuild.joinHint }}</div>
                </div>
                <div style="display:flex; flex-direction:column; gap:8px">
                  <button type="button" class="sp-ux-guild-action" onClick="{{ curGuild.support }}" style="text-align:center; padding:14px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; background:{{ curGuild.supportBg }}; color:{{ curGuild.supportFg }}; border:1px solid #141310">{{ curGuild.supportLabel }}　{{ curGuild.supportCount }}</button>
                  <div style="font-size:11px; line-height:1.8; color:#6E695C; text-align:center">{{ curGuild.supportHint }}</div>
                </div>
              </div>
            </sc-if>

            <sc-if value="{{ curGuild.loading }}">
              <div style="font-size:13px; line-height:1.9; color:#6E695C">読み込んでいます…</div>
            </sc-if>

            <div style="display:flex; flex-direction:column; gap:16px">
              <div style="display:flex; align-items:baseline; gap:14px">
                <div style="font-size:17px; font-weight:700">現在の議題</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                <sc-if value="{{ curGuild.canAct }}">
                  <div onClick="{{ curGuild.propose }}" style="font-size:12px; font-weight:700; color:var(--emu-brand-strong); cursor:pointer; white-space:nowrap">＋ 議題を出す</div>
                </sc-if>
              </div>
              <sc-if value="{{ curGuild.noVotes }}">
                <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:22px; font-size:13px; line-height:1.9; color:#6E695C">まだ議題がありません。「＋ 議題を出す」から、このギルドで決めたいことを出せます。</div>
              </sc-if>
              <sc-for list="{{ curGuild.votes }}" as="v" hint-placeholder-count="2">
                <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:22px; display:flex; flex-direction:column; gap:14px">
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap">
                    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
                      <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.16em; padding:5px 10px; border-radius:4px; background:{{ v.stateBg }}; color:{{ v.stateFg }}">{{ v.stateLabel }}</div>
                      <div style="font-size:10px; letter-spacing:.06em; padding:5px 10px; border-radius:4px; background:{{ v.kindBg }}; color:{{ v.kindFg }}">{{ v.kindLabel }}</div>
                    </div>
                    <div style="font-size:12px; color:#6E695C">{{ v.closes }}</div>
                  </div>
                  <div style="font-size:17px; font-weight:700; line-height:1.55; text-wrap:pretty">{{ v.title }}</div>
                  <div style="font-size:13px; line-height:1.9; color:#3B382F">{{ v.body }}</div>
                  <div style="display:flex; flex-direction:column; gap:8px">
                    <sc-for list="{{ v.options }}" as="o" hint-placeholder-count="2">
                      <div onClick="{{ o.go }}" style="position:relative; overflow:hidden; border:1px solid {{ o.border }}; border-radius:8px; padding:12px 14px; cursor:{{ o.cursor }}; background:#F4F1EA">
                        <div style="position:absolute; left:0; top:0; bottom:0; width:{{ o.pct }}; background:{{ o.barBg }}"></div>
                        <div style="position:relative; display:flex; justify-content:space-between; gap:12px; font-size:14px; font-weight:{{ o.weight }}; color:#141310">
                          <div>{{ o.label }}</div>
                          <div style="font-family:Inter,sans-serif; color:var(--emu-brand-strong)">{{ o.countLabel }}</div>
                        </div>
                      </div>
                    </sc-for>
                  </div>
                  <sc-if value="{{ v.isAdopted }}">
                    <div style="font-size:12px; font-weight:700; color:var(--emu-brand-strong)">{{ v.adoptedLabel }}</div>
                  </sc-if>
                  <div style="font-size:12px; color:#6E695C">{{ v.note }}</div>
                  <sc-if value="{{ v.hasQuest }}">
                    <div onClick="{{ v.goQuest }}" style="display:flex; align-items:center; gap:10px; padding:12px 14px; background:#E7E2D6; border-radius:8px; cursor:pointer; flex-wrap:wrap" style-hover="background:#DDD7C8">
                      <div style="font-size:11px; color:#6E695C">この議題から生まれたクエスト</div>
                      <div style="font-size:13px; font-weight:700; color:var(--emu-brand-strong)">{{ v.questLabel }} →</div>
                    </div>
                  </sc-if>
                  <div style="display:flex; gap:8px; flex-wrap:wrap">
                    <sc-if value="{{ v.canAdopt }}">
                      <div onClick="{{ v.adopt }}" style="padding:10px 16px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; background:transparent; color:var(--emu-brand-strong); border:1px solid var(--emu-brand-strong)" style-hover="background:#E7E2D6">採択する（運営）</div>
                    </sc-if>
                    <sc-if value="{{ v.canQuest }}">
                      <div onClick="{{ v.toQuest }}" style="padding:10px 16px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; background:var(--emu-brand-strong); color:#F4F1EA; border:1px solid var(--emu-brand-strong)" style-hover="background:#d97600">Questにする</div>
                    </sc-if>
                    <sc-if value="{{ v.canSetGuild }}">
                      <div onClick="{{ v.setGuild }}" style="padding:10px 16px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; background:transparent; color:#6E695C; border:1px solid rgba(20,19,16,.2)" style-hover="background:#E7E2D6">ギルドを割り当てる（運営）</div>
                    </sc-if>
                  </div>
                </div>
              </sc-for>
            </div>

            <sc-if value="{{ curGuild.canAct }}">
            <div style="display:flex; flex-direction:column; gap:16px">
              <div style="display:flex; align-items:baseline; gap:14px">
                <div style="font-size:17px; font-weight:700">このギルドから生まれたクエスト</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
              </div>
              <sc-if value="{{ curGuild.noQuests }}">
                <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:22px; font-size:13px; line-height:1.9; color:#6E695C">まだクエストがありません。採択された議題を「Questにする」と、ここに並びます。</div>
              </sc-if>
              <sc-for list="{{ curGuild.quests }}" as="q" hint-placeholder-count="2">
                <div onClick="{{ q.open }}" style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:18px 20px; display:flex; align-items:center; gap:14px; cursor:pointer; flex-wrap:wrap" style-hover="background:#F4F1EA">
                  <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.16em; padding:5px 10px; border-radius:4px; background:{{ q.statusBg }}; color:{{ q.statusFg }}">{{ q.status }}</div>
                  <div style="flex:1; min-width:140px; font-size:14px; font-weight:700; line-height:1.6">{{ q.title }}</div>
                  <div style="font-size:11px; color:#6E695C; white-space:nowrap">{{ q.fromLabel }}</div>
                  <div style="font-size:12px; font-weight:700; color:var(--emu-brand-strong); white-space:nowrap">詳細 →</div>
                </div>
              </sc-for>
            </div>
            </sc-if>

          </div>
        </sc-if>

        <sc-if value="{{ isLibrary }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; gap:26px">
            <div style="background:#141310; color:#F4F1EA; border-radius:12px; padding:{{ L.cardPad }}; display:flex; align-items:center; gap:32px; flex-wrap:wrap">
              <div style="flex:1; min-width:220px; display:flex; flex-direction:column; gap:10px">
                <div style="font-family:'Zen Old Mincho',serif; font-size:26px; font-weight:900; line-height:1.5" data-tour="wisdom-intro wisdom-hero">DAOの資産は、金庫ではなくここにある。</div>
                <sc-if value="{{ showLibraryToggle }}"><button onClick="{{ toggleLibrarySummary }}" style="align-self:flex-start; font:inherit; background:#fff2e5; color:#141310; border:0; border-radius:6px; padding:10px 16px; cursor:pointer">{{ libraryToggleLabel }}</button></sc-if>
                <sc-if value="{{ showLibraryDetails }}"><div style="font-size:13px; line-height:1.9; color:rgba(244,241,234,.66)">知恵カードは「元の知識 → 通した経験 → 残った一文」で1枚。引用はほかの人がこの知恵を参考にした記録です。書き手の信用スコアに反映されます。EMUERの自動付与はまだありません。</div></sc-if>
              </div>
              <sc-if value="{{ showLibraryDetails }}"><div style="display:flex; gap:28px">
                <div style="display:flex; flex-direction:column; gap:6px"><div style="font-family:Inter,sans-serif; font-size:30px; font-weight:600; color:var(--emu-brand-soft)">{{ stats.wisdomTotal }}</div><div style="font-size:12px; color:rgba(244,241,234,.6)">知恵</div></div>
                <div style="display:flex; flex-direction:column; gap:6px"><div style="font-family:Inter,sans-serif; font-size:30px; font-weight:600; color:var(--emu-brand-soft)">{{ stats.citations }}</div><div style="font-size:12px; color:rgba(244,241,234,.6)">引用</div></div>
              </div></sc-if>
            </div>
            <div data-tour="wisdom-tags" style="display:flex; gap:8px; flex-wrap:wrap">
              <sc-for list="{{ tags }}" as="t" hint-placeholder-count="5">
                <div data-tour="nav-{{ t.n }}" onClick="{{ t.go }}" style="padding:8px 14px; border:1px solid {{ t.border }}; border-radius:18px; font-size:12px; cursor:pointer; background:{{ t.bg }}; color:{{ t.fg }}" style-hover="border-color:var(--emu-brand-strong)">{{ t.label }}</div>
              </sc-for>
            </div>
            <sc-if value="{{ noWisdom }}">
              <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:22px; font-size:13px; line-height:1.9; color:#6E695C">まだ知恵カードがありません。知恵は、クエストを受けてやってみた人が置きます。</div>
            </sc-if>
            <sc-if value="{{ noHit }}">
              <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:22px; font-size:13px; line-height:1.9; color:#6E695C">この分類の知恵はまだありません。</div>
            </sc-if>
            <!-- 段組み（columns）だと、カードが中身の分だけ伸び縮みして高さがそろわない。
                 グリッドにして、同じ行のカードを同じ高さに引き伸ばす。 -->
            <div style="display:grid; grid-template-columns:repeat({{ L.libCols }}, minmax(0, 1fr)); gap:16px; align-items:stretch">
              <sc-for list="{{ wisdom }}" as="w" hint-placeholder-count="6">
                <!-- height:100% は付けない。行の高さはグリッドが中身から決めて、
                     そろえる（align-items:stretch）。100% を付けると、スマホで中身の
                     ほうが高いカードが、下のカードに重なっていた。 -->

var React = { createRef: function () { return { current: null }; } };

var DCLogic = function () {};
DCLogic.prototype.setState = function (upd) {
  var next = (typeof upd === 'function') ? upd(this.state) : upd;
  /* 読み込み結果が実際に渡った項目だけを覚える。初期値の空配列とは区別する。
     ガイド専用の一時フラグで、データや進捗として保存しない。 */
  if (next && this.tourDataReady) {
    ['me','tasks','guilds','quests','wisdom','yearDoc'].forEach(function (key) {
      if (Object.prototype.hasOwnProperty.call(next, key)) this.tourDataReady[key] = true;
    }, this);
  }
  this.state = Object.assign({}, this.state, next);
  if(next && Object.hasOwn(next,'screen')) { try { window.parent.EmuNavigation?.sync(this.state.screen); } catch(_) {} }
  schedule();
};

class Component extends DCLogic {
  tourDataReady = Object.create(null);

  state = { screen:initialScreen, expId:'', filter:'すべて', series:'general', entryOnly:false, yearDoc:null, questsDenied:false, questsNote:'', step:0, committed:{}, device:(window.innerWidth < 700 ? 'mobile' : window.innerWidth < 1100 ? 'tablet' : 'pc'), me:{name:'ゲスト', initial:'ー', line:'WISDOM 0 · クエスト 0'}, quests:[], noQuests:true, guilds:[], guildCount:'', guildUnsorted:{count:0, label:'', open:function(){}}, hasUnsorted:false, curGuild:{},  wisdom:[], wOpen:{}, noWisdom:true, citations:0, wtag:'すべて', canGuild:false, trust:{total:0, need:20, detail:'読み込んでいます…'}, vw: window.innerWidth, vh: window.innerHeight, tasks:[], noTasks:true, today:'' };

  /* 追加欄に打った途中の中身。

  go(screen){ const aliases={home:'experiments',park:'city',plaza:'city',members:'library',treasury:'experiments'};screen=aliases[screen]||screen;return () => { if(this.bottomRef.current) this.tabScrollLeft = this.bottomRef.current.scrollLeft; this.setState({screen}); this.toTop(); }; }

  /* 知恵カードをたたむ。知恵は4行・知識と経験は3行まで、報告は「詳細を見る」で出す。
     短いカードはたたむものが無いので、ボタンも出さない。 */
  foldWisdom(w, s){
    const nReports = (w.reports || []).length;
    const long = String(w.insight || '').length > 48 || String(w.from || '').length > 66
      || String(w.experiment || '').length > 66 || nReports > 0;
    const open = !long || !!(s.wOpen || {})[w.id];
    return { ...w, moreOpen: open ? 'true' : 'false',
      clampInsight: open ? 'none' : '4', clampMeta: open ? 'none' : '3',
      reportsOn: !!w.hasReports && open,
      moreShow: long ? 'block' : 'none',
      moreLabel: (s.wOpen || {})[w.id] ? '閉じる' : '詳細を見る' + (nReports ? '（報告' + nReports + '件）' : ''),

      canWisdom: !e.isFounder && !!e.iTook,
      canLog: !e.isFounder && !!e.iTook && e.status !== 'CLOSED',
      /* 完走までの手順。#000（原点）には報告も完走も無いので出さない。 */
      showSteps: !e.isFounder && !!(e.reportSteps && e.reportSteps.length),
      logLead: e.logLead || '今日やったことを書く',

      /* このクエストのためにEmuへ投稿する入口は、いまは出していない。

    };

  renderVals(){
    const s = this.state, W = 'クエスト';
    const base = LAYOUTS[s.device];
    const k = 1;   /* 本番では縮小しない */
    const hasSidebar = base.sidebar !== 'none';
    const sidebarOpen = hasSidebar && s.sidebarOpen;
    const L = {...base, menuShow: hasSidebar ? 'none' : 'flex', sidebarShow:sidebarOpen ? 'flex' : 'none', sidebarToggle:hasSidebar && !sidebarOpen ? 'flex' : 'none', w: '100%', h: '100%', scale: 'none', boxH: '100vh', frameR: '0'};
    /* 左の並び。「考える → 決める → やる → 残す」の順に置き、

    const heads = {

    const exps = allQuests.filter(e => !e.isFounder);
    const cur = allQuests.find(e => e.id === s.expId) || exps[0] || {};
    /* 系列の切り替え。一般が最初に出る。

       渡してくる（消えないように）。Quest #000 は一覧の外に別で出している。 */
    const curSeries = s.series === 'special' ? 'special' : 'general';
    const seriesFilters = [['general','一般'],['special','特殊']].map(([id,label]) => ({
      label, go:()=>this.setQuestFilter({series:id}),
      bg: curSeries===id ? '#f08300' : 'transparent',
      fg: curSeries===id ? '#F4F1EA' : '#b85f00',

    const seriesExps = exps.filter(e => (e.series || 'general') === curSeries);
    const filters = ['すべて','募集中','進行中','完了'].map(f => ({

      bg: s.filter===f ? '#141310' : 'transparent', fg: s.filter===f ? '#F4F1EA' : '#3B382F'}));
    const fmap = {'募集中':'OPEN','進行中':'RUNNING','完了':'CLOSED'};
    const statusExps = s.filter==='すべて' ? seriesExps : seriesExps.filter(e => e.status === fmap[s.filter]);
    const shownExps = s.entryOnly ? statusExps.filter(e => e.stage === '入門') : statusExps;
    const kind = k => k==='つまずいた' ? ['#F0DCD2','#A85A33'] : k==='気づいた' ? ['#0F5C3F','#F4F1EA'] : ['#E7E2D6','#3B382F'];
    const logs = LOGS.map(l => { const c = kind(l.kind); return {...l, kindBg:c[0], kindFg:c[1]}; });

    /* ───── 自分の宿題 ───── */

    /* 締切まであと何日か。きょうの日付は親からもらう（端末の時計で作っている）。 */
    const today = s.today || '';
    const daysTo = (due) => {
      if (!due || !today) return null;
      const a = new Date(today + 'T00:00:00'), b = new Date(due + 'T00:00:00');
      if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
      return Math.round((b - a) / 86400000);
    };
    const dueText = (due) => {
      if (!due) return '締切なし';
      const when = Number(due.slice(5,7)) + '/' + Number(due.slice(8,10));
      const n = daysTo(due);
      if (n === null) return when;
      if (n < 0)  return when + '・' + (-n) + '日すぎている';
      if (n === 0) return when + '・きょうまで';
      if (n === 1) return when + '・あした';
      return when + '・あと' + n + '日';
    };

    const brandOf = (id) => TASK_BRANDS.find(b => b[0] === id) || TASK_BRANDS[3];
    const shapeTask = (t) => {
      const b = brandOf(t.brand);
      const n = daysTo(t.due);
      const late  = !t.done && t.due && n !== null && n < 0;
      const soon  = !t.done && t.due && n !== null && n === 0;
      return {...t,
        brandLabel:b[1], brandColor:b[2],
        dueLabel:dueText(t.due),
        dueColor: late ? '#A32020' : soon ? '#C2703D' : '#6E695C',
        meta: b[1] + '・' + dueText(t.due),
        label: t.title,
        mark: t.done ? '✓' : '',
        markBg: t.done ? '#f08300' : 'transparent',
        markFg: t.done ? '#F4F1EA' : '#b85f00',
        titleColor: t.done ? '#9A9484' : '#141310',
        titleLine: t.done ? 'line-through' : 'none',
        hasNote: !!t.note, hasQuest: !!t.questTitle,
        questLabel: t.questTitle ? ('クエスト：' + t.questTitle) : '',
        toggle: () => { try { window.parent.spTaskToggle(this, t.id, !t.done); } catch (e) {} },
        remove: () => { try { window.parent.spTaskDelete(this, t.id, t.title); } catch (e) {} }
      };
    };

    /* 締切のあるものが先。日付の早い順。締切なしは後ろで、書いた順。 */
    const byDue = (a, b) => {
      const ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
      if (ad !== bd) return ad < bd ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);

    const allTasks = s.tasks || [];
    const openTasks = allTasks.filter(t => !t.done).sort(byDue).map(shapeTask);
    /* 受けているクエストも、宿題として並べる（自分で書かなくても出る）。

        meta: (q.due && q.due !== '締切なし') ? ('締切 ' + q.due) : '',
        metaShow: (q.due && q.due !== '締切なし') ? 'block' : 'none',
        open: this.openExp(q.id)
      };
    });
    const doneTasks = allTasks.filter(t => t.done)
      .sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 20).map(shapeTask);
    const lateCount  = openTasks.filter(t => t.due && daysTo(t.due) < 0).length;
    const todayCount = openTasks.filter(t => t.due && daysTo(t.due) === 0).length;
    /* 年末まで。「年末までに結果を出す」ための残り日数。 */
    const yearEnd = today ? daysTo(today.slice(0,4) + '-12-31') : null;

    const setDraft = (k, v) => { this.draft[k] = v; };
    const isMobile = s.device === 'mobile';

    return {
      L, word:W, wordShort:'経験', scrollRef:this.scroller, bottomRef:this.bottomRef,
      showFounderToggle:isMobile,
      showFounderDetails:!isMobile || this.founderExpanded,
      founderToggleLabel:this.founderExpanded ? '閉じる' : '詳しく見る',

      showLibraryToggle:isMobile,
      showLibraryDetails:!isMobile || this.libraryExpanded,
      libraryToggleLabel:this.libraryExpanded ? '閉じる' : '詳しく見る',

      me:s.me,
      openMenu:() => { try { window.parent.openSpMobileMenu(); } catch (e) {} },

      /* ギルド。中身は枠の外（親）が記録から作って渡す */
      guilds:s.guilds || [], guildCount:s.guildCount || '',
      guildUnsorted:s.guildUnsorted || {label:'', open:function(){}},
      hasUnsorted:!!s.hasUnsorted, curGuild:s.curGuild || {},
      entryOnly:!!s.entryOnly, toggleEntryOnly:()=>this.setQuestFilter({entryOnly:!s.entryOnly}), noShownQuests:shownExps.length===0, resetQuestFilters:()=>this.setQuestFilter({entryOnly:false,filter:'すべて'}),
      noQuests:exps.length === 0,
      noWisdom:s.noWisdom,
      noHit:!s.noWisdom && s.wtag !== 'すべて' && !(s.wisdom || []).some(w => w.tag === s.wtag),
      head: {kicker: (heads[s.screen] || heads.experiments)[0], title: (heads[s.screen] || heads.experiments)[1]},
      isCity:s.screen==='city', goCity:this.go('city'),
      showCityReturn:!!this.cityReturn && ['experiments','detail','guild'].includes(s.screen),
      isExperiments:s.screen==='experiments', isDetail:s.screen==='detail' && !cur.isFounder,

      showFounder:!!founder && s.screen==='experiments',
      /* SchoolParkの年内目標。#000 と同じくクエストの画面の頭に置く。
