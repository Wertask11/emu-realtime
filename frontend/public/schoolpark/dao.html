<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolPark DAO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#D0E2BE; }
  a { color:#0F5C3F; text-decoration:none; }
  a:hover { color:#0A3F2B; }
  ::-webkit-scrollbar { width:10px; height:10px }
  ::-webkit-scrollbar-thumb { background:rgba(20,19,16,.18); border-radius:8px }
</style>
<style>
/* 枠のまわりの余白・角丸・影を外す。
   これらはテンプレートに直に書かれていて、「確かめるための枠」を
   見せるためのもの。本番では画面いっぱいに出すので要らない。
   入れ子はこの3段で固定されている:
     いちばん外（背景）> 枠の入れ物 > 枠 */
#dao-root > div            { padding-bottom: 0 !important; }
#dao-root > div > div      { padding: 0 !important; }
#dao-root > div > div > div{ border-radius: 0 !important; box-shadow: none !important; }
html, body                 { height: 100%; }
</style>
</head>
<body>
<div id="dao-root"></div>

<!-- 設計ファイルのテンプレート。ここは1文字も変えていない -->
<template id="dao-template">

<div style="min-height:100vh; background:#D0E2BE; font-family:'Zen Kaku Gothic New',sans-serif; padding:0 0 60px">


  <div style="padding:24px 20px 0; display:flex; justify-content:center; overflow:hidden; height:{{ L.boxH }}">
  <div style="width:{{ L.w }}; height:{{ L.h }}; flex:none; transform:{{ L.scale }}; transform-origin:top center; background:#F4F1EA; color:#141310; border-radius:{{ L.frameR }}; overflow:hidden; box-shadow:0 18px 48px rgba(20,19,16,.14); display:flex">

    <div style="display:{{ L.sidebarShow }}; width:248px; flex:0 0 248px; background:#141310; color:#F4F1EA; flex-direction:column; overflow-y:auto">
      <div style="padding:24px 18px 22px 24px; display:flex; align-items:flex-start; gap:12px; border-bottom:1px solid rgba(244,241,234,.12)">
        <div style="display:flex; flex:1; flex-direction:column; gap:6px; position:relative">
          <div onClick="{{ toggleBrand }}" title="ブランドを切り替える" style="display:flex; align-items:center; gap:8px; cursor:pointer">
            <div style="font-family:'Zen Old Mincho',serif; font-size:23px; font-weight:900; letter-spacing:.02em">SchoolPark</div>
            <div style="font-family:Inter,sans-serif; font-size:12px; color:#D0E2BE">{{ brandIcon }}</div>
          </div>
          <sc-if value="{{ brandOpen }}">
            <div style="position:absolute; top:38px; left:0; z-index:20; min-width:168px; background:#1D1B16; border:1px solid rgba(244,241,234,.16); border-radius:10px; padding:6px; display:flex; flex-direction:column; gap:2px; box-shadow:0 18px 40px -14px rgba(0,0,0,.7)">
              <sc-for list="{{ brands }}" as="b">
                <div onClick="{{ b.go }}" style="padding:9px 11px; border-radius:7px; cursor:pointer; font-size:14px; font-weight:700; background:{{ b.bg }}; color:{{ b.fg }}" style-hover="background:rgba(244,241,234,.09)">{{ b.label }}</div>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <div onClick="{{ toggleSidebar }}" title="サイドバーを閉じる" style="width:32px; height:32px; border:1px solid rgba(244,241,234,.18); border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:Inter,sans-serif; font-size:18px; color:#D0E2BE" style-hover="background:rgba(244,241,234,.1)">‹</div>
      </div>
      <div style="flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:2px">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="8">
          <div onClick="{{ item.go }}" style="display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; line-height:1.3; background:{{ item.bg }}; color:{{ item.fg }}" style-hover="background:rgba(244,241,234,.09)">
            <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.12em; width:18px; opacity:.55">{{ item.num }}</div>
            <div>{{ item.label }}</div>
          </div>
        </sc-for>
      </div>
      <div style="padding:18px 20px 22px; border-top:1px solid rgba(244,241,234,.12); display:flex; flex-direction:column; gap:12px">
        <div style="display:flex; justify-content:space-between; align-items:baseline">
          <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.2em; opacity:.5">TREASURY</div>
          <div style="font-family:Inter,sans-serif; font-size:15px; font-weight:600; color:#D0E2BE">¥{{ treasury.total }}</div>
        </div>
        <div onClick="{{ openPassport }}" title="SchoolPark パスポートを見る" style="display:flex; align-items:center; gap:10px; padding:4px 8px 6px; margin:0 -8px; border-radius:8px; cursor:pointer" style-hover="background:rgba(244,241,234,.08)">
          <div style="width:32px; height:32px; border-radius:50%; background:#0F5C3F; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700">{{ me.initial }}</div>
          <div style="display:flex; flex-direction:column; gap:2px">
            <div style="font-size:13px; font-weight:500">{{ me.name }}</div>
            <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.1em; color:#D0E2BE">{{ me.line }}</div>
          </div>
        </div>
      </div>
    </div>

    <div style="flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:{{ L.scrollY }}" ref="{{ scrollRef }}">

      <div style="background:#F4F1EA; border-bottom:1px solid rgba(20,19,16,.12); padding:{{ L.headPad }}; position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:16px">
        <div onClick="{{ toggleSidebar }}" title="{{ sidebarButtonTitle }}" style="display:{{ L.sidebarToggle }}; width:38px; height:38px; flex:0 0 38px; border:1px solid rgba(20,19,16,.16); border-radius:7px; align-items:center; justify-content:center; cursor:pointer; font-family:Inter,sans-serif; font-size:18px; color:#0F5C3F" style-hover="background:#E7E2D6">{{ sidebarButtonIcon }}</div>
        <div style="display:flex; flex-direction:column; gap:5px; flex:1; min-width:0">
          <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.22em; color:#0F5C3F">{{ head.kicker }}</div>
          <div style="font-size:{{ L.headSize }}; font-weight:700; letter-spacing:.02em">{{ head.title }}</div>
        </div>
        <div onClick="{{ openMenu }}" title="メニュー" style="display:{{ L.menuShow }}; width:38px; height:38px; flex:0 0 38px; border:1px solid rgba(20,19,16,.16); border-radius:7px; align-items:center; justify-content:center; cursor:pointer; font-family:Inter,sans-serif; font-size:16px; color:#0F5C3F" style-hover="background:#E7E2D6">☰</div>
        <div onClick="{{ askReizo }}" title="冷蔵庫くんに聞く" style="width:38px; height:38px; flex:0 0 38px; border:1px solid rgba(20,19,16,.16); border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden" style-hover="background:#E7E2D6"><img src="/assets/mascot.jpg" alt="冷蔵庫くん" style="width:100%; height:100%; object-fit:cover"></div>
      </div>

      <div style="padding:{{ L.pad }}; display:flex; flex-direction:column; gap:36px">

        <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex; flex-direction:column; gap:36px">

            <div style="background:#141310; color:#F4F1EA; padding:{{ L.cardPad }}; border-radius:12px; display:grid; grid-template-columns:{{ L.hero }}; gap:32px">
              <div style="display:flex; flex-direction:column; gap:16px">
                <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.22em; color:#D0E2BE">THIS WEEK</div>
                <div style="font-family:'Zen Old Mincho',serif; font-size:{{ L.heroSize }}; font-weight:900; line-height:1.45">今週、{{ stats.newWisdom }}個の知識が<br>知恵になった。</div>
                <div style="font-size:14px; line-height:1.9; color:rgba(244,241,234,.68)">読んで終わった知識は0。走っている{{ word }}は{{ stats.running }}本、受けている仲間は{{ stats.people }}人。</div>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; align-content:center">
                <div style="border:1px solid rgba(244,241,234,.16); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:6px">
                  <div style="font-family:Inter,sans-serif; font-size:26px; font-weight:600; color:#D0E2BE">{{ stats.myCommit }}</div>
                  <div style="font-size:12px; color:rgba(244,241,234,.6)">受けているクエスト</div>
                </div>
                <div style="border:1px solid rgba(244,241,234,.16); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:6px">
                  <div style="font-family:Inter,sans-serif; font-size:26px; font-weight:600; color:#D0E2BE">{{ stats.due }}</div>
                  <div style="font-size:12px; color:rgba(244,241,234,.6)">今週締切の報告</div>
                </div>
                <div style="border:1px solid rgba(244,241,234,.16); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:6px">
                  <div style="font-family:Inter,sans-serif; font-size:26px; font-weight:600; color:#D0E2BE">{{ stats.wisdomTotal }}</div>
                  <div style="font-size:12px; color:rgba(244,241,234,.6)">ライブラリの知恵</div>
                </div>
                <div style="border:1px solid rgba(244,241,234,.16); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:6px">
                  <div style="font-family:Inter,sans-serif; font-size:26px; font-weight:600; color:#D0E2BE">{{ stats.payout }}</div>
                  <div style="font-size:12px; color:rgba(244,241,234,.6)">今月の分配見込</div>
                </div>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:18px">
              <div style="display:flex; align-items:baseline; gap:14px">
                <div style="font-size:17px; font-weight:700">今週生まれた知恵</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                <div onClick="{{ goLibrary }}" style="font-size:13px; color:#0F5C3F; cursor:pointer; font-weight:500">ライブラリへ →</div>
              </div>
              <div style="display:grid; grid-template-columns:{{ L.g3 }}; gap:16px">
                <sc-for list="{{ freshWisdom }}" as="w" hint-placeholder-count="3">
                  <div onClick="{{ w.open }}" style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:22px; display:flex; flex-direction:column; gap:14px; cursor:pointer" style-hover="border-color:#0F5C3F">
                    <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.16em; color:#0F5C3F">{{ w.tag }}</div>
                    <div style="font-family:'Zen Old Mincho',serif; font-size:20px; font-weight:900; line-height:1.55; text-wrap:pretty">{{ w.insight }}</div>
                    <div style="display:flex; flex-direction:column; gap:6px; padding-top:4px; border-top:1px dashed rgba(20,19,16,.16); font-size:12px; color:#6E695C; line-height:1.7">
                      <div>知識：{{ w.from }}</div>
                      <div>{{ wordShort }}：{{ w.experiment }}</div>
                    </div>
                    <div style="font-size:12px; color:#6E695C">by {{ w.author }} · 引用 {{ w.uses }}</div>
                  </div>
                </sc-for>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:{{ L.g2b }}; gap:28px">
              <div style="display:flex; flex-direction:column; gap:18px">
                <div style="display:flex; align-items:baseline; gap:14px">
                  <div style="font-size:17px; font-weight:700">走っている{{ word }}</div>
                  <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                  <div onClick="{{ goExperiments }}" style="font-size:13px; color:#0F5C3F; cursor:pointer; font-weight:500">すべて →</div>
                </div>
                <div style="display:flex; flex-direction:column; gap:12px">
                  <sc-for list="{{ runningExps }}" as="e" hint-placeholder-count="3">
                    <div onClick="{{ e.open }}" style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:10px; padding:18px 20px; display:flex; align-items:center; gap:20px; cursor:pointer; flex-wrap:wrap" style-hover="border-color:#0F5C3F">
                      <div style="flex:1; min-width:160px; display:flex; flex-direction:column; gap:7px">
                        <div style="font-size:15px; font-weight:700; line-height:1.5">{{ e.title }}</div>
                        <div style="font-size:12px; color:#6E695C">{{ e.owner }} · 締切 {{ e.due }}</div>
                      </div>
                      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px; white-space:nowrap">
                        <div style="font-family:Inter,sans-serif; font-size:13px; font-weight:600; color:#0F5C3F">{{ e.commits }} 人が受けてる</div>
                        <div style="width:120px; height:5px; background:rgba(20,19,16,.1); border-radius:3px; overflow:hidden">
                          <div style="height:100%; background:#0F5C3F; width:{{ e.progress }}"></div>
                        </div>
                      </div>
                    </div>
                  </sc-for>
                </div>
              </div>

              <div style="display:flex; flex-direction:column; gap:18px">
                <div style="display:flex; align-items:baseline; gap:14px">
                  <div style="font-size:17px; font-weight:700">自分の宿題</div>
                  <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                  <div style="font-size:12px; color:#6E695C">{{ todoLeft }}</div>
                </div>
                <div style="background:#E7E2D6; border-radius:12px; padding:22px; display:flex; flex-direction:column; gap:16px">
                  <sc-if value="{{ noTasks }}">
                    <div style="font-size:13px; line-height:1.9; color:#6E695C">いまは何も残っていません。<br>下の「タスク管理 →」から書けます。</div>
                  </sc-if>
                  <sc-for list="{{ todos }}" as="t" hint-placeholder-count="3">
                    <div style="display:flex; gap:12px; align-items:flex-start; padding-bottom:14px; border-bottom:1px solid rgba(20,19,16,.1)">
                      <div onClick="{{ t.toggle }}" title="終わったことにする" style="width:16px; height:16px; border:1.5px solid #0F5C3F; border-radius:4px; margin-top:3px; flex:0 0 16px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; line-height:1; color:#0F5C3F" style-hover="background:#D0E2BE"></div>
                      <div style="display:flex; flex-direction:column; gap:5px">
                        <div style="font-size:14px; font-weight:500; line-height:1.6">{{ t.label }}</div>
                        <div style="font-size:12px; color:{{ t.dueColor }}">{{ t.meta }}</div>
                      </div>
                    </div>
                  </sc-for>
                  <div onClick="{{ goTasks }}" style="text-align:center; font-size:13px; font-weight:700; color:#0F5C3F; cursor:pointer; padding-top:2px">タスク管理 →</div>
                </div>
              </div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isPark }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; gap:34px">

            <div style="background:#E7E2D6; border-radius:12px; padding:{{ L.cardPad }}; display:flex; flex-direction:column; gap:12px">
              <div style="font-family:'Zen Old Mincho',serif; font-size:{{ L.heroSize }}; font-weight:900; line-height:1.5">ここには締切も、報酬も、進捗バーもない。</div>
              <div style="font-size:14px; line-height:1.95; color:#3B382F; max-width:640px">クエストが「報酬のある仕事」なら、公園は「報酬のない遊び」。数えないし、評価もしない。ただ、ここで出た気づきは<b>「知恵にする」</b>でライブラリに持っていける。</div>
            </div>

            <div style="display:flex; flex-direction:column; gap:18px">
              <div style="display:flex; align-items:baseline; gap:14px">
                <sc-if value="{{ noPark }}"><div style="font-size:13px; line-height:1.9; color:#6E695C">公園にはまだ何もありません。</div></sc-if>
                <div style="font-size:17px; font-weight:700">今日ひま？ボード</div>
                <div style="font-size:12px; color:#6E695C">思いついたら投げる。返事がなくても気にしない。</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
              </div>
              <div style="display:grid; grid-template-columns:{{ L.g3 }}; gap:16px">
                <sc-for list="{{ board }}" as="b" hint-placeholder-count="3">
                  <div style="background:#FBF9F3; border:1px dashed rgba(20,19,16,.24); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:12px">
                    <div style="font-family:Inter,sans-serif; font-size:11px; letter-spacing:.14em; color:#C2703D">{{ b.when }}</div>
                    <div style="font-size:16px; font-weight:700; line-height:1.6; text-wrap:pretty">{{ b.title }}</div>
                    <div style="font-size:13px; line-height:1.85; color:#6E695C">{{ b.note }}</div>
                    <div style="display:flex; align-items:center; gap:10px; padding-top:10px; border-top:1px solid rgba(20,19,16,.1); flex-wrap:wrap">
                      <div style="font-size:12px; color:#6E695C">{{ b.who }}</div>
                      <div style="flex:1"></div>
                      <div onClick="{{ b.join }}" style="padding:9px 16px; border-radius:18px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid #C2703D; background:{{ b.bg }}; color:{{ b.fg }}">{{ b.label }}</div>
                    </div>
                  </div>
                </sc-for>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:{{ L.g2b }}; gap:28px">
              <div style="display:flex; flex-direction:column; gap:18px">
                <div style="display:flex; align-items:baseline; gap:14px">
                  <div style="font-size:17px; font-weight:700">バカな挑戦</div>
                  <div style="font-size:12px; color:#6E695C">役に立たないことを、本気で。</div>
                  <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                </div>
                <div style="display:flex; flex-direction:column; gap:12px">
                  <sc-for list="{{ dumb }}" as="d" hint-placeholder-count="3">
                    <div style="background:#141310; color:#F4F1EA; border-radius:12px; padding:20px 22px; display:flex; flex-direction:column; gap:10px">
                      <div style="font-family:'Zen Old Mincho',serif; font-size:20px; font-weight:900; line-height:1.5">{{ d.title }}</div>
                      <div style="font-size:13px; line-height:1.9; color:rgba(244,241,234,.66)">{{ d.body }}</div>
                      <div style="font-size:12px; color:#D0E2BE">{{ d.who }}</div>
                    </div>
                  </sc-for>
                </div>
              </div>

              <div style="display:flex; flex-direction:column; gap:18px">
                <div style="display:flex; align-items:baseline; gap:14px">
                  <div style="font-size:17px; font-weight:700">いま開いてる部屋</div>
                  <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                </div>
                <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; overflow:hidden">
                  <sc-for list="{{ rooms }}" as="r" hint-placeholder-count="4">
                    <div style="padding:16px 20px; border-bottom:1px solid rgba(20,19,16,.09); display:flex; align-items:center; gap:14px">
                      <div style="width:8px; height:8px; border-radius:50%; background:{{ r.dot }}; flex:0 0 8px"></div>
                      <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px">
                        <div style="font-size:14px; font-weight:700; line-height:1.5">{{ r.name }}</div>
                        <div style="font-size:12px; color:#6E695C">{{ r.who }}</div>
                      </div>
                      <div style="font-size:12px; font-weight:700; color:#0F5C3F; cursor:pointer; white-space:nowrap">入る</div>
                    </div>
                  </sc-for>
                </div>
                <div style="font-size:12px; line-height:1.9; color:#6E695C">部屋は誰でも立てられる。無言で作業してるだけの部屋もある。</div>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:18px">
              <div style="display:flex; align-items:baseline; gap:14px">
                <div style="font-size:17px; font-weight:700">エレベーター</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
              </div>
              <div onClick="{{ goElevator }}" style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:16px 20px; display:flex; align-items:center; gap:14px; cursor:pointer" style-hover="background:#F4F1EA">
                <div style="font-size:20px">🛗</div>
                <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px">
                  <div style="font-size:14px; font-weight:700; line-height:1.5">6つの階をのぼりおりする</div>
                  <div style="font-size:12px; color:#6E695C">屋上・星空ホール・ラボ・たんけん・カフェ・エントランス</div>
                </div>
                <div style="font-size:12px; font-weight:700; color:#0F5C3F; white-space:nowrap">乗る</div>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:18px">
              <div style="display:flex; align-items:baseline; gap:14px">
                <div style="font-size:17px; font-weight:700">月例、リアルの集まり</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
              </div>
              <div style="display:grid; grid-template-columns:{{ L.g2 }}; gap:16px">
                <sc-for list="{{ events }}" as="ev" hint-placeholder-count="2">
                  <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:24px; display:flex; gap:22px; align-items:flex-start">

            <div style="display:flex; flex-direction:column; gap:20px; position:{{ L.stick }}; top:24px">

                  <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.2em; color:#D0E2BE">ACCEPT</div>
                  <div style="font-size:14px; line-height:1.8; color:rgba(244,241,234,.72)">賛成/反対ではなく、<b style="color:#F4F1EA">自分も受けるか</b>で決める。受けた人数が予算配分になる。</div>

      <div style="display:{{ L.bottom }}; position:sticky; bottom:0; z-index:8; flex:0 0 76px; width:100%; min-height:76px; background:#141310; padding:8px 8px 12px; justify-content:flex-start; align-items:stretch; gap:4px; overflow-x:scroll; overflow-y:hidden; overscroll-behavior-x:contain; scroll-snap-type:x proximity; touch-action:pan-x; -webkit-overflow-scrolling:touch">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="9">
          <div onClick="{{ t.go }}" style="flex:0 0 72px; display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px; border-radius:8px; cursor:pointer; min-height:44px; background:{{ t.bg }}; scroll-snap-align:start">
            <div style="font-family:Inter,sans-serif; font-size:9px; letter-spacing:.1em; color:{{ t.num }}">{{ t.n }}</div>
            <div style="font-size:11px; font-weight:700; color:{{ t.fg }}">{{ t.label }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  </div>
</div>
</template>

<script>

var React = { createRef: function () { return { current: null }; } };

var DCLogic = function () {};
DCLogic.prototype.setState = function (upd) {
  var next = (typeof upd === 'function') ? upd(this.state) : upd;
  this.state = Object.assign({}, this.state, next);
  schedule();
};

const EXPS = [];

const WISDOM = [];

const LOGS = [];

const MEMBERS = [];

const STEPS = [
  {label:'元の知識', hint:'どこで得た何か', title:'その知識は、どこから来た？', desc:'Emuの講座でも、本でも、人から聞いた話でもいい。出どころが書けない知識は、まだ知恵にできない。',
   fields:[{label:'知識の出どころ', ph:'例：Emu／人間関係の設計 第3回「返報性」', h:'0px'},{label:'この知識の主張を一文で', ph:'例：人は先に与えられると返したくなる', h:'0px'}],
   note:'ここが空欄のままだと、次のステップに進めません。'},
  {label:'予想', hint:'自分の現場で何が起きるか', title:'自分の現場では、何が起きると思う？', desc:'一般論ではなく、自分の生活・仕事の話にする。ここで具体にできない知識は、まだ使える知識ではない。',
   fields:[{label:'予想', ph:'例：初対面で先に名乗ると、相手からの質問が増えるはず', h:'80px'}],
   note:'予想は外れていい。外れたことがわかるのも知恵。'},
  {label:'行動', hint:'誰が・いつまでに・何を', title:'今週、実際にやることは？', desc:'「意識する」は行動ではない。回数・期間・場所が入った、うまくいかなかったと判定できる行動にする。',
   fields:[{label:'やること', ph:'例：初対面の場で必ず自分から名乗り、先に自己開示を1つ出す', h:'60px'},{label:'回数・期間', ph:'例：2週間で20人', h:'0px'},{label:'締切', ph:'例：5/22', h:'0px'}],
   note:'締切を過ぎてログがないものは自動でクローズされます。'},
  {label:'確かめ方と予算', hint:'何を記録するか', title:'どうやって、効いたと判断する？', desc:'記録の形を先に決める。ここが決まっていれば、終わったとき知恵カードは半分書けている。',
   fields:[{label:'記録すること', ph:'例：質問が返ってきた率、相手の反応の逐語メモ', h:'60px'},{label:'必要な予算（任意）', ph:'例：¥40,000（場所代・書籍代）', h:'0px'}],
   note:'公開すると、5人が受けた時点で成立。成立したクエストにトレジャリーから予算が付きます。'}
];

const BOARD = [];
const DUMB = [];
const ROOMS = [];
const EVENTS = [];
const PEEKS = [];

/* 宿題をどの仕事に付けるか。
   色はブランドの色そのままだと明るい紙の上で読みにくいので、少し濃くしてある。 */
const TASK_BRANDS = [
  ['schoolpark', 'SchoolPark', '#0F5C3F'],
  ['emu',        'Emu',        '#C2703D'],
  ['camellia',   'Camellia',   '#B0405A'],
  ['other',      'そのほか',    '#6E695C']
];

const LAYOUTS = {
  pc: {frameW:1440, frameH:900, scrollY:'auto', frameR:'14px', sidebar:'flex', bottom:'none', pad:'36px 40px 80px', headPad:'22px 40px', headSize:'22px',
       hero:'1.35fr 1fr', heroSize:'34px', g3:'repeat(3,1fr)', g2:'repeat(2,1fr)', g2b:'1.4fr 1fr', gDetail:'1.5fr 1fr', gLogs:'1.6fr 1fr',
       gPropose:'220px 1fr', libCols:'3', table:'2fr 1fr 1fr 1fr 1fr', colHide:'block', stick:'sticky', cardPad:'32px', bigNum:'52px', ctaLabel:'＋ クエストを出す'},
  tablet: {frameW:834, frameH:1112, scrollY:'auto', frameR:'20px', sidebar:'flex', bottom:'none', pad:'28px 26px 60px', headPad:'20px 26px', headSize:'19px',
       hero:'1fr', heroSize:'30px', g3:'repeat(2,1fr)', g2:'1fr', g2b:'1fr', gDetail:'1fr', gLogs:'1fr',
       gPropose:'200px 1fr', libCols:'2', table:'2fr 1fr 1fr 1fr 1fr', colHide:'block', stick:'static', cardPad:'28px', bigNum:'44px', ctaLabel:'＋ クエスト'},
  mobile: {frameW:390, frameH:844, scrollY:'auto', frameR:'28px', sidebar:'none', bottom:'flex', pad:'20px 16px 40px', headPad:'16px 16px', headSize:'17px',
       hero:'1fr', heroSize:'26px', g3:'1fr', g2:'1fr', g2b:'1fr', gDetail:'1fr', gLogs:'1fr',
       gPropose:'1fr', libCols:'1', table:'1.6fr .6fr .8fr', colHide:'none', stick:'static', cardPad:'22px', bigNum:'38px', ctaLabel:'＋'}
};

class Component extends DCLogic {
  state = { screen:'home', expId:'', filter:'すべて', step:0, committed:{}, device:(window.innerWidth < 700 ? 'mobile' : window.innerWidth < 1100 ? 'tablet' : 'pc'), sidebarOpen:false, brandOpen:false, me:{name:'ゲスト', initial:'ー', line:'WISDOM 0 · クエスト 0'}, votes:[], noVotes:true, quests:[], noQuests:true, wisdom:[], noWisdom:true, citations:0, members:[], noMembers:true, noTreasury:true, wtag:'すべて', canGuild:false, trust:{total:0, need:20, detail:'読み込んでいます…'}, board:[], dumb:[], rooms:[], events:[], noPark:true, treasury:{card:{have:'¥0', promised:'¥0', free:'¥0', freeColor:'#D0E2BE', warn:'', month:'今月 +¥0 / -¥0'}, curTabs:[], allocTitle:'内訳（円）', allocNote:'', alloc:[], txs:[]}, vw: window.innerWidth, vh: window.innerHeight, joined:{}, tasks:[], noTasks:true, today:'' };

  /* 追加欄に打った途中の中身。
     ここを state に入れると、1文字打つたびに画面を作り直してしまい
     入力欄からカーソルが外れる。だから state の外に置いてある。 */
  draft = { title:'', note:'', brand:'schoolpark', questId:'', questTitle:'', due:'' };

  componentDidMount(){ try { window.parent.spDaoWhoAmI(this); } catch (e) {} try { window.parent.spDaoLoadTasks(this); } catch (e) {} try { window.parent.spDaoLoadVotes(this); } catch (e) {} try { window.parent.spDaoLoadQuests(this); } catch (e) {} try { window.parent.spDaoLoadWisdom(this); } catch (e) {} try { window.parent.spDaoLoadMembers(this); } catch (e) {} try { window.parent.spDaoLoadTreasury(this); } catch (e) {} try { window.parent.spDaoLoadPark(this); } catch (e) {} this._r = () => this.setState({vw: window.innerWidth, vh: window.innerHeight, device: (window.innerWidth < 700 ? 'mobile' : window.innerWidth < 1100 ? 'tablet' : 'pc')}); window.addEventListener('resize', this._r); }
  componentWillUnmount(){ window.removeEventListener('resize', this._r); }

  scroller = React.createRef();
  toTop(){ if(this.scroller.current) this.scroller.current.scrollTop = 0; window.scrollTo(0,0); }
  go(screen){ return () => { this.setState({screen}); this.toTop(); }; }
  openExp(id){ return () => { this.setState({screen:'detail', expId:id}); this.toTop(); }; }
  joinBoard(id){ return () => this.setState(s => ({joined:{...s.joined, [id]:!s.joined[id]}})); }
  commit(id){ return (ev) => { if(ev) ev.stopPropagation(); try { window.parent.spQuestToggle(id, this); } catch (e) {} }; }
  toggleSidebar = () => this.setState(s => ({sidebarOpen:!s.sidebarOpen}));
  openPassport = () => { try { window.parent.openSpPassport(); } catch (e) {} };
  askReizo = () => { try { window.parent.spReizoOpen(); } catch (e) {} };
  goElevator = () => { try { window.parent.openSpRoom('/schoolpark/south-elevator.html', 'エレベーター'); } catch (e) {} };
  toggleBrand = () => this.setState(s => ({brandOpen:!s.brandOpen}));
  goBrand(id){ return () => {
    this.setState({brandOpen:false});
    if (id === 'schoolpark') return;              /* いま居る場所なので何もしない */
    try { window.parent.chesHubGo(id); } catch (e) {}
  }; }

  decorate(e){
    const on = !!e.iTook;
    const sc = e.status==='RUNNING' ? ['#0F5C3F','#F4F1EA'] : e.status==='OPEN' ? ['#E7E2D6','#0F5C3F'] : ['#E7E2D6','#8A8474'];
    const n = e.commits;
    return {...e, commits:n,
      open:this.openExp(e.id), commit:this.commit(e.id),
      statusBg:sc[0], statusFg:sc[1],
      btnLabel: on ? '✓ 受けている' : 'このクエストを受ける',
      btnBg: on ? '#0F5C3F' : 'transparent', btnFg: on ? '#F4F1EA' : '#0F5C3F',
      btnBg2: on ? '#D0E2BE' : 'transparent', btnFg2: on ? '#141310' : '#D0E2BE',
      canClose: !!e.isMine && e.status !== 'CLOSED',
      canLog: !!e.iTook && e.status !== 'CLOSED',
      noLogs: !(e.logs && e.logs.length),
      logDid:   () => { try { window.parent.spQuestLog(e.id, 'やってみた', this); } catch (err) {} },
      logStuck: () => { try { window.parent.spQuestLog(e.id, 'つまずいた', this); } catch (err) {} },
      logFound: () => { try { window.parent.spQuestLog(e.id, '気づいた', this); } catch (err) {} },
      close: () => { try { window.parent.spQuestClose(e.id, this); } catch (err) {} },
      perHead: n > 0 ? (Math.round((parseInt(String(e.budget).replace(/,/g,''),10)||0)/n/100)*100).toLocaleString() : '0'
    };
  }

  renderVals(){
    const s = this.state, W = 'クエスト';
    const base = LAYOUTS[s.device];
    const k = 1;   /* 本番では縮小しない */
    const hasSidebar = base.sidebar !== 'none';
    const sidebarOpen = hasSidebar && s.sidebarOpen;
    const L = {...base, menuShow: hasSidebar ? 'none' : 'flex', sidebarShow:sidebarOpen ? 'flex' : 'none', sidebarToggle:hasSidebar && !sidebarOpen ? 'flex' : 'none', w: '100%', h: '100%', scale: 'none', boxH: '100vh', frameR: '0'};
    const navDefs = [['home','01','今週の広場'],['park','02','公園'],['experiments','03',W+'一覧'],['logs','04','ギルド'],['library','05','知恵ライブラリ'],['members','06','メンバー・貢献'],['treasury','07','トレジャリー']];
    const heads = {
      home:['The week / 今週の広場','おはよう、' + s.me.name],
      park:['THE PARK / 公園','無我夢中で遊ぼう'],
      experiments:['QUESTS','走っている'+W+'・募集中の'+W],
      detail:['QUEST', W+'の詳細'],
      tasks:['MY WORK / 自分の宿題','自分の宿題'],
      logs:['GUILD','ギルド — SchoolParkのDAO投票'],
      library:['WISDOM LIBRARY','知恵ライブラリ'],
      members:['MEMBERS','メンバーと貢献度'],
      treasury:['TREASURY','トレジャリーと分配'],
      propose:['NEW QUEST', W+'を出す']
    };
    const exps = (s.quests || []).map(e => this.decorate(e));
    const cur = exps.find(e => e.id === s.expId) || exps[0] || {};
    const filters = ['すべて','募集中','進行中','完了'].map(f => ({
      label:f, go:()=>this.setState({filter:f}),
      bg: s.filter===f ? '#141310' : 'transparent', fg: s.filter===f ? '#F4F1EA' : '#3B382F'}));
    const fmap = {'募集中':'OPEN','進行中':'RUNNING','完了':'CLOSED'};
    const shownExps = s.filter==='すべて' ? exps : exps.filter(e => e.status === fmap[s.filter]);
    const kind = k => k==='つまずいた' ? ['#F0DCD2','#A85A33'] : k==='気づいた' ? ['#0F5C3F','#F4F1EA'] : ['#E7E2D6','#3B382F'];
    const logs = LOGS.map(l => { const c = kind(l.kind); return {...l, kindBg:c[0], kindFg:c[1]}; });

    /* ───── 自分の宿題 ───── */

    /* 締切まであと何日か。きょうの日付は親からもらう（端末の時計で作っている）。 */
    const today = s.today || '';
    const daysTo = (due) => {
      if (!due || !today) return null;
      const a = new Date(today + 'T00:00:00'), b = new Date(due + 'T00:00:00');
      if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
      return Math.round((b - a) / 86400000);
    };
    const dueText = (due) => {
      if (!due) return '締切なし';
      const when = Number(due.slice(5,7)) + '/' + Number(due.slice(8,10));
      const n = daysTo(due);
      if (n === null) return when;
      if (n < 0)  return when + '・' + (-n) + '日すぎている';
      if (n === 0) return when + '・きょうまで';
      if (n === 1) return when + '・あした';
      return when + '・あと' + n + '日';
    };

    const brandOf = (id) => TASK_BRANDS.find(b => b[0] === id) || TASK_BRANDS[3];
    const shapeTask = (t) => {
      const b = brandOf(t.brand);
      const n = daysTo(t.due);
      const late  = !t.done && t.due && n !== null && n < 0;
      const soon  = !t.done && t.due && n !== null && n === 0;
      return {...t,
        brandLabel:b[1], brandColor:b[2],
        dueLabel:dueText(t.due),
        dueColor: late ? '#A32020' : soon ? '#C2703D' : '#6E695C',
        meta: b[1] + '・' + dueText(t.due),
        label: t.title,
        mark: t.done ? '✓' : '',
        markBg: t.done ? '#0F5C3F' : 'transparent',
        markFg: t.done ? '#F4F1EA' : '#0F5C3F',
        titleColor: t.done ? '#9A9484' : '#141310',
        titleLine: t.done ? 'line-through' : 'none',
        hasNote: !!t.note, hasQuest: !!t.questTitle,
        questLabel: t.questTitle ? ('クエスト：' + t.questTitle) : '',
        toggle: () => { try { window.parent.spTaskToggle(this, t.id, !t.done); } catch (e) {} },
        remove: () => { try { window.parent.spTaskDelete(this, t.id, t.title); } catch (e) {} }
      };
    };

    /* 締切のあるものが先。日付の早い順。締切なしは後ろで、書いた順。 */
    const byDue = (a, b) => {
      const ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
      if (ad !== bd) return ad < bd ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    };
    const allTasks = s.tasks || [];
    const openTasks = allTasks.filter(t => !t.done).sort(byDue).map(shapeTask);
    const doneTasks = allTasks.filter(t => t.done)
      .sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 20).map(shapeTask);
    const lateCount  = openTasks.filter(t => t.due && daysTo(t.due) < 0).length;
    const todayCount = openTasks.filter(t => t.due && daysTo(t.due) === 0).length;
    /* 年末まで。「年末までに結果を出す」ための残り日数。 */
    const yearEnd = today ? daysTo(today.slice(0,4) + '-12-31') : null;

    const setDraft = (k, v) => { this.draft[k] = v; };

    return {
      L, word:W, wordShort:'経験', scrollRef:this.scroller,
      toggleSidebar:this.toggleSidebar,
      me:s.me,
      openMenu:() => { try { window.parent.openSpMobileMenu(); } catch (e) {} },
      votes:s.votes, noVotes:s.noVotes, canGuild:s.canGuild, trust:s.trust,
      noQuests:s.noQuests, noPark:s.noPark,
      noWisdom:s.noWisdom,
      noHit:!s.noWisdom && s.wtag !== 'すべて' && !(s.wisdom || []).some(w => w.tag === s.wtag), noMembers:s.noMembers, noTreasury:s.noTreasury,
      openVoteForm:() => { try { window.parent.openSpVoteForm(this); } catch (e) {} },
      openPassport:this.openPassport,
      askReizo:this.askReizo,
      goElevator:this.goElevator,
      toggleBrand:this.toggleBrand,
      brandOpen:s.brandOpen,
      brandIcon:s.brandOpen ? '▴' : '▾',
      brands: [['camellia','Camellia','#E0576F'],['emu','Emu','#F08300'],['schoolpark','SchoolPark','#D0E2BE']]
        .map(([id,label,color]) => ({label, fg:color, go:this.goBrand(id),
          bg: id==='schoolpark' ? 'rgba(244,241,234,.08)' : 'transparent'})),
      sidebarButtonIcon:sidebarOpen ? '‹' : '☰',
      sidebarButtonTitle:sidebarOpen ? 'サイドバーを閉じる' : 'サイドバーを開く',
      devices: [['pc','パソコン'],['tablet','タブレット'],['mobile','スマホ']].map(([id,label]) => ({
        label, go:()=>this.setState({device:id}),
        bg: s.device===id ? '#D0E2BE' : 'rgba(244,241,234,.1)',
        fg: s.device===id ? '#141310' : 'rgba(244,241,234,.8)'})),
      nav: navDefs.map(([id,num,label]) => ({num, label, go:this.go(id),
        bg: s.screen===id ? '#0F5C3F' : 'transparent',
        fg: s.screen===id ? '#F4F1EA' : 'rgba(244,241,234,.72)'})),
      tabs: [['home','01','広場'],['park','02','公園'],['experiments','03',W],['logs','04','ギルド'],['library','05','知恵'],['members','06','メンバー'],['treasury','07','会計']].map(([id,n,label]) => ({
        n, label, go:this.go(id),
        bg: s.screen===id ? '#0F5C3F' : 'transparent',
        fg: s.screen===id ? '#F4F1EA' : 'rgba(244,241,234,.6)',
        num: s.screen===id ? '#D0E2BE' : 'rgba(244,241,234,.35)'})),
      head: {kicker: heads[s.screen][0], title: heads[s.screen][1]},
      isHome:s.screen==='home', isPark:s.screen==='park', isExperiments:s.screen==='experiments', isDetail:s.screen==='detail',
      isLogs:s.screen==='logs', isLibrary:s.screen==='library', isMembers:s.screen==='members',
      isTreasury:s.screen==='treasury', isPropose:s.screen==='propose', isTasks:s.screen==='tasks',
      goTasks:this.go('tasks'), goHome:this.go('home'),
      goPropose:() => { try { window.parent.openSpQuestForm(this); } catch (e) { this.setState({screen:'propose'}); } }, goLibrary:this.go('library'), goExperiments:this.go('experiments'), goLogs:this.go('logs'),
      stats: {newWisdom:(s.wisdom || []).length, running:exps.filter(e => e.status==='RUNNING').length, people:0, myCommit:Object.values(s.committed).filter(Boolean).length, due:0, wisdomTotal:(s.wisdom || []).length, payout:'¥0', citations:s.citations || 0},
      freshWisdom: (s.wisdom || []).slice(0,3).map(w => ({...w, open:this.go('library')})),
      runningExps: exps.filter(e => e.status==='RUNNING').slice(0,3),
      /* 広場のカードには、残っているものを上から3つだけ出す */
      todos: openTasks.slice(0, 3),
      noTasks: openTasks.length === 0,
      todoLeft: openTasks.length > 3 ? ('ほか ' + (openTasks.length - 3) + '件') : '',
      openTasks, doneTasks,
      noOpenTasks: openTasks.length === 0,
      noDoneTasks: doneTasks.length === 0,
      taskHead: openTasks.length === 0 ? '宿題は残っていない。' : ('残っている宿題は、' + openTasks.length + '個。'),
      taskLine: (lateCount ? ('すぎているものが' + lateCount + '個。') : 'すぎているものはない。')
        + (todayCount ? ('きょうまでが' + todayCount + '個。') : '')
        + (yearEnd === null ? '' : ('　年末まで、あと' + yearEnd + '日。')),
      taskStats: [
        ['残っている', String(openTasks.length)],
        ['きょうまで', String(todayCount)],
        ['すぎている', String(lateCount)],
        ['年末まで', yearEnd === null ? '—' : (yearEnd + '日')]
      ].map(([label, value]) => ({label, value})),
      draft: this.draft,
      onTaskTitle: (ev) => setDraft('title', ev.target.value),
      onTaskNote:  (ev) => setDraft('note',  ev.target.value),
      onTaskDue:   (ev) => setDraft('due',   ev.target.value),
      taskBrands: TASK_BRANDS.map(([id, label, color]) => ({
        label, go: () => { this.draft.brand = id; this.setState({}); },
        bg: this.draft.brand === id ? color : 'transparent',
        fg: this.draft.brand === id ? '#F4F1EA' : color,
        border: color })),
      /* つなぐ先は、まだ終わっていないクエストだけ */
      taskQuests: [{id:'', title:'どれにもつながない'}]
        .concat(exps.filter(e => e.status !== 'CLOSED').map(e => ({id:e.id, title:e.title})))
        .map(q => ({ label: q.title,
          go: () => { this.draft.questId = q.id; this.draft.questTitle = q.id ? q.title : ''; this.setState({}); },
          bg: this.draft.questId === q.id ? '#141310' : 'transparent',
          fg: this.draft.questId === q.id ? '#F4F1EA' : '#3B382F',
          border: this.draft.questId === q.id ? '#141310' : 'rgba(20,19,16,.16)' })),
      addTask: async () => {
        let ok = false;
        try { ok = await window.parent.spTaskAdd(this, this.draft); } catch (e) {}
        if (!ok) return;
        /* 続けて書けるように、どの仕事かだけは残す */
        this.draft = { title:'', note:'', brand:this.draft.brand, questId:'', questTitle:'', due:'' };
        this.setState({});
      },
      board: s.board || [],
      dumb: s.dumb || [], rooms: s.rooms || [], events: s.events || [],
      peeks: PEEKS.map(p => ({...p, open:this.openExp(p.id)})),
      filters, shownExps, cur,
      curLogs: cur.logs || [],
      logs, wisdom: (s.wtag && s.wtag !== 'すべて') ? (s.wisdom || []).filter(w => w.tag === s.wtag) : (s.wisdom || []),
      tags: ['すべて','RELATIONSHIP','MONEY','FOCUS','LEARNING','NEGOTIATION','COURAGE'].map(t => ({
        label:t, go:()=>this.setState({wtag:t}),
        bg: s.wtag===t ? '#141310' : 'transparent',
        fg: s.wtag===t ? '#F4F1EA' : '#3B382F',
        border: s.wtag===t ? '#141310' : 'rgba(20,19,16,.16)'})),
      members: s.members || [],
      treasury: s.treasury,
      steps: STEPS.map((st,i) => ({num:'0'+(i+1), label:st.label, hint:st.hint, go:()=>this.setState({step:i}),
        bg: s.step===i ? '#E7E2D6' : 'transparent',
        fg: s.step===i ? '#141310' : '#6E695C',
        numFg: s.step===i ? '#0F5C3F' : '#9A9484'})),
      step: STEPS[s.step], stepNum: s.step+1,
      nextLabel: s.step===3 ? '公開してコミットを募る' : '次へ',
      nextStep: () => this.setState(p => ({step: Math.min(3, p.step+1)})),
      prevStep: () => this.setState(p => ({step: Math.max(0, p.step-1)}))
    };
  }
}

/* ───── テンプレートを解釈して画面に出す仕組み ─────

   元は React が担っていた部分。使われている記法は3つだけだった。
     {{ 参照 }}                     … 値を差し込む（211か所、すべて単純な参照）
     <sc-for list="{{ 配列 }}" as="x"> … 繰り返す
     <sc-if value="{{ 真偽 }}">        … 出す・出さない
   ほかに onClick と ref。それだけを実装する。 */

/* 「a.b.c」をたどって値を取る */
function pick(scope, path) {
  var parts = String(path).trim().split('.');
  var v = scope;
  for (var i = 0; i < parts.length; i++) {
    if (v == null) return undefined;
    v = v[parts[i]];
  }
  return v;
}

var MUSTACHE = /\{\{([^}]+)\}\}/g;

/* 文字列の中の {{ }} を置き換える */
function fill(text, scope) {
  return text.replace(MUSTACHE, function (_, path) {
    var v = pick(scope, path);
    return (v === undefined || v === null) ? '' : String(v);
  });
}

/* 属性の値がまるごと1つの参照なら、値そのもの（関数など）を返す */
function whole(text, scope) {
  var m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(text);
  return m ? pick(scope, m[1]) : undefined;
}

function walk(node, scope, out) {
  for (var i = 0; i < node.childNodes.length; i++) {
    var n = node.childNodes[i];

    if (n.nodeType === 3) {                       // 文字
      out.appendChild(document.createTextNode(fill(n.nodeValue, scope)));
      continue;
    }
    if (n.nodeType !== 1) continue;

    var tag = n.tagName.toLowerCase();

    if (tag === 'sc-for') {
      var list = whole(n.getAttribute('list') || '', scope) || [];
      var as = n.getAttribute('as') || 'item';
      for (var j = 0; j < list.length; j++) {
        var child = Object.create(scope);
        child[as] = list[j];
        walk(n, child, out);
      }
      continue;
    }

    if (tag === 'sc-if') {
      if (whole(n.getAttribute('value') || '', scope)) walk(n, scope, out);
      continue;
    }

    var el = document.createElementNS(n.namespaceURI, tag);
    for (var a = 0; a < n.attributes.length; a++) {
      var at = n.attributes[a], name = at.name, val = at.value;

      if (name === 'ref') {                        // 要素を控えておく
        var box = whole(val, scope);
        if (box) box.current = el;
        continue;
      }
      /* onClick は、テンプレートを読み込んだ時点で onclick に小文字化される。
         大文字で判定すると空振りするので、大小を区別せずに見る。 */
      if (/^on[a-z]+$/i.test(name)) {
        var fn = whole(val, scope);
        if (typeof fn === 'function') el.addEventListener(name.slice(2).toLowerCase(), fn);
        continue;
      }
      if (name.indexOf('hint-') === 0) continue;   // 編集画面用の目印。表示には要らない

      el.setAttribute(name, fill(val, scope));
    }
    walk(n, scope, el);
    out.appendChild(el);
  }
}

/* ───── 起動 ───── */
var app = new Component();
var host = document.getElementById('dao-root');
var tpl = document.getElementById('dao-template');
var queued = false;

function draw() {
  queued = false;
  var vals = app.renderVals();
  var frag = document.createDocumentFragment();
  walk(tpl.content, vals, frag);
  host.replaceChildren(frag);
}
/* まとめて1回だけ描き直す。
   requestAnimationFrame は、画面が描画されていない状態（背景タブなど）では
   進まないため使わない。押したのに変わらない、が起きる。 */
function schedule() {
  if (queued) return;
  queued = true;
  Promise.resolve().then(draw);
}

draw();
if (app.componentDidMount) app.componentDidMount();

</script>
