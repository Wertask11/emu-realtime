<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolPark DAO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#D0E2BE; }
  a { color:#0F5C3F; text-decoration:none; }
  a:hover { color:#0A3F2B; }
  ::-webkit-scrollbar { width:10px; height:10px }
  ::-webkit-scrollbar-thumb { background:rgba(20,19,16,.18); border-radius:8px }
</style>
<style>
/* 枠のまわりの余白・角丸・影を外す。
   これらはテンプレートに直に書かれていて、「確かめるための枠」を
   見せるためのもの。本番では画面いっぱいに出すので要らない。
   入れ子はこの3段で固定されている:
     いちばん外（背景）> 枠の入れ物 > 枠 */
#dao-root > div            { padding-bottom: 0 !important; }
#dao-root > div > div      { padding: 0 !important; }
#dao-root > div > div > div{ border-radius: 0 !important; box-shadow: none !important; }
html, body                 { height: 100%; }
</style>
</head>
<body>
<div id="dao-root"></div>

<!-- 設計ファイルのテンプレート。ここは1文字も変えていない -->
<template id="dao-template">

<div style="min-height:100vh; background:#D0E2BE; font-family:'Zen Kaku Gothic New',sans-serif; padding:0 0 60px">


  <div style="padding:24px 20px 0; display:flex; justify-content:center; overflow:hidden; height:{{ L.boxH }}">
  <div style="width:{{ L.w }}; height:{{ L.h }}; flex:none; transform:{{ L.scale }}; transform-origin:top center; background:#F4F1EA; color:#141310; border-radius:{{ L.frameR }}; overflow:hidden; box-shadow:0 18px 48px rgba(20,19,16,.14); display:flex">

    <div style="display:{{ L.sidebarShow }}; width:248px; flex:0 0 248px; background:#141310; color:#F4F1EA; flex-direction:column; overflow-y:auto">
      <div style="padding:24px 18px 22px 24px; display:flex; align-items:flex-start; gap:12px; border-bottom:1px solid rgba(244,241,234,.12)">
        <div style="display:flex; flex:1; flex-direction:column; gap:6px; position:relative">
          <div onClick="{{ toggleBrand }}" title="ブランドを切り替える" style="display:flex; align-items:center; gap:8px; cursor:pointer">
            <div style="font-family:'Zen Old Mincho',serif; font-size:23px; font-weight:900; letter-spacing:.02em">SchoolPark</div>
            <div style="font-family:Inter,sans-serif; font-size:12px; color:#D0E2BE">{{ brandIcon }}</div>
          </div>
          <sc-if value="{{ brandOpen }}">
            <div style="position:absolute; top:38px; left:0; z-index:20; min-width:168px; background:#1D1B16; border:1px solid rgba(244,241,234,.16); border-radius:10px; padding:6px; display:flex; flex-direction:column; gap:2px; box-shadow:0 18px 40px -14px rgba(0,0,0,.7)">
              <sc-for list="{{ brands }}" as="b">
                <div onClick="{{ b.go }}" style="padding:9px 11px; border-radius:7px; cursor:pointer; font-size:14px; font-weight:700; background:{{ b.bg }}; color:{{ b.fg }}" style-hover="background:rgba(244,241,234,.09)">{{ b.label }}</div>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <div onClick="{{ toggleSidebar }}" title="サイドバーを閉じる" style="width:32px; height:32px; border:1px solid rgba(244,241,234,.18); border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:Inter,sans-serif; font-size:18px; color:#D0E2BE" style-hover="background:rgba(244,241,234,.1)">‹</div>
      </div>
      <div style="flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:2px">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="8">
          <div onClick="{{ item.go }}" style="display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; line-height:1.3; background:{{ item.bg }}; color:{{ item.fg }}" style-hover="background:rgba(244,241,234,.09)">
            <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.12em; width:18px; opacity:.55">{{ item.num }}</div>
            <div>{{ item.label }}</div>
          </div>
        </sc-for>
      </div>
      <div style="padding:18px 20px 22px; border-top:1px solid rgba(244,241,234,.12); display:flex; flex-direction:column; gap:12px">
        <div style="display:flex; justify-content:space-between; align-items:baseline">
          <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.2em; opacity:.5">TREASURY</div>
          <div style="font-family:Inter,sans-serif; font-size:15px; font-weight:600; color:#D0E2BE">¥{{ treasury.total }}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; padding-top:4px">
          <div style="width:32px; height:32px; border-radius:50%; background:#0F5C3F; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700">彩</div>
          <div style="display:flex; flex-direction:column; gap:2px">
            <div style="font-size:13px; font-weight:500">あやか</div>
            <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.1em; color:#D0E2BE">WISDOM 14 · クエスト 6</div>
          </div>
        </div>
      </div>
    </div>

    <div style="flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:{{ L.scrollY }}" ref="{{ scrollRef }}">

      <div style="background:#F4F1EA; border-bottom:1px solid rgba(20,19,16,.12); padding:{{ L.headPad }}; position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:16px">
        <div onClick="{{ toggleSidebar }}" title="{{ sidebarButtonTitle }}" style="display:{{ L.sidebarToggle }}; width:38px; height:38px; flex:0 0 38px; border:1px solid rgba(20,19,16,.16); border-radius:7px; align-items:center; justify-content:center; cursor:pointer; font-family:Inter,sans-serif; font-size:18px; color:#0F5C3F" style-hover="background:#E7E2D6">{{ sidebarButtonIcon }}</div>
        <div style="display:flex; flex-direction:column; gap:5px; flex:1; min-width:0">
          <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.22em; color:#0F5C3F">{{ head.kicker }}</div>
          <div style="font-size:{{ L.headSize }}; font-weight:700; letter-spacing:.02em">{{ head.title }}</div>
        </div>
        <div onClick="{{ askReizo }}" title="冷蔵庫くんに聞く" style="width:38px; height:38px; flex:0 0 38px; border:1px solid rgba(20,19,16,.16); border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden" style-hover="background:#E7E2D6"><img src="/assets/mascot.jpg" alt="冷蔵庫くん" style="width:100%; height:100%; object-fit:cover"></div>
        <div onClick="{{ goPropose }}" style="padding:12px 18px; background:#0F5C3F; color:#F4F1EA; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap" style-hover="background:#0A3F2B">{{ L.ctaLabel }}</div>
      </div>

      <div style="padding:{{ L.pad }}; display:flex; flex-direction:column; gap:36px">

        <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex; flex-direction:column; gap:36px">

            <div style="background:#141310; color:#F4F1EA; padding:{{ L.cardPad }}; border-radius:12px; display:grid; grid-template-columns:{{ L.hero }}; gap:32px">
              <div style="display:flex; flex-direction:column; gap:16px">
                <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.22em; color:#D0E2BE">THIS WEEK</div>
                <div style="font-family:'Zen Old Mincho',serif; font-size:{{ L.heroSize }}; font-weight:900; line-height:1.45">今週、{{ stats.newWisdom }}個の知識が<br>知恵になった。</div>
                <div style="font-size:14px; line-height:1.9; color:rgba(244,241,234,.68)">読んで終わった知識は0。走っている{{ word }}は{{ stats.running }}本、受けている仲間は{{ stats.people }}人。</div>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; align-content:center">
                <div style="border:1px solid rgba(244,241,234,.16); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:6px">
                  <div style="font-family:Inter,sans-serif; font-size:26px; font-weight:600; color:#D0E2BE">{{ stats.myCommit }}</div>
                  <div style="font-size:12px; color:rgba(244,241,234,.6)">受けているクエスト</div>
                </div>
                <div style="border:1px solid rgba(244,241,234,.16); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:6px">
                  <div style="font-family:Inter,sans-serif; font-size:26px; font-weight:600; color:#D0E2BE">{{ stats.due }}</div>
                  <div style="font-size:12px; color:rgba(244,241,234,.6)">今週締切の報告</div>
                </div>
                <div style="border:1px solid rgba(244,241,234,.16); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:6px">
                  <div style="font-family:Inter,sans-serif; font-size:26px; font-weight:600; color:#D0E2BE">{{ stats.wisdomTotal }}</div>
                  <div style="font-size:12px; color:rgba(244,241,234,.6)">ライブラリの知恵</div>
                </div>
                <div style="border:1px solid rgba(244,241,234,.16); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:6px">
                  <div style="font-family:Inter,sans-serif; font-size:26px; font-weight:600; color:#D0E2BE">{{ stats.payout }}</div>
                  <div style="font-size:12px; color:rgba(244,241,234,.6)">今月の分配見込</div>
                </div>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:18px">
              <div style="display:flex; align-items:baseline; gap:14px">
                <div style="font-size:17px; font-weight:700">今週生まれた知恵</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                <div onClick="{{ goLibrary }}" style="font-size:13px; color:#0F5C3F; cursor:pointer; font-weight:500">ライブラリへ →</div>
              </div>
              <div style="display:grid; grid-template-columns:{{ L.g3 }}; gap:16px">
                <sc-for list="{{ freshWisdom }}" as="w" hint-placeholder-count="3">
                  <div onClick="{{ w.open }}" style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:22px; display:flex; flex-direction:column; gap:14px; cursor:pointer" style-hover="border-color:#0F5C3F">
                    <div style="font-family:Inter,sans-serif; font-size:10px; letter-spacing:.16em; color:#0F5C3F">{{ w.tag }}</div>
                    <div style="font-family:'Zen Old Mincho',serif; font-size:20px; font-weight:900; line-height:1.55; text-wrap:pretty">{{ w.insight }}</div>
                    <div style="display:flex; flex-direction:column; gap:6px; padding-top:4px; border-top:1px dashed rgba(20,19,16,.16); font-size:12px; color:#6E695C; line-height:1.7">
                      <div>知識：{{ w.from }}</div>
                      <div>{{ wordShort }}：{{ w.experiment }}</div>
                    </div>
                    <div style="font-size:12px; color:#6E695C">by {{ w.author }} · 引用 {{ w.uses }}</div>
                  </div>
                </sc-for>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:{{ L.g2b }}; gap:28px">
              <div style="display:flex; flex-direction:column; gap:18px">
                <div style="display:flex; align-items:baseline; gap:14px">
                  <div style="font-size:17px; font-weight:700">走っている{{ word }}</div>
                  <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                  <div onClick="{{ goExperiments }}" style="font-size:13px; color:#0F5C3F; cursor:pointer; font-weight:500">すべて →</div>
                </div>
                <div style="display:flex; flex-direction:column; gap:12px">
                  <sc-for list="{{ runningExps }}" as="e" hint-placeholder-count="3">
                    <div onClick="{{ e.open }}" style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:10px; padding:18px 20px; display:flex; align-items:center; gap:20px; cursor:pointer; flex-wrap:wrap" style-hover="border-color:#0F5C3F">
                      <div style="flex:1; min-width:160px; display:flex; flex-direction:column; gap:7px">
                        <div style="font-size:15px; font-weight:700; line-height:1.5">{{ e.title }}</div>
                        <div style="font-size:12px; color:#6E695C">{{ e.owner }} · 締切 {{ e.due }}</div>
                      </div>
                      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px; white-space:nowrap">
                        <div style="font-family:Inter,sans-serif; font-size:13px; font-weight:600; color:#0F5C3F">{{ e.commits }} 人が受けてる</div>
                        <div style="width:120px; height:5px; background:rgba(20,19,16,.1); border-radius:3px; overflow:hidden">
                          <div style="height:100%; background:#0F5C3F; width:{{ e.progress }}"></div>
                        </div>
                      </div>
                    </div>
                  </sc-for>
                </div>
              </div>

              <div style="display:flex; flex-direction:column; gap:18px">
                <div style="display:flex; align-items:baseline; gap:14px">
                  <div style="font-size:17px; font-weight:700">自分の宿題</div>
                  <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                </div>
                <div style="background:#E7E2D6; border-radius:12px; padding:22px; display:flex; flex-direction:column; gap:16px">
                  <sc-for list="{{ todos }}" as="t" hint-placeholder-count="3">
                    <div style="display:flex; gap:12px; align-items:flex-start; padding-bottom:14px; border-bottom:1px solid rgba(20,19,16,.1)">
                      <div style="width:16px; height:16px; border:1.5px solid #0F5C3F; border-radius:4px; margin-top:3px; flex:0 0 16px"></div>
                      <div style="display:flex; flex-direction:column; gap:5px">
                        <div style="font-size:14px; font-weight:500; line-height:1.6">{{ t.label }}</div>
                        <div style="font-size:12px; color:#6E695C">{{ t.meta }}</div>
                      </div>
                    </div>
                  </sc-for>
                  <div onClick="{{ goLogs }}" style="text-align:center; font-size:13px; font-weight:700; color:#0F5C3F; cursor:pointer; padding-top:2px">ログを書く →</div>
                </div>
              </div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isPark }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; gap:34px">

            <div style="background:#E7E2D6; border-radius:12px; padding:{{ L.cardPad }}; display:flex; flex-direction:column; gap:12px">
              <div style="font-family:'Zen Old Mincho',serif; font-size:{{ L.heroSize }}; font-weight:900; line-height:1.5">ここには締切も、報酬も、進捗バーもない。</div>
              <div style="font-size:14px; line-height:1.95; color:#3B382F; max-width:640px">クエストが「ひとりで試す」なら、公園は「みんなでやる」。数えないし、評価もしない。ただ、ここで出た気づきは<b>「知恵にする」</b>でライブラリに持っていける。</div>
            </div>

            <div style="display:flex; flex-direction:column; gap:18px">
              <div style="display:flex; align-items:baseline; gap:14px">
                <div style="font-size:17px; font-weight:700">今日ひま？ボード</div>
                <div style="font-size:12px; color:#6E695C">思いついたら投げる。返事がなくても気にしない。</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
              </div>
              <div style="display:grid; grid-template-columns:{{ L.g3 }}; gap:16px">
                <sc-for list="{{ board }}" as="b" hint-placeholder-count="3">
                  <div style="background:#FBF9F3; border:1px dashed rgba(20,19,16,.24); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:12px">
                    <div style="font-family:Inter,sans-serif; font-size:11px; letter-spacing:.14em; color:#C2703D">{{ b.when }}</div>
                    <div style="font-size:16px; font-weight:700; line-height:1.6; text-wrap:pretty">{{ b.title }}</div>
                    <div style="font-size:13px; line-height:1.85; color:#6E695C">{{ b.note }}</div>
                    <div style="display:flex; align-items:center; gap:10px; padding-top:10px; border-top:1px solid rgba(20,19,16,.1); flex-wrap:wrap">
                      <div style="font-size:12px; color:#6E695C">{{ b.who }}</div>
                      <div style="flex:1"></div>
                      <div onClick="{{ b.join }}" style="padding:9px 16px; border-radius:18px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid #C2703D; background:{{ b.bg }}; color:{{ b.fg }}">{{ b.label }}</div>
                    </div>
                  </div>
                </sc-for>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:{{ L.g2b }}; gap:28px">
              <div style="display:flex; flex-direction:column; gap:18px">
                <div style="display:flex; align-items:baseline; gap:14px">
                  <div style="font-size:17px; font-weight:700">バカな挑戦</div>
                  <div style="font-size:12px; color:#6E695C">役に立たないことを、本気で。</div>
                  <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                </div>
                <div style="display:flex; flex-direction:column; gap:12px">
                  <sc-for list="{{ dumb }}" as="d" hint-placeholder-count="3">
                    <div style="background:#141310; color:#F4F1EA; border-radius:12px; padding:20px 22px; display:flex; flex-direction:column; gap:10px">
                      <div style="font-family:'Zen Old Mincho',serif; font-size:20px; font-weight:900; line-height:1.5">{{ d.title }}</div>
                      <div style="font-size:13px; line-height:1.9; color:rgba(244,241,234,.66)">{{ d.body }}</div>
                      <div style="font-size:12px; color:#D0E2BE">{{ d.who }}</div>
                    </div>
                  </sc-for>
                </div>
              </div>

              <div style="display:flex; flex-direction:column; gap:18px">
                <div style="display:flex; align-items:baseline; gap:14px">
                  <div style="font-size:17px; font-weight:700">いま開いてる部屋</div>
                  <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
                </div>
                <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; overflow:hidden">
                  <sc-for list="{{ rooms }}" as="r" hint-placeholder-count="4">
                    <div style="padding:16px 20px; border-bottom:1px solid rgba(20,19,16,.09); display:flex; align-items:center; gap:14px">
                      <div style="width:8px; height:8px; border-radius:50%; background:{{ r.dot }}; flex:0 0 8px"></div>
                      <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px">
                        <div style="font-size:14px; font-weight:700; line-height:1.5">{{ r.name }}</div>
                        <div style="font-size:12px; color:#6E695C">{{ r.who }}</div>
                      </div>
                      <div style="font-size:12px; font-weight:700; color:#0F5C3F; cursor:pointer; white-space:nowrap">入る</div>
                    </div>
                  </sc-for>
                </div>
                <div style="font-size:12px; line-height:1.9; color:#6E695C">部屋は誰でも立てられる。無言で作業してるだけの部屋もある。</div>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:18px">
              <div style="display:flex; align-items:baseline; gap:14px">
                <div style="font-size:17px; font-weight:700">エレベーター</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
              </div>
              <div onClick="{{ goElevator }}" style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:16px 20px; display:flex; align-items:center; gap:14px; cursor:pointer" style-hover="background:#F4F1EA">
                <div style="font-size:20px">🛗</div>
                <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px">
                  <div style="font-size:14px; font-weight:700; line-height:1.5">6つの階をのぼりおりする</div>
                  <div style="font-size:12px; color:#6E695C">屋上・星空ホール・ラボ・たんけん・カフェ・エントランス</div>
                </div>
                <div style="font-size:12px; font-weight:700; color:#0F5C3F; white-space:nowrap">乗る</div>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:18px">
              <div style="display:flex; align-items:baseline; gap:14px">
                <div style="font-size:17px; font-weight:700">月例、リアルの集まり</div>
                <div style="flex:1; height:1px; background:rgba(20,19,16,.14)"></div>
              </div>
              <div style="display:grid; grid-template-columns:{{ L.g2 }}; gap:16px">
                <sc-for list="{{ events }}" as="ev" hint-placeholder-count="2">
                  <div style="background:#FBF9F3; border:1px solid rgba(20,19,16,.12); border-radius:12px; padding:24px; display:flex; gap:22px; align-items:flex-start">
                    <div style="display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 14px; background:#C2703D; color:#F4F1EA; border-radius:10px; flex:0 0 auto">
                      <div style="font-family:Inter,sans-serif; font-size:11px; letter-spacing:.14em">{{ ev.month }}</div>
                      <div style="font-family:Inter,sans-serif; font-size:26px; font-weight:600; line-height:1">{{ ev.day }}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:9px; min-width:0">
                      <div style="font-size:17px; font-weight:700; line-height:1.55">{{ ev.title }}</div>
                      <div style="font-size:13px; line-height:1.9; color:#3B382F">{{ ev.body }}</div>
                      <div style="font-size:12px; color:#6E695C">{{ ev.place }} · {{ ev.who }}</div>
                    </div>
                  </div>
                </sc-for>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:18px">
              <div style="display:flex; align-items:baseline; gap:14px">

/* ───── テンプレートを解釈して画面に出す仕組み ─────

   元は React が担っていた部分。使われている記法は3つだけだった。
     {{ 参照 }}                     … 値を差し込む（211か所、すべて単純な参照）
     <sc-for list="{{ 配列 }}" as="x"> … 繰り返す
     <sc-if value="{{ 真偽 }}">        … 出す・出さない
   ほかに onClick と ref。それだけを実装する。 */

/* 「a.b.c」をたどって値を取る */
function pick(scope, path) {
  var parts = String(path).trim().split('.');
  var v = scope;
  for (var i = 0; i < parts.length; i++) {
    if (v == null) return undefined;
    v = v[parts[i]];
  }
  return v;
}

var MUSTACHE = /\{\{([^}]+)\}\}/g;

/* 文字列の中の {{ }} を置き換える */
function fill(text, scope) {
  return text.replace(MUSTACHE, function (_, path) {
    var v = pick(scope, path);
    return (v === undefined || v === null) ? '' : String(v);
  });
}

/* 属性の値がまるごと1つの参照なら、値そのもの（関数など）を返す */
function whole(text, scope) {
  var m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(text);
  return m ? pick(scope, m[1]) : undefined;
}

function walk(node, scope, out) {
  for (var i = 0; i < node.childNodes.length; i++) {
    var n = node.childNodes[i];

    if (n.nodeType === 3) {                       // 文字
      out.appendChild(document.createTextNode(fill(n.nodeValue, scope)));
      continue;
    }
    if (n.nodeType !== 1) continue;

    var tag = n.tagName.toLowerCase();

    if (tag === 'sc-for') {
      var list = whole(n.getAttribute('list') || '', scope) || [];
      var as = n.getAttribute('as') || 'item';
      for (var j = 0; j < list.length; j++) {
        var child = Object.create(scope);
        child[as] = list[j];
        walk(n, child, out);
      }
      continue;
    }

    if (tag === 'sc-if') {
      if (whole(n.getAttribute('value') || '', scope)) walk(n, scope, out);
      continue;
    }

    var el = document.createElementNS(n.namespaceURI, tag);
    for (var a = 0; a < n.attributes.length; a++) {
      var at = n.attributes[a], name = at.name, val = at.value;

      if (name === 'ref') {                        // 要素を控えておく
        var box = whole(val, scope);
        if (box) box.current = el;
        continue;
      }
      /* onClick は、テンプレートを読み込んだ時点で onclick に小文字化される。
         大文字で判定すると空振りするので、大小を区別せずに見る。 */
      if (/^on[a-z]+$/i.test(name)) {
        var fn = whole(val, scope);
        if (typeof fn === 'function') el.addEventListener(name.slice(2).toLowerCase(), fn);
        continue;
      }
      if (name.indexOf('hint-') === 0) continue;   // 編集画面用の目印。表示には要らない

      el.setAttribute(name, fill(val, scope));
    }
    walk(n, scope, el);
    out.appendChild(el);
  }
}

/* ───── 起動 ───── */
var app = new Component();
var host = document.getElementById('dao-root');
var tpl = document.getElementById('dao-template');
var queued = false;

function draw() {
  queued = false;
  var vals = app.renderVals();
  var frag = document.createDocumentFragment();
  walk(tpl.content, vals, frag);
  host.replaceChildren(frag);
}
/* まとめて1回だけ描き直す。
   requestAnimationFrame は、画面が描画されていない状態（背景タブなど）では
   進まないため使わない。押したのに変わらない、が起きる。 */
function schedule() {
  if (queued) return;
  queued = true;
  Promise.resolve().then(draw);
}

draw();
if (app.componentDidMount) app.componentDidMount();

</script>
