<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Emu 会員管理</title>
<style>
:root{--ink:#1a1840;--muted:#6f6a86;--line:#e6e2dc;--bg:#faf8f5;--card:#fff;--accent:#f08300;--ok:#1f8a4c;--warn:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:20px;margin:0 0 4px}
.lead{color:var(--muted);font-size:12px;margin:0 0 20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{font-size:14px;margin:0 0 8px}
.meta{font-size:12px;color:var(--muted);word-break:break-all}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.act{border:none;border-radius:999px;padding:10px 18px;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px}
button.ok{background:var(--ok);color:#fff} button.no{background:#fff;color:var(--warn);border:1.5px solid #f0c8c2}
button.neutral{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:14px;margin-top:6px}
/* 入力欄の見出し。SchoolParkタブで使う */
label{display:block;margin-top:12px;font-size:12px;font-weight:600;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;background:#f2efeb;color:var(--muted)}
.pill.on{background:#e7f5ec;color:var(--ok)} .pill.warn{background:#fdecea;color:var(--warn)}
.gate{text-align:center;padding:70px 20px;color:var(--muted)}
.hide{display:none!important}
.empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}
.warnbox{background:#fdecea;border:1px solid #f0c8c2;border-radius:10px;padding:12px;font-size:12px;color:#8a2b20;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Emu 会員管理</h1>
  <p class="lead">オーナー専用。返金の承認と本人確認の判定は取り消せません。</p>

  <div id="gate" class="gate">確認しています…</div>

  <main id="main" class="hide">
    <div class="warnbox">
      返金の承認は取り消せません。本人確認は書類を預からず、対話で確認した事実だけを記録します。
    </div>

    <div class="tabs">
      <button data-tab="members" class="active">会員一覧</button>
      <button data-tab="review">受領コメント</button>
      <button data-tab="refunds">返金申請</button>
      <button data-tab="kyc">本人確認</button>
      <button data-tab="dialogue">対話記録</button>
      <button data-tab="metrics">指標</button>
      <button data-tab="schoolpark">SchoolPark</button>
      <button data-tab="emu">Emu</button>
    </div>

    <section id="tab-members"></section>
    <section id="tab-review" class="hide"></section>
    <section id="tab-refunds" class="hide"></section>
    <section id="tab-kyc" class="hide"></section>
    <section id="tab-dialogue" class="hide"></section>
    <section id="tab-metrics" class="hide"></section>
    <section id="tab-schoolpark" class="hide"></section>
    <section id="tab-emu" class="hide"></section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const API = "https://emu-realtime.onrender.com";
/* 運営のアドレス。入り方によって変わるので両方。
   index.html / firestore.rules / backend と同じ組み合わせにしておく。 */
const SP_OWNER_ADDRS = [
  "0xdcc687c05f130e57597a8525771299a4efb6edf7",  // 実ウォレット
  "0x195f4478ee3865ee1dd360b79e121c638bdd42ac"   // SchoolParkパスポート
];
const app = initializeApp({
  apiKey: "AIzaSyBKHS1D8Or6gfMd4NbzhDI7dG5Je7BLtbs",
  authDomain: "schoolpark-emu.vercel.app",
  projectId: "emusch-2a111",
  storageBucket: "emusch-2a111.firebasestorage.app",
  messagingSenderId: "795496371585",
  appId: "1:795496371585:web:51deec91b8a2152e4c8480"
});
const auth = getAuth(app);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = iso => iso ? new Date(iso).toLocaleString("ja-JP") : "—";
let idToken = null;

async function api(path, options) {
  const res = await fetch(API + path, {
    method: (options && options.method) || "GET",
    headers: Object.assign({ "Authorization": "Bearer " + idToken },
      (options && options.body) ? { "Content-Type": "application/json" } : {}),
    body: options && options.body ? JSON.stringify(options.body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw Object.assign(new Error(data.error || ("HTTP " + res.status)), { code: data.error, status: res.status });
  return data;
}

/* ───────── 会員一覧 ─────────
   誰が light / plus / pro なのかを見る。これまで一覧する手段がなかった。
   人数が少ないうちは、次の段へ上がるかどうかは「誰に声をかけるか」で決まる。
   その判断材料として、声をかける目安になる数も並べる。 */
const PLAN_STYLE = {
  pro:   { color:"#b45309", bg:"#fef3c7" },
  plus:  { color:"#3730a3", bg:"#e0e7ff" },
  light: { color:"#166534", bg:"#dcfce7" }
};
const STATUS_LABEL = {
  active:"利用中", trialing:"お試し中", past_due:"支払い遅延",
  canceled:"解約済み", unpaid:"未払い", incomplete:"手続き途中"
};

/* Camellia の対象年齢。camellia-auth.js・特商法・利用規約と必ず同じにすること。 */
const CAM_MIN_AGE = 18, CAM_MAX_AGE = 45;

async function renderMembers() {
  const el = $("#tab-members");
  el.innerHTML = '<p class="empty">読み込み中…</p>';
  try {
    const { items, summary } = await api("/api/billing/admin/members");

    const head = '<div class="card"><h3>いまの会員</h3>'
      + '<div class="row"><span>Emu light</span><span>' + summary.light + ' 人</span></div>'
      + '<div class="row"><span>Emu plus</span><span>' + summary.plus + ' 人</span></div>'
      + '<div class="row"><span>Emu pro</span><span>' + summary.pro + ' 人</span></div>'
      + '<div class="row"><span>利用中の合計</span><span>' + summary.active + ' 人</span></div>'
      + '<div class="row"><span>月あたりの売上</span><span>' + Number(summary.mrr || 0).toLocaleString("ja-JP") + ' 円</span></div>'
      + '</div>';

    /* 施行時の付与。公式パス保有者に plus、オーナーに pro を渡す。
       先に空打ちで人数を見てから配れるようにしている。

       会員がゼロでも必ず出す。付与の対象は「契約している人」ではなく
       「公式パスを持っている人」なので、有料会員がいなくても配る相手はいる。 */
    const grant = '<div class="card" style="border:2px solid #f08300;background:#fff8f0;">'
      + '<h3 style="color:#b45309;">最初の付与（9月1日の制限に備える）</h3>'
      + '<p class="hint">オーナーに Emu pro（期限なし）、公式パス（NFT）をお持ちの方に Emu plus を6か月、'
      + 'それ以外の既存の方に Emu light を6か月お渡しします。<b>重なる場合は公式パスを優先します。</b><br>'
      + '実行した時点より後に登録した方には渡しません。二度押しても増えません。</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">'
      + '<button id="grantDry" class="btn">まず人数を数える（配らない）</button>'
      + '<button id="grantRun" class="btn" style="background:#b45309;color:#fff;">実際に配る</button>'
      + '</div><p id="grantOut" class="hint" style="margin-top:10px;"></p></div>';

    /* 1人ずつ渡す。指定はSchoolParkパスポートのID（アドレス）。
       期限は入れなければ「期限なし」。同じ人に渡し直すと上書きする。 */
    const one = '<div class="card">'
      + '<h3>1人に渡す（SchoolParkパスポートのID）</h3>'
      + '<p class="hint">Emu light・plus・pro を、指定した方に渡します。'
      + 'お金のやりとりはありません。Stripeの契約には触りません。<br>'
      + '契約と重なった場合は、上の段のほうが使われます。</p>'
      + '<label>SchoolPark パスポートのID</label>'
      + '<input id="gOneAddr" placeholder="0x… （パスポートの画面からコピーできます）" spellcheck="false">'
      + '<label>渡すもの</label><select id="gOnePlan">'
      + '<option value="light">Emu light（月額500円ぶん）</option>'
      + '<option value="plus">Emu plus（月額3,000円ぶん）</option>'
      + '<option value="pro">Emu pro（月額10,000円ぶん）</option>'
      + '</select>'
      + '<label>いつまで有効か</label>'
      + '<input id="gOneUntil" type="date">'
      + '<p class="hint" style="margin:4px 0 0">空のままにすると期限なしになります。'
      + 'その日の終わり（23:59）まで有効です。</p>'
      + '<label>メモ（任意）</label><input id="gOneNote" placeholder="例：登壇のお礼／モニター参加">'
      + '<div class="actions"><button class="btn primary" id="gOneRun">渡す</button>'
      + '<button class="btn" id="gOneWho">このIDを調べる</button></div>'
      + '<p id="gOneOut" class="hint" style="margin-top:8px;"></p>'
      /* 公式パスの鍵は、小文字のものと大文字まじりのものが混ざっている。
         サーバーはどちらでも読めるが、Firestoreのルールは小文字しか探せないため、
         大文字まじりの人は「plusと表示されるのに投稿できない」状態になる。
         押すと小文字の鍵をそろえる（もとの記録は消さない）。 */
      + '<h3 style="margin-top:18px">公式パスの鍵をそろえる</h3>'
      + '<p class="hint" style="margin:0 0 8px">大文字まじりで登録されている方は、'
      + 'Emu plus と表示されるのに投稿できない状態になります。'
      + '押すと小文字にそろえます。もとの記録は消しません。何度押しても安全です。</p>'
      + '<div class="actions"><button class="btn" id="passCheck">まず調べるだけ</button>'
      + '<button class="btn primary" id="passFix">そろえる</button></div>'
      + '<p id="passOut" class="hint" style="margin-top:8px;"></p>'
      + '<h3 style="margin-top:18px">いま渡してあるもの</h3>'
      + '<div id="gList"><p class="empty">読み込み中…</p></div>'
      + '</div>'
      /* Camellia の管理。これまで camellia/control-admin.html という
         ログインの要らないページで見ていたので、運営だけのここへ寄せる。
         気分・症状・服薬・月経は出さない。入口で本人にそう約束している。 */
      + '<div class="card" style="margin-top:16px">'
      + '<h2 style="margin:0 0 4px">Camellia に入った人</h2>'
      + '<p class="hint" style="margin:0 0 10px">'
      + '対象は' + CAM_MIN_AGE + '〜' + CAM_MAX_AGE + '歳です。'
      + '名前を押すと、その方のこれまでの記録がすべて開きます。<br>'
      + '要配慮個人情報です。画面を人に見られない場所で開いてください。</p>'
      + '<div id="camList"><p class="empty">読み込み中…</p></div>'
      + '</div>';

    const cards = !items.length
      ? '<p class="empty">まだ有料会員はいません。</p>'
      : items.map(function (m) {
      const st = PLAN_STYLE[m.plan] || { color:"#555", bg:"#eee" };
      const s = m.signals || {};
      /* 声をかける目安。§22 の移行シグナルのうち、いま数えられるもの。
         「学びへ昇華」は人の意見で自分の考えが変わった記録なので、いちばん強い合図。 */
      const marks = [];
      if (s.elevated > 0) marks.push('考えが変わった ' + s.elevated);
      if (s.asked > 0)    marks.push('自分から募集した ' + s.asked);
      if (s.answered > 0) marks.push('人に届けた ' + s.answered);
      const strong = (s.elevated > 0) || (s.asked > 0 && s.answered > 0);

      return '<div class="card">'
        + '<div class="row"><span><b>' + esc(m.name || "（名前なし）") + '</b></span>'
        + '<span style="color:' + st.color + ';background:' + st.bg + ';padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;">'
        + esc(m.planLabel) + '</span></div>'
        + '<div class="row"><span>状態</span><span>' + esc(STATUS_LABEL[m.status] || m.status)
        + (m.cancelAtPeriodEnd ? '（期間終了で終わり）' : '') + '</span></div>'
        + '<div class="row"><span>入会</span><span>' + fmt(m.firstSubscribedAt) + '</span></div>'
        + '<div class="row"><span>次の更新</span><span>' + fmt(m.currentPeriodEnd) + '</span></div>'
        + '<div class="row"><span>届けた知識</span><span>' + (s.posts || 0) + ' 件（役に立った ' + (s.helpful || 0) + ' 回）</span></div>'
        + '<div class="row"><span>次の段への合図</span><span>'
        + (marks.length ? esc(marks.join(' / ')) : 'まだなし') + '</span></div>'
        + (strong && m.plan !== 'pro'
            ? '<p class="hint" style="color:#b45309;font-weight:700;">声をかける頃合いです。</p>'
            : '')
        + '<p class="hint" style="font-size:11px;color:#999;">uid: ' + esc(m.uid) + '</p>'
        + '</div>';
    }).join("");

    el.innerHTML = head + grant + one + cards;

    const PLAN_JA = { light: "Emu light", plus: "Emu plus", pro: "Emu pro" };
    const GRANT_ERR = {
      BAD_ADDRESS: "IDの形が違います。0x で始まる42文字を入れてください。",
      BAD_PLAN: "渡すものを選んでください。",
      BAD_EXPIRES: "日付の形が違います。",
      EXPIRES_IN_PAST: "その日はもう過ぎています。先の日付にしてください。",
      USER_NOT_FOUND: "そのIDの方が見つかりません。一度Emuにログインしたことがあるか、IDが正しいかをご確認ください。"
    };

    /* Camellia に入った人。サーバー（Admin SDK）を通して読む。
       Firestore のルールでは本人しか読めないようにしてあるため、
       この画面から直接は読まない。 */

    /* 記録の欄の名前。日本語で出す。ここに無い欄は、そのままの名前で出す。 */
    const CAM_FIELD_JA = {
      mood: "気分", anxiety: "不安", stress: "ストレス", loneliness: "孤独感",
      motivation: "意欲", irritability: "イライラ", concentration: "集中",
      sleep: "睡眠時間", sleepQuality: "眠りの質", need: "いま必要なもの",
      mindNote: "こころのメモ", painPlace: "痛む場所", pain: "痛み",
      fatigue: "疲れ", energy: "元気", temperature: "体温", appetite: "食欲",
      cycle: "月経周期", lastMenstrualDate: "最終月経日", symptoms: "症状",
      medication: "服薬", bodyNote: "からだのメモ", savedAt: "記録した時刻"
    };
    const CAM_SKIP = ["date", "savedAt", "updatedAt", "uid"];

    function camDailyTable(daily) {
      if (!daily || !daily.length) {
        return '<p class="hint" style="margin:8px 0 0">記録はまだありません。'
          + '日々の記録は、いまはお使いの端末の中にだけ入っています。'
          + 'サーバーへ移すと、ここに出るようになります。</p>';
      }
      return daily.map(function (d) {
        const items = Object.keys(d)
          .filter(function (k) { return CAM_SKIP.indexOf(k) < 0 && d[k] !== "" && d[k] !== null; })
          .map(function (k) {
            return '<span style="display:inline-block;margin:0 12px 4px 0">'
              + '<small style="color:var(--muted)">' + esc(CAM_FIELD_JA[k] || k) + '</small> '
              + esc(String(d[k])) + '</span>';
          }).join("");
        return '<div style="border-top:1px solid var(--line);padding:8px 0">'
          + '<b style="font-size:13px">' + esc(d.date) + '</b><br>'
          + (items || '<small style="color:var(--muted)">（中身なし）</small>')
          + '</div>';
      }).join("");
    }

    async function paintCamellia() {
      const box = $("#camList");
      if (!box) return;
      let r;
      try { r = await api("/api/billing/admin/camellia"); }
      catch (e) {
        box.innerHTML = '<p class="empty">読み込めませんでした（' + esc(e.code || e.message) + '）</p>';
        return;
      }
      if (!r.members.length) { box.innerHTML = '<p class="empty">まだどなたも入っていません。</p>'; return; }
      box.innerHTML = r.members.map(function (m, i) {
        const age = (m.age === null || m.age === undefined) ? "不明" : (m.age + "歳");
        const ng = m.eligible === false;
        const p = m.personality || {};
        return '<details style="border-bottom:1px solid var(--line)">'
          + '<summary style="cursor:pointer;padding:10px 0;display:flex;'
          + 'justify-content:space-between;gap:12px;align-items:flex-start">'
          + '<span>' + esc(m.name || "（お名前なし）")
          + (m.provider ? ' <small style="color:var(--muted)">' + esc(m.provider) + '</small>' : '')
          + (ng ? ' <b style="color:#b91c1c">★対象の年齢ではありません</b>' : '')
          + '<br><small style="color:var(--muted)">' + esc(m.passport || m.uid) + '</small></span>'
          + '<span style="text-align:right;white-space:nowrap">' + esc(age)
          + '<br><small style="color:var(--muted)">'
          + (m.agreedAt ? '同意 ' + fmt(m.agreedAt) : '同意なし')
          + '</small></span></summary>'
          + '<div style="padding:4px 0 14px">'
          + '<p class="hint" style="margin:0 0 6px">'
          + '生年月日 ' + esc(m.birthDate || "不明")
          + (m.agreedVersion ? '／同意の版 ' + esc(m.agreedVersion) : '')
          + (p.mbti || p.animal ? '／' + esc([p.mbti, p.animal].filter(Boolean).join("・")) : '')
          + '</p>'
          + camDailyTable(m.daily)
          + '</div></details>';
      }).join("");
    }

    async function paintGrants() {
      const box = $("#gList");
      if (!box) return;
      let rows = [];
      try { rows = (await api("/api/billing/admin/grants")).grants || []; }
      catch (e) { box.innerHTML = '<p class="empty">読み込めませんでした（' + esc(e.code || e.message) + '）</p>'; return; }
      /* 公式パスは別のところ（paid_users）にいる。読めなくても付与の表示は出す。 */
      let passes = [];
      try { passes = (await api("/api/billing/admin/passes")).passes || []; } catch (e) {}

      /* 出どころで3つに分ける。まぜると、手で渡したぶんが埋もれる。 */
      const byHand = rows.filter(r => r.source === "admin");
      const bulk = rows.filter(r => r.source !== "admin");

      const grantRow = r =>
        '<div class="row"><span>' + esc(PLAN_JA[r.plan] || r.plan)
        + (r.expired ? ' <b style="color:#b91c1c">期限切れ</b>' : '')
        + '<br><small style="color:var(--muted)">' + esc(r.address || r.uid) + '</small>'
        + (r.note ? '<br><small style="color:var(--muted)">' + esc(r.note) + '</small>' : '')
        + '</span><span>'
        + (r.expiresAt ? fmt(r.expiresAt) + " まで" : "期限なし")
        + ' <button class="act no" data-grevoke="' + esc(r.address || "") + '">取り消す</button>'
        + '</span></div>';

      const section = (title, hint, html) =>
        '<h4 style="margin:14px 0 6px;font-size:13px;color:var(--muted)">' + title + '</h4>'
        + (hint ? '<p class="hint" style="margin:0 0 6px">' + hint + '</p>' : '')
        + html;

      box.innerHTML =
        section('手で渡したもの（この画面から）', '',
          byHand.length ? byHand.map(grantRow).join("")
            : '<p class="empty">まだありません。</p>')
        + section('最初の一括付与', '施行のときにまとめて渡したぶんです。',
            bulk.length ? bulk.map(grantRow).join("")
              : '<p class="empty">ありません。</p>')
        + section('公式パスの持ち主',
            '買い切りで期限なし。Emu plus 相当が、持っているあいだずっと続きます。',
            passes.length
              ? passes.map(p =>
                  '<div class="row"><span>Emu plus 相当'
                  + (p.readableByRules ? '' : ' <b style="color:#b91c1c">★鍵が大文字まじり。投稿できません</b>')
                  + '<br><small style="color:var(--muted)">' + esc(p.address) + '</small>'
                  + (p.label ? '<br><small style="color:var(--muted)">' + esc(p.label) + '</small>' : '')
                  + '</span><span>期限なし</span></div>').join("")
              : '<p class="empty">まだいません。</p>');

      box.querySelectorAll("[data-grevoke]").forEach(b => {
        b.onclick = async () => {
          if (!b.dataset.grevoke) { alert("このぶんはIDが記録されていないため、ここからは取り消せません。"); return; }
          if (!confirm("この方に渡したものを取り消します。よろしいですか？")) return;
          try { await api("/api/billing/admin/grants/revoke", { method: "POST", body: { address: b.dataset.grevoke } }); }
          catch (e) { alert(GRANT_ERR[e.code] || ("取り消せませんでした（" + (e.code || e.message) + "）")); return; }
          paintGrants();
        };
      });
    }
    paintGrants();
    paintCamellia();

    /* 結果は必ず目に入るようにする。
       画面が縦に長いので、書いただけだと見えない位置に出ることがある。 */
    function sayGrant(text, ok) {
      const out = $("#gOneOut");
      if (!out) return;
      out.textContent = text;
      out.style.color = ok === true ? "#166534" : (ok === false ? "#b91c1c" : "");
      out.style.fontWeight = ok === undefined ? "" : "700";
      try { out.scrollIntoView({ block: "nearest" }); } catch (e) {}
    }

    /* 入力欄でEnterを押したら送る。
       フォームではないので、そのままだとEnterでは何も起きず、
       「押したのに反応がない」と見えてしまう。 */
    ["gOneAddr", "gOneNote"].forEach(function (id) {
      const el = $("#" + id);
      if (el) el.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); $("#gOneRun").click(); } };
    });

    /* 「渡したのに反映されない」ときに、サーバーが何を見ているかを出す。 */
    $("#gOneWho").onclick = async () => {
      const addr = ($("#gOneAddr").value || "").trim();
      if (!addr) { sayGrant("調べたいIDを入れてください。", false); return; }
      sayGrant("調べています…");
      let w;
      try { w = await api("/api/billing/admin/whois?address=" + encodeURIComponent(addr)); }
      catch (e) { sayGrant("調べられませんでした（" + (e.code || e.message) + "）", false); return; }
      const L = [];
      L.push("見つかった人: " + (w.uid ? w.uid + "（" + w.foundBy + "）" : "★いません"));
      if (w.account) {
        L.push("　入り方: " + (w.account.provider || "不明") + "／名前: " + (w.account.displayName || "なし"));
        L.push("　walletAddress: " + (w.account.walletAddress || "空"));
        L.push("　chesAddress: " + (w.account.chesAddress || "空"));
      }
      L.push("渡してあるもの: " + (w.grant
        ? w.grant.plan + "（" + w.grant.source + "）"
          + (w.grant.expiresAt ? " / " + fmt(w.grant.expiresAt) + " まで" : " / 期限なし")
          + (w.grant.notStartedYet ? " ★まだ始まっていない" : "")
          + (w.grant.alreadyExpired ? " ★もう切れている" : "")
        : "なし"));
      L.push("契約: " + (w.subscription ? (w.subscription.plan || "?") + " / " + w.subscription.status : "なし"));
      L.push("→ いま使えるもの: " + (w.effective ? w.effective.plan + "（" + w.effective.source + "）" : "不明"));
      const out = $("#gOneOut");
      out.style.color = ""; out.style.fontWeight = "";
      out.textContent = L.join("\n");
      out.style.whiteSpace = "pre-wrap";
      try { out.scrollIntoView({ block: "nearest" }); } catch (e) {}
    };

    /* 公式パスの鍵をそろえる。dry=1 のときは調べるだけで、何も書かない。 */
    async function passNormalize(dry) {
      const out = $("#passOut");
      out.style.whiteSpace = "pre-wrap"; out.style.color = ""; out.style.fontWeight = "";
      out.textContent = dry ? "調べています…" : "そろえています…";
      let r;
      try {
        r = await api("/api/billing/admin/pass/normalize" + (dry ? "?dry=1" : ""), { method: "POST" });
      } catch (e) {
        out.style.color = "#b3261e"; out.style.fontWeight = "600";
        out.textContent = "できませんでした（" + (e.code || e.message) + "）";
        return;
      }
      const L = ["公式パスの登録: " + r.total + "件"];
      L.push("　すでに小文字: " + r.kept.length + "件");
      if (!r.moved.length) {
        L.push("　そろえる必要のあるもの: なし");
      } else {
        L.push("　" + (dry ? "そろえるとこうなります" : "そろえました") + ": " + r.moved.length + "件");
        r.moved.forEach(function (m) {
          L.push("　　" + m.from + "\n　　　→ " + m.to + (m.note ? "（" + m.note + "）" : ""));
        });
      }
      if (r.failed.length) L.push("　できなかったもの: " + r.failed.map(function (f) { return f.id; }).join(", "));
      out.style.color = r.failed.length ? "#b3261e" : "#1b5e20";
      out.style.fontWeight = "600";
      out.textContent = L.join("\n");
    }
    $("#passCheck").onclick = function () { passNormalize(true); };
    $("#passFix").onclick = function () {
      if (!confirm("公式パスの鍵を小文字にそろえます。\nもとの記録は消しません。よろしいですか？")) return;
      passNormalize(false);
    };

    $("#gOneRun").onclick = async () => {
      const addr = ($("#gOneAddr").value || "").trim();
      const plan = $("#gOnePlan").value;
      const until = ($("#gOneUntil").value || "").trim();
      if (!addr) { sayGrant("SchoolPark パスポートのIDを入れてください。", false); return; }
      /* 日付だけを受け取っているので、その日の終わりまで有効にする。
         0時にすると「その日はもう使えない」ことになって分かりにくい。 */
      const expiresAt = until ? new Date(until + "T23:59:59").toISOString() : null;
      const label = PLAN_JA[plan] + (until ? "（" + until + " まで）" : "（期限なし）");
      if (!confirm(label + " を渡します。よろしいですか？\n\n" + addr)) return;
      sayGrant("渡しています…");
      const btn = $("#gOneRun");
      btn.disabled = true;
      try {
        const r = await api("/api/billing/admin/grants", {
          method: "POST", body: { address: addr, plan: plan, expiresAt: expiresAt, note: ($("#gOneNote").value || "").trim() }
        });
        sayGrant("渡しました。" + (PLAN_JA[r.plan] || r.plan) + "／"
          + (r.expiresAt ? fmt(r.expiresAt) + " まで" : "期限なし")
          + "　すぐ有効になります（受け取った方の画面は、Emuのタブに戻るか開き直すと変わります）", true);
        $("#gOneAddr").value = ""; $("#gOneNote").value = "";
        paintGrants();
      } catch (e) {
        sayGrant(GRANT_ERR[e.code] || ("渡せませんでした（" + (e.code || e.message) + "）"), false);
      } finally {
        btn.disabled = false;
      }
    };

    async function runGrant(dryRun) {
      const out = $("#grantOut");
      out.textContent = dryRun ? "数えています…" : "配っています…";
      try {
        const r = await api("/api/billing/admin/founding/grant", {
          method: "POST", body: { dryRun: dryRun, months: 6, grantedBy: "initial-2026-09" }
        });
        out.innerHTML = (dryRun ? "<b>数えただけです（まだ配っていません）</b><br>" : "<b>配りました</b><br>")
          + "見たアカウント " + r.scanned + " 件<br>"
          + "Emu pro（オーナー）: <b>" + r.proTarget + " 人</b><br>"
          + "Emu plus（公式パス保有者）: <b>" + r.plusTarget + " 人</b><br>"
          + "Emu light（それ以外の既存の方）: <b>" + r.lightTarget + " 人</b><br>"
          + (dryRun ? "配る予定" : "配った") + ": <b>" + r.granted + " 件</b>　"
          + "すでに配ってあった: " + r.skipped + " 件<br>"
          + "対象外（実行時点より後に登録）: " + r.tooNew + " 人<br>"
          + "light と plus の期限: " + fmt(r.expiresAt);
        if (!dryRun) renderMembers();
      } catch (e) {
        out.textContent = "失敗しました（" + e.message + "）";
      }
    }
    $("#grantDry").onclick = () => runGrant(true);
    $("#grantRun").onclick = () => {
      if (!confirm("実際に配ります。\n\nオーナーに pro（期限なし）、公式パス保有者に plus（6か月）、"
        + "それ以外の既存の方に light（6か月）。重なる場合は公式パスを優先します。\n"
        + "先に「まず人数を数える」で確認しましたか？")) return;
      runGrant(false);
    };
  } catch (e) {
    el.innerHTML = '<p class="empty">会員一覧を読み込めませんでした（' + esc(e.message) + '）</p>';
  }
}

/* ───────── 受領コメント ─────────
   light の核。規約で「指定日から7営業日以内に1回返す」と約束している。
   期限を過ぎたら翌月500円の割引になるので、期限が近い順に並べる。 */
async function renderReview() {
  const el = $("#tab-review");
  el.innerHTML = '<p class="empty">読み込み中…</p>';
  try {
    const { items, capacity } = await api("/api/review/admin/list?status=all");
    const pending = items.filter(i => i.status === "pending");
    const overdue = pending.filter(i => i.overdue);
    const owed = items.filter(i => i.late && !i.lateCompensated);

    const head = '<div class="card"><h3>いまの状況</h3>'
      + '<div class="row"><span>返すのを待っている</span><span><b>' + pending.length + '</b> 件</span></div>'
      + '<div class="row"><span style="color:#c0392b;">期限を過ぎている</span>'
      + '<span style="color:#c0392b;"><b>' + overdue.length + '</b> 件</span></div>'
      + '<div class="row"><span>500円の割引が未処理</span><span><b>' + owed.length + '</b> 件</span></div>'
      + '<div class="row"><span>受付枠</span><span>' + items.length + ' / ' + capacity + '</span></div>'
      + '</div>';

    if (!items.length) {
      el.innerHTML = head + '<p class="empty">まだ依頼はありません。</p>';
      return;
    }

    el.innerHTML = head + items.map(function (r) {
      const late = r.overdue;
      const done = r.status === "answered";
      return '<div class="card"' + (late ? ' style="border-color:#c0392b;"' : '') + '>'
        + '<div class="row"><span><b>' + (done ? "返信済み" : "未返信") + '</b></span>'
        + '<span' + (late ? ' style="color:#c0392b;font-weight:700;"' : '') + '>期限 ' + fmt(r.dueAt)
        + (late ? '（過ぎています）' : '') + '</span></div>'
        + '<div class="row"><span>依頼日</span><span>' + fmt(r.requestedAt) + '</span></div>'
        + '<div class="row"><span>投稿</span><span style="font-size:12px;">' + esc(r.postId) + '</span></div>'
        + (done
          ? '<p class="hint" style="white-space:pre-wrap;">' + esc(r.comment || "") + '</p>'
            + '<div class="row"><span>返信日</span><span>' + fmt(r.answeredAt) + '</span></div>'
            + (r.late && !r.lateCompensated
                ? '<p class="hint" style="color:#c0392b;font-weight:700;">'
                  + '期限を過ぎて返しました。翌月500円の割引が必要です。</p>'
                  + '<button class="btn" data-comp="' + esc(r.id) + '">割引を渡したと記録する</button>'
                : (r.lateCompensated ? '<p class="hint">割引を渡しました。</p>' : ''))
          : '<textarea data-cmt="' + esc(r.id) + '" rows="4" placeholder="例）あなたの経験を受け取りました。特に「〇〇」という部分は、同じ状況にいる人が考えるきっかけになりそうです。"></textarea>'
            + '<button class="btn primary" data-ans="' + esc(r.id) + '">この内容で返す</button>')
        + '<p class="hint" style="font-size:11px;color:#999;">uid: ' + esc(r.uid) + '</p>'
        + '</div>';
    }).join("");

    el.querySelectorAll("[data-ans]").forEach(function (b) {
      b.onclick = async function () {
        const id = b.dataset.ans;
        const box = el.querySelector('[data-cmt="' + id + '"]');
        const comment = (box && box.value || "").trim();
        if (comment.length < 10) { alert("10文字以上でお願いします。"); return; }
        b.disabled = true; b.textContent = "送っています…";
        try {
          const r = await api("/api/review/admin/" + id + "/answer", { method:"POST", body:{ comment } });
          if (r.late) alert("返しました。ただし期限を過ぎています。翌月500円の割引が必要です。");
          renderReview();
        } catch (e) { alert("失敗しました（" + e.message + "）"); b.disabled = false; b.textContent = "この内容で返す"; }
      };
    });
    el.querySelectorAll("[data-comp]").forEach(function (b) {
      b.onclick = async function () {
        if (!confirm("翌月500円の割引を渡したものとして記録します。\nStripe 側の処理はご自身で行ってください。")) return;
        b.disabled = true;
        try { await api("/api/review/admin/" + b.dataset.comp + "/compensate", { method:"POST", body:{} }); renderReview(); }
        catch (e) { alert("失敗しました（" + e.message + "）"); b.disabled = false; }
      };
    });
  } catch (e) {
    el.innerHTML = '<p class="empty">読み込めませんでした（' + esc(e.message) + '）</p>';
  }
}

// ───────── 返金申請 ─────────
async function renderRefunds() {
  const el = $("#tab-refunds");
  el.innerHTML = '<p class="empty">読み込み中…</p>';
  try {
    const { items } = await api("/api/billing/admin/refunds?status=pending");
    if (!items.length) return el.innerHTML = '<p class="empty">未処理の返金申請はありません。</p>';
    el.innerHTML = items.map(r => {
      const s = r.survey || {};
      return '<div class="card" data-id="' + esc(r.id) + '">'
        + '<h3>' + esc(r.email || r.uid) + '</h3>'
        + '<p class="meta">uid: ' + esc(r.uid) + '｜申請日 ' + fmt(r.requestedAt) + '</p>'
        + '<div class="row"><span>参加した対話</span><span>' + (s.sessionsJoined || 0) + ' 回</span></div>'
        + '<div class="row"><span>対話可能枠 3つ以上</span><span>' + (s.slotsRegistered ? "あり" : "なし") + '</span></div>'
        + '<div class="row"><span>評価に回答済み</span><span>' + (s.ratedAfterSessions ? "はい" : "いいえ") + '</span></div>'
        + '<div class="row"><span>創業者と話したい</span><span>' + (s.wantsFounderCall ? "希望あり" : "—") + '</span></div>'
        + (r.reason ? '<p class="meta" style="margin-top:8px">理由: ' + esc(r.reason) + '</p>' : "")
        + '<p class="meta" style="margin-top:8px">承認すると Stripe から初月分 10,000円が返金されます（取り消せません）。</p>'
        + '<textarea data-note placeholder="判断のメモ（記録に残ります）"></textarea>'
        + '<div class="actions"><button class="act neutral" data-summary>対話記録を見る</button>'
        + '<button class="act ok" data-approve>承認して返金する</button>'
        + '<button class="act no" data-reject>却下</button></div>'
        + '<div data-detail></div></div>';
    }).join("");

    el.querySelectorAll(".card").forEach(card => {
      const id = card.dataset.id;
      const note = () => card.querySelector("[data-note]").value;
      const uid = card.querySelector(".meta").textContent.split("uid: ")[1].split("｜")[0];

      card.querySelector("[data-summary]").onclick = async (e) => {
        e.target.disabled = true;
        try {
          const r = await api("/api/dialogue/admin/summary/" + encodeURIComponent(uid));
          const s = r.summary;
          card.querySelector("[data-detail]").innerHTML =
            '<div class="card" style="margin-top:10px">'
            + '<div class="row"><span>提示した機会</span><span>' + s.offered + '</span></div>'
            + '<div class="row"><span>実施</span><span>' + s.held + '</span></div>'
            + '<div class="row"><span>また話したい</span><span>' + s.wantsAgain + '</span></div>'
            + '<div class="row"><span>Emu側都合の不成立</span><span>' + s.emuFault + '</span></div>'
            + '<div class="row"><span>本人都合の欠席</span><span>' + s.memberFault + '</span></div>'
            + '<div class="row"><span>登録された対話可能枠</span><span>' + s.slotCount + '</span></div>'
            + '<div class="row"><span><strong>返金条件を満たすか</strong></span><span>'
            + (s.meetsRefundConditions ? '<span class="pill on">満たす</span>' : '<span class="pill warn">満たさない</span>')
            + '</span></div></div>';
        } catch (err) { alert("取得できませんでした: " + err.message); }
        e.target.disabled = false;
      };

      card.querySelector("[data-approve]").onclick = async (e) => {
        if (!confirm("返金を実行します。取り消せません。よろしいですか？")) return;
        e.target.disabled = true;
        try {
          const r = await api("/api/billing/admin/refunds/" + id + "/decide",
            { method:"POST", body:{ decision:"approve", adminNote: note() } });
          alert("返金しました（" + r.amount + "円）");
          renderRefunds();
        } catch (err) { alert("返金に失敗しました: " + (err.code || err.message)); e.target.disabled = false; }
      };

      card.querySelector("[data-reject]").onclick = async (e) => {
        if (!confirm("この申請を却下します。よろしいですか？")) return;
        e.target.disabled = true;
        try {
          await api("/api/billing/admin/refunds/" + id + "/decide",
            { method:"POST", body:{ decision:"reject", adminNote: note() } });
          renderRefunds();
        } catch (err) { alert("失敗しました: " + (err.code || err.message)); e.target.disabled = false; }
      };
    });
  } catch (e) {
    el.innerHTML = '<p class="empty">読み込みに失敗しました（' + esc(e.code || e.message) + '）</p>';
  }
}

// ───────── 本人確認 ─────────
/* 書類の画像は預からない。対話で確認できたら、ここで確認済みにする。
   残るのは「いつ・どの方法で確認したか」だけ。 */
async function renderKyc() {
  const el = $("#tab-kyc");
  el.innerHTML = '<p class="empty">読み込み中…</p>';
  try {
    const { items, methodLabels } = await api("/api/kyc/admin/list?status=all");
    if (!items.length) return el.innerHTML = '<p class="empty">まだ会員がいません。</p>';

    el.innerHTML =
      '<div class="warnbox" style="background:#eef3ee;border-color:#cfe0d2;color:#2f5d3f">'
      + 'Emu は本人確認書類の画像を預かりません。最初の対話で顔を見て確認し、その事実だけを記録します。'
      + '</div>'
      + items.map(k => {
        const verified = k.status === "verified";
        return '<div class="card" data-uid="' + esc(k.uid) + '">'
          + '<h3>' + (verified ? '確認済み' : '未確認') + '</h3>'
          + '<p class="meta">uid: ' + esc(k.uid) + '</p>'
          + '<div class="row"><span>18歳以上の申告</span><span>'
          + (k.adultDeclared
              ? '<span class="pill on">あり</span> ' + esc(fmt(k.adultDeclaredAt))
              : '<span class="pill warn">なし</span>') + '</span></div>'
          + '<div class="row"><span>確認の方法</span><span>' + esc(k.methodLabel || '—') + '</span></div>'
          + '<div class="row"><span>確認日</span><span>' + esc(k.verifiedAt ? fmt(k.verifiedAt) : '—') + '</span></div>'
          + (k.note ? '<p class="meta" style="margin-top:6px">メモ: ' + esc(k.note) + '</p>' : '')
          + (verified
            ? '<div class="actions"><button class="act no" data-unverify>確認を取り消す</button></div>'
            : '<select data-method>'
              + Object.entries(methodLabels || { dialogue:'対話で確認' })
                  .map(([k2,v]) => '<option value="' + k2 + '">' + v + '</option>').join('')
              + '</select>'
              + '<input data-note placeholder="メモ（任意・記録に残ります）">'
              + '<div class="actions"><button class="act ok" data-verify>確認済みにする</button></div>')
          + '</div>';
      }).join("");

    el.querySelectorAll("[data-verify]").forEach(b => {
      b.onclick = async () => {
        const card = b.closest(".card");
        b.disabled = true;
        try {
          await api("/api/kyc/admin/" + encodeURIComponent(card.dataset.uid) + "/verify", {
            method:"POST",
            body:{
              verified:true,
              method: card.querySelector("[data-method]").value,
              note: card.querySelector("[data-note]").value
            }
          });
          renderKyc();
        } catch (e) { alert("失敗しました: " + (e.code || e.message)); b.disabled = false; }
      };
    });
    el.querySelectorAll("[data-unverify]").forEach(b => {
      b.onclick = async () => {
        if (!confirm("この会員の確認を取り消します。よろしいですか？")) return;
        const card = b.closest(".card");
        b.disabled = true;
        try {
          await api("/api/kyc/admin/" + encodeURIComponent(card.dataset.uid) + "/verify",
            { method:"POST", body:{ verified:false } });
          renderKyc();
        } catch (e) { alert("失敗しました: " + (e.code || e.message)); b.disabled = false; }
      };
    });
  } catch (e) {
    el.innerHTML = '<p class="empty">読み込みに失敗しました（' + esc(e.code || e.message) + '）</p>';
  }
}

// ───────── 対話記録 ─────────

      offerBtn.disabled = true;
      try {
        await api("/api/dialogue/admin/offer", { method:"POST", body:{
          uid, scheduledAt: new Date(at).toISOString(), venue, meetingUrl
        }});
        renderDialogue();
      } catch (e) { alert("失敗しました: " + (e.code || e.message)); offerBtn.disabled = false; }

    el.querySelectorAll("[data-orate]").forEach(btn => {
      btn.onclick = async () => {
        const card = btn.closest(".card");
        btn.disabled = true;
        try {
          await api("/api/dialogue/admin/" + card.dataset.id + "/rate",
            { method:"POST", body:{ wantsAgain: btn.dataset.orate === "1" } });
          renderDialogue();
        } catch (e) { alert("失敗しました: " + (e.code || e.message)); btn.disabled = false; }
      };
    });
    el.querySelectorAll("[data-record]").forEach(btn => {
      btn.onclick = async () => {
        const card = btn.closest(".card");
        btn.disabled = true;
        try {
          await api("/api/dialogue/admin/" + card.dataset.id + "/record",
            { method:"POST", body:{ outcome: card.querySelector("[data-outcome]").value } });

        } catch (e) { alert("失敗しました: " + (e.code || e.message)); btn.disabled = false; }

  } catch (e) {
    el.innerHTML = '<p class="empty">読み込みに失敗しました（' + esc(e.code || e.message) + '）</p>';
  }

/* ───────── SchoolPark ─────────
   クエストと議題を、ここから出す。
   ほかのタブはサーバー（Render）に聞いているが、SchoolPark の記録は
   Firestore に直接ある。ルールが「運営だけが書ける」を見ているので、
   この画面から書いてもすり抜けはできない。 */
let _sp = null;   // Firestore の道具。使うときに読み込む

async function spReady() {
  if (_sp) return _sp;
  const fs = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
  _sp = { db: fs.getFirestore(app), ...fs };
  return _sp;
}

/* 自分のパスポート番号。ches_accounts に入っている。
   取れなかったときは、どこで止まったのかを返す。
   「パスポートが見つかりません」だけだと、原因が分からず直しようがない。 */
async function spMyAddress() {
  const f = await spReady();
  const uid = auth.currentUser && auth.currentUser.uid;
  if (!uid) return { addr: null, why: "ログインしていません。" };
  let snap;
  try {
    snap = await f.getDoc(f.doc(f.db, "ches_accounts", uid));
  } catch (e) {
    return { addr: null, why: "アカウントの記録を読めませんでした（" + (e.code || e.message) + "）。uid: " + uid };
  }
  if (!snap.exists()) {
    return { addr: null, why: "この uid のアカウントの記録がありません。uid: " + uid
      + "\n一度 Emu を開いてログインすると作られます。" };
  }
  const d = snap.data() || {};
  const addr = d.chesAddress || d.walletAddress || null;
  if (!addr) {
    return { addr: null, why: "アカウントの記録はありますが、アドレスの欄が空です。uid: " + uid };
  }
  /* クエストと公園は、ルールが「運営のアドレスであること」を求める。
     ところが同じ運営でも、入り方でアドレスが変わる。
       LINE等   … chesAddress = walletAddress = uid から作った番号
       ウォレット … walletAddress は実ウォレット、chesAddress は
                    "wallet:0x…" から作った、また別の番号
     chesAddress を無条件に使うと、ウォレットで入ったときだけ
     運営のアドレスに当たらず、出そうとしても弾かれる。
     自分の持ち番号のうち、運営として登録されているものを選ぶ。 */
  const owned = [d.chesAddress, d.walletAddress]
    .filter(Boolean)
    .find(a => SP_OWNER_ADDRS.indexOf(String(a).toLowerCase()) >= 0);
  return { addr: addr, ownerAddr: owned || addr, why: "" };
}

async function renderSchoolPark() {
  const el = $("#tab-schoolpark");
  el.innerHTML = '<p class="empty">読み込み中…</p>';
  let f, me;
  try { f = await spReady(); me = await spMyAddress(); }
  catch (e) {
    el.innerHTML = '<p class="empty">読み込みに失敗しました（' + esc(e.code || e.message) + '）。<br>'
      + 'Firestore の読み込みが止められている可能性があります。</p>';
    return;
  }
  if (!me.addr) {
    el.innerHTML = '<div class="card"><h3>SchoolPark を開けませんでした</h3>'
      + '<p class="empty" style="text-align:left;white-space:pre-wrap">' + esc(me.why) + '</p>'
      + '<p class="empty" style="text-align:left">この画面は Firestore を直接読みます。'
      + 'ほかのタブ（会員一覧など）はサーバー経由なので、そちらが動いていても'
      + 'ここだけ止まることがあります。</p></div>';
    return;
  }
  const addr = me.addr;
  /* クエストと公園を出すときは、運営として登録されているアドレスを使う */
  const ownerAddr = me.ownerAddr || me.addr;

  const [qs, vs, ws, ps, ts2] = await Promise.all([
    f.getDocs(f.collection(f.db, "sp_quests")),
    f.getDocs(f.collection(f.db, "sp_votes")),
    f.getDocs(f.collection(f.db, "sp_wisdom")),
    f.getDocs(f.collection(f.db, "sp_park")),
    f.getDocs(f.collection(f.db, "sp_treasury"))
  ]);
  const money = []; ts2.forEach(s => money.push({ id: s.id, ...(s.data() || {}) }));
  money.sort((a, b) => (b.at || b.createdAt || 0) - (a.at || a.createdAt || 0));
  const PARK_KIND = { board:"今日ひま？ボード", dumb:"バカな挑戦", room:"いま開いてる部屋", event:"月例の集まり" };
  const park = []; ps.forEach(s => park.push({ id: s.id, ...(s.data() || {}) }));
  park.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const quests = []; qs.forEach(s => quests.push({ id: s.id, ...(s.data() || {}) }));
  quests.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const votes = []; vs.forEach(s => votes.push({ id: s.id, ...(s.data() || {}) }));
  votes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  let wisdomCount = 0; ws.forEach(() => wisdomCount++);

  /* 議題ごとの票を数える。数を別に持たず、票そのものを毎回数える。 */
  for (const v of votes) {
    v.counts = {}; v.total = 0;
    try {
      const bs = await f.getDocs(f.collection(f.db, "sp_votes", v.id, "ballots"));
      bs.forEach(b => {
        const o = String((b.data() || {}).optionId || "");
        if (!o) return;
        v.counts[o] = (v.counts[o] || 0) + 1; v.total++;
      });
    } catch (e) {}
  }
  /* クエストごとの「受けた人」「報告を出した人」を数える。
     完走＝受けていて、報告を1本以上出していて、そのクエストが完了したもの。 */
  const TRUST_NEED = 20;
  const M = {};
  const pick = (addr, name) => {
    const k = String(addr || "").toLowerCase();
    if (!k) return null;
    if (!M[k]) M[k] = { addr: addr, key: k, name: name || (addr.slice(0,6)+"…"+addr.slice(-4)),
      short: addr.slice(0,6)+"…"+addr.slice(-4), done:0, wisdom:0, cited:0 };
    if (name && M[k].name.indexOf("…") >= 0) M[k].name = name;
    return M[k];
  };
  for (const q of quests) {
    q.took = 0;
    const took = [];
    try {
      const cs = await f.getDocs(f.collection(f.db, "sp_quests", q.id, "commits"));
      cs.forEach(c => { q.took++; took.push({ addr: c.id, name: (c.data()||{}).name || "" }); });
    } catch (e) {}
    const wrote = {};
    try {
      const ls = await f.getDocs(f.collection(f.db, "sp_quests", q.id, "logs"));
      ls.forEach(l => { const a = String((l.data()||{}).author || "").toLowerCase(); if (a) wrote[a] = true; });
    } catch (e) {}
    took.forEach(t => {
      const m = pick(t.addr, t.name);
      if (m && q.status === "CLOSED" && wrote[m.key]) m.done++;
    });
  }
  /* 知恵カードと、引用された数 */
  {
    const mine = [];
    ws.forEach(s => { const d = s.data() || {}; mine.push({ id: s.id, author: d.author, name: d.authorName }); });
    for (const x of mine) {
      const m = pick(x.author, x.name);
      if (m) m.wisdom++;
      try {
        const cs = await f.getDocs(f.collection(f.db, "sp_wisdom", x.id, "cites"));
        cs.forEach(() => { if (m) m.cited++; });
      } catch (e) {}
    }
  }
  /* いま認めている人 */
  const trusted = {};
  try {
    const ts = await f.getDocs(f.collection(f.db, "sp_trust"));
    ts.forEach(s => { trusted[String(s.id).toLowerCase()] = true; });
  } catch (e) {}
  const people = Object.keys(M).map(k => {
    const m = M[k];
    /* 在籍月数はここでは数えない（人ごとにアカウントを引くと重いため）。
       画面に出すのは SchoolPark での実績ぶんの点数。 */
    m.score = m.done * 10 + m.wisdom * 5 + m.cited * 3;
    m.trusted = !!trusted[k];
    return m;
  }).sort((a, b) => b.score - a.score);

  const STATUS = { OPEN: "募集中", RUNNING: "進行中", CLOSED: "完了" };
  const yen = v => (parseInt(String(v || "0").replace(/[^0-9]/g, ""), 10) || 0).toLocaleString();

  /* ───── トレジャリーの集計 ─────
     クエストの予算は「これから払う約束」でしかない。
     いま持っている額は、記録した入金と支出で決まる。 */
  const CURRENCIES = ["JPY", "JPYC", "EMUER"];
  const CUR_LABEL = { JPY: "円", JPYC: "JPYC", EMUER: "EMUER" };
  const asMoney = (n, cur) => {
    const v = Math.round(Number(n) || 0);
    if (cur === "JPY") return (v < 0 ? "-¥" : "¥") + Math.abs(v).toLocaleString();
    return v.toLocaleString() + " " + (CUR_LABEL[cur] || cur);
  };
  const pot = {};
  CURRENCIES.forEach(c => pot[c] = { have: 0, promised: 0 });
  money.forEach(m => {
    const c = CURRENCIES.indexOf(m.currency) >= 0 ? m.currency : "JPY";
    const v = Math.max(0, Number(m.amount) || 0);
    pot[c].have += (m.kind === "out" ? -v : v);
  });
  quests.forEach(q => {
    const c = CURRENCIES.indexOf(q.budgetCurrency) >= 0 ? q.budgetCurrency : "JPY";
    if (q.status !== "CLOSED") pot[c].promised += (parseInt(String(q.budget || "0").replace(/[^0-9]/g, ""), 10) || 0);
  });

  el.innerHTML =
    '<div class="card"><h3>いまの状態</h3>'
    + '<div class="row"><span>クエスト</span><span>' + quests.length + ' 本</span></div>'
    + '<div class="row"><span>議題</span><span>' + votes.length + ' 件</span></div>'
    + '<div class="row"><span>知恵カード</span><span>' + wisdomCount + ' 枚</span></div>'
    + '<div class="row"><span>公園に置いたもの</span><span>' + park.length + ' 件</span></div></div>'

    + '<div class="card"><h3>トレジャリー</h3>'
    + '<p class="empty" style="text-align:left;margin:0 0 10px">'
    + '<b>ある</b>＝記録した入金から支出を引いた額。<b>約束済み</b>＝まだ完了していないクエストの予算。'
    + '<b>使える</b>がマイナスなら、払えない約束をしていることになります。</p>'
    + CURRENCIES.map(c => {
        const free = pot[c].have - pot[c].promised;
        return '<div class="row"><span>' + CUR_LABEL[c] + '</span><span>'
          + 'ある ' + asMoney(pot[c].have, c)
          + ' ／ 約束済み ' + asMoney(pot[c].promised, c)
          + ' ／ <b style="color:' + (free < 0 ? "#b91c1c" : "#166534") + '">使える '
          + asMoney(free, c) + '</b></span></div>';
      }).join("")
    + '<label>何のお金か</label><input id="atLabel" placeholder="例：Emu light 会費（8月分）／サーバー代">'
    + '<label>入金か支出か</label><select id="atKind">'
    + '<option value="in">入金（入ってきた）</option>'
    + '<option value="out">支出（出ていった）</option></select>'
    + '<label>金額と通貨</label><div style="display:flex;gap:8px">'
    + '<input id="atAmount" inputmode="numeric" placeholder="0" style="flex:1;min-width:0">'
    + '<select id="atCurrency" style="flex:0 0 110px">'
    + CURRENCIES.map(c => '<option value="' + c + '">' + CUR_LABEL[c] + '</option>').join("")
    + '</select></div>'
    + '<label>日付</label><input id="atDate" type="date">'
    + '<label>メモ（任意）</label><textarea id="atNote" rows="2" placeholder="振込元・用途など"></textarea>'

        const d = m.at || m.createdAt;
        return '<div class="row"><span>' + (d ? fmt(d) : "—") + ' · ' + esc(m.label || "") + '</span>'

      : '<p class="empty">まだ記録がありません。</p>')

        + ' · ' + q.took + '/' + (q.need || 5) + '人が受けた</small></span>'
        + '<span>'
        + (q.status !== "RUNNING" ? '<button class="act neutral" data-qrun="' + esc(q.id) + '">進行中にする</button> ' : '')
        + (q.status !== "CLOSED" ? '<button class="act ok" data-qclose="' + esc(q.id) + '">完了にする</button>' : '')
        + '</span></div>').join("")
      : '<p class="empty">まだクエストがありません。</p>')
    + '</div>'

    + '<div class="card"><h3>公園に置く</h3>'
    + '<p class="empty" style="text-align:left;margin:0 0 10px">締切も報酬もない場所。'
    + '「乗る」はどなたでもできます。</p>'
    + '<label>種類</label><select id="apKind">'
    + '<option value="board">今日ひま？ボード</option>'
    + '<option value="dumb">バカな挑戦</option>'
    + '<option value="room">いま開いてる部屋</option>'
    + '<option value="event">月例、リアルの集まり</option></select>'
    + '<label>題名</label><input id="apTitle" placeholder="例：誰か通話つないで作業しない？">'
    + '<label>説明</label><textarea id="apBody" rows="2" placeholder="無言でいい。カメラも要らない。"></textarea>'
    + '<label>いつ（ボードのみ）</label><input id="apWhen" placeholder="例：今夜 20:00〜 ／ いつでも">'
    + '<label>日付（集まりのみ）</label><input id="apAt" type="date">'
    + '<label>場所（集まりのみ）</label><input id="apPlace" placeholder="例：代々木公園">'
    + '<label>ひとこと（挑戦・集まり）</label><input id="apWho" placeholder="例：12人が行く ／ 3日目で心が折れた">'
    + '<div class="actions"><button class="btn primary" id="apSubmit">公園に置く</button></div></div>'

    + '<div class="card"><h3>公園にあるもの</h3>'
    + (park.length ? park.map(x =>
        '<div class="row"><span>' + esc(x.title || "")
        + '<br><small style="color:var(--muted)">' + (PARK_KIND[x.kind] || x.kind)
        + (x.hidden ? ' · しまってある' : '') + '</small></span>'
        + '<span><button class="act ' + (x.hidden ? 'ok' : 'neutral') + '" data-phide="' + esc(x.id) + '" data-pnow="'
        + (x.hidden ? '1' : '0') + '">' + (x.hidden ? '出す' : 'しまう') + '</button> '
        + '<button class="act no" data-pdel="' + esc(x.id) + '">消す</button></span></div>').join("")
      : '<p class="empty">まだ何もありません。</p>')
    + '</div>'

    + '<div class="card"><h3>ギルドに関われる人</h3>'
    + '<p class="empty" style="text-align:left;margin:0 0 10px">議題を出せるのは、運営・公式パスの方・ここで認めた方です。'
    + '特殊ギルドの投票も同じ。一般ギルドの投票は誰でもできます。<br>'
    + '信用スコア＝完走×10＋知恵×5＋引用され×3＋在籍月数（上限12）。'
    + '目安は ' + TRUST_NEED + ' 点です。</p>'
    + (people.length ? people.map(m =>
        '<div class="row"><span>' + esc(m.name) + '<br>'
        + '<small style="color:var(--muted)">' + esc(m.short) + ' · '
        + '信用 ' + m.score + ' 点（完走' + m.done + '・知恵' + m.wisdom + '・引用され' + m.cited + '）'
        + (m.trusted ? ' · 認めています' : '') + '</small></span>'
        + '<span>' + (m.trusted
            ? '<button class="act no" data-tdel="' + esc(m.addr) + '">取り消す</button>'
            : '<button class="act ok" data-tadd="' + esc(m.addr) + '" data-tname="' + esc(m.name) + '">参加OKにする</button>')
        + '</span></div>').join("")
      : '<p class="empty">まだ活動している人がいません。</p>')
    + '</div>'

    + '<div class="card"><h3>議題と投票の結果</h3>'
    + '<p class="empty" style="text-align:left;margin:0 0 10px">締切は早めることだけできます。'
    + '先に延ばすことはできません（負けそうだから延長、ができないように）。'
    + '題名・説明・選択肢は出したあと動かせません。</p>'
    + (votes.length ? votes.map(v => {
        const closed = !!v.closesAt && v.closesAt <= Date.now();
        const bars = (v.options || []).map(o => {
          const n = v.counts[o.id] || 0;
          const pct = v.total ? Math.round(n / v.total * 100) : 0;
          return '<div class="row"><span>' + esc(o.label) + '</span>'
            + '<span>' + n + '票 · ' + pct + '%</span></div>';
        }).join("");
        return '<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:12px">'
          + '<div class="row"><span><b>' + esc(v.title || "") + '</b><br>'
          + '<small style="color:var(--muted)">' + (closed ? "締め切り済み" : "受付中")
          + ' · ' + v.total + '票 · ' + fmt(v.closesAt ? new Date(v.closesAt).toISOString() : null) + ' まで</small></span>'
          + '<span>' + (closed ? "" : '<button class="act no" data-vclose="' + esc(v.id) + '">いま締め切る</button>') + '</span></div>'
          + bars + '</div>';
      }).join("")
      : '<p class="empty">まだ議題がありません。</p>')
    + '</div>';

  /* トレジャリーに1本記録する。
     金額はあとから書き換えられない（ルールでも update を止めてある）。
     間違えたら消して入れ直す。 */
  $("#atSubmit").onclick = async () => {
    const v = id => ($("#" + id).value || "").trim();
    const label = v("atLabel");
    if (!label) { alert("何のお金かを書いてください。"); return; }
    const amount = parseInt(v("atAmount").replace(/[^0-9]/g, ""), 10) || 0;
    if (amount <= 0) { alert("金額を入れてください。"); return; }
    const cur = CURRENCIES.indexOf(v("atCurrency")) >= 0 ? v("atCurrency") : "JPY";
    const kind = v("atKind") === "out" ? "out" : "in";
    /* 日付は入れなければ今日。入れたらその日の正午として扱う
       （時刻を0時にすると、時差で前日に見えることがあるため）。 */
    let at = Date.now();
    if (v("atDate")) {
      const d = new Date(v("atDate") + "T12:00:00");
      if (!isNaN(d.getTime())) at = d.getTime();
    }
    try {
      await f.addDoc(f.collection(f.db, "sp_treasury"), {
        kind: kind, currency: cur, amount: amount,
        label: label.slice(0, 120), note: v("atNote").slice(0, 400),
        at: at, createdAt: Date.now(), by: ownerAddr
      });
    } catch (e) { alert("記録できませんでした（" + (e.code || e.message) + "）"); return; }
    renderSchoolPark();
  };

  document.querySelectorAll("[data-atdel]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("この記録を消します。よろしいですか？\n（金額を直すときは、消して入れ直してください）")) return;
      try { await f.deleteDoc(f.doc(f.db, "sp_treasury", b.dataset.atdel)); }
      catch (e) { alert("消せませんでした（" + (e.code || e.message) + "）"); return; }
      renderSchoolPark();
    };
  });

  $("#aqSubmit").onclick = async () => {
    const v = id => ($("#" + id).value || "").trim();
    if (!v("aqTitle")) { alert("何を試すのかを書いてください。"); return; }
    if (!v("aqHypothesis")) { alert("予想を書いてください。"); return; }
    const days = Math.max(1, Math.min(90, parseInt(v("aqDays"), 10) || 14));
    try {
      await f.addDoc(f.collection(f.db, "sp_quests"), {
        title: v("aqTitle").slice(0, 120), knowledge: v("aqKnowledge").slice(0, 200),
        hypothesis: v("aqHypothesis").slice(0, 400), action: v("aqAction").slice(0, 400),
        measure: v("aqMeasure").slice(0, 400),
        budget: String(parseInt(v("aqBudget").replace(/[^0-9]/g, ""), 10) || 0),
        budgetCurrency: CURRENCIES.indexOf(v("aqCurrency")) >= 0 ? v("aqCurrency") : "JPY",
        need: Math.max(1, Math.min(50, parseInt(v("aqNeed"), 10) || 5)),
        owner: ownerAddr, ownerName: (auth.currentUser && auth.currentUser.displayName) || "運営",
        status: "OPEN", createdAt: Date.now(), closesAt: Date.now() + days * 86400000
      });
    } catch (e) { alert("出せませんでした（" + (e.code || e.message) + "）"); return; }
    renderSchoolPark();
  };

  $("#avSubmit").onclick = async () => {
    const v = id => ($("#" + id).value || "").trim();
    if (!v("avTitle")) { alert("議題を書いてください。"); return; }
    const labels = v("avOpts").split("\n").map(x => x.trim()).filter(Boolean);
    if (labels.length < 2 || labels.length > 4) { alert("選択肢は2〜4つにしてください。"); return; }
    const days = Math.max(1, Math.min(30, parseInt(v("avDays"), 10) || 7));
    try {
      await f.addDoc(f.collection(f.db, "sp_votes"), {
        title: v("avTitle").slice(0, 120), body: v("avBody").slice(0, 600),
        options: labels.map((l, i) => ({ id: "o" + (i + 1), label: l.slice(0, 60) })),
        kind: (v("avKind") === "special") ? "special" : "free",
        createdBy: addr, createdAt: Date.now(), closesAt: Date.now() + days * 86400000
      });
    } catch (e) { alert("出せませんでした（" + (e.code || e.message) + "）"); return; }
    renderSchoolPark();
  };

  el.querySelectorAll("[data-qrun]").forEach(b => {
    b.onclick = async () => {
      try { await f.updateDoc(f.doc(f.db, "sp_quests", b.dataset.qrun), { status: "RUNNING" }); }
      catch (e) { alert("変えられませんでした（" + (e.code || e.message) + "）"); return; }
      renderSchoolPark();
    };
  });
  el.querySelectorAll("[data-qclose]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("このクエストを完了にします。受付は締め切られます。よろしいですか？")) return;
      try { await f.updateDoc(f.doc(f.db, "sp_quests", b.dataset.qclose), { status: "CLOSED", closedAt: Date.now() }); }
      catch (e) { alert("変えられませんでした（" + (e.code || e.message) + "）"); return; }
      renderSchoolPark();
    };
  });
  $("#apSubmit").onclick = async () => {
    const v = id => ($("#" + id).value || "").trim();
    if (!v("apTitle")) { alert("題名を書いてください。"); return; }
    const kind = v("apKind") || "board";
    const doc = { kind: kind, title: v("apTitle").slice(0, 120), body: v("apBody").slice(0, 600),
      by: ownerAddr, createdAt: Date.now(), hidden: false };
    if (kind === "board") doc.when = v("apWhen").slice(0, 60) || "いつでも";
    if (kind === "event") {
      const at = v("apAt");
      if (!at) { alert("集まりの日付を入れてください。"); return; }
      doc.at = new Date(at + "T00:00:00").getTime();
      doc.place = v("apPlace").slice(0, 80);
    }
    if (kind === "dumb" || kind === "event") doc.who = v("apWho").slice(0, 80);
    try { await f.addDoc(f.collection(f.db, "sp_park"), doc); }
    catch (e) { alert("置けませんでした（" + (e.code || e.message) + "）"); return; }
    renderSchoolPark();
  };
  el.querySelectorAll("[data-phide]").forEach(b => {
    b.onclick = async () => {
      try { await f.updateDoc(f.doc(f.db, "sp_park", b.dataset.phide), { hidden: b.dataset.pnow !== "1" }); }
      catch (e) { alert("変えられませんでした（" + (e.code || e.message) + "）"); return; }
      renderSchoolPark();
    };
  });
  el.querySelectorAll("[data-pdel]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("これを消します。元に戻せません。よろしいですか？")) return;
      try { await f.deleteDoc(f.doc(f.db, "sp_park", b.dataset.pdel)); }
      catch (e) { alert("消せませんでした（" + (e.code || e.message) + "）"); return; }
      renderSchoolPark();
    };
  });
  el.querySelectorAll("[data-tadd]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("この方をギルドに参加OKにします。\n\n議題を出すことと、特殊ギルドへの投票ができるようになります。")) return;
      try { await f.setDoc(f.doc(f.db, "sp_trust", b.dataset.tadd),
        { name: b.dataset.tname || "", by: addr, at: Date.now() }); }
      catch (e) { alert("できませんでした（" + (e.code || e.message) + "）"); return; }
      renderSchoolPark();
    };
  });
  el.querySelectorAll("[data-tdel]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("この方の参加を取り消します。よろしいですか？")) return;
      try { await f.deleteDoc(f.doc(f.db, "sp_trust", b.dataset.tdel)); }
      catch (e) { alert("できませんでした（" + (e.code || e.message) + "）"); return; }
      renderSchoolPark();
    };
  });
  el.querySelectorAll("[data-vclose]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("この議題をいま締め切ります。\n\n締め切ると、もう投票できません。よろしいですか？")) return;
      try { await f.updateDoc(f.doc(f.db, "sp_votes", b.dataset.vclose), { closesAt: Date.now() }); }
      catch (e) { alert("締め切れませんでした（" + (e.code || e.message) + "）"); return; }
      renderSchoolPark();
    };
  });
}

/* ───────── Emu（Room1）─────────
   旧 Room1 管理画面にあった「直接追加」と「お預かり箱」を移した。
   あちらは開くたびに管理者APIキーを手で入れる作りだったが、
   サーバー側を直したので、ここではログインしているだけで通る。 */
const R1_THEMES = {
  money: { label: "マネーリテラシー",
    subs: ["増やし方","育て方","守り方","使い方","付き合い方","稼ぎ方","見極め方","回し方"] },
  net:   { label: "ネットリテラシー",
    subs: ["SNSとの付き合い方","炎上・トラブル対策","詐欺・フェイクの見抜き方","個人情報・セキュリティ","AIとの付き合い方","発信と責任","ネットの法律・ルール"] },
  life:  { label: "ライフリテラシー",
    subs: ["感情との向き合い方","交渉","家事","エチケット","セルフケア","レジリエンス","パブリック"] },
  blue:  { label: "ブルーファイル", subs: {
    "リーダーシップ":   ["理念","ビジョン","戦略","変革","創造的能力","創造的態度"],
    "マネジメント":     ["目標設定","計画立案","進捗管理","目標達成","計数管理"],
    "人材活用":         ["組織運営","人材発掘・活用","業務委任","人材育成","動機付け","人的ネットワーク"],
    "意思決定":         ["決断力","解決案の提示","問題分析","情報収集","改善"],
    "ヒューマンスキル": ["状況把握","自己客観視点","チームワーク","共感力","異文化コミュニケーション","傾聴力","説得力","プレゼンテーション","企画提案力","伝達力"],
    "志向":             ["クオリティ","カスタマー","プロフィット","スペシャリティ"],
    "姿勢":             ["成長・学習意欲","柔軟な対応","主体的な行動","誠実な対応","ルール遵守","マナー意識"],
    "エネルギー":       ["信念","タフネス","ストレスコントロール","継続力"]
  }}
};

async function renderEmu() {
  const el = $("#tab-emu");
  el.innerHTML = '<p class="empty">読み込み中…</p>';

  let subs = [];
  try { subs = await api("/api/room1/submissions"); }
  catch (e) {
    const code = String(e.code || e.message || "");
    /* 止まった理由ごとに言い分ける。まとめて出すと直しようがない。 */
    const why =
      (code === "UNAUTHORIZED")
        ? "サーバー（Render）の再デプロイがまだのようです。ログインだけで使えるようにした変更が、まだ反映されていません。"
      : (code === "OWNER_ONLY")
        ? "この画面はオーナー専用です。別のアカウントでログインしていませんか。"
      : (code === "AUTH_REQUIRED" || code === "INVALID_AUTH_TOKEN" || code === "AUTH_UNAVAILABLE")
        ? "ログインが確認できませんでした。ページを開き直してみてください。"
      : (code === "ACCOUNT_NOT_FOUND" || code === "WALLET_NOT_FOUND")
        ? "アカウントの記録が見つかりませんでした。一度 Emu を開いてください。"
      : "サーバーとのやりとりで止まりました。";
    el.innerHTML = '<div class="card"><h3>Room1 を開けませんでした</h3>'
      + '<p class="empty" style="text-align:left">' + esc(why) + '</p>'
      + '<p class="meta">' + esc(code) + '</p></div>';
    return;
  }
  const waiting = (subs || []).filter(s => !s.status || s.status === "pending");

  el.innerHTML =
    '<div class="card"><h3>学習コンテンツを直接追加</h3>'
    + '<p class="empty" style="text-align:left;margin:0">Room1（マネー・ネット・ライフ・ブルーファイル）に、そのまま載ります。</p>'
    + '<label for="r1Theme">テーマ</label><select id="r1Theme"><option value="">選んでください</option>'
    + Object.keys(R1_THEMES).map(k => '<option value="' + k + '">' + esc(R1_THEMES[k].label) + '</option>').join("")
    + '</select>'
    + '<label for="r1Sub">サブテーマ</label><select id="r1Sub" disabled><option value="">先にテーマを選んでください</option></select>'
    + '<div id="r1SubsubRow" class="hide"><label for="r1Subsub">サブサブテーマ（ブルーファイルのみ）</label>'
    + '<select id="r1Subsub" disabled><option value="">先にサブテーマを選んでください</option></select></div>'
    + '<label for="r1Summary">要約（一覧の冒頭に出ます）</label>'
    + '<input id="r1Summary" placeholder="例：生活防衛資金は月収3〜6ヶ月分を目安に">'
    + '<label for="r1Body">本文</label><textarea id="r1Body" rows="7" placeholder="学習コンテンツの本文"></textarea>'
    + '<label for="r1Note">補足・背景・注意点</label><textarea id="r1Note" rows="3" placeholder="あれば"></textarea>'
    + '<label for="r1NoteUrl">Note記事のURL（任意）</label><input id="r1NoteUrl" placeholder="https://note.com/...">'
    + '<div class="actions"><button class="act ok" id="r1Add">コンテンツを追加する</button></div></div>'

    + '<div class="card" id="r1Inbox"></div>';
  paintInbox(subs);
  startInboxWatch();

  const themeSel = $("#r1Theme"), subSel = $("#r1Sub"), subsubSel = $("#r1Subsub"), subsubRow = $("#r1SubsubRow");
  themeSel.onchange = () => {
    const t = themeSel.value;
    subsubSel.innerHTML = '<option value="">先にサブテーマを選んでください</option>';
    subsubSel.disabled = true;
    subsubRow.classList.toggle("hide", t !== "blue");
    if (!t) { subSel.innerHTML = '<option value="">先にテーマを選んでください</option>'; subSel.disabled = true; return; }
    const list = (t === "blue") ? Object.keys(R1_THEMES.blue.subs) : R1_THEMES[t].subs;
    subSel.innerHTML = '<option value="">選んでください</option>'
      + list.map(x => '<option value="' + esc(x) + '">' + esc(x) + '</option>').join("");
    subSel.disabled = false;
  };
  subSel.onchange = () => {
    if (themeSel.value !== "blue" || !subSel.value) { subsubSel.disabled = true; return; }
    subsubSel.innerHTML = '<option value="">選んでください（任意）</option>'
      + (R1_THEMES.blue.subs[subSel.value] || []).map(x => '<option value="' + esc(x) + '">' + esc(x) + '</option>').join("");
    subsubSel.disabled = false;
  };

  $("#r1Add").onclick = async () => {
    const v = id => ($("#" + id).value || "").trim();
    if (!themeSel.value || !subSel.value || !v("r1Body")) {
      alert("テーマ・サブテーマ・本文は必ず入れてください。"); return;
    }
    const btn = $("#r1Add"); btn.disabled = true; btn.textContent = "追加しています…";
    try {
      await api("/api/room1/direct-add", { method: "POST", body: {
        theme: themeSel.value, subTheme: subSel.value,
        subSubTheme: (themeSel.value === "blue" ? subsubSel.value : ""),
        summary: v("r1Summary"), body: v("r1Body"), note: v("r1Note"), noteUrl: v("r1NoteUrl")
      }});
    } catch (e) {
      alert("追加できませんでした（" + (e.code || e.message) + "）");
      btn.disabled = false; btn.textContent = "コンテンツを追加する"; return;
    }
    renderEmu();
  };

}

/* お預かり箱の中身だけを描く。
   直接追加の入力欄は描き直さない。書きかけが消えてしまうため。 */
function paintInbox(subs) {
  const box = $("#r1Inbox");
  if (!box) return;
  const waiting = (subs || []).filter(s => !s.status || s.status === "pending");
  box.innerHTML =
    '<h3>お預かり箱 <span class="pill">' + waiting.length + ' 件</span>'
    + ' <span class="meta" id="r1InboxAt" style="font-weight:400"></span></h3>'
    + '<p class="empty" style="text-align:left;margin:0 0 8px">利用者から届いた気づき・疑問・体験です。'
    + '通すと学習コンテンツになります。開いているあいだ、15秒ごとに読み直します。</p>'
    + (waiting.length ? waiting.map(s =>
        '<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:12px">'
        + '<div class="meta">' + esc(R1_THEMES[s.theme] ? R1_THEMES[s.theme].label : (s.theme || "—"))
        + (s.subTheme ? ' / ' + esc(s.subTheme) : "") + ' · ' + fmt(s.createdAt) + '</div>'
        + '<p style="white-space:pre-wrap;font-size:14px;margin:8px 0">' + esc(s.body || "") + '</p>'
        + '<div class="actions">'
        + '<button class="act ok" data-r1ok="' + esc(s.id) + '">通して載せる</button>'
        + '<button class="act no" data-r1no="' + esc(s.id) + '">見送る</button></div></div>').join("")
      : '<p class="empty">いま届いているものはありません。</p>')
    + '<div class="actions"><button class="act neutral" id="r1Reload">いま読み直す</button></div>';

  const at = $("#r1InboxAt");
  if (at) at.textContent = "最終確認 " + new Date().toLocaleTimeString("ja-JP");

  /* タブにも件数を出す。開かないと気づけない、を無くす */
  const tab = document.querySelector('.tabs button[data-tab="emu"]');
  if (tab) {
    tab.textContent = waiting.length ? ("Emu 📮" + waiting.length) : "Emu";
    tab.style.borderColor = waiting.length ? "#f08300" : "";
    tab.style.color = waiting.length ? "#b45309" : "";
  }

  /* 押したことが分かるようにする。
     以前は refreshInbox(true) を呼ぶだけで、
     ・失敗しても黙って捨てる
     ・成功しても中身が同じなら見た目が変わらない
     ので、押しても何も起きていないように見えていた。 */
  $("#r1Reload").onclick = async (ev) => {
    const btn = ev.currentTarget;
    btn.disabled = true;
    btn.textContent = "読み直しています…";
    const err = await refreshInbox(true);
    // 中身が同じなら描き直されず、このボタンがそのまま残る
    const still = $("#r1Reload");
    if (still) {
      still.disabled = false;
      still.textContent = err ? "もう一度読み直す" : "いま読み直す";
    }
    const at = $("#r1InboxAt");
    if (at) {
      at.textContent = err
        ? "読み直せませんでした（" + err + "）"
        : "最終確認 " + new Date().toLocaleTimeString("ja-JP");
      at.style.color = err ? "#b91c1c" : "";
    }
  };
  box.querySelectorAll("[data-r1ok]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("これを学習コンテンツとして載せます。よろしいですか？")) return;
      try { await api("/api/room1/approve/" + encodeURIComponent(b.dataset.r1ok), { method: "POST", body: {} }); }
      catch (e) { alert("通せませんでした（" + (e.code || e.message) + "）"); return; }
      refreshInbox(true);
    };
  });
  box.querySelectorAll("[data-r1no]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("これを見送ります。よろしいですか？")) return;
      try { await api("/api/room1/reject/" + encodeURIComponent(b.dataset.r1no), { method: "POST", body: {} }); }
      catch (e) { alert("できませんでした（" + (e.code || e.message) + "）"); return; }
      refreshInbox(true);
    };
  });
}

/* 開いているあいだ、繰り返し読み直す。
   届いたものが管理画面の再読み込みなしで出るようにするため。 */
let _inboxTimer = null;
/* 読めなかったときは、その理由を文字で返す（読めたときは null）。
   自動の15秒ごとの回では黙って見送り、手で押したときだけ画面に出す。 */
async function refreshInbox(force) {
  if (!$("#r1Inbox")) return null;                  // Emuタブを離れた
  if (!force && document.hidden) return null;       // 見ていないときは休む
  try {
    paintInbox(await api("/api/room1/submissions"));
    return null;
  } catch (e) {
    return (e && (e.code || e.message)) || "原因不明";
  }
}
function startInboxWatch() {
  stopInboxWatch();
  _inboxTimer = setInterval(refreshInbox, 15000);
}
function stopInboxWatch() {
  if (_inboxTimer) { clearInterval(_inboxTimer); _inboxTimer = null; }
}
/* 画面に戻ってきたら、待たずに1回読む */
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshInbox(); });

document.querySelectorAll(".tabs button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("active", x === b));
    ["members","review","refunds","kyc","dialogue","metrics","schoolpark","emu"].forEach(t =>
      document.getElementById("tab-" + t).classList.toggle("hide", t !== b.dataset.tab));
    /* Emuタブを離れたら、お預かり箱の読み直しを止める */
    if (b.dataset.tab !== "emu") stopInboxWatch();
    ({ members: renderMembers, review: renderReview, refunds: renderRefunds, kyc: renderKyc, dialogue: renderDialogue, metrics: renderMetrics, schoolpark: renderSchoolPark, emu: renderEmu })[b.dataset.tab]();
  };
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    $("#gate").innerHTML = 'ログインが必要です。<br><br><a href="/">Emu にログインする →</a>';
    return;
  }
  idToken = await user.getIdToken();
  try {
    // オーナー以外はサーバーが 403 を返す。画面側でも入口で弾く。
    await api("/api/billing/admin/refunds?status=pending");
    $("#gate").classList.add("hide");
    $("#main").classList.remove("hide");
    renderMembers();   // 最初に開くのは会員一覧

    /* 受領コメントの期限は、管理画面を開かないと気づけないと約束を落とす。
       タブに件数を出して、中を見る前に分かるようにする。 */
    try {
      const due = await api("/api/review/admin/due");
      const tab = document.querySelector('.tabs button[data-tab="review"]');
      if (tab && (due.overdue > 0 || due.dueIn2Days > 0)) {
        tab.textContent = "受領コメント " + (due.overdue > 0 ? "🔴" + due.overdue : "🟠" + due.dueIn2Days);
        tab.style.borderColor = due.overdue > 0 ? "#c0392b" : "#f08300";
        tab.style.color = due.overdue > 0 ? "#c0392b" : "#b45309";
      }
    } catch (e) { /* 取れなくても管理画面は使える */ }
  } catch (e) {
    $("#gate").textContent = e.code === "OWNER_ONLY"
      ? "この画面はオーナー専用です。"
      : "読み込みに失敗しました（" + (e.code || e.message) + "）";
  }
});
</script>
</body>
