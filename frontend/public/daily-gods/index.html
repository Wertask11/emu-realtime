<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>日常の神々 — カードゲーム</title><link rel="stylesheet" href="./game.css"></head><body>
<div id="godgame"><div class="board">
<div class="top"><h2>日常の神々</h2><span id="gg-round"></span></div>
<div class="subtitle">十九柱の気まぐれ決戦 · 1人用</div>
<div class="scores"><div><span>あなた</span><div class="hp"><span id="gg-pbar"></span></div><span id="gg-php" class="statline"></span></div><div><span>CPU</span><div class="hp"><span id="gg-cbar"></span></div><span id="gg-chp" class="statline"></span></div></div>
<div class="arena"><div id="gg-pslot" class="slot"></div><div id="gg-cslot" class="slot"></div></div>
<div id="gg-status" class="status" aria-live="polite"></div>
<div class="top"><span>あなたの手札</span><span id="gg-deck"></span></div>
<div id="gg-hand" class="hand"></div>
<div id="gg-selected" class="selected" aria-live="polite"></div>
<div class="actions"><button id="gg-play" class="primary" disabled>この神を召喚</button><button id="gg-next" hidden>次のラウンドへ</button><button id="gg-restart" hidden>もう一度遊ぶ</button></div>
<details open><summary>遊び方</summary><div class="rules"><div>手札を1枚選んで「この神を召喚」。CPUと同時に公開し、神の能力で勝負します。</div><div>気力は24。先に相手を0にすれば勝ち。19ラウンド終了時は残り気力が多い方の勝ちです。同時に0、または同点なら引き分け。</div><div>双方とも19種類を1枚ずつ使用。手札3枚から毎回1枚使い、山札があれば1枚補充。CPUはあなたが選ぶ前にカードを決めています。</div><div>回復（上限24）→同時攻撃の順。防御はそのラウンドだけ有効。「貫通」は防御とダメージ上限を無視します。</div></div></details>
<details><summary>十九柱のカード図鑑</summary><div id="gg-catalog" class="catalog"></div></details>
<details><summary>対戦の記録</summary><ol id="gg-log" class="log"></ol></details>
</div></div>
<script src="./game.js" defer></script></body></html>
