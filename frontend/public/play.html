<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日の遊び — Emu</title>
<style>
:root{--mikan:#f08300;--ink:#25211d;--muted:#77716a;--line:#e8dfd5;--paper:#faf7f2;--soft:#fff0dc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",sans-serif}button{font:inherit;cursor:pointer}.page{max-width:1180px;margin:auto;padding:42px 28px 72px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.eyebrow{color:var(--mikan);font-size:12px;font-weight:800;letter-spacing:.14em}.intro h1{font:700 36px/1.3 Georgia,"Yu Mincho",serif;margin:8px 0}.intro p{color:var(--muted);margin:0;line-height:1.7}.today{background:var(--mikan);color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}.feature,.play-card{background:#fff;border:1px solid var(--line);border-radius:20px}.feature{padding:30px;border-left:6px solid var(--mikan)}.meta,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.badge{display:inline-flex;background:var(--soft);color:#8a4600;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800}.meta small{color:var(--muted)}.feature h2{font:700 27px/1.45 Georgia,"Yu Mincho",serif;margin:18px 0 10px}.feature>p{color:#5f5952;line-height:1.8}.button{border:1px solid var(--line);background:#fff;color:#514b45;border-radius:10px;padding:11px 15px;font-weight:800}.button:hover{border-color:var(--mikan);color:#a85500}.primary{background:var(--mikan);border-color:var(--mikan);color:#fff}.primary:hover{background:#d97600;color:#fff}.plays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.play-card{padding:20px;text-align:left;display:grid;gap:10px}.play-card strong{line-height:1.55}.play-card small{color:var(--muted)}.note{color:var(--muted);font-size:12px;margin-top:18px}.status{margin-top:18px;padding:13px 16px;background:var(--soft);color:#784000;border-radius:12px;display:none}@media(max-width:760px){.page{padding:24px 14px 50px}.intro{align-items:flex-start}.intro h1{font-size:29px}.plays{grid-template-columns:1fr}.feature{padding:22px}.feature h2{font-size:23px}}
</style>
<style>.plays{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:760px){.plays{grid-template-columns:1fr}}</style>
</head>
<body>
<main class="page">
  <header class="intro"><div><div class="eyebrow">PLAY TODAY</div><h1>今日の遊び</h1><p>少し動けば、今日が誰かとつながる体験になる。</p></div><span class="today">TODAY</span></header>
  <section class="feature">
    <div class="meta"><span class="badge">今すぐ遊べる</span><small>思考・言葉・誰かとのつながり</small></div>
    <h2>ECHO FIELDで、誰かの言葉を受け取ろう</h2>
    <p>言葉を置き、誰かの言葉と出会う小さな遊び。上手に話す必要はありません。今の気持ちから始められます。</p>
    <div class="actions"><button class="button primary" data-play="echo">今すぐ参加する</button><button class="button" data-remind>あとで参加</button></div>
  </section>
  <section class="plays" aria-label="遊びの一覧">
    <button class="play-card" data-play="ringo"><span class="badge">思考実験</span><strong>林檎の方程式</strong><small>哲学と数式の境界で遊ぶ</small></button>
    <button class="play-card" data-play="echo"><span class="badge">言葉で遊ぶ</span><strong>ECHO FIELD</strong><small>誰かの言葉を受け取り、次へ渡す</small></button>
  </section>
  <p class="note">遊んだ記録は「一日シェア」へ、体験から得た気づきは「知識を届ける」へつながります。</p>
  <div class="status" id="status" role="status"></div>
</main>
<script>
const ORIGIN=location.origin,send=message=>parent.postMessage(message,ORIGIN),status=document.getElementById('status');
document.querySelectorAll('[data-play]').forEach(button=>button.onclick=()=>send({type:'emu-play-open',play:button.dataset.play}));
document.querySelector('[data-remind]').onclick=()=>{localStorage.setItem('emuPlayReminder',new Date().toISOString());status.textContent='今日の遊びを「あとで参加」に保存しました。';status.style.display='block'};
</script>
</body>
</html>
