<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>開催中の議論 — Emu</title>
<style>
:root{--mikan:#f08300;--ink:#25211d;--muted:#77716a;--line:#e8dfd5;--paper:#faf7f2;--soft:#fff0dc}*{box-sizing:border-box}*,*::before,*::after{-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",sans-serif}button{font:inherit;cursor:pointer}.page{max-width:1180px;margin:auto;padding:42px 28px 72px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.eyebrow{color:var(--mikan);font-size:12px;font-weight:800;letter-spacing:.14em}.intro h1{font:700 36px/1.3 Georgia,"Yu Mincho",serif;margin:8px 0}.intro p{color:var(--muted);margin:0;line-height:1.7}.live{background:var(--mikan);color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}.feature,.topic{background:#fff;border:1px solid var(--line);border-radius:20px}.feature{padding:30px;border-left:6px solid var(--mikan)}.meta,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.badge{display:inline-flex;background:var(--soft);color:#8a4600;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800}.meta small{color:var(--muted)}.feature h2{font:700 27px/1.45 Georgia,"Yu Mincho",serif;margin:18px 0 10px}.feature>p{color:#5f5952;line-height:1.8}.button{border:1px solid var(--line);background:#fff;color:#514b45;border-radius:10px;padding:11px 15px;font-weight:800}.button:hover{border-color:var(--mikan);color:#a85500}.primary{background:var(--mikan);border-color:var(--mikan);color:#fff}.primary:hover{background:#d97600;color:#fff}.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.topic{padding:20px;text-align:left;display:grid;gap:10px}.topic strong{line-height:1.55}.topic small{color:var(--muted)}.note{color:var(--muted);font-size:12px;margin-top:18px}.feature.own{margin-top:18px;border-left-color:#8a7fd0}.feature.own #ownTopic{width:100%;margin:14px 0 4px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;color:var(--ink);background:#fff;box-sizing:border-box}.feature.own #ownTopic:focus{outline:none;border-color:var(--mikan)}.status{margin-top:18px;padding:13px 16px;background:var(--soft);color:#784000;border-radius:12px;display:none}@media(max-width:760px){.page{padding:24px 14px 50px}.intro{align-items:flex-start}.intro h1{font-size:29px}.topics{grid-template-columns:1fr}.feature{padding:22px}.feature h2{font-size:23px}}
</style>
<style>
@media(max-width:1024px) and (min-width:621px){.page{padding:32px 24px 64px}.topics{grid-template-columns:repeat(2,minmax(0,1fr))}.topic:last-child{grid-column:1/-1}.feature{padding:26px}}
@media(max-width:620px){.page{padding:20px 13px max(42px,env(safe-area-inset-bottom))}.intro{align-items:flex-start;margin-bottom:14px}.intro h1{font-size:28px}.intro p{font-size:13px}.live{flex:none}.feature{padding:20px 17px;border-left-width:4px;border-radius:16px}.feature h2{font-size:22px;margin:15px 0 9px}.feature>p{font-size:14px;line-height:1.75}.actions{display:grid;grid-template-columns:1fr}.button{width:100%;min-height:46px}.topics{grid-template-columns:1fr;gap:11px}.topic{min-height:116px;padding:17px;border-radius:15px}.note{line-height:1.7}}
</style>
</head>
<body>
<main class="page">
  <header class="intro"><div><div class="eyebrow">THINK TOGETHER</div><h1 data-i18n="d.title">開催中の議論</h1><p data-i18n="d.lead">正しさを競わず、体験を持ち寄って考えを深める場所。</p></div><span class="live">● LIVE</span></header>
  <section class="feature">
    <div class="meta"><span class="badge" data-i18n="d.badge">意見募集中</span><small data-i18n="d.meta">今日の問い・リアルタイム議論</small></div>
    <!-- お題は日本語の原文を data-topic に保持し、表示だけ訳す（親へ返す値は原文のまま） -->
    <h2 id="featuredTopic" data-i18n="d.loadingTopic">今日の議題を読み込んでいます…</h2>
    <p data-i18n="d.body">便利さが増えるほど、私たちは何を手放し、何を守るべきでしょうか。結論を急がず、実際の経験から考えます。</p>
    <div class="actions"><button class="button primary" data-join disabled data-i18n="d.join">議論に参加する</button><button class="button" data-lens="experience" disabled data-i18n="d.lens.experience">体験を共有</button><button class="button" data-lens="perspective" disabled data-i18n="d.lens.perspective">別の視点</button><button class="button" data-lens="question" disabled data-i18n="d.lens.question">問いを深める</button></div>
  </section>
  <!-- 自分で議題を立てる。用意された問いに乗るだけでなく、話したいことから始められるようにする。 -->
  <section class="feature own">
    <div class="meta"><span class="badge" data-i18n="d.own.badge">自分で立てる</span><small data-i18n="d.own.meta">話したいことから始める</small></div>
    <h2 data-i18n="d.own.title">いま、誰かと話したいことはありますか</h2>
    <p data-i18n="d.own.lead">問いの形でなくても構いません。引っかかっていることを、そのまま書いてください。</p>
    <input id="ownTopic" type="text" maxlength="120" data-i18n-placeholder="d.own.placeholder"
           placeholder="例）「面白かった」で終わる会話が、なぜ物足りないのか" aria-label="話したいこと">
    <div class="actions">
      <button class="button primary" id="ownStart" data-i18n="d.own.start">この議題で議論を始める</button>
    </div>
  </section>

  <p class="note" data-i18n="d.note">終了した議論は「みんなの結論」として残り、知識を読むへ届けられます。</p>
  <div class="status" id="status" role="status"></div>
</main>
<script src="/emu-i18n.js"></script>
<script src="/emu-i18n-pages.js"></script>
<script>
const ORIGIN=location.origin,send=message=>parent.postMessage(message,ORIGIN),status=document.getElementById('status');
const topicEl=document.getElementById('featuredTopic');
// 親へ渡すお題は日本語の原文（部屋のお題として使われるため）。画面表示だけ選択言語にする。
const rawTopic=()=>topicEl.dataset.topic||topicEl.textContent;
function paintTopic(){if(topicEl.dataset.topic)topicEl.textContent=window.emuTopic?emuTopic(topicEl.dataset.topic):topicEl.dataset.topic}
window.onEmuLangChange=paintTopic;
document.querySelector('[data-join]').onclick=()=>send({type:'emu-discussion-open',topic:rawTopic(),mode:'opinion'});
document.querySelectorAll('[data-lens]').forEach(button=>button.onclick=()=>send({type:'emu-discussion-open',topic:rawTopic(),mode:button.dataset.lens}));
window.addEventListener('message',event=>{if(event.origin!==ORIGIN||event.source!==parent)return;if(event.data?.type==='emu-discussion-topic'&&event.data.topic){topicEl.dataset.topic=event.data.topic;topicEl.removeAttribute('data-i18n');paintTopic();document.querySelectorAll('.actions button').forEach(button=>button.disabled=false)}});
/* 自分で立てた議題で議論を始める。親側は topic をそのまま部屋のお題に使うので、
   用意された問いと同じ経路（emu-discussion-open）に乗せる。 */
const ownInput=document.getElementById('ownTopic'),ownBtn=document.getElementById('ownStart');
function startOwnTopic(){
  const t=(ownInput.value||'').trim();
  if(!t){ status.textContent=(window.emuT?emuT('d.own.empty'):'話したいことを入力してください。'); status.style.display='block'; ownInput.focus(); return; }
  send({type:'emu-discussion-open',topic:t,mode:'opinion'});
}
ownBtn.onclick=startOwnTopic;
ownInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); startOwnTopic(); } });
send({type:'emu-discussion-ready'});
</script>
</body>
</html>
