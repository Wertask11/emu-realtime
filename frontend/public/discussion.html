<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>開催中の議論 — Emu</title>
<style>
:root{--mikan:#f08300;--ink:#25211d;--muted:#77716a;--line:#e8dfd5;--paper:#faf7f2;--soft:#fff0dc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",sans-serif}button{font:inherit;cursor:pointer}.page{max-width:1180px;margin:auto;padding:42px 28px 72px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.eyebrow{color:var(--mikan);font-size:12px;font-weight:800;letter-spacing:.14em}.intro h1{font:700 36px/1.3 Georgia,"Yu Mincho",serif;margin:8px 0}.intro p{color:var(--muted);margin:0;line-height:1.7}.live{background:var(--mikan);color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}.feature,.topic{background:#fff;border:1px solid var(--line);border-radius:20px}.feature{padding:30px;border-left:6px solid var(--mikan)}.meta,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.badge{display:inline-flex;background:var(--soft);color:#8a4600;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800}.meta small{color:var(--muted)}.feature h2{font:700 27px/1.45 Georgia,"Yu Mincho",serif;margin:18px 0 10px}.feature>p{color:#5f5952;line-height:1.8}.button{border:1px solid var(--line);background:#fff;color:#514b45;border-radius:10px;padding:11px 15px;font-weight:800}.button:hover{border-color:var(--mikan);color:#a85500}.primary{background:var(--mikan);border-color:var(--mikan);color:#fff}.primary:hover{background:#d97600;color:#fff}.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.topic{padding:20px;text-align:left;display:grid;gap:10px}.topic strong{line-height:1.55}.topic small{color:var(--muted)}.note{color:var(--muted);font-size:12px;margin-top:18px}.status{margin-top:18px;padding:13px 16px;background:var(--soft);color:#784000;border-radius:12px;display:none}@media(max-width:760px){.page{padding:24px 14px 50px}.intro{align-items:flex-start}.intro h1{font-size:29px}.topics{grid-template-columns:1fr}.feature{padding:22px}.feature h2{font-size:23px}}
</style>
</head>
<body>
<main class="page">
  <header class="intro"><div><div class="eyebrow">THINK TOGETHER</div><h1>開催中の議論</h1><p>正しさを競わず、体験を持ち寄って考えを深める場所。</p></div><span class="live">● LIVE</span></header>
  <section class="feature">
    <div class="meta"><span class="badge">意見募集中</span><small>今日の問い・リアルタイム議論</small></div>
    <h2 id="featuredTopic">AIに任せること、自分で考え続けたいこと</h2>
    <p>便利さが増えるほど、私たちは何を手放し、何を守るべきでしょうか。結論を急がず、実際の経験から考えます。</p>
    <div class="actions"><button class="button primary" data-join>議論に参加する</button><button class="button" data-lens="体験を共有">体験を共有</button><button class="button" data-lens="別の視点">別の視点</button><button class="button" data-lens="問いを深める">問いを深める</button></div>
  </section>
  <section class="topics" aria-label="その他の議論">
    <button class="topic" data-topic="学校でAIをどこまで使っていい？"><span class="badge">整理中</span><strong>学校でAIをどこまで使っていい？</strong><small>学びと自分で考える力について</small></button>
    <button class="topic" data-topic="地域のつながりをどう取り戻す？"><span class="badge">意見募集中</span><strong>地域のつながりをどう取り戻す？</strong><small>身近な体験から考える</small></button>
    <button class="topic" data-topic="働く時間は短いほどよい？"><span class="badge">結論作成中</span><strong>働く時間は短いほどよい？</strong><small>終了後は「みんなの結論」へ</small></button>
  </section>
  <p class="note">終了した議論は「みんなの結論」として残り、知識を読むへ届けられます。</p>
  <div class="status" id="status" role="status"></div>
</main>
<script>
const ORIGIN=location.origin,send=message=>parent.postMessage(message,ORIGIN),status=document.getElementById('status');
document.querySelector('[data-join]').onclick=()=>send({type:'emu-discussion-open',topic:document.getElementById('featuredTopic').textContent});
document.querySelectorAll('[data-topic]').forEach(button=>button.onclick=()=>{document.getElementById('featuredTopic').textContent=button.dataset.topic;status.textContent='議題を選択しました。「議論に参加する」から参加できます。';status.style.display='block';window.scrollTo({top:0,behavior:'smooth'})});
document.querySelectorAll('[data-lens]').forEach(button=>button.onclick=()=>{status.textContent='「'+button.dataset.lens+'」として発言するモードです。議論に参加すると入力できます。';status.style.display='block'});
window.addEventListener('message',event=>{if(event.origin!==ORIGIN||event.source!==parent)return;if(event.data?.type==='emu-discussion-topic'&&event.data.topic)document.getElementById('featuredTopic').textContent=event.data.topic});
send({type:'emu-discussion-ready'});
</script>
</body>
</html>
