<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!-- これが無いと、スマホでも横幅980pxとして描かれ、文字が極端に小さくなる -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Emu | Room1 - 学び</title>
<style>
/* 見た目は新しい Emu にそろえる。
   白地・クリーム・オレンジ。中身と処理は元のまま。
   もとは暗い配色で、Emu の中に出すと浮いていた。 */
:root{
  --paper:#f8f6f2; --card:#ffffff; --ink:#211f1c; --muted:#85817a;
  --line:#e5dfd7; --orange:#ef7d00; --soft:#fff1dc; --deep:#bd6100;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Noto Sans JP','Yu Gothic',system-ui,sans-serif;
  overflow-y:auto;
}
html{overflow-y:auto}
header{
  padding:18px clamp(16px,3vw,28px); border-bottom:1px solid var(--line);
  background:var(--card); display:flex; align-items:center; gap:12px;
}
header h1{margin:0; font:700 19px/1.4 Georgia,'Yu Mincho',serif; color:var(--ink)}
/* 戻るボタンと見出しを、左にそろえて並べる */
.header-actions{display:flex; align-items:center; gap:12px; min-width:0}
.header-btn{
  cursor:pointer; font-size:13px; font-weight:700; color:#55524d;
  border:1px solid var(--line); padding:8px 13px; border-radius:9px;
  background:var(--card); font-family:inherit;
}
.header-btn:hover{background:var(--soft); border-color:#f2c48a; color:var(--deep)}
#container{padding:clamp(18px,3vw,30px); max-width:1100px; margin:0 auto}
.section-title{margin:0 0 14px; font-size:13px; font-weight:800; color:var(--muted); letter-spacing:.06em}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
.card{
  background:var(--card); border:1px solid var(--line); padding:20px;
  cursor:pointer; border-radius:14px; transition:.15s;
}
.card:hover{border-color:#f2c48a; background:#fffdfa}
.card h2{margin:0 0 7px; font-size:16px; font-weight:800; color:var(--ink)}
.card p{margin:0; font-size:13px; line-height:1.7; color:var(--muted)}
.back-btn{
  display:inline-block; margin-bottom:14px; cursor:pointer;
  color:var(--deep); font-size:13px; font-weight:800;
}
.back-btn:hover{text-decoration:underline}
.mode-btns{display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap}
.mode-btns .card{padding:13px 18px; font-size:14px; font-weight:700; border-radius:999px}
ul.sub-list{list-style:none; padding:0; margin:0; display:grid; gap:9px}
ul.sub-list li{
  cursor:pointer; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:15px 18px; font-size:14px; font-weight:700; color:var(--ink);
}
ul.sub-list li:hover{border-color:#f2c48a; background:#fffdfa; color:var(--deep)}
h2{font:700 21px/1.5 Georgia,'Yu Mincho',serif; margin:0 0 14px}
#detailBody{line-height:1.95; color:#514e49; white-space:pre-wrap; font-size:14px}

/* お預かり箱 */
.deposit-wrapper{margin-top:44px; border-top:1px solid var(--line); padding-top:28px}
.deposit-toggle{
  cursor:pointer; color:#fff; border:0; background:var(--orange);
  padding:13px 20px; border-radius:12px; font-size:14px; font-weight:800;
  font-family:inherit; box-shadow:0 8px 20px #ef7d0030;
}
.deposit-toggle:hover{background:var(--deep)}
.deposit-box{display:none; margin-top:20px}
.deposit-box textarea, .deposit-box select{
  width:100%; margin-top:10px; padding:13px;
  background:var(--card); color:var(--ink);
  border:1px solid #dfd8ce; border-radius:12px;
  font-family:inherit; font-size:14px; box-sizing:border-box;
}
.deposit-box textarea:focus, .deposit-box select:focus{outline:0; border-color:var(--orange)}
.deposit-box button{
  margin-top:14px; padding:12px 20px; background:var(--orange);
  color:#fff; border:0; border-radius:11px; cursor:pointer;
  font-family:inherit; font-size:14px; font-weight:800;
}
.deposit-box button:hover{background:var(--deep)}

/* 更新バッジ */
#new-badge{
  display:none; position:fixed; bottom:20px; right:20px;
  background:var(--orange); color:#fff; border:none; border-radius:999px;
  padding:12px 20px; font-size:13px; font-weight:800; cursor:pointer;
  font-family:inherit; box-shadow:0 10px 24px #ef7d0040; z-index:999;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:760px){
  header{padding:14px}
  header h1{font-size:16px}
  #container{padding:16px 14px 40px}
  .mode-btns{overflow-x:auto; flex-wrap:nowrap; padding-bottom:4px}
  .mode-btns .card{white-space:nowrap}
}
</style>
</head>

<body>

<!-- 新コンテンツ通知バッジ -->
<button id="new-badge" onclick="applyNewContents()">
  🆕 新しいコンテンツが追加されました → 反映する
</button>

<header>
  <div class="header-actions">
    <button id="backToEmuBtn" class="header-btn" onclick="backToEmu()">← 戻る</button>
    <h1 id="headerTitle">Room1</h1>
  </div>
</header>

<div id="container">
  <div class="mode-btns">
    <div class="card" onclick="switchMode('money')">マネーリテラシー</div>
    <div class="card" onclick="switchMode('net')">ネットリテラシー</div>
    <div class="card" onclick="switchMode('life')">ライフリテラシー</div>
    <div class="card" onclick="switchMode('blue')">ブルーファイル</div>
  </div>

  <div id="list"></div>

  <div id="sub" style="display:none;">
    <div class="back-btn" onclick="backToList()">← 戻る</div>
    <h2 id="subTitle"></h2>
    <ul class="sub-list" id="subList"></ul>
  </div>

  <div id="detail" style="display:none;">
    <div class="back-btn" onclick="backToSub()">← 戻る</div>
    <h2 id="detailTitle"></h2>
    <div id="detailList"></div>
    <div id="detailBody"></div>
  </div>

  <!-- お預かり箱（ユーザー送信用） -->
  <div class="deposit-wrapper">
    <button class="deposit-toggle" onclick="toggleDeposit()">📮 お預かり箱</button>
    <div class="deposit-box" id="depositBox">
      <p style="font-size:13px; color:var(--text-sub); line-height:1.6;">
        マネー・ネット・ライフ・ブルーファイルに関する気づきや疑問、体験をお預かりします。<br>
        価値のあるものは学習コンテンツとして反映されます。
      </p>
      <select id="depositTheme" onchange="onDepositThemeChange()">
        <option value="">テーマを選択</option>
        <option value="money">マネーリテラシー</option>
        <option value="net">ネットリテラシー</option>
        <option value="life">ライフリテラシー</option>
        <option value="blue">ブルーファイル</option>
      </select>
      <select id="depositSubTheme" disabled>
        <option value="">サブテーマを選択</option>
      </select>
      <textarea id="depositContent" rows="4" placeholder="ここに内容を書いてください"></textarea>
      <button onclick="submitDeposit()">預ける</button>
    </div>
  </div>
</div>

<script>
var API_BASE = "https://emu-realtime.onrender.com";

var themeData = {
  money: {
    title: "Room1｜マネーリテラシー",
    items: [
      ["増やし方","資産・収入をどう増やすか"],["育て方","時間を味方につける考え方"],
      ["守り方","失わない・騙されない"],["使い方","価値ある支出とは何か"],
      ["付き合い方","感情・幸福・距離感"],["稼ぎ方","労働・スキル・仕組み"],
      ["見極め方","情報・人・話の真偽"],["回し方","流れを止めない設計"]
    ]
  },
  net: {
    title: "Room1｜ネットリテラシー",
    items: [
      ["SNSとの付き合い方","距離感と健全な使い方"],["炎上・トラブル対策","守る・避ける・対処する"],
      ["詐欺・フェイクの見抜き方","疑う力を持つ"],["個人情報・セキュリティ","守るべき境界線"],
      ["AIとの付き合い方","使う側でいるために"],["発信と責任","言葉の影響力"],
      ["ネットの法律・ルール","知らないと損する知識"]
    ]
  },
  life: {
    title: "Room1｜ライフリテラシー",
    items: [
      ["感情との向き合い方","自分を理解する力"],["交渉","対話で前に進める技術"],
      ["家事","生活を回す基本スキル"],["エチケット","人との距離感と礼節"],
      ["セルフケア","自分を守り整える"],["レジリエンス","折れない・立ち直る力"],
      ["パブリック","社会との関わり方"]
    ]
  },
  blue: {
    title: "Room1｜ブルーファイル",
    mains: {
      "リーダーシップ":   ["理念","ビジョン","戦略","変革","創造的能力","創造的態度"],
      "マネジメント":     ["目標設定","計画立案","進捗管理","目標達成","計数管理"],
      "人材活用":         ["組織運営","人材発掘・活用","業務委任","人材育成","動機付け","人的ネットワーク"],
      "意思決定":         ["決断力","解決案の提示","問題分析","情報収集","改善"],
      "ヒューマンスキル": ["状況把握","自己客観視点","チームワーク","共感力","異文化コミュニケーション","傾聴力","説得力","プレゼンテーション","企画提案力","伝達力"],
      "志向":             ["クオリティ","カスタマー","プロフィット","スペシャリティ"],
      "姿勢":             ["成長・学習意欲","柔軟な対応","主体的な行動","誠実な対応","ルール遵守","マナー意識"],
      "エネルギー":       ["信念","タフネス","ストレスコントロール","継続力"]
    }
  }
};

var currentMode = "money";
var currentBlueMain = "";
var currentHits = [];
var viewState = "list";
var room1Contents = [];        // 現在表示中のコンテンツ
var latestContents = null;     // バックグラウンドで取得した最新（未適用）
var currentDetailTitle = "";
var currentDetailBlueMain = "";

// ══════════════════════════════════════
// コンテンツ読み込み
// ══════════════════════════════════════
function loadContents(onDone) {
  fetch(API_BASE + '/api/room1/contents')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var arr = Array.isArray(data) ? data : [];
      if (onDone) onDone(arr);
    })
    .catch(function(e) {
      console.error("contents load error", e);
      if (onDone) onDone([]);
    });
}

// 初回ロード
function init() {
  loadContents(function(data) {
    room1Contents = data;
    renderList();
  });

  // 30秒ごとにバックグラウンドポーリング
  setInterval(function() {
    loadContents(function(data) {
      // 件数が増えていたら通知バッジを表示
      if (data.length > room1Contents.length) {
        latestContents = data;
        var badge = document.getElementById('new-badge');
        if (badge) badge.style.display = 'block';
      }
    });
  }, 30 * 1000);
}

// バッジをクリックして反映
function applyNewContents() {
  if (!latestContents) return;
  room1Contents = latestContents;
  latestContents = null;
  document.getElementById('new-badge').style.display = 'none';

  // 現在詳細ビューを開いていれば再描画
  if (document.getElementById('detail').style.display === 'block' && currentDetailTitle) {
    openDetail(currentDetailTitle, currentDetailBlueMain);
  } else {
    renderList();
  }
}

window.addEventListener('load', init);

// ══════════════════════════════════════
// UI
// ══════════════════════════════════════
function backToEmu() {
  /* 小部屋の枠で開かれているときは、親に閉じてもらう。
     古い開き方（closeRoom1）でも動くよう、両方に声をかける。 */
  try { window.top.postMessage({ type: "spContentClose" }, "*"); } catch (e) {}
  try { if (parent && parent.closeRoom1) parent.closeRoom1(); } catch (e) {}
}

function switchMode(mode) {
  currentMode = mode;
  currentBlueMain = "";
  renderList();
}

function renderList() {
  var list = document.getElementById("list");
  document.getElementById("sub").style.display = "none";
  document.getElementById("detail").style.display = "none";

  if (currentMode !== "blue") {
    var html = '<div class="section-title">どれを磨く？</div><div class="grid">';
    themeData[currentMode].items.forEach(function(i) {
      html += '<div class="card" onclick="openDetail(\'' + escJs(i[0]) + '\')"><h2>' + i[0] + '</h2><p>' + i[1] + '</p></div>';
    });
    html += '</div>';
    list.innerHTML = html;
  } else {
    var html2 = '<div class="section-title">どれを磨く？</div><div class="grid">';
    Object.keys(themeData.blue.mains).forEach(function(m) {
      html2 += '<div class="card" onclick="openBlueMain(\'' + escJs(m) + '\')"><h2>' + m + '</h2></div>';
    });
    html2 += '</div>';
    list.innerHTML = html2;
  }

  /* 見出しは「Room1」で固定にする。いまどのテーマかは、
     すぐ下のボタンの並びで分かる。 */
  list.style.display = "block";
}

function openBlueMain(main) {
  currentBlueMain = main;
  document.getElementById("list").style.display = "none";
  document.getElementById("detail").style.display = "none";
  document.getElementById("sub").style.display = "block";
  document.getElementById("subTitle").textContent = main;
  var subListHtml = "";
  themeData.blue.mains[main].forEach(function(s) {
    subListHtml += '<li onclick="openDetail(\'' + escJs(s) + '\', \'' + escJs(main) + '\')">' + s + '</li>';
  });
  document.getElementById("subList").innerHTML = subListHtml;
}

function openDetail(title, blueMain) {
  viewState = "list";
  currentDetailTitle = title;
  currentDetailBlueMain = blueMain || "";

  document.getElementById("list").style.display = "none";
  document.getElementById("sub").style.display = "none";
  document.getElementById("detail").style.display = "block";
  document.getElementById("detailTitle").textContent = title;

  if (currentMode === "blue" && blueMain) {
    currentHits = room1Contents.filter(function(c) {
      return c.theme === "blue" && c.subTheme === blueMain && c.subSubTheme === title && typeof c.body === "string";
    });
  } else {
    currentHits = room1Contents.filter(function(c) {
      return c.subTheme === title && typeof c.body === "string";
    });
  }

  if (currentHits.length === 0) {
    document.getElementById("detailList").innerHTML =
      "<p style='color:var(--text-sub);font-size:13px;'>このテーマは現在準備中です。</p>";
    document.getElementById("detailBody").innerHTML = "";
    return;
  }
  renderHitList();
}

function renderHitList() {
  var html = "";
  currentHits.forEach(function(h, i) {
    html += '<div class="card" onclick="openPost(' + i + ')">' +
      '<strong>📘 ' + (h.summary || '学習コンテンツ') + '</strong>';
    if (h.body) {
      html += '<p style="font-size:13px;color:var(--text-sub);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">' + h.body + '</p>';
    }
    html += '<span style="font-size:11px;color:var(--text-sub);">' + new Date(h.createdAt).toLocaleString() + '</span></div>';
  });
  document.getElementById("detailList").innerHTML = html;
  document.getElementById("detailBody").innerHTML = "";
}

function openPost(index) {
  viewState = "post";
  var post = currentHits[index];
  if (!post) return;
  var parts = [post.theme, post.subTheme, post.subSubTheme].filter(Boolean);
  document.getElementById("detailTitle").textContent = parts.join("｜");
  document.getElementById("detailList").innerHTML = "";
  document.getElementById("detailBody").innerHTML =
    '<div style="line-height:1.9;margin-bottom:24px;"><strong>📝 要約</strong><br>' +
    (post.summary ? post.summary.replace(/\n/g,"<br>") : "—") +
    '</div><div style="line-height:1.9;margin-bottom:32px;"><strong>📘 本文</strong><br>' +
    post.body.replace(/\n/g,"<br>") + '</div>' +
    (post.note ? '<div style="border-top:1px dashed var(--border);padding-top:16px;color:var(--text-sub);font-size:13px;">⚠ 補足・注意<br>' + post.note.replace(/\n/g,"<br>") + '</div>' : "") +
    (post.noteUrl ? '<div style="margin-top:24px;"><a href="' + post.noteUrl + '" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:10px 20px;background:var(--accent);color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:bold;">📝 Noteで全文を読む →</a></div>' : "");
}

function backToList() { currentBlueMain = ""; renderList(); }

function backToSub() {
  if (viewState === "post") { viewState = "list"; renderHitList(); return; }
  if (currentMode !== "blue" || !currentBlueMain) { renderList(); return; }
  openBlueMain(currentBlueMain);
}

function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// ══════════════════════════════════════
// お預かり箱（ユーザー送信）
// ══════════════════════════════════════
function toggleDeposit() {
  var box = document.getElementById("depositBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function onDepositThemeChange() {
  var theme = document.getElementById("depositTheme").value;
  var subSel = document.getElementById("depositSubTheme");
  subSel.innerHTML = "<option value=''>サブテーマを選択</option>";
  subSel.disabled = !theme;
  if (!theme) return;

  if (theme === "blue") {
    Object.keys(themeData.blue.mains).forEach(function(m) {
      var opt = document.createElement("option");
      opt.value = m; opt.textContent = m; subSel.appendChild(opt);
    });
  } else {
    themeData[theme].items.forEach(function(item) {
      var opt = document.createElement("option");
      opt.value = item[0]; opt.textContent = item[0]; subSel.appendChild(opt);
    });
  }
}

function submitDeposit() {
  var theme    = document.getElementById("depositTheme").value;
  var subTheme = document.getElementById("depositSubTheme").value;
  var content  = document.getElementById("depositContent").value.trim();

  if (!theme || !subTheme || !content) { alert("テーマ・サブテーマ・内容を入力してください"); return; }

  fetch(API_BASE + '/api/room1/submit', {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ theme: theme, subTheme: subTheme, content: content })
  })
  .then(function(res) { return res.json(); })
  .then(function() {
    alert("📮 お預かりいたしました！");
    document.getElementById("depositContent").value = "";
    document.getElementById("depositTheme").value = "";
    document.getElementById("depositSubTheme").innerHTML = "<option value=''>サブテーマを選択</option>";
    document.getElementById("depositSubTheme").disabled = true;
    document.getElementById("depositBox").style.display = "none";
  });
}
</script>
</body>
</html>
